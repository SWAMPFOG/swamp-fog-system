<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090b"><title>SWAMP FOG HELP Ver.4</title>
<style>
:root{--bg:#08090b;--panel:#121318;--panel2:#191b22;--line:#2b2e38;--text:#f5f5f7;--muted:#989daa;--gold:#e7c66b;--red:#ff646e;--green:#67d39b;--blue:#70a8ff;--orange:#ffad5a;--purple:#b894ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:106px}header{position:sticky;top:0;z-index:30;background:rgba(8,9,11,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:13px 15px}.title{font-size:18px;font-weight:900;letter-spacing:.08em}.sub{font-size:10px;color:var(--muted);margin-top:3px}main{padding:13px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:13px}.sum{background:var(--panel);border:1px solid var(--line);border-radius:13px;text-align:center;padding:10px 4px}.sum b{font-size:22px}.sum span{display:block;color:var(--muted);font-size:10px;margin-top:3px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 9px}h2{font-size:15px;margin:0}button{border:0;border-radius:10px;padding:9px 11px;font-weight:800;background:var(--gold);color:#111}button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}button.danger{background:rgba(255,100,110,.13);color:var(--red);border:1px solid rgba(255,100,110,.3)}button.small{padding:7px 9px;font-size:11px}.grid{display:grid;gap:9px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}.card.short{border-color:var(--red)}.card.over{box-shadow:0 0 0 2px rgba(255,100,110,.28)}.card.check{box-shadow:0 0 0 2px rgba(231,198,107,.25)}.card.vip{border-color:var(--purple)}.card-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.name{font-size:18px;font-weight:900}.meta{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.45}.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.badge{font-size:10px;border-radius:999px;padding:5px 7px;background:var(--panel2);border:1px solid var(--line)}.badge.red{color:var(--red);border-color:rgba(255,100,110,.4)}.badge.gold{color:var(--gold);border-color:rgba(231,198,107,.4)}.badge.blue{color:var(--blue);border-color:rgba(112,168,255,.4)}.badge.green{color:var(--green);border-color:rgba(103,211,155,.4)}.badge.purple{color:var(--purple);border-color:rgba(184,148,255,.4)}.badge.orange{color:var(--orange);border-color:rgba(255,173,90,.4)}.block{margin-top:10px;padding:9px 10px;background:#0d0e12;border:1px dashed var(--line);border-radius:11px;font-size:12px;line-height:1.55}.block b{color:var(--gold)}.seats,.quick{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.seat,.chip{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:8px 9px;font-size:11px;color:var(--text)}.chip{border-radius:999px}.chip.selected{background:var(--gold);color:#111;border-color:var(--gold)}.seat b{display:block;font-size:12px}.seat span{font-size:10px;color:var(--muted)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:10px 11px}.row-name{font-weight:900}.state{font-size:10px;color:var(--muted);margin-top:3px}.history{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 11px;font-size:12px}.history .time{font-size:10px;color:var(--muted);margin-top:3px}.empty{color:var(--muted);font-size:12px;padding:13px 2px}.hide{display:none!important}.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(12,13,16,.97);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 7px calc(8px + env(safe-area-inset-bottom))}.nav button{background:transparent;color:var(--muted);padding:10px 2px;font-size:11px}.nav button.on{color:var(--gold)}.undo{position:fixed;left:12px;right:12px;bottom:84px;z-index:35;background:#15171d;border:1px solid var(--line);border-radius:13px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}.undo span{font-size:11px}dialog{width:min(93vw,520px);max-height:88vh;overflow:auto;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:18px;padding:16px}dialog::backdrop{background:rgba(0,0,0,.74)}input,select,textarea{width:100%;background:#0c0d11;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:16px}.field{margin:10px 0}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.note{font-size:11px;color:var(--muted);line-height:1.55}
</style></head><body>
<header><div class="title">SWAMP FOG HELP</div><div class="sub">HELP ROTATION SYSTEM — Ver.4</div></header>
<main><div class="summary"><div class="sum"><b id="sSessions">0</b><span>稼働卓</span></div><div class="sum"><b id="sActive">0</b><span>着席中</span></div><div class="sum"><b id="sRequests">0</b><span>ヘルプ希望</span></div><div class="sum"><b id="sChecks">0</b><span>チェック待ち</span></div></div>
<section id="viewTables"><div class="section-head"><h2>営業盤</h2><button class="small" onclick="openTable()">＋ 卓開始</button></div><div id="tableList" class="grid"></div></section>
<section id="viewCasts" class="hide"><div class="section-head"><h2>キャスト</h2><button class="small" onclick="openCast()">＋ 追加</button></div><div id="castList" class="grid"></div></section>
<section id="viewHistory" class="hide"><div class="section-head"><h2>履歴</h2></div><div id="historyList" class="grid"></div></section>
<section id="viewClosed" class="hide"><div class="section-head"><h2>終了卓</h2></div><div id="closedList" class="grid"></div></section></main>
<div id="undoBar" class="undo hide"><span id="undoText"></span><button class="small secondary" onclick="undoLast()">取り消す</button></div>
<nav class="nav"><button id="navTables" class="on" onclick="showView('tables')">営業盤</button><button id="navCasts" onclick="showView('casts')">キャスト</button><button id="navHistory" onclick="showView('history')">履歴</button><button id="navClosed" onclick="showView('closed')">終了卓</button></nav>
<dialog id="tableDialog"><h2>卓を開始</h2><div class="field"><label>卓番</label><input id="tName" placeholder="例：A8"></div><div class="field"><label>担当</label><select id="tOwner"></select></div><div class="field"><label>お客様区分</label><select id="tCustomerType"><option>通常</option><option>お連れ様</option><option>ご新規様</option><option>VIP</option></select></div><div class="field"><label>お客様人数</label><select id="tGuests"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div><div class="field"><label>必要ヘルプ人数</label><select id="tNeed"><option>0</option><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option></select></div><div class="field"><label>ヘルプ上限</label><select id="tMax"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></div><div class="field"><label>卓目的</label><select id="tMission"><option>通常</option><option>飲み上げ</option><option>告知</option><option>場内狙い</option><option>シャンパン</option><option>盛り上げ</option><option>フォロー</option></select></div><div class="field"><label>予算（任意）</label><input id="tBudget" type="number" inputmode="numeric" placeholder="例：50000"></div><div class="actions"><button class="secondary" onclick="tableDialog.close()">閉じる</button><button onclick="addTable()">開始</button></div></dialog>
<dialog id="castDialog"><h2>キャスト追加</h2><div class="field"><label>名前</label><input id="cName" placeholder="キャスト名"></div><div class="field"><label>ランク</label><select id="cRank"><option>S</option><option>A</option><option selected>B</option><option>C</option></select></div><div class="actions"><button class="secondary" onclick="castDialog.close()">閉じる</button><button onclick="addCast()">追加</button></div></dialog>
<dialog id="requestDialog"><h2 id="requestTitle">ヘルプ希望</h2><div id="requestChips" class="quick"></div><div class="actions"><button class="secondary" onclick="requestDialog.close()">閉じる</button></div></dialog>
<dialog id="checkDialog"><h2 id="checkTitle">チェック</h2><div class="field"><label>会計額</label><input id="checkAmount" type="number" inputmode="numeric" placeholder="例：14000"></div><div class="field"><label>結果・背景</label><select id="checkReason"><option>継続</option><option>飲み上げ成功</option><option>予算都合</option><option>体調配慮</option><option>関係性重視</option><option>次回来店優先</option><option>会計・退店</option><option>その他</option></select></div><div class="field"><label>メモ</label><textarea id="checkMemo" placeholder="例：病み上がりでドリンクをもらいづらかった"></textarea></div><div class="actions"><button class="secondary" onclick="checkDialog.close()">閉じる</button><button onclick="saveCheck()">保存</button></div></dialog>
<script>
const KEY='swampHelpV4';let state=load()||{casts:[],sessions:[],closed:[],history:[],actions:[],planned:{}};let lastAction=null,requestSessionId=null,checkSessionId=null;
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function fmt(ms){let m=Math.max(0,Math.floor(ms/60000));return m<60?m+'分':Math.floor(m/60)+'時間'+m%60+'分'}function currentSession(cid){return state.sessions.find(s=>s.castIds.includes(cid))}function activeHistory(cid,sid){return [...state.history].reverse().find(h=>h.castId===cid&&h.sessionId===sid&&!h.end)}function snapshot(){return JSON.stringify({casts:state.casts,sessions:state.sessions,closed:state.closed,history:state.history,planned:state.planned})}function logAction(text,snap){lastAction={text,snapshot:snap};state.actions.unshift({id:uid(),text,time:Date.now()});state.actions=state.actions.slice(0,100)}function undoLast(){if(!lastAction)return;let s=JSON.parse(lastAction.snapshot);Object.assign(state,s);lastAction=null;save()}
function openCast(){cName.value='';cRank.value='B';castDialog.showModal()}function addCast(){let name=cName.value.trim();if(!name)return;let snap=snapshot();if(!state.casts.some(c=>c.name===name)){state.casts.push({id:uid(),name,rank:cRank.value});logAction(`${name}を追加`,snap)}castDialog.close();save()}
function openTable(){tName.value='';tGuests.value='1';tNeed.value='2';tMax.value='2';tMission.value='通常';tBudget.value='';tOwner.innerHTML='<option value="">担当なし</option>'+state.casts.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');tableDialog.showModal()}
function addTable(){let name=tName.value.trim();if(!name)return;let sameCount=state.sessions.concat(state.closed).filter(s=>s.tableName===name).length+1;let snap=snapshot();state.sessions.push({id:uid(),tableName:name,sessionNo:sameCount,ownerId:tOwner.value||null,customerType:tCustomerType.value,guests:+tGuests.value,need:+tNeed.value,max:+tMax.value,mission:tMission.value,budget:+tBudget.value||null,castIds:[],requests:[],checkPending:false,checks:[],start:Date.now()});logAction(`${name} #${sameCount} 開始`,snap);tableDialog.close();save()}
function endSession(id){let s=state.sessions.find(x=>x.id===id);if(!s||!confirm(`${s.tableName} #${s.sessionNo} を終了しますか？`))return;let snap=snapshot();[...s.castIds].forEach(cid=>exitCast(cid,id,false));s.end=Date.now();state.closed.unshift(s);state.sessions=state.sessions.filter(x=>x.id!==id);logAction(`${s.tableName} #${s.sessionNo} 終了`,snap);save()}
function quickTap(sid,cid){let s=state.sessions.find(x=>x.id===sid),c=state.casts.find(x=>x.id===cid);if(!s||!c)return;let key=sid+'_'+cid;if(state.planned[key]){let snap=snapshot();let prev=currentSession(cid);if(prev){exitCast(cid,prev.id,false)}s.castIds.push(cid);state.history.push({id:uid(),castId:cid,sessionId:s.id,start:Date.now(),end:null});s.requests=s.requests.filter(x=>x!==cid);delete state.planned[key];logAction(`${c.name} → ${s.tableName} #${s.sessionNo}`,snap)}else state.planned[key]=true;save()}
function exitCast(cid,sid,doLog=true){let s=state.sessions.find(x=>x.id===sid),c=state.casts.find(x=>x.id===cid);if(!s)return;let snap=doLog?snapshot():null;s.castIds=s.castIds.filter(x=>x!==cid);let h=activeHistory(cid,sid);if(h)h.end=Date.now();if(doLog)logAction(`${c?.name} が ${s.tableName} #${s.sessionNo} 退出`,snap)}function exitSave(cid,sid){exitCast(cid,sid,true);save()}
function openRequest(sid){requestSessionId=sid;let s=state.sessions.find(x=>x.id===sid);requestTitle.textContent=`${s.tableName} #${s.sessionNo} ヘルプ希望`;renderRequestChips();requestDialog.showModal()}function renderRequestChips(){let s=state.sessions.find(x=>x.id===requestSessionId);requestChips.innerHTML=state.casts.map(c=>`<button class="chip ${s.requests.includes(c.id)?'selected':''}" onclick="toggleRequest('${c.id}')">${esc(c.name)}</button>`).join('')}function toggleRequest(cid){let s=state.sessions.find(x=>x.id===requestSessionId),snap=snapshot(),c=state.casts.find(x=>x.id===cid);if(s.requests.includes(cid)){s.requests=s.requests.filter(x=>x!==cid);logAction(`${s.tableName} ヘルプ希望解除：${c.name}`,snap)}else{s.requests.push(cid);logAction(`${s.tableName} ヘルプ希望：${c.name}`,snap)}renderRequestChips();save()}
function markCheck(sid){let s=state.sessions.find(x=>x.id===sid),snap=snapshot();s.checkPending=!s.checkPending;logAction(`${s.tableName} #${s.sessionNo} ${s.checkPending?'チェック待ち':'チェック解除'}`,snap);save()}function openCheck(sid){checkSessionId=sid;let s=state.sessions.find(x=>x.id===sid);checkTitle.textContent=`${s.tableName} #${s.sessionNo} チェック`;checkAmount.value='';checkReason.value='継続';checkMemo.value='';checkDialog.showModal()}function saveCheck(){let s=state.sessions.find(x=>x.id===checkSessionId);if(!s)return;let snap=snapshot();s.checks.push({time:Date.now(),amount:+checkAmount.value||null,reason:checkReason.value,memo:checkMemo.value.trim()});s.checkPending=false;logAction(`${s.tableName} #${s.sessionNo} チェック記録`,snap);checkDialog.close();save()}
function render(){let active=state.sessions.reduce((n,s)=>n+s.castIds.length,0);sSessions.textContent=state.sessions.length;sActive.textContent=active;sRequests.textContent=state.sessions.reduce((n,s)=>n+s.requests.length,0);sChecks.textContent=state.sessions.filter(s=>s.checkPending).length;
tableList.innerHTML=state.sessions.length?[...state.sessions].sort((a,b)=>(b.checkPending-a.checkPending)||(b.requests.length-a.requests.length)||((b.need-b.castIds.length)-(a.need-a.castIds.length))).map(s=>{let owner=state.casts.find(c=>c.id===s.ownerId),short=Math.max(0,s.need-s.castIds.length),over=s.castIds.length>s.max;let cls=[short?'short':'',over?'over':'',s.checkPending?'check':'',s.customerType==='VIP'?'vip':''].join(' ');let reqNames=s.requests.map(cid=>state.casts.find(c=>c.id===cid)?.name).filter(Boolean);let waiting=state.casts.filter(c=>c.id!==s.ownerId).map(c=>{let cur=currentSession(c.id),key=s.id+'_'+c.id;return `<button class="chip ${state.planned[key]?'selected':''}" onclick="quickTap('${s.id}','${c.id}')">${esc(c.name)}${cur?`・${esc(cur.tableName)}`:''}</button>`}).join('');let seats=s.castIds.map(cid=>{let c=state.casts.find(x=>x.id===cid),h=activeHistory(cid,s.id);return `<div class="seat"><b>${esc(c?.name)}</b><span>${h?fmt(Date.now()-h.start):'0分'}</span><br><button class="small danger" onclick="exitSave('${cid}','${s.id}')">退出</button></div>`}).join('');let checks=s.checks.slice(-2).map(ch=>`<div>${new Date(ch.time).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})} ${ch.amount?`¥${ch.amount.toLocaleString()}`:''} ${esc(ch.reason)} ${esc(ch.memo||'')}</div>`).join('');return `<div class="card ${cls}"><div class="card-top"><div><div class="name">${esc(s.tableName)} <span class="badge">#${s.sessionNo}</span></div><div class="meta">担当：${esc(owner?.name||'未設定')}｜${esc(s.customerType)} ${s.guests}名｜ヘルプ ${s.castIds.length}/${s.max}</div></div><button class="small danger" onclick="endSession('${s.id}')">卓終了</button></div><div class="badges"><span class="badge ${short?'red':'green'}">${short?`不足${short}名`:'必要人数充足'}</span><span class="badge gold">${esc(s.mission)}</span>${s.budget?`<span class="badge orange">予算 ¥${s.budget.toLocaleString()}</span>`:''}${over?'<span class="badge red">上限超過</span>':''}${s.checkPending?'<span class="badge gold">チェック待ち</span>':''}</div>${reqNames.length?`<div class="block"><b>ヘルプ希望：</b>${reqNames.map(esc).join('・')}</div>`:''}<div class="seats">${seats||'<div class="empty">ヘルプ未配置</div>'}</div><div class="actions" style="justify-content:flex-start"><button class="small secondary" onclick="openRequest('${s.id}')">ヘルプ希望</button><button class="small secondary" onclick="markCheck('${s.id}')">${s.checkPending?'チェック解除':'チェック待ち'}</button><button class="small secondary" onclick="openCheck('${s.id}')">チェック記録</button></div><div class="block"><b>クイック配置</b><br><span class="note">1回タップ＝予定、2回目＝着席。別卓着席中なら自動移動。</span><div class="quick">${waiting}</div></div>${checks?`<div class="block"><b>直近チェック</b>${checks}</div>`:''}</div>`}).join(''):'<div class="empty">卓を開始してください</div>';
castList.innerHTML=state.casts.length?state.casts.map(c=>{let cur=currentSession(c.id),req=state.sessions.filter(s=>s.requests.includes(c.id)).map(s=>s.tableName+' #'+s.sessionNo);return `<div class="row"><div><div class="row-name">${esc(c.name)} <span class="badge">${c.rank}</span></div><div class="state">${cur?`${esc(cur.tableName)} #${cur.sessionNo} 着席中`:'待機中'}${req.length?`｜希望：${req.map(esc).join('、')}`:''}</div></div></div>`}).join(''):'<div class="empty">キャストを追加してください</div>';
historyList.innerHTML=state.actions.length?state.actions.map(a=>`<div class="history"><b>${esc(a.text)}</b><div class="time">${new Date(a.time).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}</div></div>`).join(''):'<div class="empty">履歴はありません</div>';
closedList.innerHTML=state.closed.length?state.closed.map(s=>{let owner=state.casts.find(c=>c.id===s.ownerId);return `<div class="card"><div class="name">${esc(s.tableName)} <span class="badge">#${s.sessionNo}</span></div><div class="meta">担当：${esc(owner?.name||'未設定')}｜${esc(s.customerType)} ${s.guests}名｜${new Date(s.start).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}〜${new Date(s.end).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}</div><div class="badges"><span class="badge gold">${esc(s.mission)}</span>${s.budget?`<span class="badge orange">予算 ¥${s.budget.toLocaleString()}</span>`:''}</div></div>`}).join(''):'<div class="empty">終了卓はありません</div>';undoBar.classList.toggle('hide',!lastAction);undoText.textContent=lastAction?`直前：${lastAction.text}`:''}
function showView(v){['Tables','Casts','History','Closed'].forEach(x=>{document.getElementById('view'+x).classList.toggle('hide',x.toLowerCase()!==v);document.getElementById('nav'+x).classList.toggle('on',x.toLowerCase()===v)});render()}render();setInterval(render,30000);
</script></body></html>
