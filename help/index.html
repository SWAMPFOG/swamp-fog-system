<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<title>SWAMP FOG HELP SIMPLE Ver.2</title>
<style>
:root{
  --bg:#08090b;--panel:#121318;--panel2:#191b22;--line:#2b2e38;
  --text:#f5f5f7;--muted:#8f95a3;--green:#56d38c;--yellow:#e8c75f;
  --red:#ff626d;--orange:#ffad5a;--dark:#2a2d35;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:86px}
header{position:sticky;top:0;z-index:20;background:rgba(8,9,11,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:13px 14px}
.title{font-size:18px;font-weight:900;letter-spacing:.07em}.sub{font-size:10px;color:var(--muted);margin-top:3px}
main{padding:12px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:13px}
.sum{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:10px 3px;text-align:center}
.sum b{font-size:21px}.sum span{display:block;font-size:10px;color:var(--muted);margin-top:3px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:15px 2px 8px}
h2{font-size:15px;margin:0}
button{border:0;border-radius:10px;padding:9px 11px;font-weight:800;background:#e7c66b;color:#111}
button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
button.small{padding:7px 9px;font-size:11px}
.list{display:grid;gap:7px}
.cast-row{
  min-height:62px;border-radius:13px;border:1px solid var(--line);background:var(--panel);
  padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;
  user-select:none;-webkit-user-select:none;touch-action:pan-y;
}
.cast-row.help{background:var(--dark);opacity:.72}
.cast-main{min-width:0}
.cast-name{font-weight:900;font-size:15px;line-height:1.2}
.cast-sub{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.45}
.status-pill{font-size:10px;border-radius:999px;padding:6px 8px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.status-pill.available{color:var(--green)}
.status-pill.help{color:var(--orange)}
.table-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.table-tag{
  font-size:10px;border-radius:999px;padding:5px 7px;border:1px solid var(--line);background:var(--panel2)
}
.table-tag.high{color:#fff;background:rgba(255,98,109,.18);border-color:rgba(255,98,109,.55)}
.table-tag.mid{color:#fff;background:rgba(232,199,95,.15);border-color:rgba(232,199,95,.5)}
.table-tag.low{color:#fff;background:rgba(86,211,140,.14);border-color:rgba(86,211,140,.45)}
.table-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px}
.table-card.high{border-color:var(--red)}.table-card.mid{border-color:var(--yellow)}.table-card.low{border-color:var(--green)}
.table-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.table-name{font-size:18px;font-weight:900}
.meta{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.45}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.badge{font-size:10px;border-radius:999px;padding:5px 7px;background:var(--panel2);border:1px solid var(--line)}
.badge.red{color:var(--red)}.badge.yellow{color:var(--yellow)}.badge.green{color:var(--green)}
.empty{font-size:12px;color:var(--muted);padding:12px 2px}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(12,13,16,.97);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:7px 8px calc(7px + env(safe-area-inset-bottom))}
.nav button{background:transparent;color:var(--muted);padding:10px 4px;font-size:11px}.nav button.on{color:#e7c66b}
.hide{display:none!important}
dialog{width:min(93vw,500px);max-height:88vh;overflow:auto;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:18px;padding:16px}
dialog::backdrop{background:rgba(0,0,0,.74)}
input,select,textarea{width:100%;background:#0d0e12;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:16px}
textarea{min-height:150px}
.field{margin:10px 0}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.table-picks{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.table-pick{background:var(--panel2);color:var(--text);border:1px solid var(--line);padding:10px 4px}
.table-pick.on{background:#63a4ff;color:#111}
.tag-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.tag{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.tag.on{background:#e7c66b;color:#111}
.note{font-size:11px;color:var(--muted);line-height:1.55}
</style>
</head>
<body>
<header>
<div class="title">SWAMP FOG HELP</div>
<div class="sub">SIMPLE AVAILABILITY BOARD — Ver.2</div>
</header>

<main>
<div class="summary">
  <div class="sum"><b id="sumAttend">0</b><span>出勤</span></div>
  <div class="sum"><b id="sumAvailable">0</b><span>ヘルプ可能</span></div>
  <div class="sum"><b id="sumOwn">0</b><span>自席</span></div>
  <div class="sum"><b id="sumHelp">0</b><span>ヘルプ中</span></div>
</div>

<section id="viewBoard">
  <div class="section-head"><h2>キャスト状況</h2><button class="small secondary" onclick="showInfo()">操作</button></div>
  <div id="castList" class="list"></div>

  <div class="section-head"><h2>自席卓</h2></div>
  <div id="tableList" class="list"></div>
</section>

<section id="viewAttendance" class="hide">
  <div class="section-head"><h2>本日出勤</h2><button class="small" onclick="openBulk()">＋まとめて追加</button></div>
  <div id="attendanceList" class="list"></div>
</section>

<section id="viewManage" class="hide">
  <div class="section-head"><h2>在籍管理</h2><button class="small" onclick="openBulk()">＋追加</button></div>
  <div id="manageList" class="list"></div>
</section>
</main>

<nav class="nav">
<button id="navBoard" class="on" onclick="showView('board')">営業盤</button>
<button id="navAttendance" onclick="showView('attendance')">本日出勤</button>
<button id="navManage" onclick="showView('manage')">在籍</button>
</nav>

<dialog id="bulkDialog">
<h2>キャストまとめて追加</h2>
<p class="note">改行・読点・カンマで区切って入力。重複は自動で除外します。</p>
<div class="field"><textarea id="bulkInput"></textarea></div>
<div class="actions"><button class="secondary" onclick="bulkDialog.close()">閉じる</button><button onclick="addBulk()">追加</button></div>
</dialog>

<dialog id="stateDialog">
<h2 id="stateTitle">状態変更</h2>
<div class="field">
  <button style="width:100%;margin-bottom:8px" onclick="setState('available')">ヘルプ可能</button>
  <button style="width:100%;margin-bottom:8px;background:#63a4ff" onclick="openOwnTables()">自席あり</button>
  <button style="width:100%;background:#ffad5a" onclick="setState('help')">ヘルプ着席中</button>
</div>
<div class="actions"><button class="secondary" onclick="stateDialog.close()">閉じる</button></div>
</dialog>

<dialog id="ownDialog">
<h2 id="ownTitle">自席卓</h2>
<p class="note">複数卓を選ぶと自動で「2被り」「3被り」と表示します。</p>
<div id="tablePicks" class="table-picks"></div>
<div class="actions"><button class="secondary" onclick="ownDialog.close()">閉じる</button><button onclick="saveOwnTables()">保存</button></div>
</dialog>

<dialog id="tableEditDialog">
<h2 id="tableEditTitle">卓情報</h2>
<div class="field"><label>属性</label><div id="tagGrid" class="tag-grid"></div></div>
<div class="field"><label>優先度</label>
<select id="prioritySelect">
<option value="high">高</option>
<option value="mid">中</option>
<option value="low">低</option>
</select>
</div>
<div class="actions"><button class="secondary" onclick="tableEditDialog.close()">閉じる</button><button onclick="saveTableMeta()">保存</button></div>
</dialog>

<script>
const KEY='swampHelpSimpleV2';
const TABLES=['A1','A2','A3','A4','A5','A6','A7','A8','B1','B2','B3','C1','C2','C3','C4','C5','C6','C7','C8','D1','D2','S1','S2','S3','S4','S5','S6','S7','S8','S9','VIP','RVIP'];
const TAGS=['高単価','リピート','場内','飲み上げ','告知','通常'];
let state=load()||{casts:[],tableMeta:{}};
let selectedCastId=null,selectedTables=new Set(),editingTable=null,selectedTags=new Set();

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

function openBulk(){bulkInput.value='';bulkDialog.showModal()}
function addBulk(){
  let arr=[...new Set(bulkInput.value.split(/[\n、,，]+/).map(x=>x.trim()).filter(Boolean))];
  let existing=new Set(state.casts.map(c=>c.name));
  arr.filter(n=>!existing.has(n)).forEach(name=>state.casts.push({id:uid(),name,attend:true,status:'available',tables:[]}));
  bulkDialog.close();save()
}
function toggleAttend(id){
  let c=state.casts.find(x=>x.id===id);c.attend=!c.attend;
  if(!c.attend){c.status='available';c.tables=[]}
  save()
}
function deleteCast(id){
  let c=state.casts.find(x=>x.id===id);if(!c)return;
  if(confirm(c.name+'を削除しますか？')){state.casts=state.casts.filter(x=>x.id!==id);save()}
}

let pressTimer=null,longPressed=false,startX=0,startY=0,moved=false;
function startPress(id,e){
  longPressed=false;moved=false;
  let p=e.touches?e.touches[0]:e;startX=p.clientX;startY=p.clientY;
  pressTimer=setTimeout(()=>{if(!moved){longPressed=true;openState(id)}},600)
}
function movePress(e){
  let p=e.touches?e.touches[0]:e;
  if(Math.abs(p.clientX-startX)>8||Math.abs(p.clientY-startY)>8){
    moved=true;clearTimeout(pressTimer)
  }
}
function endPress(){clearTimeout(pressTimer)}
function cancelPress(){clearTimeout(pressTimer)}

function openState(id){
  selectedCastId=id;let c=state.casts.find(x=>x.id===id);stateTitle.textContent=c.name+' 状態変更';stateDialog.showModal()
}
function setState(st){
  let c=state.casts.find(x=>x.id===selectedCastId);if(!c)return;
  c.status=st;if(st!=='own')c.tables=[];
  stateDialog.close();save()
}
function openOwnTables(){
  stateDialog.close();
  let c=state.casts.find(x=>x.id===selectedCastId);c.status='own';
  selectedTables=new Set(c.tables||[]);
  ownTitle.textContent=c.name+' 自席卓';
  renderTablePicks();ownDialog.showModal()
}
function renderTablePicks(){
  tablePicks.innerHTML=TABLES.map(t=>`<button class="table-pick ${selectedTables.has(t)?'on':''}" onclick="toggleTable('${t}')">${t}</button>`).join('')
}
function toggleTable(t){selectedTables.has(t)?selectedTables.delete(t):selectedTables.add(t);renderTablePicks()}
function saveOwnTables(){
  let c=state.casts.find(x=>x.id===selectedCastId);c.status='own';c.tables=[...selectedTables];
  ownDialog.close();save()
}
function getOwners(table){
  return state.casts.filter(c=>c.attend&&c.status==='own'&&(c.tables||[]).includes(table))
}
function openTableMeta(table){
  editingTable=table;
  let m=state.tableMeta[table]||{priority:'mid',tags:[]};
  selectedTags=new Set(m.tags||[]);
  prioritySelect.value=m.priority||'mid';
  tableEditTitle.textContent=table+' 卓情報';
  renderTags();tableEditDialog.showModal()
}
function renderTags(){tagGrid.innerHTML=TAGS.map(t=>`<button class="tag ${selectedTags.has(t)?'on':''}" onclick="toggleTag('${t}')">${t}</button>`).join('')}
function toggleTag(t){selectedTags.has(t)?selectedTags.delete(t):selectedTags.add(t);renderTags()}
function saveTableMeta(){
  state.tableMeta[editingTable]={priority:prioritySelect.value,tags:[...selectedTags]};
  tableEditDialog.close();save()
}

function priorityClass(t){return (state.tableMeta[t]||{priority:'mid'}).priority}
function priorityText(t){
  let p=priorityClass(t);
  return p==='high'?'高':p==='low'?'低':'中'
}

function render(){
  let attending=state.casts.filter(c=>c.attend);
  let available=attending.filter(c=>c.status==='available').length;
  let own=attending.filter(c=>c.status==='own').length;
  let help=attending.filter(c=>c.status==='help').length;
  sumAttend.textContent=attending.length;sumAvailable.textContent=available;sumOwn.textContent=own;sumHelp.textContent=help;

  castList.innerHTML=attending.length?attending.map(c=>{
    let count=(c.tables||[]).length;
    let tables=(c.tables||[]).map(t=>`<span class="table-tag ${priorityClass(t)}">${t} ${priorityText(t)}</span>`).join('');
    let sub=c.status==='available'?'今すぐヘルプ可能':
      c.status==='help'?'ヘルプ着席中':
      count>1?`${count}被り`:'自席あり';
    let pill=c.status==='available'?'<span class="status-pill available">ヘルプ可能</span>':
      c.status==='help'?'<span class="status-pill help">ヘルプ中</span>':'';
    return `<div class="cast-row ${c.status==='help'?'help':''}"
      onmousedown="startPress('${c.id}',event)" onmousemove="movePress(event)" onmouseup="endPress()" onmouseleave="cancelPress()"
      ontouchstart="startPress('${c.id}',event)" ontouchmove="movePress(event)" ontouchend="endPress()" ontouchcancel="cancelPress()">
      <div class="cast-main">
        <div class="cast-name">${esc(c.name)}</div>
        <div class="cast-sub">${esc(sub)}</div>
        ${c.status==='own'?`<div class="table-tags">${tables}</div>`:''}
      </div>
      ${pill}
    </div>`
  }).join(''):'<div class="empty">本日出勤を設定してください</div>';

  let usedTables=TABLES.filter(t=>getOwners(t).length);
  tableList.innerHTML=usedTables.length?usedTables.map(t=>{
    let owners=getOwners(t),m=state.tableMeta[t]||{priority:'mid',tags:[]};
    let pLabel=m.priority==='high'?'高':m.priority==='low'?'低':'中';
    return `<div class="table-card ${m.priority}" onclick="openTableMeta('${t}')">
      <div class="table-top"><div><div class="table-name">${t}</div><div class="meta">担当：${owners.map(o=>esc(o.name)).join('・')}</div></div>
      <div class="badge ${m.priority==='high'?'red':m.priority==='low'?'green':'yellow'}">${pLabel}</div></div>
      <div class="badges">${(m.tags||[]).map(x=>`<span class="badge">${esc(x)}</span>`).join('')||'<span class="badge">属性なし</span>'}</div>
    </div>`
  }).join(''):'<div class="empty">自席卓はまだありません</div>';

  attendanceList.innerHTML=state.casts.length?state.casts.map(c=>`<div class="table-card" onclick="toggleAttend('${c.id}')"><div class="table-top"><div><div class="table-name">${esc(c.name)}</div><div class="meta">${c.attend?'本日出勤':'休み'}</div></div><div class="badge ${c.attend?'green':'red'}">${c.attend?'ON':'OFF'}</div></div></div>`).join(''):'<div class="empty">在籍を追加してください</div>';

  manageList.innerHTML=state.casts.length?state.casts.map(c=>`<div class="table-card"><div class="table-top"><div><div class="table-name">${esc(c.name)}</div></div><button class="small secondary" onclick="deleteCast('${c.id}')">削除</button></div></div>`).join(''):'<div class="empty">在籍を追加してください</div>';
}
function showView(v){
  ['Board','Attendance','Manage'].forEach(x=>{
    document.getElementById('view'+x).classList.toggle('hide',x.toLowerCase()!==v);
    document.getElementById('nav'+x).classList.toggle('on',x.toLowerCase()===v)
  });render()
}
function showInfo(){alert('キャスト操作は長押しのみです。\\nスクロール中は操作されません。\\n自席ありを選ぶと複数卓登録できます。\\n卓番の色は各卓の優先度です。')}
render();
</script>
</body>
</html>
