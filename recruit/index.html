<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SWAMP FOG 面接アンケート</title>
<style>
:root{
  --bg:#08090b;
  --panel:#12151a;
  --panel2:#0b0d10;
  --gold:#d8b45b;
  --text:#f5f2ea;
  --muted:#9da4ae;
  --line:#30353e;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  width:100%;
  min-height:100%;
  background:var(--bg);
  overflow-x:hidden;
  overflow-y:auto;
  -webkit-text-size-adjust:100%;
}

body{
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  overflow-x:hidden;
  overflow-y:visible;
  position:static;
  -webkit-overflow-scrolling:touch;
}

.app{
  width:min(980px, calc(100% - 24px));
  max-width:980px;
  margin:0 auto;
  padding:16px 0 96px;
  position:relative;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  border-bottom:1px solid var(--line);
  padding:12px 0 18px;
  margin-bottom:14px;
}

.brand{
  font-weight:900;
  letter-spacing:.16em;
}

.brand small{
  display:block;
  color:var(--gold);
  font-size:10px;
  margin-top:5px;
}


.card{
  width:100%;
  max-width:100%;
  min-width:0;
  overflow:hidden;
  background:var(--panel);
  border:1px solid #292e36;
  border-radius:18px;
  padding:18px;
  margin:14px 0;
}

h1{
  font-size:27px;
  line-height:1.25;
  margin:0 0 8px;
}

h2{
  font-size:18px;
  line-height:1.3;
  color:#f0d083;
  margin:0 0 14px;
}

.lead,.meta{
  color:var(--muted);
  line-height:1.6;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  width:100%;
  min-width:0;
}

.grid > div,
.full{
  min-width:0;
  max-width:100%;
}

.full{
  grid-column:1/-1;
}

label{
  display:block;
  color:#d1d5db;
  font-size:13px;
  margin-bottom:6px;
}

input,
select,
textarea{
  display:block;
  width:100%;
  max-width:100%;
  min-width:0;
  min-height:48px;
  background:var(--panel2);
  color:#fff;
  border:1px solid #373c45;
  border-radius:12px;
  padding:12px;
  font:inherit;
}

textarea{
  min-height:90px;
  resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
  outline:none;
  border-color:var(--gold);
  box-shadow:0 0 0 2px rgba(216,180,91,.12);
}

.btn{
  box-sizing:border-box;
  max-width:100%;
  min-height:46px;
  border:1px solid #3b414b;
  background:#171a20;
  color:#fff;
  border-radius:12px;
  padding:11px 14px;
  font:inherit;
  white-space:normal;
}

.primary{
  border:0;
  background:linear-gradient(135deg,#ae8127,#f1d47f);
  color:#171109;
  font-weight:900;
}

.wide{
  display:block;
  width:100%;
  max-width:100%;
  padding:16px;
  text-align:center;
}

.hidden{
  display:none!important;
}

.modal{
  position:fixed;
  inset:0;
  background:#000c;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:9;
  overflow:auto;
}

.box{
  width:min(800px,100%);
  max-width:100%;
  max-height:calc(100vh - 36px);
  overflow:auto;
  background:#14171c;
  border:1px solid #363b44;
  border-radius:18px;
  padding:18px;
  -webkit-overflow-scrolling:touch;
}

.list{display:grid;gap:9px}

.item{
  min-width:0;
  background:#0d1014;
  border:1px solid #2c3139;
  border-radius:13px;
  padding:13px;
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.toolbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:12px 0;
}

.toolbar>*{
  flex:1 1 140px;
  min-width:0;
}

.detail{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.d{
  min-width:0;
  overflow-wrap:anywhere;
  background:#0c0f13;
  border-radius:10px;
  padding:10px;
}

.d small{
  color:var(--muted);
  display:block;
  margin-bottom:4px;
}

.danger{
  color:#ffaaaa;
  border-color:#6e3e3e;
}

.spinner{
  position:fixed;
  inset:0;
  background:#000a;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:20;
  font-weight:800;
}

.status-cards{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
  margin:10px 0 12px;
}

.status-card{
  appearance:none;
  width:100%;
  min-width:0;
  min-height:58px;
  border:1px solid #2f3540;
  border-radius:12px;
  background:#11151a;
  color:#fff;
  padding:8px 4px;
  text-align:center;
  cursor:pointer;
  font:inherit;
}

.status-card strong{
  display:block;
  font-size:12px;
  font-weight:700;
  margin-bottom:4px;
}

.status-card span{
  display:block;
  font-size:20px;
  font-weight:800;
  line-height:1;
}

.status-card:active{transform:scale(.98)}
.status-card.active{
  border-color:#f5c542;
  box-shadow:0 0 0 1px #f5c542 inset;
}

/* iPhone / smartphone */
@media screen and (max-width:700px){
  html,body{
    width:100%;
    max-width:100%;
    overflow-x:hidden;
  }

  body{
    overflow-y:auto;
  }

  .app{
    width:calc(100% - 24px);
    max-width:calc(100% - 24px);
    margin:0 12px;
    padding:14px 0 calc(120px + env(safe-area-inset-bottom));
  }

  header{
    padding:10px 2px 16px;
    margin-bottom:12px;
  }

  .brand{font-size:15px}
  .brand small{font-size:9px}

  .card{
    width:100%;
    max-width:100%;
    border-radius:18px;
    padding:18px 16px;
    margin:12px 0;
  }

  h1{
    font-size:25px;
    margin-bottom:12px;
  }

  h2{
    font-size:20px;
    margin-bottom:16px;
  }

  .lead{
    font-size:14px;
    margin-bottom:16px;
  }

  .grid,
  .detail{
    display:grid;
    grid-template-columns:minmax(0,1fr);
    gap:14px;
    width:100%;
    max-width:100%;
  }

  .full{
    grid-column:1;
  }

  label{
    font-size:15px;
    margin-bottom:7px;
  }

  input,
  select,
  textarea{
    width:100%;
    max-width:100%;
    min-width:0;
    min-height:52px;
    font-size:16px;
    padding:12px 14px;
    border-radius:13px;
  }

  textarea{
    min-height:88px;
  }

  .btn{
    min-height:48px;
    font-size:15px;
    padding:11px 13px;
  }

  .wide{
    width:100%;
    max-width:100%;
    min-height:54px;
    padding:14px 12px;
  }

  .status-cards{
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:6px;
  }

  .status-card{
    min-height:56px;
    padding:7px 3px;
  }

  .status-card strong{font-size:11px}
  .status-card span{font-size:18px}

  .toolbar>*{
    flex:1 1 100%;
  }
}

/* ===== SMARTPHONE STEPPER FORM ===== */
.step-progress{position:sticky;top:0;z-index:6;background:rgba(8,9,11,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:10px 0 8px;margin-bottom:8px}
.step-progress-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
.step-progress-head strong{font-size:14px;color:#f0d083}
.step-progress-head span{font-size:12px;color:var(--muted)}
.step-progress-track{width:100%;height:7px;border-radius:999px;overflow:hidden;background:#20242b}
.step-progress-bar{height:100%;width:16.666%;background:linear-gradient(90deg,#a87820,#f1d47f);transition:width .2s ease}
.form-step{display:none}.form-step.active{display:block}
.step-kicker{display:inline-block;margin-bottom:8px;color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.08em}
.step-nav{position:sticky;bottom:0;z-index:7;display:flex;gap:10px;margin-top:14px;padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,#08090b 75%,rgba(8,9,11,0))}
.step-nav .btn{flex:1;min-height:54px;font-weight:800}.step-nav .primary{flex:1.4}
.step-help{margin:-4px 0 14px;color:var(--muted);font-size:12px;line-height:1.5}
@media screen and (max-width:700px){
  #formView .card{padding:18px 15px}
  #formView input,#formView select,#formView textarea{min-height:56px;font-size:17px}
  #formView textarea{min-height:110px}
  #formView label{font-size:15px;font-weight:700}
}

</style></head><body><div class="app">
<header><div class="brand">SWAMP FOG<small>INTERVIEW SHEET</small></div><button class="btn" onclick="loginOpen()">⚙ 管理者</button></header>

<section id="formView">
<form id="f">
  <div class="step-progress">
    <div class="step-progress-head"><strong id="stepTitle">面接・基本情報</strong><span id="stepCount">1 / 6</span></div>
    <div class="step-progress-track"><div id="stepBar" class="step-progress-bar"></div></div>
  </div>

  <section class="form-step active" data-step="0" data-title="面接・基本情報">
    <div class="card"><span class="step-kicker">STEP 1</span><h1>面接アンケート</h1><p class="lead">まず基本情報を入力してください。</p>
      <div class="grid">
        <div><label>面接日</label><input id="ivDate" type="date"></div>
        <div><label>応募方法 *</label><select id="method" required onchange="methodChange()"><option value="">選択してください</option><option>ホスホス</option><option>スターガイズ</option><option>インスタ</option><option>X</option><option>TikTok</option><option>紹介</option><option>その他</option></select></div>
        <div id="methodDetailWrap" class="full hidden"><label id="methodDetailLabel">詳細 *</label><input id="methodDetail"></div>
        <div><label>フリガナ</label><input name="furigana"></div><div><label>氏名 *</label><input name="name" required></div>
        <div><label>生年月日</label><input name="birthday" type="date" onchange="calcAge()"></div><div><label>年齢</label><input name="age" id="age" readonly></div>
        <div class="full"><label>連絡先</label><input name="phone" type="tel" inputmode="tel"></div>
      </div>
    </div>
  </section>

  <section class="form-step" data-step="1" data-title="プロフィール・経歴">
    <div class="card"><span class="step-kicker">STEP 2</span><h2>プロフィール・経歴</h2><p class="step-help">分からない項目は空欄のままで大丈夫です。</p>
      <div class="grid">
        <div><label>身長</label><input name="height" type="number" inputmode="numeric" placeholder="cm"></div>
        <div><label>血液型</label><select name="blood"><option value="">未回答</option><option>A</option><option>B</option><option>O</option><option>AB</option><option>不明</option></select></div>
        <div><label>国籍</label><input name="nationality"></div><div class="full"><label>現住所</label><input name="address"></div>
        <div class="full"><label>最終学歴</label><input name="education"></div>
        <div class="full"><label>職歴①</label><input name="career1" placeholder="勤務先・職種・勤続年数"></div>
        <div class="full"><label>職歴②</label><input name="career2" placeholder="勤務先・職種・勤続年数"></div>
        <div class="full"><label>職歴③</label><input name="career3" placeholder="勤務先・職種・勤続年数"></div>
        <div class="full"><label>職歴④</label><input name="career4" placeholder="勤務先・職種・勤続年数"></div>
      </div>
    </div>
  </section>

  <section class="form-step" data-step="2" data-title="働き方・ホスト経験">
    <div class="card"><span class="step-kicker">STEP 3</span><h2>働き方・ホスト経験</h2>
      <div class="grid">
        <div><label>雇用形態</label><select name="employment"><option value="">未回答</option><option>レギュラー</option><option>バイト</option></select></div>
        <div><label>希望出勤日数</label><select name="days"><option value="">未回答</option><option>週1日</option><option>週2日</option><option>週3日</option><option>週4日</option><option>週5日</option><option>週6日以上</option></select></div>
        <div><label>希望源氏名</label><input name="stage"></div><div><label>ホスト経験</label><select name="exp"><option value="">未回答</option><option>有</option><option>無</option></select></div>
        <div><label>経験期間</label><input name="expPeriod" placeholder="例：2年3ヶ月"></div><div><label>過去最高月収</label><input name="highIncome" inputmode="numeric" placeholder="万円"></div>
        <div><label>過去最低月収</label><input name="lowIncome" inputmode="numeric" placeholder="万円"></div><div><label>現在の状況</label><select name="current"><option value="">未回答</option><option>在籍中</option><option>在籍なし</option></select></div>
        <div class="full"><label>現在の在籍先</label><input name="workplace"></div>
      </div>
    </div>
  </section>

  <section class="form-step" data-step="3" data-title="SNS">
    <div class="card"><span class="step-kicker">STEP 4</span><h2>SNS</h2>
      <div class="grid">
        <div><label>X フォロワー数</label><input name="x" inputmode="numeric"></div><div><label>Instagram フォロワー数</label><input name="ig" inputmode="numeric"></div>
        <div><label>TikTok フォロワー数</label><input name="tt" inputmode="numeric"></div><div><label>YouTube 登録者数</label><input name="yt" inputmode="numeric"></div>
        <div class="full"><label>SNSアカウント</label><input name="sns" placeholder="@ユーザー名 / URL"></div>
      </div>
    </div>
  </section>

  <section class="form-step" data-step="4" data-title="面接質問">
    <div class="card"><span class="step-kicker">STEP 5</span><h2>面接質問</h2>
      <div class="grid">
        <div class="full"><label>当店を選んだ理由 ①</label><textarea name="reason1"></textarea></div>
        <div class="full"><label>当店を選んだ理由 ②</label><textarea name="reason2"></textarea></div>
        <div class="full"><label>当店を選んだ理由 ③</label><textarea name="reason3"></textarea></div>
        <div class="full"><label>仕事で大切なこと ①</label><textarea name="important1"></textarea></div>
        <div class="full"><label>仕事で大切なこと ②</label><textarea name="important2"></textarea></div>
        <div class="full"><label>仕事で大切なこと ③</label><textarea name="important3"></textarea></div>
        <div><label>会話は得意ですか？</label><select name="talk"><option value="">未回答</option><option>はい</option><option>いいえ</option></select></div>
        <div><label>お酒は飲めますか？</label><select name="drink"><option value="">未回答</option><option>はい</option><option>いいえ</option></select></div>
      </div>
    </div>
  </section>

  <section class="form-step" data-step="5" data-title="自己管理・体験">
    <div class="card"><span class="step-kicker">STEP 6</span><h2>自己管理・体験</h2>
      <div class="grid">
        <div class="full"><label>長所</label><textarea name="strength"></textarea></div><div class="full"><label>短所</label><textarea name="weakness"></textarea></div>
        <div class="full"><label>部活・特技・趣味</label><textarea name="hobby"></textarea></div><div class="full"><label>不安・悩み</label><textarea name="worry"></textarea></div>
        <div><label>体調面の自己管理</label><select name="health"><option value="">未回答</option><option>している</option><option>していない</option></select></div><div><label>具体的な内容</label><input name="healthDetail"></div>
        <div><label>通院や持病</label><select name="medical"><option value="">未回答</option><option>ある</option><option>ない</option></select></div><div><label>具体的な内容</label><input name="medicalDetail"></div>
        <div class="full"><label>将来の夢</label><textarea name="dream"></textarea></div><div class="full"><label>体験入店した店舗</label><textarea name="tried"></textarea></div>
        <div class="full"><label>体験予定の店舗</label><textarea name="planned"></textarea></div>
      </div>
      <p class="step-help" style="margin-top:16px">入力内容を確認して「アンケートを送信」を押してください。</p>
    </div>
  </section>

  <div class="step-nav">
    <button id="prevStepBtn" class="btn hidden" type="button" onclick="changeStep(-1)">戻る</button>
    <button id="nextStepBtn" class="btn primary" type="button" onclick="changeStep(1)">次へ</button>
    <button id="submitStepBtn" class="btn primary hidden" type="submit">アンケートを送信</button>
  </div>
</form>
</section>

<section id="thanks" class="hidden"><div class="card" style="text-align:center;padding:55px 20px"><h1 style="color:#f0d083">✓</h1><h1>ご回答ありがとうございました</h1><p class="lead">スタッフをお呼びください。</p><button class="btn" onclick="resetForm()">入力画面へ戻る</button></div></section>
<section id="admin" class="hidden">
  <div id="statusCards" class="status-cards"></div>
  <div class="toolbar">
    <button class="btn" onclick="logout()">応募者画面へ</button>
    <input id="search" placeholder="名前・応募方法・担当者で検索" oninput="render()">
    <select id="filter" onchange="render()">
      <option value="">全ステータス</option>
      <option>応募</option>
      <option>面接</option>
      <option>体験入店</option>
      <option>入店</option>
      <option>辞退</option>
      <option>不採用</option>
    </select>
    <button class="btn" onclick="loadApplicants()">更新</button>
  </div>
  <div id="list" class="list"></div>
</section>

<div id="login" class="modal hidden"><div class="box" style="width:min(420px,100%)"><h2>管理者ログイン</h2><label>パスワード</label><input id="pw" type="password"><div class="toolbar"><button class="btn" onclick="loginClose()">キャンセル</button><button class="btn primary" onclick="doLogin()">ログイン</button></div></div></div>
<div id="detailModal" class="modal hidden"><div class="box"><div id="detail"></div></div></div>
<div id="spinner" class="spinner hidden">通信中...</div>

<script>
let adminPassword='', applicants=[]; const $=s=>document.querySelector(s);
function today(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function spin(v){$('#spinner').classList.toggle('hidden',!v)}
function methodChange(){let v=$('#method').value,show=v==='紹介'||v==='その他';$('#methodDetailWrap').classList.toggle('hidden',!show);$('#methodDetail').required=show;$('#methodDetailLabel').textContent=v==='紹介'?'紹介者名 *':'その他の応募方法 *';if(!show)$('#methodDetail').value=''}
function calcAge(){let v=document.querySelector('[name=birthday]').value;if(!v){$('#age').value='';return}let b=new Date(v+'T00:00:00'),n=new Date(),a=n.getFullYear()-b.getFullYear();if(n.getMonth()<b.getMonth()||(n.getMonth()==b.getMonth()&&n.getDate()<b.getDate()))a--;$('#age').value=a}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function formObject(){let fd=new FormData($('#f')),o={interviewDate:$('#ivDate').value,method:$('#method').value,methodDetail:$('#methodDetail').value.trim()};for(let [k,v] of fd.entries())o[k]=String(v).trim();return o}

let currentStep = 0;
function initFormStepper(){currentStep=0;const d=$('#ivDate');if(d&&!d.value)d.value=today();showStep(0)}
function showStep(index){const steps=[...document.querySelectorAll('.form-step')];if(!steps.length)return;currentStep=Math.max(0,Math.min(index,steps.length-1));steps.forEach((step,i)=>step.classList.toggle('active',i===currentStep));const active=steps[currentStep];$('#stepTitle').textContent=active.dataset.title||'';$('#stepCount').textContent=`${currentStep+1} / ${steps.length}`;$('#stepBar').style.width=`${((currentStep+1)/steps.length)*100}%`;$('#prevStepBtn').classList.toggle('hidden',currentStep===0);$('#nextStepBtn').classList.toggle('hidden',currentStep===steps.length-1);$('#submitStepBtn').classList.toggle('hidden',currentStep!==steps.length-1);window.scrollTo({top:0,behavior:'smooth'})}
function validateCurrentStep(){const step=document.querySelector(`.form-step[data-step="${currentStep}"]`);if(!step)return true;for(const el of [...step.querySelectorAll('[required]')]){if(!String(el.value||'').trim()){el.focus();alert('必須項目を入力してください。');return false}}if(currentStep===0){const method=$('#method').value;if((method==='紹介'||method==='その他')&&!$('#methodDetail').value.trim()){$('#methodDetail').focus();alert('応募方法の詳細を入力してください。');return false}}return true}
function changeStep(delta){if(delta>0&&!validateCurrentStep())return;showStep(currentStep+delta)}


$('#f').onsubmit=e=>{
 e.preventDefault();
 if(!$('#method').value){alert('応募方法を選択してください');return}

function resetForm(){$('#thanks').classList.add('hidden');$('#formView').classList.remove('hidden');$('#ivDate').value=today();currentStep=0;showStep(0)}
function loginOpen(){$('#login').classList.remove('hidden');$('#pw').value=''}function loginClose(){$('#login').classList.add('hidden')}
function doLogin(){let p=$('#pw').value;spin(true);google.script.run.withSuccessHandler(ok=>{spin(false);if(!ok){alert('パスワードが違います');return}adminPassword=p;loginClose();$('#formView').classList.add('hidden');$('#thanks').classList.add('hidden');$('#admin').classList.remove('hidden');loadApplicants()}).withFailureHandler(e=>{spin(false);alert(e.message)}).adminLogin(p)}
function logout(){adminPassword='';$('#admin').classList.add('hidden');$('#formView').classList.remove('hidden');$('#ivDate').value=today();currentStep=0;showStep(0)}
function loadApplicants(){spin(true);google.script.run.withSuccessHandler(a=>{spin(false);applicants=a||[];render()}).withFailureHandler(e=>{spin(false);alert(e.message);logout()}).getApplicants(adminPassword)}
function renderStatusCards(){
  const box = $('#statusCards');
  if (!box) return;

  const statuses = ['応募','面接','体験入店','入店','辞退','不採用'];

  box.innerHTML = statuses.map(status => {
    const count = applicants.filter(x =>
      String(x['ステータス'] || '').trim() === status
    ).length;

    const active = $('#filter').value === status ? ' active' : '';

return `
  <button class="status-card${active}" onclick="filterByStatus('${status}')">
    <strong>${status}</strong>
    <span>${count}人</span>
  </button>
`;
  }).join('');
}

function filterByStatus(status){
  $('#filter').value = status;
  render();
}
function render(){
  renderStatusCards();
  let q=$('#search').value.toLowerCase(),f=$('#filter').value,arr=applicants.filter(x=>(!f||x['ステータス']===f)&&(!q||[x['氏名'],x['希望源氏名'],x['応募方法'],x['応募方法詳細'],x['面接担当者'],x['SNSアカウント']].join(' ').toLowerCase().includes(q)));$('#list').innerHTML=arr.length?arr.map(x=>`<div class="item" onclick="openDetail('${esc(x.ID)}')"><div><b>${esc(x['氏名'])}</b><div class="meta">${esc(x['面接日'])} ・ ${esc(x['応募方法'])}${x['応募方法詳細']?'（'+esc(x['応募方法詳細'])+'）':''}${x['面接担当者']?' ・ 担当:'+esc(x['面接担当者']):''}</div></div><span>${esc(x['ステータス'])}</span></div>`).join(''):'<div class="card lead">データがありません。</div>'}
function D(k,v){return`<div class="d"><small>${esc(k)}</small><div>${esc(v||'—')}</div></div>`}
function openDetail(id){let x=applicants.find(v=>v.ID===id);if(!x)return;let skip=['ID','回答日時','面接担当者','ステータス'];let fields=Object.keys(x).filter(k=>!skip.includes(k));$('#detail').innerHTML=`<div class="toolbar"><button class="btn" onclick="closeDetail()">閉じる</button><input id="interviewer" value="${esc(x['面接担当者'])}" placeholder="面接担当者"><select id="status">${['応募','面接','体験入店','入店','辞退','不採用'].map(s=>`<option ${s===x['ステータス']?'selected':''}>${s}</option>`).join('')}</select><button class="btn" onclick="adminSave('${esc(x.ID)}')">保存</button></div><div class="detail">${fields.map(k=>D(k,x[k])).join('')}</div><div class="toolbar"><button class="btn primary" onclick="shareLine('${esc(x.ID)}')">幹部LINEへ共有</button><button class="btn" onclick="copyLine('${esc(x.ID)}')">内容をコピー</button><button class="btn danger" onclick="del('${esc(x.ID)}')">削除</button></div>`;$('#detailModal').classList.remove('hidden')}
function closeDetail(){$('#detailModal').classList.add('hidden')}
function adminSave(id){spin(true);google.script.run.withSuccessHandler(()=>{spin(false);closeDetail();loadApplicants()}).withFailureHandler(e=>{spin(false);alert(e.message)}).updateApplicant(adminPassword,id,$('#interviewer').value.trim(),$('#status').value)}
function lineText(x){
  const lines = ['【SWAMP FOG 面接アンケート】'];

  const hasValue = (value) => {
    if (value === undefined || value === null) return false;

    const v = String(value).trim();

    return !(
      v === '' ||
      v === 'ー' ||
      v === '-' ||
      v === '－' ||
      v === '未回答'
    );
  };

  const add = (label, value) => {
    if (!hasValue(value)) return;
    lines.push(label + '：' + String(value).trim());
  };

  const section = (title, items) => {
    const temp = [];

    items.forEach(([label, value]) => {
      if (hasValue(value)) {
        temp.push(label + '：' + String(value).trim());
      }
    });

    // 回答が1つでもあるセクションだけ表示
    if (temp.length > 0) {
      lines.push('');
      lines.push('■ ' + title);
      lines.push(...temp);
    }
  };


  // =========================
  // 面接情報
  // =========================

  let interviewDate = x['面接日'];

  if (hasValue(interviewDate)) {
    interviewDate = String(interviewDate)
      .replace(/ 00:00:00$/, '');
  }

  section('面接情報', [
    ['面接日', interviewDate],
    ['面接担当', x['面接担当者']],
    ['応募方法', x['応募方法']],
    ['応募方法詳細', x['応募方法詳細']]
  ]);


  // =========================
  // 基本情報
  // =========================

  section('基本情報', [
    ['氏名', x['氏名']],
    ['フリガナ', x['フリガナ']],
    ['生年月日', x['生年月日']],
    ['年齢', x['年齢']],
    ['国籍', x['国籍']],
    ['連絡先', x['連絡先']],
    ['現住所', x['現住所']],
    ['現在の状況', x['現在の状況']]
  ]);


  // =========================
  // SNS
  // =========================

  section('SNS', [
    ['Instagram', x['Instagramフォロワー']],
    ['TikTok', x['TikTokフォロワー']],
    ['X', x['Xフォロワー']],
    ['YouTube', x['YouTube登録者']],
    ['SNSアカウント', x['SNSアカウント']]
  ]);


  // =========================
  // 経歴・ホスト経験
  // =========================

  section('経歴・ホスト経験', [
    ['雇用形態', x['雇用形態']],
    ['ホスト経験', x['ホスト経験']],
    ['経験期間', x['経験期間']],
    ['過去最高月収', x['過去最高月収']],
    ['現在の在籍先', x['現在の在籍先']],
    ['職歴1', x['職歴1']],
    ['職歴2', x['職歴2']],
    ['職歴3', x['職歴3']],
    ['職歴4', x['職歴4']]
  ]);


  // =========================
  // 面接内容
  // =========================

  section('面接内容', [
    ['当店を選んだ理由①', x['当店を選んだ理由1']],
    ['当店を選んだ理由②', x['当店を選んだ理由2']],
    ['当店を選んだ理由③', x['当店を選んだ理由3']],
    ['仕事で大切なこと①', x['仕事で大切なこと1']],
    ['仕事で大切なこと②', x['仕事で大切なこと2']],
    ['長所', x['長所']],
    ['短所', x['短所']],
    ['不安・悩み', x['不安・悩み']],
    ['将来の夢', x['将来の夢']]
  ]);


  // =========================
  // 体調・自己管理
  // =========================

  section('体調・自己管理', [
    ['体調面の自己管理', x['体調面の自己管理']],
    ['通院や持病', x['通院や持病']],
    ['通院・持病詳細', x['通院・持病 詳細']],
    ['お酒は飲める', x['お酒は飲める']]
  ]);


  // =========================
  // 体験・出勤
  // =========================

  section('体験・出勤', [
    ['体験入店した店舗', x['体験入店した店舗']],
    ['体験予定の店舗', x['体験予定の店舗']],
    ['希望出勤日数', x['希望出勤日数']]
  ]);


  // =========================
  // 最終ステータス
  // =========================

  if (hasValue(x['ステータス'])) {
    lines.push('');
    lines.push('■ ステータス');
    lines.push(String(x['ステータス']).trim());
  }


  return lines.join('\n');
}

  

async function cp(t){try{await navigator.clipboard.writeText(t);return true}catch(e){let a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();let ok=document.execCommand('copy');a.remove();return ok}}
async function copyLine(id){let x=applicants.find(v=>v.ID===id);alert(await cp(lineText(x))?'コピーしました':'コピーできませんでした')}
async function shareLine(id){let x=applicants.find(v=>v.ID===id),t=lineText(x);if(navigator.share){try{await navigator.share({title:'SWAMP FOG 面接アンケート',text:t});return}catch(e){if(e.name==='AbortError')return}}await cp(t);alert('共有できない環境のためコピーしました。LINEに貼り付けてください。')}
function del(id){if(!confirm('この応募者データを削除しますか？'))return;spin(true);google.script.run.withSuccessHandler(()=>{spin(false);closeDetail();loadApplicants()}).withFailureHandler(e=>{spin(false);alert(e.message)}).deleteApplicant(adminPassword,id)}
