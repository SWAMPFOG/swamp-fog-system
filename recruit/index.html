<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><title>SWAMP FOG 面接アンケート</title>
<style>
:root{--bg:#08090b;--p:#12151a;--g:#d8b45b;--t:#f5f2ea;--m:#9da4ae;--l:#30353e}*{box-sizing:border-box}body{margin:0;background:#08090b;color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}.app{max-width:980px;margin:auto;padding:18px 18px 40px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--l);padding:12px 0 18px}.brand{font-weight:900;letter-spacing:.16em}.brand small{display:block;color:var(--g);font-size:10px;margin-top:5px}.card{background:var(--p);border:1px solid #292e36;border-radius:18px;padding:18px;margin:14px 0}h1{font-size:27px;margin:0 0 8px}h2{font-size:18px;color:#f0d083;margin:0 0 14px}.lead{color:var(--m);line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{display:block;color:#d1d5db;font-size:13px;margin-bottom:6px}input,select,textarea{width:100%;min-height:48px;background:#0b0d10;color:#fff;border:1px solid #373c45;border-radius:12px;padding:12px;font:inherit}textarea{min-height:90px}.btn{border:1px solid #3b414b;background:#171a20;color:#fff;border-radius:12px;padding:11px 14px;font:inherit}.primary{border:0;background:linear-gradient(135deg,#ae8127,#f1d47f);color:#171109;font-weight:900}.wide{width:100%;padding:16px}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;padding:18px;z-index:9}.box{width:min(780px,100%);max-height:90vh;overflow:auto;background:#14171c;border:1px solid #363b44;border-radius:18px;padding:18px}.list{display:grid;gap:9px}.item{background:#0d1014;border:1px solid #2c3139;border-radius:13px;padding:13px;display:flex;justify-content:space-between;gap:10px}.meta{font-size:12px;color:var(--m);margin-top:4px}.detail{display:grid;grid-template-columns:1fr 1fr;gap:8px}.d{background:#0c0f13;border-radius:10px;padding:10px}.d small{color:var(--m);display:block;margin-bottom:4px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.toolbar>*{flex:1}.danger{color:#ffaaaa;border-color:#6e3e3e}@media(max-width:650px){.grid,.detail{grid-template-columns:1fr}.brand{font-size:16px}}
</style></head><body><div class="app">
<header><div class="brand">SWAMP FOG<small>INTERVIEW SHEET</small></div><button class="btn" onclick="loginOpen()">⚙ 管理者</button></header>

<section id="formView"><div class="card"><h1>面接アンケート</h1><p class="lead">面接の参考に使用します。分かる範囲で入力してください。</p><div class="grid"><div><label>面接日</label><input id="ivDate" readonly></div><div><label>応募方法 *</label><select id="method" required onchange="methodChange()"><option value="">選択</option><option>ホスホス</option><option>スターガイズ</option><option>インスタ</option><option>X</option><option>TikTok</option><option>紹介</option><option>その他</option></select></div><div id="methodDetailWrap" class="full hidden"><label id="methodDetailLabel">詳細 *</label><input id="methodDetail"></div></div></div>

<form id="f">
<div class="card"><h2>01 個人情報</h2><div class="grid">
<div><label>フリガナ</label><input name="furigana"></div><div><label>氏名 *</label><input name="name" required></div>
<div><label>生年月日</label><input name="birthday" type="date" onchange="calcAge()"></div><div><label>年齢</label><input name="age" id="age" readonly></div>
<div><label>身長</label><input name="height" type="number" placeholder="cm"></div><div><label>血液型</label><select name="blood"><option value="">未回答</option><option>A</option><option>B</option><option>O</option><option>AB</option><option>不明</option></select></div>
<div><label>国籍</label><input name="nationality"></div><div><label>連絡先</label><input name="phone" type="tel"></div>
<div class="full"><label>現住所</label><input name="address"></div><div class="full"><label>最終学歴</label><input name="education"></div>
<div class="full"><label>職歴①</label><input name="career1" placeholder="勤務先・職種・勤続年数"></div><div class="full"><label>職歴②</label><input name="career2" placeholder="勤務先・職種・勤続年数"></div>
<div class="full"><label>職歴③</label><input name="career3" placeholder="勤務先・職種・勤続年数"></div><div class="full"><label>職歴④</label><input name="career4" placeholder="勤務先・職種・勤続年数"></div>
</div></div>

<div class="card"><h2>02 質問項目</h2><div class="grid">
<div><label>雇用形態</label><select name="employment"><option value="">未回答</option><option>レギュラー</option><option>バイト</option></select></div><div><label>バイト希望：週何日</label><select name="days"><option value="">未回答</option><option>週1日</option><option>週2日</option><option>週3日</option><option>週4日</option><option>週5日</option><option>週6日以上</option></select></div>
<div><label>希望源氏名</label><input name="stage"></div><div><label>ホスト経験</label><select name="exp"><option value="">未回答</option><option>有</option><option>無</option></select></div>
<div><label>経験ありの場合の期間</label><input name="expPeriod"></div><div><label>過去最高月収</label><input name="highIncome" placeholder="万円"></div>
<div><label>過去最低月収</label><input name="lowIncome" placeholder="万円"></div><div><label>現在の状況</label><select name="current"><option value="">未回答</option><option>在籍中</option><option>在籍なし</option></select></div>
<div class="full"><label>現在の在籍先</label><input name="workplace"></div>
<div><label>X フォロワー数</label><input name="x"></div><div><label>Instagram フォロワー数</label><input name="ig"></div><div><label>TikTok フォロワー数</label><input name="tt"></div><div><label>YouTube 登録者数</label><input name="yt"></div>
<div class="full"><label>SNSアカウント</label><input name="sns"></div>
<div class="full"><label>当店を選んだ理由 ①</label><input name="reason1"></div><div class="full"><label>当店を選んだ理由 ②</label><input name="reason2"></div><div class="full"><label>当店を選んだ理由 ③</label><input name="reason3"></div>
<div class="full"><label>仕事で大切なこと ①</label><input name="important1"></div><div class="full"><label>仕事で大切なこと ②</label><input name="important2"></div><div class="full"><label>仕事で大切なこと ③</label><input name="important3"></div>
<div><label>会話は得意ですか？</label><select name="talk"><option value="">未回答</option><option>はい</option><option>いいえ</option></select></div><div><label>お酒は飲めますか？</label><select name="drink"><option value="">未回答</option><option>はい</option><option>いいえ</option></select></div>
<div class="full"><label>長所</label><textarea name="strength"></textarea></div><div class="full"><label>短所</label><textarea name="weakness"></textarea></div><div class="full"><label>部活・特技・趣味</label><textarea name="hobby"></textarea></div><div class="full"><label>不安・悩み</label><textarea name="worry"></textarea></div>
<div><label>体調面の自己管理</label><select name="health"><option value="">未回答</option><option>している</option><option>していない</option></select></div><div><label>具体的な内容</label><input name="healthDetail"></div>
<div><label>通院や持病</label><select name="medical"><option value="">未回答</option><option>ある</option><option>ない</option></select></div><div><label>具体的な内容</label><input name="medicalDetail"></div>
<div class="full"><label>将来の夢</label><textarea name="dream"></textarea></div><div class="full"><label>体験入店した店舗</label><textarea name="tried"></textarea></div><div class="full"><label>体験予定の店舗</label><textarea name="planned"></textarea></div>
</div></div><div class="card"><button class="btn primary wide">アンケートを送信</button></div></form></section>

<section id="thanks" class="hidden"><div class="card" style="text-align:center;padding:55px 20px"><h1 style="color:#f0d083">✓</h1><h1>ご回答ありがとうございました</h1><p class="lead">スタッフをお呼びください。</p><button class="btn" onclick="resetForm()">次の入力画面へ</button></div></section>

<section id="admin" class="hidden"><div class="toolbar"><button class="btn" onclick="logout()">応募者画面へ</button><input id="search" placeholder="名前・応募方法・担当者で検索" oninput="render()"><select id="filter" onchange="render()"><option value="">全ステータス</option><option>応募</option><option>面接</option><option>体験入店</option><option>入店</option><option>辞退</option><option>不採用</option></select></div><div id="list" class="list"></div></section>
</div>

<div id="login" class="modal hidden"><div class="box" style="width:min(420px,100%)"><h2>管理者ログイン</h2><label>パスワード</label><input id="pw" type="password"><div class="toolbar"><button class="btn" onclick="loginClose()">キャンセル</button><button class="btn primary" onclick="doLogin()">ログイン</button></div></div></div>
<div id="detailModal" class="modal hidden"><div class="box"><div id="detail"></div></div></div>

<script>
const K='swampFogInterview_v12',PK='swampFogInterviewPass';if(!localStorage.getItem(PK))localStorage.setItem(PK,'2026');let data=JSON.parse(localStorage.getItem(K)||'[]');const $=s=>document.querySelector(s);
function today(){let d=new Date();return d.toLocaleDateString('ja-JP')}$('#ivDate').value=today();
function methodChange(){let v=$('#method').value,show=v==='紹介'||v==='その他';$('#methodDetailWrap').classList.toggle('hidden',!show);$('#methodDetail').required=show;$('#methodDetailLabel').textContent=v==='紹介'?'紹介者名 *':'その他の応募方法 *';if(!show)$('#methodDetail').value=''}
function calcAge(){let v=document.querySelector('[name=birthday]').value;if(!v){$('#age').value='';return}let b=new Date(v),n=new Date(),a=n.getFullYear()-b.getFullYear();if(n.getMonth()<b.getMonth()||(n.getMonth()==b.getMonth()&&n.getDate()<b.getDate()))a--;$('#age').value=a}
function save(){localStorage.setItem(K,JSON.stringify(data))}function val(fd,k){return(fd.get(k)||'').toString().trim()}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
$('#f').onsubmit=e=>{e.preventDefault();let fd=new FormData(e.target),o={id:Date.now().toString(),createdAt:new Date().toISOString(),interviewDate:today(),interviewer:'',status:'応募',method:$('#method').value,methodDetail:$('#methodDetail').value.trim()};['furigana','name','birthday','age','height','blood','nationality','phone','address','education','career1','career2','career3','career4','employment','days','stage','exp','expPeriod','highIncome','lowIncome','current','workplace','x','ig','tt','yt','sns','reason1','reason2','reason3','important1','important2','important3','talk','drink','strength','weakness','hobby','worry','health','healthDetail','medical','medicalDetail','dream','tried','planned'].forEach(k=>o[k]=val(fd,k));data.unshift(o);save();e.target.reset();$('#method').value='';methodChange();$('#formView').classList.add('hidden');$('#thanks').classList.remove('hidden');scrollTo(0,0)}
function resetForm(){$('#thanks').classList.add('hidden');$('#formView').classList.remove('hidden');$('#ivDate').value=today();scrollTo(0,0)}
function loginOpen(){$('#login').classList.remove('hidden');$('#pw').value=''}function loginClose(){$('#login').classList.add('hidden')}function doLogin(){if($('#pw').value===localStorage.getItem(PK)){loginClose();$('#formView').classList.add('hidden');$('#thanks').classList.add('hidden');$('#admin').classList.remove('hidden');render()}else alert('パスワードが違います')}
function logout(){$('#admin').classList.add('hidden');$('#formView').classList.remove('hidden');$('#ivDate').value=today()}
function render(){let q=$('#search').value.toLowerCase(),f=$('#filter').value,arr=data.filter(x=>(!f||x.status===f)&&(!q||[x.name,x.stage,x.method,x.methodDetail,x.interviewer,x.sns].join(' ').toLowerCase().includes(q)));$('#list').innerHTML=arr.length?arr.map(x=>`<div class="item" onclick="openDetail('${x.id}')"><div><b>${esc(x.name)}</b><div class="meta">${esc(x.interviewDate)} ・ ${esc(x.method)}${x.methodDetail?'（'+esc(x.methodDetail)+'）':''}${x.interviewer?' ・ 担当:'+esc(x.interviewer):''}</div></div><span>${esc(x.status)}</span></div>`).join(''):'<div class="card lead">データがありません。</div>'}
function D(k,v){return`<div class="d"><small>${esc(k)}</small><div>${esc(v||'—')}</div></div>`}
function openDetail(id){let x=data.find(v=>v.id===id);if(!x)return;let fs=[['面接日',x.interviewDate],['応募方法',x.method+(x.methodDetail?'（'+x.methodDetail+'）':'')],['フリガナ',x.furigana],['氏名',x.name],['生年月日',x.birthday],['年齢',x.age?x.age+'歳':''],['身長',x.height?x.height+'cm':''],['血液型',x.blood],['国籍',x.nationality],['連絡先',x.phone],['現住所',x.address],['最終学歴',x.education],['職歴',[x.career1,x.career2,x.career3,x.career4].filter(Boolean).join('\n')],['雇用形態',x.employment+(x.days?' / '+x.days:'')],['希望源氏名',x.stage],['ホスト経験',x.exp],['経験期間',x.expPeriod],['過去最高月収',x.highIncome?x.highIncome+'万円':''],['過去最低月収',x.lowIncome?x.lowIncome+'万円':''],['現在の状況',x.current],['在籍先',x.workplace],['X',x.x],['Instagram',x.ig],['TikTok',x.tt],['YouTube',x.yt],['SNS',x.sns],['当店を選んだ理由',[x.reason1,x.reason2,x.reason3].filter(Boolean).join('\n')],['仕事で大切なこと',[x.important1,x.important2,x.important3].filter(Boolean).join('\n')],['会話',x.talk],['お酒',x.drink],['長所',x.strength],['短所',x.weakness],['部活・特技・趣味',x.hobby],['不安・悩み',x.worry],['体調面の自己管理',x.health+(x.healthDetail?'：'+x.healthDetail:'')],['通院や持病',x.medical+(x.medicalDetail?'：'+x.medicalDetail:'')],['将来の夢',x.dream],['体験入店した店舗',x.tried],['体験予定の店舗',x.planned]];$('#detail').innerHTML=`<div class="toolbar"><button class="btn" onclick="closeDetail()">閉じる</button><input id="interviewer" value="${esc(x.interviewer)}" placeholder="面接担当者（管理者入力）"><select id="status">${['応募','面接','体験入店','入店','辞退','不採用'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select><button class="btn" onclick="adminSave('${x.id}')">保存</button></div><div class="detail">${fs.map(v=>D(v[0],v[1])).join('')}</div><div class="toolbar"><button class="btn primary" onclick="shareLine('${x.id}')">幹部LINEへ共有</button><button class="btn" onclick="copyLine('${x.id}')">内容をコピー</button><button class="btn danger" onclick="del('${x.id}')">削除</button></div>`;$('#detailModal').classList.remove('hidden')}
function closeDetail(){$('#detailModal').classList.add('hidden')}function adminSave(id){let x=data.find(v=>v.id===id);x.interviewer=$('#interviewer').value.trim();x.status=$('#status').value;save();render();alert('保存しました')}
function lineText(x){let L=(a,b)=>`${a}：${b||'—'}`;return['【SWAMP FOG 面接アンケート】',L('面接日',x.interviewDate),L('面接担当',x.interviewer),L('応募方法',x.method+(x.methodDetail?'（'+x.methodDetail+'）':'')),'',L('氏名',x.name),L('年齢',x.age?x.age+'歳':''),L('連絡先',x.phone),L('ホスト経験',x.exp),L('経験期間',x.expPeriod),L('過去最高月収',x.highIncome?x.highIncome+'万円':''),L('現在の在籍先',x.workplace),L('SNS',x.sns),L('当店を選んだ理由',[x.reason1,x.reason2,x.reason3].filter(Boolean).join(' / ')),L('仕事で大切なこと',[x.important1,x.important2,x.important3].filter(Boolean).join(' / ')),L('長所',x.strength),L('短所',x.weakness),L('不安・悩み',x.worry),L('将来の夢',x.dream),L('体験入店した店舗',x.tried),L('体験予定の店舗',x.planned),L('ステータス',x.status)].join('\n')}
async function cp(t){try{await navigator.clipboard.writeText(t);return true}catch(e){let a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();let ok=document.execCommand('copy');a.remove();return ok}}
async function copyLine(id){let x=data.find(v=>v.id===id);alert(await cp(lineText(x))?'コピーしました':'コピーできませんでした')}
async function shareLine(id){let x=data.find(v=>v.id===id),t=lineText(x);if(navigator.share){try{await navigator.share({title:'SWAMP FOG 面接アンケート',text:t});return}catch(e){if(e.name==='AbortError')return}}await cp(t);alert('共有できない環境のためコピーしました。LINEに貼り付けてください。')}
function del(id){if(confirm('削除しますか？')){data=data.filter(v=>v.id!==id);save();closeDetail();render()}}
</script></body></html>
