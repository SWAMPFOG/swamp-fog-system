<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>FOG RECRUIT SCOUT Ver.1</title>
<style>
:root{--bg:#090b10;--card:#121621;--card2:#181e2b;--line:#293247;--txt:#f5f7fb;--muted:#98a2b3;--accent:#4f8cff;--good:#31c48d;--warn:#f6b94b;--bad:#ef6672}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(9,11,16,.94);backdrop-filter:blur(12px);padding:14px 14px 10px;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0}.sub{font-size:11px;color:var(--muted);margin-top:3px}
main{padding:12px 12px 90px;max-width:760px;margin:auto}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:14px}.stat{padding:10px 6px;text-align:center}.stat b{font-size:20px;display:block}.stat span{font-size:10px;color:var(--muted)}
.card{padding:12px;margin-top:10px}.row{display:flex;gap:7px;align-items:center}.grow{flex:1}input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;background:#0d1119;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px}
textarea{min-height:60px;resize:vertical}.label{font-size:11px;color:var(--muted);margin:8px 0 4px}
button,.btn{border:0;border-radius:10px;padding:10px 12px;background:var(--accent);color:white;font-weight:700;text-decoration:none;text-align:center;cursor:pointer}
.secondary{background:var(--card2);border:1px solid var(--line)}.danger{background:#38191e;color:#ffabb2}.good{background:#12352b;color:#75e4bc}
.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.candidate{padding:11px 0;border-top:1px solid var(--line)}.candidate:first-child{border-top:0}
.name{font-weight:800}.handle{font-size:12px;color:#8eb3ff}.meta{font-size:11px;color:var(--muted);margin-top:4px}.badge{font-size:10px;border-radius:99px;padding:4px 7px;background:var(--card2);border:1px solid var(--line)}
.rankA{color:#ffd86b}.rankB{color:#9ac2ff}.rankC{color:#c7ccd6}.actions{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:6px;margin-top:8px}.actions button,.actions a{font-size:12px;padding:9px 5px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:7px}.empty{text-align:center;color:var(--muted);padding:24px 8px;font-size:13px}
.bottom{position:fixed;bottom:0;left:0;right:0;padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:rgba(9,11,16,.95);border-top:1px solid var(--line);display:flex;gap:8px;z-index:6}.bottom button{flex:1}
dialog{width:min(94vw,620px);border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--txt);padding:14px}dialog::backdrop{background:#000b}
.small{font-size:11px;color:var(--muted)}.hidden{display:none}
</style></head>
<body>
<header><h1>FOG RECRUIT SCOUT <span class="badge">Ver.1</span></h1><div class="sub">Instagram求人候補 発掘・選別・進捗管理</div></header>
<main>
<div class="grid">
 <div class="stat"><b id="sTotal">0</b><span>候補</span></div>
 <div class="stat"><b id="sFollow">0</b><span>フォロー済</span></div>
 <div class="stat"><b id="sDm">0</b><span>DM済</span></div>
 <div class="stat"><b id="sReply">0</b><span>返信あり</span></div>
</div>

<div class="card">
 <div class="filters">
  <input id="q" placeholder="名前・ID・地域・メモ検索">
  <select id="statusFilter"><option value="">全ステータス</option><option>未確認</option><option>フォロー済</option><option>DM済</option><option>返信あり</option><option>面接候補</option><option>採用</option><option>除外</option></select>
  <select id="rankFilter"><option value="">全ランク</option><option>A</option><option>B</option><option>C</option></select>
  <select id="sort"><option value="new">新しい順</option><option value="score">高評価順</option><option value="followers">フォロワー順</option></select>
 </div>
</div>

<div class="card">
 <div class="row"><b class="grow">候補一覧</b><span id="count" class="small"></span></div>
 <div id="list"></div>
</div>

<div class="card">
 <b>データ管理</b>
 <div class="toolbar"><button class="secondary" onclick="exportData()">バックアップ</button><button class="secondary" onclick="document.getElementById('importFile').click()">復元</button></div>
 <input class="hidden" type="file" id="importFile" accept=".json">
 <div class="small" style="margin-top:8px">候補データはこの端末のブラウザ内に自動保存されます。</div>
</div>
</main>

<div class="bottom"><button onclick="openAdd()">＋ 候補者追加</button><button class="secondary" onclick="todayMode()">今日の候補</button></div>

<dialog id="dlg">
<form method="dialog" onsubmit="saveCandidate(event)">
 <div class="row"><b class="grow" id="dlgTitle">候補者追加</b><button type="button" class="secondary" onclick="dlg.close()">×</button></div>
 <input type="hidden" id="editId">
 <div class="label">Instagram ID</div><input id="handle" placeholder="@username" required>
 <div class="label">表示名</div><input id="displayName" placeholder="名前">
 <div class="filters">
  <div><div class="label">地域</div><input id="area" placeholder="大阪 / ミナミ"></div>
  <div><div class="label">フォロワー数</div><input id="followers" type="number" min="0" placeholder="800"></div>
  <div><div class="label">最終投稿</div><input id="lastPost" type="date"></div>
  <div><div class="label">ランク</div><select id="rank"><option>A</option><option selected>B</option><option>C</option></select></div>
 </div>
 <div class="label">プロフィールキーワード</div><input id="keywords" placeholder="大阪, 美容師, 大学生">
 <div class="label">ステータス</div><select id="status"><option>未確認</option><option>フォロー済</option><option>DM済</option><option>返信あり</option><option>面接候補</option><option>採用</option><option>除外</option></select>
 <div class="label">メモ</div><textarea id="memo" placeholder="雰囲気・連絡内容など"></textarea>
 <div class="toolbar"><button type="button" class="danger" id="deleteBtn" onclick="deleteCandidate()">削除</button><button type="submit">保存</button></div>
</form>
</dialog>

<script>
const KEY='fogRecruitScoutV1';
let data=JSON.parse(localStorage.getItem(KEY)||'[]');
const $=id=>document.getElementById(id);
function persist(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function cleanHandle(v){return v.trim().replace(/^@/,'').replace(/^https?:\/\/(www\.)?instagram\.com\//,'').split(/[/?#]/)[0]}
function score(c){let s=c.rank==='A'?30:c.rank==='B'?20:10;if(c.area)s+=10;if(c.keywords)s+=10;if(c.followers>=100&&c.followers<=5000)s+=10;if(c.lastPost){let d=(Date.now()-new Date(c.lastPost))/(864e5);if(d<=30)s+=15}return s}
function render(){
 let arr=[...data],q=$('q').value.toLowerCase(),sf=$('statusFilter').value,rf=$('rankFilter').value;
 arr=arr.filter(c=>(!q||[c.handle,c.displayName,c.area,c.keywords,c.memo].join(' ').toLowerCase().includes(q))&&(!sf||c.status===sf)&&(!rf||c.rank===rf));
 if($('sort').value==='score')arr.sort((a,b)=>score(b)-score(a)); else if($('sort').value==='followers')arr.sort((a,b)=>(b.followers||0)-(a.followers||0)); else arr.sort((a,b)=>b.created-a.created);
 $('sTotal').textContent=data.filter(x=>x.status!=='除外').length;$('sFollow').textContent=data.filter(x=>['フォロー済','DM済','返信あり','面接候補','採用'].includes(x.status)).length;
 $('sDm').textContent=data.filter(x=>['DM済','返信あり','面接候補','採用'].includes(x.status)).length;$('sReply').textContent=data.filter(x=>['返信あり','面接候補','採用'].includes(x.status)).length;$('count').textContent=arr.length+'件';
 $('list').innerHTML=arr.length?arr.map(c=>`<div class="candidate">
 <div class="row"><div class="grow"><span class="name">${esc(c.displayName||c.handle)}</span> <span class="handle">@${esc(c.handle)}</span></div><span class="badge rank${c.rank}">${c.rank}</span><span class="badge">${score(c)}pt</span></div>
 <div class="meta">${esc(c.area||'地域未設定')} ・ ${(c.followers||0).toLocaleString()} followers ・ ${esc(c.status)}${c.keywords?' ・ '+esc(c.keywords):''}</div>
 <div class="actions"><a class="btn" target="_blank" href="https://www.instagram.com/${encodeURIComponent(c.handle)}/">Instagram</a><button class="good" onclick="advance('${c.id}')">次の進捗</button><button class="secondary" onclick="editCandidate('${c.id}')">編集</button></div>
 </div>`).join(''):`<div class="empty">候補者がまだ登録されていません。<br>「＋ 候補者追加」から始められます。</div>`;
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function openAdd(){['editId','handle','displayName','area','followers','lastPost','keywords','memo'].forEach(x=>$(x).value='');$('rank').value='B';$('status').value='未確認';$('deleteBtn').style.visibility='hidden';$('dlgTitle').textContent='候補者追加';dlg.showModal()}
function saveCandidate(e){e.preventDefault();let h=cleanHandle($('handle').value);if(!h)return;let id=$('editId').value;if(data.some(c=>c.handle.toLowerCase()===h.toLowerCase()&&c.id!==id)){alert('このInstagram IDは登録済みです');return}
 let obj={id:id||crypto.randomUUID(),handle:h,displayName:$('displayName').value.trim(),area:$('area').value.trim(),followers:+$('followers').value||0,lastPost:$('lastPost').value,rank:$('rank').value,keywords:$('keywords').value.trim(),status:$('status').value,memo:$('memo').value.trim(),created:id?(data.find(x=>x.id===id)?.created||Date.now()):Date.now()};
 if(id)data=data.map(x=>x.id===id?obj:x);else data.push(obj);dlg.close();persist()}
function editCandidate(id){let c=data.find(x=>x.id===id);if(!c)return;Object.keys(c).forEach(k=>{if($(k))$(k).value=c[k]??''});$('editId').value=id;$('deleteBtn').style.visibility='visible';$('dlgTitle').textContent='候補者編集';dlg.showModal()}
function deleteCandidate(){let id=$('editId').value;if(id&&confirm('この候補者を削除しますか？')){data=data.filter(x=>x.id!==id);dlg.close();persist()}}
function advance(id){let steps=['未確認','フォロー済','DM済','返信あり','面接候補','採用'];let c=data.find(x=>x.id===id);let i=steps.indexOf(c.status);c.status=steps[Math.min(i+1,steps.length-1)];persist()}
function todayMode(){$('statusFilter').value='未確認';$('rankFilter').value='';$('sort').value='score';render();window.scrollTo({top:120,behavior:'smooth'})}
function exportData(){let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='FOG_RECRUIT_SCOUT_backup.json';a.click();URL.revokeObjectURL(a.href)}
$('importFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x))throw 0;if(confirm('現在のデータをバックアップデータで置き換えますか？')){data=x;persist()}}catch{alert('バックアップファイルを読み込めませんでした')}};r.readAsText(f)}
['q','statusFilter','rankFilter','sort'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',render));render();
</script></body></html>
