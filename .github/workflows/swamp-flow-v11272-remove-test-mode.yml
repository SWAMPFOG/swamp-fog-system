name: SWAMP-FLOW Ver.11.2.72 remove test mode
on:
  push:
    paths:
      - '.github/workflows/swamp-flow-v11272-remove-test-mode.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove test mode safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          old=s
          assert '<title>SWAMP-FLOW Ver.11.2.71 Stable</title>' in s
          # UI only: exact style, banner, menu button
          s,n=re.subn(r'\n?<style id="v11256-test-mode-style">.*?</style>','',s,count=1,flags=re.S); assert n==1,n
          s,n=re.subn(r'\n?<div id="testModeBanner" class="test-mode-banner hidden">.*?</div>','',s,count=1,flags=re.S); assert n==1,n
          s,n=re.subn(r'\n?<button id="testModeMenu" class="full">.*?</button>','',s,count=1,flags=re.S); assert n==1,n
          # Storage routing: production only. Keep scopedStorageKey API for recovery/archive callers.
          exact="const TEST_MODE_FLAG_KEY='swamp-flow-v11-test-mode-active';\nlet TEST_MODE=localStorage.getItem(TEST_MODE_FLAG_KEY)==='1';\nfunction scopedStorageKey(key){return TEST_MODE?key+'-test':key}"
          assert exact in s
          s=s.replace(exact,"function scopedStorageKey(key){return key}",1)
          # Legacy migration no longer needs test guard.
          s=s.replace("    if(!TEST_MODE){\n      for(const key of LEGACY_KEYS){\n        const raw=localStorage.getItem(key);\n        if(raw){const migrated=normalize(JSON.parse(raw));persistSplit(migrated,'legacy-migration');return migrated}\n      }\n    }","    for(const key of LEGACY_KEYS){\n      const raw=localStorage.getItem(key);\n      if(raw){const migrated=normalize(JSON.parse(raw));persistSplit(migrated,'legacy-migration');return migrated}\n    }",1)
          # Remove only the dedicated test-state/UI/toggle functions.
          start=s.index('function makeFreshTestState(')
          end=s.index('function now()',start)
          chunk=s[start:end]
          assert 'function updateTestModeUI()' in chunk and 'function toggleTestMode()' in chunk
          s=s[:start]+s[end:]
          # Remove exact event binding/init only.
          exact_bind="document.querySelector('#testModeMenu').onclick=toggleTestMode;updateTestModeUI();"
          assert exact_bind in s
          s=s.replace(exact_bind,'',1)
          # Version bump only exact visible version strings.
          s=s.replace('<title>SWAMP-FLOW Ver.11.2.71 Stable</title>','<title>SWAMP-FLOW Ver.11.2.72 Stable</title>',1)
          s=s.replace('SWAMP-FLOW Ver.11.2.71 Stable <span','SWAMP-FLOW Ver.11.2.72 Stable <span',1)
          # Safety: no test runtime remains; core features remain.
          for gone in ['TEST_MODE','testModeMenu','testModeBanner','toggleTestMode','makeFreshTestState','v11256-test-mode-style']:
            assert gone not in s,gone
          for keep in ['id="v11265-table-restore"','id="v11268-today-seat-history"','id="v11269-visible-page-render"','id="v11271-live-tick"','function save(){persistSplit(state)}','function scopedStorageKey(key){return key}','id="historyMenu"','id="undoLastTableEndBtn"']:
            assert keep in s,keep
          delta=s.count('\n')-old.count('\n')
          assert -100 <= delta <= -20,delta
          p.write_text(s)
          print('old bytes',len(old),'new bytes',len(s),'line delta',delta)
          PY
          git diff --check
          git diff --stat
          git config user.name "SWAMPFOG"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "SWAMP-FLOW Ver.11.2.72: remove test mode"
          git push
