name: SWAMP-FLOW Ver.11.2.69 render performance
on:
  push:
    paths:
      - '.github/workflows/swamp-flow-v11269-performance.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reduce hidden page renders
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          original=s
          assert '<title>SWAMP-FLOW Ver.11.2.68 Stable</title>' in s
          old="function render(){document.querySelector('#clock').textContent=new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});let active=state.tables.filter(t=>t.active);document.querySelector('#mTables').textContent=active.length;document.querySelector('#mSeated').textContent=state.casts.filter(c=>c.currentTable).length;document.querySelector('#mAlerts').textContent=active.filter(t=>['find','prepare','urgent','over'].includes(tablePhase(t).stage)).length;renderDirectBoard();renderTables();renderStatus();if(!document.querySelector('#sheet').classList.contains('hidden')){if(selectedTable&&!selectedCast)renderTableCandidates();else if(selectedCast)renderCandidates()}}"
          new="function render(){document.querySelector('#clock').textContent=new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});let active=state.tables.filter(t=>t.active);document.querySelector('#mTables').textContent=active.length;document.querySelector('#mSeated').textContent=state.casts.filter(c=>c.currentTable).length;document.querySelector('#mAlerts').textContent=active.filter(t=>['find','prepare','urgent','over'].includes(tablePhase(t).stage)).length;const home=document.querySelector('#homePage'),tables=document.querySelector('#tablesPage'),status=document.querySelector('#statusPage');if(home&&!home.classList.contains('hidden'))renderDirectBoard();if(tables&&!tables.classList.contains('hidden'))renderTables();if(status&&!status.classList.contains('hidden'))renderStatus();if(!document.querySelector('#sheet').classList.contains('hidden')){if(selectedTable&&!selectedCast)renderTableCandidates();else if(selectedCast)renderCandidates()}}"
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          marker="<!-- SWAMP-FLOW Ver.11.2.69 / visible-page render only -->"
          assert marker not in s
          nav_script='''\n<!-- SWAMP-FLOW Ver.11.2.69 / visible-page render only -->\n<script id="v11269-visible-page-render">\n(function(){\n  document.querySelectorAll('nav button[data-page]').forEach(btn=>{\n    btn.addEventListener('click',()=>{\n      const p=btn.dataset.page;\n      if(p==='home')renderDirectBoard();\n      else if(p==='tables')renderTables();\n      else if(p==='status')renderStatus();\n    });\n  });\n})();\n</script>\n'''
          s=s.replace('</body>',nav_script+'\n</body>',1)
          s=s.replace('Ver.11.2.68 Stable','Ver.11.2.69 Stable')
          required=['function saveTable()','function endBusiness()',"document.querySelector('#addTable').onclick",'id="v11265-table-restore"','id="v11268-today-seat-history"','id="v11269-visible-page-render"']
          for x in required: assert x in s, x
          assert s.count('function render(){')>=1
          delta=original.count('\n')-s.count('\n')
          assert -30 <= delta <= 5, delta
          p.write_text(s)
          print('old bytes',len(original),'new bytes',len(s),'line delta',delta)
          PY
          git diff --stat
          git diff --check
          git config user.name "SWAMPFOG"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "SWAMP-FLOW Ver.11.2.69: reduce hidden page rendering"
          git push
