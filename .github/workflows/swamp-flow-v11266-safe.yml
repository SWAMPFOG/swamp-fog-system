name: SWAMP-FLOW Ver.11.2.66 safe cleanup
on:
  push:
    paths:
      - '.github/workflows/swamp-flow-v11266-safe.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove only FOG-GOALS integration block
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start='<!-- SWAMP-FLOW Ver.11.2.65 Stable / FOG-GOALS自動連動 -->\n<script id="v11251-fog-goals-sync">'
          next_marker='<!-- SWAMP-FLOW Ver.11.2.63 / 延長ランキング自動化 -->'
          i=s.find(start)
          if i<0: raise SystemExit('FOG-GOALS start marker not found')
          j=s.find(next_marker,i)
          if j<0: raise SystemExit('Next block marker not found')
          removed=s[i:j]
          if removed.count('<script')!=1 or 'v11251-fog-goals-sync' not in removed:
              raise SystemExit('Unexpected removal scope')
          s=s[:i]+'<!-- Ver.11.2.66 / FOG-GOALS連携は保留のため未実装 -->\n\n'+s[j:]
          s=s.replace('Ver.11.2.65 Stable','Ver.11.2.66 Stable')
          if 'v11265-table-restore' not in s: raise SystemExit('Table restore missing')
          if 'v11251-fog-goals-sync' in s: raise SystemExit('FOG-GOALS block still present')
          if 'v11253-extension-ranking' not in s: raise SystemExit('Ranking block missing')
          p.write_text(s,encoding='utf-8')
          print('removed_chars=',len(removed))
          PY
          git config user.name "SWAMPFOG"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "SWAMP-FLOW Ver.11.2.66: remove deferred FOG-GOALS integration safely"
          git push
