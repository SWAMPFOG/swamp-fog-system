name: SWAMP-FLOW Ver.11.2.66 lightweight cleanup
on:
  push:
    paths:
      - '.github/workflows/swamp-flow-v11266-light.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove deferred FOG-GOALS integration and obsolete undo layer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          before=len(s)
          s=s.replace('Ver.11.2.65','Ver.11.2.66')

          # FOG-GOALS連携は現時点では保留。関連scriptのみ除去する。
          script_re=re.compile(r'<script\b[^>]*>.*?</script>',re.S|re.I)
          removed_fog=0
          def drop_fog(m):
              global removed_fog
              block=m.group(0)
              if 'fogGoals' in block or 'FOG-GOALS' in block:
                  removed_fog+=1
                  return ''
              return block
          s=script_re.sub(drop_fog,s)

          # Ver.11.2.65の選択式復元に置き換わった旧「直前1卓だけ復元」層を削除。
          s,n1=re.subn(r'\s*<style id="v11262-undo-table-end-style">.*?</style>','',s,flags=re.S|re.I)
          s,n2=re.subn(r'\s*<!-- SWAMP-FLOW Ver\.11\.2\.6[0-9] / 卓終了取消ボタンをメニューへ正式配置 -->\s*<script id="v11262-undo-table-end">.*?</script>','',s,flags=re.S|re.I)

          # 空行の過剰増加だけ整理（表示・ロジックには影響なし）
          s=re.sub(r'\n{4,}','\n\n\n',s)
          p.write_text(s,encoding='utf-8')
          print('removed_fog_scripts=',removed_fog,'removed_old_undo_style=',n1,'removed_old_undo_script=',n2,'bytes_saved=',before-len(s))
          if removed_fog < 1:
              raise SystemExit('FOG-GOALS integration block was not found; aborting')
          if n1 != 1 or n2 != 1:
              raise SystemExit('Old undo layer markers did not match exactly; aborting')
          if 'SWAMP-FLOW Ver.11.2.66 Stable' not in s:
              raise SystemExit('Version bump verification failed')
          if 'v11265-table-restore' not in s:
              raise SystemExit('New table restore implementation missing')
          PY
          git config user.name "SWAMPFOG"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "SWAMP-FLOW Ver.11.2.66 lightweight cleanup"
          git push
