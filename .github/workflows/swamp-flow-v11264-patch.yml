name: SWAMP-FLOW Ver.11.2.64 patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/swamp-flow-v11264-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Ver.11.2.63 Stable', 'Ver.11.2.64 Stable')
          old = '<button id="historyMenu"><span>着席履歴</span></button><button id="endBusinessMenu" class="danger-menu"><span>営業終了</span></button>'
          new = '<button id="historyMenu"><span>着席履歴</span></button><button id="undoLastTableEndBtn" class="danger-menu"><span>直前の卓終了取消</span><small>最後に終了した卓を復元</small></button><button id="endBusinessMenu" class="danger-menu"><span>営業終了</span></button>'
          if old not in s:
              raise SystemExit('menu insertion target not found')
          s = s.replace(old, new, 1)
          s = s.replace('<button type="button" id="undoLastTableEndBtn">直前の卓終了を取消</button>\n', '', 1)
          s = s.replace('<!-- SWAMP-FLOW Ver.11.2.63 / 直前卓終了取消をメニュー内へ移動 -->', '<!-- SWAMP-FLOW Ver.11.2.64 / 卓終了取消ボタンをメニューへ正式配置 -->', 1)
          p.write_text(s, encoding='utf-8')
      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/swamp-flow-v11264-patch.yml
          git config user.name "SWAMPFOG"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/swamp-flow-v11264-patch.yml
          git commit -m "Ver.11.2.64: 卓終了取り消しボタンをメニューに追加"
          git push origin main
