name: SWAMP-FLOW Ver.11.2.65 patch
on:
  push:
    paths:
      - '.github/workflows/swamp-flow-v11265-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Ver.11.2.64','Ver.11.2.65')
          marker='<!-- SWAMP-FLOW Ver.11.2.65 / 卓終了取消・完全終了卓復元 -->'
          if marker not in s:
              payload=Path('.patches/v11265.html').read_text(encoding='utf-8')
              s=s.replace('</body>',payload+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "SWAMPFOG"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "SWAMP-FLOW Ver.11.2.65 table restore workflows"
          git push
