name: SWAMP-FLOW Ver.11.2.71 live tick optimization
on:
  push:
    paths:
      - '.github/workflows/swamp-flow-v11271-live-tick.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consolidate live timer updates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p=Path('index.html')
          s=p.read_text()
          original=s
          assert '<title>SWAMP-FLOW Ver.11.2.70 Stable</title>' in s
          marker='<!-- SWAMP-FLOW Ver.11.2.71 / consolidated live tick -->'
          assert marker not in s
          b64=''
          block=base64.b64decode(b64).decode()
          s=s.replace('</body>',block+'\n</body>',1)
          s=s.replace('Ver.11.2.70 Stable','Ver.11.2.71 Stable')
          for x in ['id="v11271-live-tick"','function save(){persistSplit(state)}','id="v11265-table-restore"','id="v11268-today-seat-history"','id="v11269-visible-page-render"']:
            assert x in s, x
          assert 'Ver.11.2.70 Stable' not in s
          delta=s.count('\n')-original.count('\n')
          assert 40 <= delta <= 100, delta
          p.write_text(s)
          print('old bytes',len(original),'new bytes',len(s),'line delta',delta)
          PY
          git diff --check
          git diff --stat
          git config user.name "SWAMPFOG"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "SWAMP-FLOW Ver.11.2.71: consolidate live timer updates"
          git push
