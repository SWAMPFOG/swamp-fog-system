name: SWAMP-FLOW Ver.11.2.67 step2 cleanup
on:
  push:
    paths:
      - '.github/workflows/swamp-flow-v11267-step2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete undo CSS only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=s
          s,n=re.subn(r'\s*<style id="v11262-undo-table-end-style">.*?</style>', '', s, count=1, flags=re.S|re.I)
          if n!=1:
              raise SystemExit(f'obsolete undo CSS match count={n}; abort')
          s=s.replace('Ver.11.2.66','Ver.11.2.67')
          if 'v11265-table-restore-style' not in s or 'v11265-table-restore' not in s:
              raise SystemExit('current restore implementation missing; abort')
          if 'v11251-fog-goals-sync' not in s:
              raise SystemExit('FOG-GOALS block unexpectedly missing; abort')
          if 'v11262-undo-table-end-style' in s:
              raise SystemExit('obsolete undo CSS still present; abort')
          if 'SWAMP-FLOW Ver.11.2.67 Stable' not in s:
              raise SystemExit('version bump failed; abort')
          p.write_text(s,encoding='utf-8')
          print('removed_chars=',len(old)-len(s))
          PY
          git config user.name "SWAMPFOG"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "SWAMP-FLOW Ver.11.2.67 remove obsolete undo CSS"
          git push