<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#090a0c" />

<title>SWAMP-FLOW Ver.10.1</title>
<style>
:root{--bg:#090a0c;--panel:#14161a;--panel2:#1d2026;--line:#2b3038;--text:#f6f7f9;--muted:#9299a5;--green:#56e58e;--yellow:#ffd257;--orange:#ff9d45;--red:#ff5e68;--blue:#68b4ff;--nav:72px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}button,input,select{font:inherit;color:inherit}button{border:0}body{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom))}.hidden{display:none!important}
header{position:sticky;top:0;z-index:20;background:rgba(9,10,12,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 14px 10px}.brand{display:flex;align-items:center;justify-content:space-between}.brand h1{font-size:17px;margin:0;letter-spacing:.08em}.clock{font-size:12px;color:var(--muted)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}.metric{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:7px;text-align:center}.metric b{display:block;font-size:16px}.metric small{color:var(--muted);font-size:10px}
.alerts{padding:10px 12px 2px}.alert-title{font-size:12px;color:var(--muted);margin:0 2px 7px}.alert-strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}.alert-strip::-webkit-scrollbar{display:none}.alert-card{min-width:170px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left}.alert-card.prepare{border-color:#765f1a;background:#211d10}.alert-card.urgent{border-color:#8a4d18;background:#28170d}.alert-card.over{border-color:#7b2429;background:#291013;animation:pulse 1.2s infinite}.alert-top{display:flex;justify-content:space-between;align-items:center}.alert-table{font-weight:800;font-size:17px}.alert-plan{font-size:11px;padding:3px 6px;border-radius:999px;background:#ffffff16}.alert-time{font-size:25px;font-variant-numeric:tabular-nums;font-weight:900;margin:6px 0 2px}.alert-next{font-size:11px;color:#d4d7dc}@keyframes pulse{50%{box-shadow:0 0 0 3px #ff5e6830}}
main{padding:8px 12px 22px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:12px 2px 7px}.section-head h2{font-size:13px;margin:0;color:#dfe2e7}.section-head span{font-size:11px;color:var(--muted)}.rank{margin-bottom:12px}.cast-list{display:grid;gap:7px}.cast{width:100%;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 12px;text-align:left;position:relative;overflow:hidden}.cast::before{content:"";width:4px;align-self:stretch;border-radius:4px;background:var(--team,#666)}.cast-main{min-width:0;flex:1}.cast-name{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cast-sub{font-size:11px;color:var(--muted);margin-top:2px}.cast-state{font-size:12px;font-weight:800;padding:6px 8px;border-radius:999px;background:#ffffff10;white-space:nowrap}.cast.available .cast-state{color:var(--green);background:#56e58e15}.cast.seated .cast-state{color:var(--blue);background:#68b4ff15}.cast.preparing .cast-state{color:var(--yellow);background:#ffd25718}.cast.done,.cast.blocked{opacity:.42}.cast.done .cast-state{color:#d6d6d6}.cast.blocked .cast-state{color:var(--red)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:40;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(4,1fr);background:rgba(16,17,20,.97);border-top:1px solid var(--line);backdrop-filter:blur(16px)}nav button{background:transparent;color:var(--muted);font-size:11px;font-weight:700}nav button.active{color:#fff}nav b{display:block;font-size:20px;margin-bottom:2px}
.sheet{position:fixed;inset:0;z-index:60;background:#0008;display:flex;align-items:flex-end}.sheet-panel{width:100%;max-height:88vh;overflow:auto;background:#111318;border-radius:22px 22px 0 0;border-top:1px solid #343943;padding:10px 12px calc(18px + env(safe-area-inset-bottom))}.handle{width:44px;height:4px;background:#4a4f58;border-radius:4px;margin:0 auto 12px}.sheet-head{display:flex;justify-content:space-between;align-items:center}.sheet-head h3{margin:0;font-size:17px}.close{width:34px;height:34px;border-radius:50%;background:#ffffff10}.hint{font-size:11px;color:var(--muted);margin:6px 0 12px}.table-scroll{display:flex;gap:9px;overflow-x:auto;padding:2px 1px 10px;scroll-snap-type:x proximity}.table-card{position:relative;min-width:148px;scroll-snap-align:start;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:11px;text-align:left}.table-card.selected{border-color:var(--blue);background:#132339}.table-card.refused{border-color:#6d282e;background:#261114;opacity:.72}.table-line{display:flex;justify-content:space-between;align-items:center}.table-no{font-size:22px;font-weight:900}.plan{font-size:12px;font-weight:800;background:#ffffff12;padding:4px 7px;border-radius:8px}.entry{font-size:12px;color:#c7cbd2;margin-top:8px}.t-time{font-size:25px;font-weight:900;font-variant-numeric:tabular-nums;margin:7px 0 2px}.meta{font-size:11px;color:var(--muted);line-height:1.5}.reason{font-size:11px;color:#ffe39c;margin-top:7px;min-height:30px}.refuse{width:100%;margin-top:9px;padding:8px;border-radius:9px;background:#4b1b20;color:#ffabb0;font-size:11px;font-weight:800}.tap-note{position:absolute;inset:auto 8px 8px 8px;text-align:center;background:#68b4ff;color:#071523;border-radius:8px;padding:6px;font-size:11px;font-weight:900}.toast{position:fixed;z-index:100;left:50%;bottom:calc(var(--nav) + 18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#f6f7f9;color:#101216;border-radius:999px;padding:9px 14px;font-size:12px;font-weight:800;box-shadow:0 8px 30px #0008;max-width:88%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page{padding:10px 12px}.page h2{font-size:17px}.table-list{display:grid;gap:9px}.info-card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:12px}.info-top{display:flex;justify-content:space-between;align-items:center}.info-top strong{font-size:18px}.mini-actions{display:flex;gap:7px;margin-top:10px}.mini-actions button,.primary,.secondary,.danger{padding:10px 12px;border-radius:10px;font-weight:800}.primary{background:var(--blue);color:#08131d}.secondary{background:#ffffff12}.danger{background:#4b1b20;color:#ffabb0}.form{display:grid;gap:9px}.form label{font-size:11px;color:var(--muted)}.form input,.form select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fab{position:fixed;right:16px;bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;background:var(--blue);color:#07131e;font-size:28px;font-weight:500;box-shadow:0 8px 24px #0009}

.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.menu-grid button{min-height:52px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:800}.list-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.list-row:last-child{border-bottom:0}.list-main{flex:1;min-width:0}.list-main b{display:block}.list-main small{display:block;color:var(--muted);margin-top:3px}.tag{display:inline-block;font-size:10px;border-radius:999px;padding:3px 6px;background:#ffffff12;margin:2px 3px 0 0}.tag.red{color:#ffabb0;background:#4b1b20}.tag.blue{color:#a8d4ff;background:#18334d}.icon-btn{width:38px;height:38px;border-radius:10px;background:#ffffff10}.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.switch-row input{width:22px;height:22px}.sender-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:9px}.sender-btn{padding:10px;border-radius:10px;background:#ffffff10;border:1px solid var(--line);font-weight:800}.sender-btn.on{background:#1c3a2a;border-color:#3a8b5d;color:#8af0ad}.sender-btn.pending{background:#3b3218;border-color:#8c762e;color:#ffe18b}.full{grid-column:1/-1}.notice{border:1px solid #66531d;background:#211c0d;border-radius:12px;padding:10px;color:#ffe49b;font-size:12px;line-height:1.5}.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.modal-actions.three{grid-template-columns:1fr 1fr 1fr}.history-item{padding:10px 0;border-bottom:1px solid var(--line)}.history-item b{font-size:14px}.history-item small{display:block;color:var(--muted);margin-top:4px}.count-badge{min-width:26px;text-align:center;border-radius:999px;padding:4px 7px;background:#ffffff12;font-size:11px;font-weight:900}.blocked-reason{font-size:10px;color:#ffabb0;margin-top:3px}.form textarea{width:100%;min-height:110px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px;color:#fff}
</style>
</head>
<body>
<header><div class="brand"><h1>SWAMP-FLOW</h1><span class="clock" id="clock"></span></div><div class="summary"><div class="metric"><b id="mTables">0</b><small>稼働卓</small></div><div class="metric"><b id="mSeated">0</b><small>着席中</small></div><div class="metric"><b id="mAlerts">0</b><small>準備アラート</small></div></div></header>
<section id="homePage">
<div class="alerts"><p class="alert-title">次の着席準備</p><div class="alert-strip" id="alerts"></div></div>
<main id="casts"></main>
</section>
<section id="tablesPage" class="page hidden"><h2>卓設定・稼働状況</h2><div id="tableList" class="table-list"></div><button class="fab" id="addTable">＋</button></section>
<section id="statusPage" class="page hidden"><h2>営業状況</h2><div id="statusList" class="table-list"></div></section>
<section id="menuPage" class="page hidden"><h2>メニュー</h2><div class="menu-grid">
<button id="addCastMenu">＋ キャスト追加</button><button id="castManageMenu">人 キャスト管理</button>
<button id="restrictionMenu">制 制限設定</button><button id="sendingMenu">送 送り設定</button>
<button id="historyMenu">履 着席履歴</button><button id="backupMenu">保 バックアップ</button>
<button id="importMenu">復 データ復元</button><button id="endBusinessMenu">終 営業終了</button>
</div><div class="info-card" style="margin-top:10px"><b>操作</b><p class="hint">キャスト名 → 卓候補 → 卓を1回タップで準備、同じ卓を2回目で着席確定。着席・準備・拒否は長押しで取り消せます。</p></div><div class="mini-actions" style="margin-top:10px"><button class="secondary" id="seed">サンプル復元</button><button class="danger" id="reset">卓データのみリセット</button></div></section>
<nav><button data-page="home" class="active"><b>人</b>キャスト</button><button data-page="tables"><b>卓</b>卓設定</button><button data-page="status"><b>状</b>状況</button><button data-page="menu"><b>≡</b>メニュー</button></nav>
<div id="sheet" class="sheet hidden"><div class="sheet-panel"><div class="handle"></div><div class="sheet-head"><h3 id="sheetTitle"></h3><button class="close" id="closeSheet">×</button></div><p class="hint">卓カードを1回タップで選択、同じ卓をもう1回タップで着席確定。長押しで取消。</p><div class="table-scroll" id="candidates"></div></div></div>
<div id="tableModal" class="sheet hidden"><div class="sheet-panel"><div class="handle"></div><div class="sheet-head"><h3 id="modalTitle">卓を追加</h3><button class="close" id="closeModal">×</button></div><div class="form"><div class="row"><label>卓番<input id="fNo" placeholder="S1"></label><label>プラン<select id="fPlan"><option>A</option><option selected>B</option><option>VIP</option><option>お連れ様</option></select></label></div><div class="row"><label>入店時間<input id="fEntry" type="time"></label><label>お客様人数<input id="fGuests" type="number" min="1" value="2"></label></div><div id="companionOwnerWrap" class="hidden"><label>お連れ様担当キャスト<select id="fOwner"></select></label></div><div class="row"><label>回し時間（分）<input id="fCycle" type="number" min="2" value="5"></label><label>準備アラート（秒前）<input id="fLead" type="number" min="10" value="90"></label></div><button class="primary" id="saveTable">保存</button></div></div></div>
<div id="utilityModal" class="sheet hidden"><div class="sheet-panel"><div class="handle"></div><div class="sheet-head"><h3 id="utilityTitle"></h3><button class="close" id="closeUtility">×</button></div><div id="utilityBody"></div></div></div><input id="importInput" type="file" accept="application/json" class="hidden"><div id="toast" class="toast hidden"></div>
<script>
const KEY='swamp-flow-v10.1',OLD_KEY='swamp-flow-v10';
const sample={casts:[
{id:'c1',name:'れい',rank:'S',team:'#9b6cff'},{id:'c2',name:'ゆうせい',rank:'S',team:'#4fc3f7'},{id:'c3',name:'のあ',rank:'S',team:'#ff7da8'},{id:'c4',name:'たいが',rank:'A',team:'#65d58a'},{id:'c5',name:'かぐや',rank:'A',team:'#ffd15c'},{id:'c6',name:'りょうすけ',rank:'B',team:'#ff9966'},{id:'c7',name:'なつき',rank:'C',team:'#7da1ff'}],tables:[],refusals:{},history:[],settings:{sendLimit:2}};
let state=load(),selectedCast=null,selectedTable=null,editTableId=null,longTimer=null;
function clone(x){return JSON.parse(JSON.stringify(x))}
function normalize(s){s=s&&typeof s==='object'?s:clone(sample);s.casts=Array.isArray(s.casts)?s.casts:[];s.tables=Array.isArray(s.tables)?s.tables:[];s.refusals=s.refusals||{};s.history=Array.isArray(s.history)?s.history:[];s.settings={sendLimit:2,...(s.settings||{})};s.casts.forEach((c,i)=>Object.assign(c,{id:c.id||'c'+Date.now()+i,rank:c.rank||'C',team:c.team||'#777777',working:c.working!==false,sends:Number(c.sends)||0,penalty:!!c.penalty,inHouse:!!c.inHouse,late:!!c.late,ngTables:Array.isArray(c.ngTables)?c.ngTables:[],currentTable:c.currentTable||null,preparingFor:c.preparingFor||null}));s.tables.forEach(t=>Object.assign(t,{active:t.active!==false,seated:Array.isArray(t.seated)?t.seated:[],senders:Array.isArray(t.senders)?t.senders:[],senderPending:Array.isArray(t.senderPending)?t.senderPending:[],lastSeatAt:t.lastSeatAt||null,ownerId:t.ownerId||''}));return s}
function load(){try{let raw=localStorage.getItem(KEY)||localStorage.getItem(OLD_KEY);return normalize(raw?JSON.parse(raw):clone(sample))}catch{return normalize(clone(sample))}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function now(){return Date.now()} function pad(n){return String(n).padStart(2,'0')} function hm(t){let d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())}
function fmt(sec){let neg=sec<0;sec=Math.abs(Math.floor(sec));return(neg?'+':'')+Math.floor(sec/60)+':'+pad(sec%60)}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(s){let e=document.querySelector('#toast');e.textContent=s;e.classList.remove('hidden');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.add('hidden'),1900)}
function tablePhase(t){if(!t.active)return null;if(!t.lastSeatAt)return{sec:0,stage:'idle'};let elapsed=(now()-t.lastSeatAt)/1000,remaining=t.cycle*60-elapsed;if(remaining<=0)return{sec:remaining,stage:'over'};if(remaining<=30)return{sec:remaining,stage:'urgent'};if(remaining<=t.lead)return{sec:remaining,stage:'prepare'};return{sec:remaining,stage:'normal'}}
function isCompanion(t){return t.plan==='お連れ様'}
function blockReason(c,t){if(!c.working)return'本日休み';if(c.currentTable)return'着席中';if((t.seated||[]).includes(c.id))return'着席済み';if(state.refusals[c.id+'|'+t.id])return'着席拒否';if(c.ngTables.includes(t.id))return'卓別NG';if(isCompanion(t)&&t.ownerId===c.id)return'お連れ様担当本人';if(t.plan==='VIP'&&!['S','A'].includes(c.rank))return'VIP対象外';if(c.penalty&&!isCompanion(t)&&t.plan!=='VIP')return'勤怠ペナルティ';if(c.inHouse&&!isCompanion(t)&&t.plan!=='VIP')return'場内中';if(c.sends>=state.settings.sendLimit&&!isCompanion(t)&&t.plan!=='VIP')return'送り上限';return''}
function eligible(c,t){return !!t.active&&!blockReason(c,t)}
function candidatesFor(c){return state.tables.filter(t=>eligible(c,t)).sort((a,b)=>a.entryAt-b.entryAt)}
function castState(c){if(!c.working)return['blocked','休み'];if(c.preparingFor)return['preparing','準備中 '+tableNo(c.preparingFor)];if(c.currentTable)return['seated','着席 '+tableNo(c.currentTable)];let n=candidatesFor(c).length;if(!state.tables.some(t=>t.active))return['blocked','対象なし'];if(n===0)return['done','完走'];return['available','残'+n+'卓']}
function tableNo(id){return state.tables.find(t=>t.id===id)?.no||''}
function render(){document.querySelector('#clock').textContent=new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});let active=state.tables.filter(t=>t.active);document.querySelector('#mTables').textContent=active.length;document.querySelector('#mSeated').textContent=state.casts.filter(c=>c.currentTable).length;let alertTables=active.filter(t=>['prepare','urgent','over'].includes(tablePhase(t).stage));document.querySelector('#mAlerts').textContent=alertTables.length;renderAlerts(alertTables);renderCasts();renderTables();renderStatus();if(selectedCast&&!document.querySelector('#sheet').classList.contains('hidden'))renderCandidates()}
function renderAlerts(arr){let box=document.querySelector('#alerts');if(!arr.length){box.innerHTML='<div class="alert-card"><div class="alert-next">現在、準備が必要な卓はありません</div></div>';return}arr.sort((a,b)=>tablePhase(a).sec-tablePhase(b).sec);box.innerHTML=arr.map(t=>{let p=tablePhase(t),next=state.casts.filter(c=>eligible(c,t)).slice(0,3).map(c=>c.name).join('・')||'候補なし';return`<button class="alert-card ${p.stage}" data-alert="${t.id}"><div class="alert-top"><span class="alert-table">${esc(t.no)}</span><span class="alert-plan">${esc(t.plan)}</span></div><div class="alert-time">${p.stage==='over'?'超過 '+fmt(p.sec):'あと '+fmt(p.sec)}</div><div class="alert-next">次候補：${esc(next)}</div></button>`}).join('');box.querySelectorAll('[data-alert]').forEach(b=>b.onclick=()=>{let t=state.tables.find(x=>x.id===b.dataset.alert),c=state.casts.find(x=>eligible(x,t));if(c)openCandidates(c.id,t.id);else toast('着席可能なキャストがいません')})}
function restrictionsText(c){let a=[];if(!c.working)a.push('休み');if(c.penalty)a.push('勤怠');if(c.inHouse)a.push('場内');if(c.sends>=state.settings.sendLimit)a.push('送り停止');if(c.ngTables.length)a.push('NG'+c.ngTables.length);return a.join('・')}
function renderCasts(){let root=document.querySelector('#casts');root.innerHTML='';for(let rank of ['S','A','B','C']){let list=state.casts.filter(c=>c.rank===rank);if(!list.length)continue;let sec=document.createElement('section');sec.className='rank';sec.innerHTML=`<div class="section-head"><h2>${rank}ランク</h2><span>${list.length}名</span></div><div class="cast-list"></div>`;let wrap=sec.querySelector('.cast-list');list.forEach(c=>{let [cls,label]=castState(c),b=document.createElement('button'),r=restrictionsText(c);b.className='cast '+cls;b.style.setProperty('--team',c.team);b.innerHTML=`<span class="cast-main"><div class="cast-name">${esc(c.name)}</div><div class="cast-sub">${c.preparingFor?'声掛け済み・卓前待機':c.currentTable?'長押しで着席取消':r||'タップして着席可能卓を表示'}</div></span><span class="cast-state">${label}</span>`;if(cls==='available')b.onclick=()=>openCandidates(c.id);if(cls==='preparing')b.onclick=()=>openCandidates(c.id,c.preparingFor);bindLong(b,()=>undoCast(c));wrap.appendChild(b)});root.appendChild(sec)}}
function openCandidates(cid,preferred){selectedCast=cid;selectedTable=preferred||null;document.querySelector('#sheet').classList.remove('hidden');renderCandidates()}
function renderCandidates(){let c=state.casts.find(x=>x.id===selectedCast);if(!c)return;document.querySelector('#sheetTitle').textContent=c.name+' の着席可能卓';let tables=state.tables.filter(t=>t.active&&!(t.seated||[]).includes(c.id)).sort((a,b)=>a.entryAt-b.entryAt),box=document.querySelector('#candidates');box.innerHTML=tables.map(t=>{let refused=!!state.refusals[c.id+'|'+t.id],reasonBlocked=blockReason(c,t),ok=!reasonBlocked,p=tablePhase(t),sel=selectedTable===t.id,reason=reasonBlocked|| (p?.stage==='over'?'タイマー超過':p?.stage==='urgent'?'交代まで30秒以内':p?.stage==='prepare'?'次キャスト準備時間':'入店順');return`<div class="table-card ${sel?'selected':''} ${refused?'refused':''}" data-tid="${t.id}"><div class="table-line"><span class="table-no">${esc(t.no)}</span><span class="plan">${esc(t.plan)}</span></div><div class="entry">入店 ${hm(t.entryAt)}　${t.guests}名</div><div class="t-time">${!t.lastSeatAt?'未開始':p.stage==='over'?'超過 '+fmt(p.sec):fmt(p.sec)}</div><div class="meta">${t.cycle}分回し／準備${t.lead}秒前<br>着席済 ${(t.seated||[]).length}名</div><div class="reason">${esc(reason)}</div>${ok?`<button class="refuse" data-refuse="${t.id}">着席拒否</button>`:''}${sel&&!reasonBlocked?'<div class="tap-note">もう一度タップで確定</div>':''}</div>`}).join('')||'<div class="hint">対象卓がありません</div>';box.querySelectorAll('.table-card').forEach(card=>{let tid=card.dataset.tid;card.onclick=e=>{if(e.target.dataset.refuse)return;let t=state.tables.find(x=>x.id===tid);if(blockReason(c,t)){toast(blockReason(c,t));return}if(selectedTable===tid)seat(c,t);else{selectedTable=tid;c.preparingFor=tid;save();render();toast(c.name+'へ声掛け・'+t.no+'待機')}};bindLong(card,()=>undoPair(c,tid))});box.querySelectorAll('[data-refuse]').forEach(b=>b.onclick=e=>{e.stopPropagation();state.refusals[c.id+'|'+b.dataset.refuse]=true;selectedTable=null;save();render();toast(c.name+'の着席拒否を登録')})}
function seat(c,t){if(!eligible(c,t)){toast(blockReason(c,t)||'現在は着席できません');return}c.currentTable=t.id;c.preparingFor=null;t.seated=t.seated||[];t.seated.push(c.id);t.lastSeatAt=now();state.history.push({type:'seat',cast:c.id,table:t.id,castName:c.name,tableNo:t.no,at:now()});save();document.querySelector('#sheet').classList.add('hidden');selectedCast=selectedTable=null;if(navigator.vibrate)navigator.vibrate(80);toast(c.name+' → '+t.no+' 着席');render()}
function undoCast(c){if(c.currentTable){let tid=c.currentTable,t=state.tables.find(x=>x.id===tid);if(t)t.seated=(t.seated||[]).filter(id=>id!==c.id);let idx=state.history.map(h=>h.type==='seat'&&h.cast===c.id&&h.table===tid).lastIndexOf(true);if(idx>=0)state.history.splice(idx,1);c.currentTable=null;save();render();toast(c.name+'の着席を取り消しました')}else if(c.preparingFor){c.preparingFor=null;save();render();toast('準備中を解除しました')}}
function undoPair(c,tid){let k=c.id+'|'+tid;if(state.refusals[k]){delete state.refusals[k];save();render();toast('着席拒否を解除しました');return}if(selectedTable===tid){selectedTable=null;if(c.preparingFor===tid)c.preparingFor=null;save();render();toast('仮選択・準備中を解除しました')}}
function bindLong(el,fn){el.addEventListener('touchstart',()=>{longTimer=setTimeout(fn,650)},{passive:true});el.addEventListener('touchmove',()=>clearTimeout(longTimer),{passive:true});['touchend','touchcancel'].forEach(x=>el.addEventListener(x,()=>clearTimeout(longTimer)));el.addEventListener('contextmenu',e=>{e.preventDefault();fn()})}
function renderTables(){let box=document.querySelector('#tableList');box.innerHTML=state.tables.map(t=>{let p=tablePhase(t),send=(t.senders||[]).length;return`<div class="info-card"><div class="info-top"><strong>${esc(t.no)} <small>${esc(t.plan)}</small></strong><span>${t.active?'稼働中':'終了'}</span></div><div class="hint">入店 ${hm(t.entryAt)}／${t.guests}名／${t.cycle}分回し／準備${t.lead}秒前</div><div>${!t.lastSeatAt?'タイマー未開始':p.stage==='over'?'超過 '+fmt(p.sec):'次交代まで '+fmt(p.sec)}</div><div class="hint">送り ${send}/${t.guests}${isCompanion(t)&&t.ownerId?'／担当 '+esc(state.casts.find(c=>c.id===t.ownerId)?.name||''):''}</div><div class="mini-actions"><button class="secondary" data-edit="${t.id}">編集</button><button class="secondary" data-send="${t.id}">送り</button><button class="${t.active?'danger':'secondary'}" data-toggle="${t.id}">${t.active?'卓終了':'再開'}</button></div></div>`}).join('')||'<div class="info-card">卓設定から新しい卓を追加してください。</div>';box.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openTableModal(b.dataset.edit));box.querySelectorAll('[data-send]').forEach(b=>b.onclick=()=>openSenderForTable(b.dataset.send));box.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{let t=state.tables.find(x=>x.id===b.dataset.toggle);t.active=!t.active;save();render()})}
function renderStatus(){let box=document.querySelector('#statusList');box.innerHTML=state.tables.filter(t=>t.active).sort((a,b)=>a.entryAt-b.entryAt).map(t=>{let names=(t.seated||[]).map(id=>state.casts.find(c=>c.id===id)?.name).filter(Boolean),p=tablePhase(t),senders=(t.senders||[]).map(id=>state.casts.find(c=>c.id===id)?.name).filter(Boolean);return`<div class="info-card"><div class="info-top"><strong>${esc(t.no)} <small>${esc(t.plan)}</small></strong><span>${!t.lastSeatAt?'未開始':p.stage==='over'?'超過 '+fmt(p.sec):fmt(p.sec)}</span></div><div class="hint">入店 ${hm(t.entryAt)}／着席済 ${names.length}名／送り ${senders.length}/${t.guests}</div><div>${esc(names.join('・')||'着席履歴なし')}</div>${senders.length?`<div class="hint">送り：${esc(senders.join('・'))}</div>`:''}</div>`}).join('')||'<div class="info-card">稼働中の卓はありません。</div>'}
function fillOwners(selected=''){document.querySelector('#fOwner').innerHTML='<option value="">選択してください</option>'+state.casts.filter(c=>c.working).map(c=>`<option value="${c.id}" ${selected===c.id?'selected':''}>${esc(c.name)}（${c.rank}）</option>`).join('')}
function toggleOwner(){document.querySelector('#companionOwnerWrap').classList.toggle('hidden',document.querySelector('#fPlan').value!=='お連れ様')}
function openTableModal(id=null){editTableId=id;let t=id?state.tables.find(x=>x.id===id):null;document.querySelector('#modalTitle').textContent=t?'卓を編集':'卓を追加';document.querySelector('#fNo').value=t?.no||'';document.querySelector('#fPlan').value=t?.plan||'B';document.querySelector('#fEntry').value=t?hm(t.entryAt):new Date().toTimeString().slice(0,5);document.querySelector('#fGuests').value=t?.guests||2;document.querySelector('#fCycle').value=t?.cycle||(t?.plan==='お連れ様'?5:3);document.querySelector('#fLead').value=t?.lead||90;fillOwners(t?.ownerId||'');toggleOwner();document.querySelector('#tableModal').classList.remove('hidden')}
function saveTable(){let no=document.querySelector('#fNo').value.trim().toUpperCase();if(!no){toast('卓番を入力してください');return}let [h,m]=document.querySelector('#fEntry').value.split(':').map(Number),d=new Date();d.setHours(h,m,0,0);let plan=document.querySelector('#fPlan').value,ownerId=plan==='お連れ様'?document.querySelector('#fOwner').value:'';if(plan==='お連れ様'&&!ownerId){toast('担当キャストを選択してください');return}let data={no,plan,ownerId,entryAt:d.getTime(),guests:+document.querySelector('#fGuests').value||1,cycle:+document.querySelector('#fCycle').value||3,lead:+document.querySelector('#fLead').value||90};if(editTableId)Object.assign(state.tables.find(x=>x.id===editTableId),data);else state.tables.push({id:'t'+Date.now(),...data,active:true,seated:[],senders:[],senderPending:[],lastSeatAt:null});save();document.querySelector('#tableModal').classList.add('hidden');render();toast(no+'を保存しました')}
function openUtility(title,html){document.querySelector('#utilityTitle').textContent=title;document.querySelector('#utilityBody').innerHTML=html;document.querySelector('#utilityModal').classList.remove('hidden')}
function closeUtility(){document.querySelector('#utilityModal').classList.add('hidden')}
function castForm(c={}){openUtility(c.id?'キャスト編集':'キャスト追加',`<div class="form"><label>キャスト名<input id="uName" value="${esc(c.name||'')}"></label><div class="row"><label>ランク<select id="uRank">${['S','A','B','C'].map(r=>`<option ${c.rank===r?'selected':''}>${r}</option>`).join('')}</select></label><label>チーム色<input id="uTeam" type="color" value="${c.team||'#777777'}"></label></div><button class="primary" id="uSave">保存</button>${c.id?'<button class="danger" id="uDelete">削除</button>':''}</div>`);document.querySelector('#uSave').onclick=()=>{let name=document.querySelector('#uName').value.trim();if(!name){toast('名前を入力してください');return}if(c.id)Object.assign(c,{name,rank:document.querySelector('#uRank').value,team:document.querySelector('#uTeam').value});else state.casts.push(normalize({casts:[{id:'c'+Date.now(),name,rank:document.querySelector('#uRank').value,team:document.querySelector('#uTeam').value}],tables:[]}).casts[0]);save();closeUtility();render();toast(name+'を保存しました')};if(c.id)document.querySelector('#uDelete').onclick=()=>{if(!confirm(c.name+'を削除しますか？'))return;state.casts=state.casts.filter(x=>x.id!==c.id);state.tables.forEach(t=>{t.seated=t.seated.filter(id=>id!==c.id);t.senders=t.senders.filter(id=>id!==c.id)});save();closeUtility();render()}}
function openCastManage(){openUtility('キャスト管理',`<div class="info-card">${state.casts.map(c=>`<div class="list-row"><span style="width:5px;height:38px;border-radius:5px;background:${c.team}"></span><div class="list-main"><b>${esc(c.name)}　${c.rank}</b><small>${esc(restrictionsText(c)||'制限なし')}／送り${c.sends}</small></div><button class="icon-btn" data-castedit="${c.id}">編集</button></div>`).join('')||'登録なし'}</div>`);document.querySelectorAll('[data-castedit]').forEach(b=>b.onclick=()=>castForm(state.casts.find(c=>c.id===b.dataset.castedit)))}
function openRestrictions(){openUtility('制限設定',`<div class="notice">制限は着席候補へ即時反映されます。VIP・お連れ様は一部制限の例外です。</div><div class="info-card" style="margin-top:10px">${state.casts.map(c=>`<div class="list-row"><div class="list-main"><b>${esc(c.name)}　${c.rank}</b><small>${esc(restrictionsText(c)||'制限なし')}</small></div><button class="icon-btn" data-restrict="${c.id}">設定</button></div>`).join('')}</div>`);document.querySelectorAll('[data-restrict]').forEach(b=>b.onclick=()=>openRestrictionCast(b.dataset.restrict))}
function openRestrictionCast(cid){let c=state.casts.find(x=>x.id===cid);openUtility(c.name+'・制限',`<div class="form"><div class="switch-row"><span>本日出勤</span><input id="rWorking" type="checkbox" ${c.working?'checked':''}></div><div class="switch-row"><span>勤怠ペナルティ</span><input id="rPenalty" type="checkbox" ${c.penalty?'checked':''}></div><div class="switch-row"><span>場内中</span><input id="rInHouse" type="checkbox" ${c.inHouse?'checked':''}></div><div class="switch-row"><span>遅刻</span><input id="rLate" type="checkbox" ${c.late?'checked':''}></div><label>送り数<input id="rSends" type="number" min="0" value="${c.sends}"></label><div><b>卓別NG</b>${state.tables.filter(t=>t.active).map(t=>`<label class="switch-row"><span>${esc(t.no)} ${esc(t.plan)}</span><input class="rNg" type="checkbox" value="${t.id}" ${c.ngTables.includes(t.id)?'checked':''}></label>`).join('')||'<p class="hint">稼働卓なし</p>'}</div><button class="primary" id="rSave">保存</button></div>`);document.querySelector('#rSave').onclick=()=>{c.working=document.querySelector('#rWorking').checked;c.penalty=document.querySelector('#rPenalty').checked;c.inHouse=document.querySelector('#rInHouse').checked;c.late=document.querySelector('#rLate').checked;c.sends=+document.querySelector('#rSends').value||0;c.ngTables=[...document.querySelectorAll('.rNg:checked')].map(x=>x.value);if(!c.working){c.currentTable=null;c.preparingFor=null}save();closeUtility();render();toast('制限を保存しました')}}
function openSending(){openUtility('送り設定',`<div class="notice">送り指名が客数に達すると卓を自動終了し、選ばれたキャストの送り数を加算します。</div><div class="info-card" style="margin-top:10px">${state.tables.filter(t=>t.active).map(t=>`<div class="list-row"><div class="list-main"><b>${esc(t.no)}　${esc(t.plan)}</b><small>送り ${(t.senders||[]).length}/${t.guests}</small></div><button class="icon-btn" data-sending="${t.id}">設定</button></div>`).join('')||'稼働卓なし'}</div>`);document.querySelectorAll('[data-sending]').forEach(b=>b.onclick=()=>openSenderForTable(b.dataset.sending))}
function openSenderForTable(tid){let t=state.tables.find(x=>x.id===tid);openUtility(t.no+'・送り指名',`<div class="notice">1回タップで仮選択、同じキャストを2回目で送り確定。確定済みは長押しで取り消し。</div><div class="sender-grid">${state.casts.filter(c=>c.working).map(c=>{let on=t.senders.includes(c.id),pending=t.senderPending.includes(c.id);return`<button class="sender-btn ${on?'on':pending?'pending':''}" data-sender="${c.id}">${esc(c.name)}<br><small>${on?'送り確定':pending?'もう一度で確定':'送り'+c.sends}</small></button>`}).join('')}</div><p class="hint">確定 ${(t.senders||[]).length}/${t.guests}</p>`);document.querySelectorAll('[data-sender]').forEach(b=>{let cid=b.dataset.sender;bindLong(b,()=>removeSender(t,cid));b.onclick=()=>toggleSender(t,cid)})}
function toggleSender(t,cid){if(t.senders.includes(cid))return;if(t.senderPending.includes(cid)){t.senderPending=t.senderPending.filter(id=>id!==cid);t.senders.push(cid);let c=state.casts.find(x=>x.id===cid);if(c)c.sends++;state.history.push({type:'send',cast:cid,table:t.id,castName:c?.name||'',tableNo:t.no,at:now()});if(t.senders.length>=t.guests){t.active=false;t.lastSeatAt=null;state.casts.forEach(c=>{if(c.currentTable===t.id)c.currentTable=null;if(c.preparingFor===t.id)c.preparingFor=null});toast(t.no+' 送り完了・卓終了')}else toast((c?.name||'')+' 送り確定')}else t.senderPending.push(cid);save();openSenderForTable(t.id);render()}
function removeSender(t,cid){let c=state.casts.find(x=>x.id===cid);if(t.senders.includes(cid)){t.senders=t.senders.filter(id=>id!==cid);if(c)c.sends=Math.max(0,c.sends-1);t.active=true}else t.senderPending=t.senderPending.filter(id=>id!==cid);save();openSenderForTable(t.id);render();toast('送り設定を取り消しました')}
function showHistory(){openUtility('着席・送り履歴',`<div class="info-card">${[...state.history].reverse().map(h=>`<div class="history-item"><b>${esc(h.type==='send'?'送り':'着席')}　${esc(h.castName||state.casts.find(c=>c.id===h.cast)?.name||'')} → ${esc(h.tableNo||tableNo(h.table))}</b><small>${new Date(h.at).toLocaleString('ja-JP')}</small></div>`).join('')||'履歴なし'}</div><button class="danger" id="clearHistory" style="width:100%;margin-top:10px">履歴削除</button>`);document.querySelector('#clearHistory').onclick=()=>{if(confirm('履歴を削除しますか？')){state.history=[];save();showHistory()}}}
function backup(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='SWAMP-FLOW_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function endBusiness(){if(!confirm('営業を終了しますか？\n卓・着席・送り・一時制限をリセットします。'))return;state.tables=[];state.refusals={};state.history=[];state.casts.forEach(c=>Object.assign(c,{currentTable:null,preparingFor:null,sends:0,penalty:false,inHouse:false,late:false,ngTables:[]}));save();render();toast('営業終了処理が完了しました')}
document.querySelector('#closeSheet').onclick=()=>document.querySelector('#sheet').classList.add('hidden');document.querySelector('#sheet').onclick=e=>{if(e.target.id==='sheet')e.currentTarget.classList.add('hidden')};document.querySelector('#addTable').onclick=()=>openTableModal();document.querySelector('#closeModal').onclick=()=>document.querySelector('#tableModal').classList.add('hidden');document.querySelector('#saveTable').onclick=saveTable;document.querySelector('#fPlan').onchange=toggleOwner;document.querySelector('#closeUtility').onclick=closeUtility;document.querySelector('#utilityModal').onclick=e=>{if(e.target.id==='utilityModal')closeUtility()};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');['home','tables','status','menu'].forEach(p=>document.querySelector('#'+p+'Page').classList.toggle('hidden',p!==b.dataset.page))});
document.querySelector('#addCastMenu').onclick=()=>castForm();document.querySelector('#castManageMenu').onclick=openCastManage;document.querySelector('#restrictionMenu').onclick=openRestrictions;document.querySelector('#sendingMenu').onclick=openSending;document.querySelector('#historyMenu').onclick=showHistory;document.querySelector('#backupMenu').onclick=backup;document.querySelector('#importMenu').onclick=()=>document.querySelector('#importInput').click();document.querySelector('#endBusinessMenu').onclick=endBusiness;
document.querySelector('#importInput').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{state=normalize(JSON.parse(r.result));save();render();toast('データを復元しました')}catch{toast('復元できないファイルです')}};r.readAsText(f);e.target.value=''};
document.querySelector('#seed').onclick=()=>{state=normalize(clone(sample));let base=Date.now();state.tables=[{id:'t1',no:'S1',plan:'B',ownerId:'',entryAt:base-35*60000,guests:2,cycle:3,lead:90,active:true,seated:[],senders:[],senderPending:[],lastSeatAt:base-125000},{id:'t2',no:'S3',plan:'VIP',ownerId:'',entryAt:base-18*60000,guests:2,cycle:3,lead:90,active:true,seated:[],senders:[],senderPending:[],lastSeatAt:base-100000},{id:'t3',no:'S5',plan:'A',ownerId:'',entryAt:base-8*60000,guests:1,cycle:3,lead:90,active:true,seated:[],senders:[],senderPending:[],lastSeatAt:null}];save();render();toast('サンプルを復元しました')};
document.querySelector('#reset').onclick=()=>{if(!confirm('卓データをリセットしますか？'))return;state.tables=[];state.refusals={};state.history=[];state.casts.forEach(c=>{c.currentTable=null;c.preparingFor=null});save();render();toast('卓データをリセットしました')};
if(!state.tables.length)document.querySelector('#seed').click();setInterval(render,1000);render();
</script>
</body></html>
