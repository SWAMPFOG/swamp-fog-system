<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07080b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SWAMP-FOG 初回回し Ver.6</title>
<style>
:root{
  --bg:#07080b;--panel:#11141a;--panel2:#191d24;--line:#2d3340;
  --text:#f6f7fb;--muted:#959baa;--gold:#d8b65b;--green:#39cf7e;
  --yellow:#f2c14f;--red:#ff6171;--blue:#62aaff
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif}
button,input,select{font:inherit}button{cursor:pointer}
.app{max-width:1500px;margin:auto;padding:calc(10px + env(safe-area-inset-top)) 7px calc(55px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:30;background:rgba(7,8,11,.96);backdrop-filter:blur(14px);margin:calc(-10px - env(safe-area-inset-top)) -7px 8px;padding:calc(10px + env(safe-area-inset-top)) 8px 9px;border-bottom:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:18px;margin:0}.sub{font-size:10px;color:var(--muted);margin-top:2px}
.actions{display:flex;gap:5px}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:8px 10px;border-radius:10px;font-weight:850}
.btn.gold{background:var(--gold);color:#171208;border-color:transparent}.btn.blue{background:#173552;color:#d8edff}.btn.red{background:#391a21;color:#ffc4ca}.btn.small{font-size:10px;padding:7px 8px}
.controlbar{display:grid;grid-template-columns:1fr auto;gap:7px;margin-bottom:8px}
.controlbar input{min-width:0;background:#11141a;color:white;border:1px solid var(--line);border-radius:11px;padding:11px 12px;text-transform:uppercase;outline:none}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 3px;text-align:center}.stat b{display:block;font-size:17px}.stat span{font-size:9px;color:var(--muted)}
.tables{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.table{background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden}
.table-head{padding:7px;background:linear-gradient(180deg,#191d25,#12151b);border-bottom:1px solid var(--line)}
.title-row{display:flex;align-items:center;gap:4px}.table-name{width:70px;min-width:0;background:#090c11;color:white;border:1px solid var(--line);border-radius:8px;padding:6px;font-size:17px;font-weight:950;text-transform:uppercase}
.spacer{flex:1}.icon-btn{border:1px solid var(--line);background:#252a34;color:white;border-radius:8px;padding:6px 7px;font-size:9px;font-weight:850}.icon-btn.danger{background:#391a21;color:#ffc2c9}
.info-line{display:grid;grid-template-columns:auto 1fr auto auto;gap:5px;align-items:center;margin-top:6px}
.badge{font-size:9px;padding:5px 6px;border-radius:7px;background:#2a2517;color:#ffe49a;border:1px solid #615421;font-weight:850}
.info-line label{font-size:9px;color:var(--muted)}.info-line input{width:38px;background:#090c11;color:white;border:1px solid var(--line);border-radius:7px;padding:5px;text-align:center}
.timer-row{display:grid;grid-template-columns:1fr auto;gap:5px;margin-top:6px}.timer{background:#090c11;border:1px solid var(--line);border-radius:8px;text-align:center;padding:7px;font-size:20px;font-weight:950;font-variant-numeric:tabular-nums}.timer.warn{color:var(--yellow)}.timer.done{color:var(--red)}
.timer-row button{border:1px solid var(--line);background:#313743;color:white;border-radius:8px;padding:7px;font-size:9px;font-weight:850}
.selection{margin-top:6px;background:#0d1015;border:1px solid var(--line);border-radius:9px;padding:6px}
.selection-top{display:flex;justify-content:space-between;gap:5px;font-size:9px;color:var(--muted)}.selection strong{color:var(--gold)}
.primary{width:100%;margin-top:6px;border:0;border-radius:9px;background:var(--gold);color:#171208;padding:10px 5px;font-size:11px;font-weight:950}
.primary:disabled{opacity:.4}
.cast-list{display:flex;flex-direction:column;gap:4px;padding:6px}
.section-label{font-size:9px;color:var(--muted);font-weight:850;padding:2px 1px}
.cast{display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:5px;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:6px;min-height:42px}
.cast.available{border-left:4px solid var(--yellow)}.cast.selected{border-color:var(--gold);background:#2b2618}.cast.done{border-left:4px solid var(--green);background:#102019;opacity:.78}
.check{width:22px;height:22px;border:1px solid #5e6572;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:950}.selected .check{background:var(--gold);color:#171208}.done .check{background:var(--green);color:#07170e;border-color:transparent}
.cast-name{font-size:12px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cast-meta{font-size:8px;color:var(--muted);margin-top:2px}.rank{font-size:9px;border:1px solid var(--line);border-radius:6px;padding:4px 5px;font-weight:900}
.history{border-top:1px solid var(--line);padding:6px;background:#0d1015}.history summary{font-size:10px;font-weight:850;cursor:pointer}.history-row{display:grid;grid-template-columns:38px 1fr;gap:5px;margin-top:4px;background:#171b22;border:1px solid var(--line);border-radius:7px;padding:5px;font-size:9px}.history-no{color:var(--gold);font-weight:950}.history-time{color:var(--muted);margin-left:5px}
.empty{border:1px dashed var(--line);border-radius:9px;padding:13px 5px;text-align:center;color:var(--muted);font-size:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;z-index:100}.modal.show{display:flex}.sheet{width:100%;max-height:90vh;overflow:auto;background:#11141a;border-radius:20px 20px 0 0;padding:15px;border-top:1px solid var(--line)}.sheet h3{margin:0 0 5px}.sheet-note{font-size:11px;color:var(--muted);margin-bottom:10px}
.cast-grid{display:flex;flex-direction:column;gap:7px}.cast-edit{display:grid;grid-template-columns:1fr 74px auto;gap:6px;background:#191d24;border:1px solid var(--line);border-radius:10px;padding:7px}.cast-edit input,.cast-edit select{min-width:0;background:#0d1015;color:white;border:1px solid var(--line);border-radius:8px;padding:9px}.cast-edit button{border:1px solid var(--line);background:#391a21;color:#ffc2c9;border-radius:8px;padding:7px}
.sheet-actions{display:flex;gap:8px;position:sticky;bottom:0;background:#11141a;padding-top:10px}.sheet-actions button{flex:1}
@media(max-width:580px){
 .app{padding-left:5px;padding-right:5px}.tables{gap:5px}.table-head{padding:5px}.table-name{width:49px;font-size:14px;padding:5px 3px}.icon-btn{font-size:7px;padding:5px 4px}.badge{font-size:7px;padding:4px}.info-line{grid-template-columns:auto 1fr auto auto;gap:3px}.info-line label{font-size:7px}.info-line input{width:31px;padding:4px 2px;font-size:9px}.timer{font-size:16px}.timer-row button{font-size:7px;padding:5px}.selection{padding:5px}.selection-top{font-size:7px}.primary{font-size:9px;padding:8px 3px}.cast-list{padding:4px}.cast{grid-template-columns:19px minmax(0,1fr) auto;padding:4px;gap:3px;min-height:36px}.check{width:18px;height:18px;font-size:10px}.cast-name{font-size:9px}.cast-meta{font-size:6px}.rank{font-size:7px;padding:3px}.summary{gap:3px}.stat b{font-size:14px}.stat span{font-size:8px}.top .btn{font-size:8px;padding:6px}.sub{display:none}
}
</style>
</head>
<body>
<div class="app">
<header>
 <div class="top">
  <div><h1>SWAMP-FOG 初回回し Ver.6</h1><div class="sub">ヘルプ優先・卓別着席チェック・可変人数回し</div></div>
  <div class="actions">
   <button class="btn blue small" onclick="openCastManager()">出勤メンバー</button>
   <button class="btn red small" onclick="endBusiness()">営業終了</button>
  </div>
 </div>
</header>

<div class="controlbar">
 <input id="newTableName" placeholder="卓番を入力（例 S1 / A3）" maxlength="12" onkeydown="if(event.key==='Enter')addTable()">
 <button class="btn gold" onclick="addTable()">＋卓追加</button>
</div>

<section class="summary">
 <div class="stat"><b id="tableCount">0</b><span>稼働卓</span></div>
 <div class="stat"><b id="castCount">0</b><span>出勤人数</span></div>
 <div class="stat"><b id="unseatedCount">0</b><span>未着席枠</span></div>
 <div class="stat"><b id="rotationCount">0</b><span>総回転</span></div>
</section>

<main id="tables" class="tables"></main>
</div>

<div id="castModal" class="modal" onclick="if(event.target===this)closeCastManager()">
 <div class="sheet">
  <h3>本日の出勤メンバー</h3>
  <div class="sheet-note">C → B → A → S の順で自動表示します。下位ランクを先に回し、上位ランクをヘルプとして確保します。</div>
  <div id="castGrid" class="cast-grid"></div>
  <button class="btn blue" style="width:100%;margin-top:9px" onclick="addCastRow()">＋キャスト追加</button>
  <div class="sheet-actions">
   <button class="btn" onclick="closeCastManager()">キャンセル</button>
   <button class="btn gold" onclick="saveCasts()">保存して反映</button>
  </div>
 </div>
</div>

<script>
const KEY="swamp_fog_v6_board";
const OLD_KEYS=["swamp_fog_v5_board","swamp_fog_v4_board","swamp_fog_v4","swamp_fog_v3"];
const DEFAULT_DURATION=210;
const RANK_ORDER={C:0,B:1,A:2,S:3};
let state={casts:[],tables:[]};
let intervals={};
let draftCasts=[];

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=(s="")=>String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
const format=sec=>`${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`;
const getTable=id=>state.tables.find(t=>t.id===id);
const getCast=id=>state.casts.find(c=>c.id===id);
const orderedCasts=()=>[...state.casts].sort((a,b)=>(RANK_ORDER[a.rank]??9)-(RANK_ORDER[b.rank]??9)||a.order-b.order||a.name.localeCompare(b.name,"ja"));

function defaultState(){return {casts:[],tables:[]}}
function persist(){localStorage.setItem(KEY,JSON.stringify(state))}

function load(){
 try{
  state=JSON.parse(localStorage.getItem(KEY));
  if(!state){
   for(const k of OLD_KEYS){
    const old=JSON.parse(localStorage.getItem(k));
    if(old){state=old;break}
   }
  }
 }catch{}
 if(!state)state=defaultState();
 normalize();render();resumeTimers();
}

function normalize(){
 state.casts=(state.casts||[]).map((c,i)=>({id:c.id||uid(),name:c.name||"",rank:["S","A","B","C"].includes(c.rank)?c.rank:"C",order:Number(c.order??i)})).filter(c=>c.name);
 state.tables=(state.tables||[]).map(t=>{
  const duration=Math.max(15,Number(t.duration||t.timer?.duration||DEFAULT_DURATION));
  const oldDone=new Set((t.queue||[]).filter(q=>q.status==="finished"||q.status==="seated").map(q=>q.castId));
  return {
   id:t.id||uid(),name:t.name||"卓",duration,
   timer:{remaining:Number(t.timer?.remaining??duration),running:Boolean(t.timer?.running),last:t.timer?.last||null},
   selected:Array.isArray(t.selected)?t.selected:[],
   done:Array.isArray(t.done)?t.done:[...oldDone],
   history:Array.isArray(t.history)?t.history:[]
  };
 });
 const now=Date.now();
 state.tables.forEach(t=>{
  t.selected=t.selected.filter(id=>state.casts.some(c=>c.id===id)&&!t.done.includes(id));
  t.done=t.done.filter(id=>state.casts.some(c=>c.id===id));
  if(t.timer.running&&t.timer.last){
   t.timer.remaining=Math.max(0,t.timer.remaining-Math.floor((now-t.timer.last)/1000));
   t.timer.last=now;
   if(!t.timer.remaining)t.timer.running=false;
  }
 });
 persist();
}

function addTable(){
 const input=document.getElementById("newTableName");
 const name=input.value.trim().toUpperCase();
 if(!name)return alert("卓番を入力してください");
 if(!state.casts.length)return alert("先に「出勤メンバー」を登録してください");
 if(state.tables.some(t=>t.name.toUpperCase()===name))return alert("同じ卓番があります");
 state.tables.push({id:uid(),name,duration:DEFAULT_DURATION,timer:{remaining:DEFAULT_DURATION,running:false,last:null},selected:[],done:[],history:[]});
 input.value="";persist();render();
}

function removeTable(id){
 if(!confirm("この卓を削除しますか？"))return;
 stopTimer(id);state.tables=state.tables.filter(t=>t.id!==id);persist();render();
}

function updateName(id,value){const t=getTable(id);if(!t)return;t.name=value.trim().toUpperCase()||"卓";persist()}
function setDuration(id,part,value){
 const t=getTable(id);if(!t)return;
 let m=Math.floor(t.duration/60),s=t.duration%60;
 const n=Math.max(0,Number(value)||0);
 if(part==="m")m=Math.min(30,n);else s=Math.min(59,n);
 t.duration=Math.max(15,m*60+s);
 if(!t.timer.running)t.timer.remaining=t.duration;
 persist();render();
}

function toggleCast(tableId,castId){
 const t=getTable(tableId);if(!t||t.done.includes(castId))return;
 const i=t.selected.indexOf(castId);
 if(i>=0)t.selected.splice(i,1);else t.selected.push(castId);
 persist();render();
}

function seatSelected(id){
 const t=getTable(id);if(!t)return;
 if(!t.selected.length)return alert("次に回すキャストを選択してください");
 const names=t.selected.map(cid=>getCast(cid)?.name).filter(Boolean);
 if(!names.length)return;
 t.history.push({no:t.history.length+1,castIds:[...t.selected],names,time:new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})});
 t.selected.forEach(cid=>{if(!t.done.includes(cid))t.done.push(cid)});
 t.selected=[];
 t.timer.remaining=t.duration;t.timer.running=true;t.timer.last=Date.now();
 startInterval(id);persist();render();
}

function resetTable(id){
 const t=getTable(id);if(!t)return;
 if(!confirm("この卓の着席チェックと履歴をリセットしますか？"))return;
 stopTimer(id);t.selected=[];t.done=[];t.history=[];t.timer={remaining:t.duration,running:false,last:null};persist();render();
}

function resetTimer(id){
 const t=getTable(id);if(!t)return;stopTimer(id);t.timer.remaining=t.duration;t.timer.running=false;t.timer.last=null;persist();render();
}

function startInterval(id){
 clearInterval(intervals[id]);
 intervals[id]=setInterval(()=>{
  const t=getTable(id);if(!t||!t.timer.running){clearInterval(intervals[id]);return}
  const now=Date.now(),elapsed=Math.floor((now-(t.timer.last||now))/1000);
  if(elapsed>0){t.timer.remaining=Math.max(0,t.timer.remaining-elapsed);t.timer.last=now;if(!t.timer.remaining)t.timer.running=false;persist();render()}
 },1000);
}
function stopTimer(id){clearInterval(intervals[id]);delete intervals[id];const t=getTable(id);if(t){t.timer.running=false;t.timer.last=null}}
function resumeTimers(){state.tables.filter(t=>t.timer.running).forEach(t=>startInterval(t.id))}

function tableHtml(t){
 const casts=orderedCasts(), available=casts.filter(c=>!t.done.includes(c.id)), done=casts.filter(c=>t.done.includes(c.id));
 const mins=Math.floor(t.duration/60),secs=t.duration%60;
 const timerClass=t.timer.remaining===0?"done":t.timer.remaining<=30?"warn":"";
 const selectedNames=t.selected.map(id=>getCast(id)?.name).filter(Boolean);
 return `<section class="table">
  <div class="table-head">
   <div class="title-row">
    <input class="table-name" value="${esc(t.name)}" onchange="updateName('${t.id}',this.value)">
    <span class="spacer"></span>
    <button class="icon-btn" onclick="resetTable('${t.id}')">卓リセット</button>
    <button class="icon-btn danger" onclick="removeTable('${t.id}')">削除</button>
   </div>
   <div class="info-line">
    <span class="badge">ヘルプ優先 C→S</span><span></span>
    <label>時間</label>
    <span><input value="${mins}" inputmode="numeric" onchange="setDuration('${t.id}','m',this.value)">:<input value="${String(secs).padStart(2,"0")}" inputmode="numeric" onchange="setDuration('${t.id}','s',this.value)"></span>
   </div>
   <div class="timer-row"><div class="timer ${timerClass}">${format(t.timer.remaining)}</div><button onclick="resetTimer('${t.id}')">タイマー<br>リセット</button></div>
   <div class="selection">
    <div class="selection-top"><span>次に回す人をタップ</span><strong>${selectedNames.length?esc(selectedNames.join("・")):"未選択"}</strong></div>
    <button class="primary" ${t.selected.length?"":"disabled"} onclick="seatSelected('${t.id}')">選択した${t.selected.length||""}人を着席 ＋ タイマー開始</button>
   </div>
  </div>
  <div class="cast-list">
   <div class="section-label">まだ着いていない（下位ランクから表示）</div>
   ${available.length?available.map(c=>castHtml(t,c,false)).join(""):'<div class="empty">全員着席済みです</div>'}
   ${done.length?`<div class="section-label" style="margin-top:3px">着席済み</div>${done.map(c=>castHtml(t,c,true)).join("")}`:""}
  </div>
  <details class="history">
   <summary>回転履歴（${t.history.length}組）</summary>
   ${t.history.length?t.history.slice().reverse().map(h=>`<div class="history-row"><div class="history-no">${h.no}組目</div><div>${esc((h.names||h.castIds?.map(id=>getCast(id)?.name).filter(Boolean)||[]).join("・"))}<span class="history-time">${esc(h.time||"")}</span></div></div>`).join(""):'<div class="empty" style="margin-top:5px">まだ履歴はありません</div>'}
  </details>
 </section>`;
}

function castHtml(t,c,isDone){
 const selected=t.selected.includes(c.id);
 return `<button class="cast ${isDone?"done":selected?"selected":"available"}" ${isDone?"disabled":""} onclick="toggleCast('${t.id}','${c.id}')">
  <span class="check">${isDone?"✓":selected?"✓":""}</span>
  <span style="text-align:left"><div class="cast-name">${esc(c.name)}</div><div class="cast-meta">${isDone?"この卓は着席済み":"タップして次の回転に選択"}</div></span>
  <span class="rank">${c.rank}</span>
 </button>`;
}

function render(){
 document.getElementById("tables").innerHTML=state.tables.length?state.tables.map(tableHtml).join(""):'<div class="empty" style="grid-column:1/-1;padding:30px">出勤メンバーを登録して、卓番を追加してください</div>';
 const totalSlots=state.tables.reduce((n,t)=>n+Math.max(0,state.casts.length-t.done.length),0);
 const totalRotations=state.tables.reduce((n,t)=>n+t.history.length,0);
 tableCount.textContent=state.tables.length;castCount.textContent=state.casts.length;unseatedCount.textContent=totalSlots;rotationCount.textContent=totalRotations;
}

function openCastManager(){
 draftCasts=orderedCasts().map(c=>({...c}));
 if(!draftCasts.length)draftCasts=[{id:uid(),name:"",rank:"C",order:0}];
 renderCastManager();castModal.classList.add("show");
}
function closeCastManager(){castModal.classList.remove("show")}
function renderCastManager(){
 castGrid.innerHTML=draftCasts.map((c,i)=>`<div class="cast-edit">
  <input placeholder="キャスト名" value="${esc(c.name)}" oninput="draftCasts[${i}].name=this.value">
  <select onchange="draftCasts[${i}].rank=this.value"><option ${c.rank==="C"?"selected":""}>C</option><option ${c.rank==="B"?"selected":""}>B</option><option ${c.rank==="A"?"selected":""}>A</option><option ${c.rank==="S"?"selected":""}>S</option></select>
  <button onclick="removeCastRow(${i})">削除</button>
 </div>`).join("");
}
function addCastRow(){draftCasts.push({id:uid(),name:"",rank:"C",order:draftCasts.length});renderCastManager()}
function removeCastRow(i){draftCasts.splice(i,1);renderCastManager()}
function saveCasts(){
 const clean=draftCasts.map((c,i)=>({...c,name:c.name.trim(),order:i})).filter(c=>c.name);
 const names=clean.map(c=>c.name);
 if(new Set(names).size!==names.length)return alert("同じ名前が重複しています");
 const validIds=new Set(clean.map(c=>c.id));
 state.casts=clean;
 state.tables.forEach(t=>{t.selected=t.selected.filter(id=>validIds.has(id));t.done=t.done.filter(id=>validIds.has(id))});
 persist();closeCastManager();render();
}

function endBusiness(){
 if(!confirm("営業を終了して、卓・履歴・タイマーをすべて消去しますか？\n出勤メンバーは残ります。"))return;
 Object.keys(intervals).forEach(stopTimer);state.tables=[];persist();render();
}

load();
</script>
</body>
</html>
