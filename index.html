<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#090a0c" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>SWAMP-FLOW Ver.10.0</title>
<style>
:root{--bg:#090a0c;--panel:#14161a;--panel2:#1d2026;--line:#2b3038;--text:#f6f7f9;--muted:#9299a5;--green:#56e58e;--yellow:#ffd257;--orange:#ff9d45;--red:#ff5e68;--blue:#68b4ff;--nav:72px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}button,input,select{font:inherit;color:inherit}button{border:0}body{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom))}.hidden{display:none!important}
header{position:sticky;top:0;z-index:20;background:rgba(9,10,12,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 14px 10px}.brand{display:flex;align-items:center;justify-content:space-between}.brand h1{font-size:17px;margin:0;letter-spacing:.08em}.clock{font-size:12px;color:var(--muted)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}.metric{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:7px;text-align:center}.metric b{display:block;font-size:16px}.metric small{color:var(--muted);font-size:10px}
.alerts{padding:10px 12px 2px}.alert-title{font-size:12px;color:var(--muted);margin:0 2px 7px}.alert-strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}.alert-strip::-webkit-scrollbar{display:none}.alert-card{min-width:170px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left}.alert-card.prepare{border-color:#765f1a;background:#211d10}.alert-card.urgent{border-color:#8a4d18;background:#28170d}.alert-card.over{border-color:#7b2429;background:#291013;animation:pulse 1.2s infinite}.alert-top{display:flex;justify-content:space-between;align-items:center}.alert-table{font-weight:800;font-size:17px}.alert-plan{font-size:11px;padding:3px 6px;border-radius:999px;background:#ffffff16}.alert-time{font-size:25px;font-variant-numeric:tabular-nums;font-weight:900;margin:6px 0 2px}.alert-next{font-size:11px;color:#d4d7dc}@keyframes pulse{50%{box-shadow:0 0 0 3px #ff5e6830}}
main{padding:8px 12px 22px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:12px 2px 7px}.section-head h2{font-size:13px;margin:0;color:#dfe2e7}.section-head span{font-size:11px;color:var(--muted)}.rank{margin-bottom:12px}.cast-list{display:grid;gap:7px}.cast{width:100%;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 12px;text-align:left;position:relative;overflow:hidden}.cast::before{content:"";width:4px;align-self:stretch;border-radius:4px;background:var(--team,#666)}.cast-main{min-width:0;flex:1}.cast-name{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cast-sub{font-size:11px;color:var(--muted);margin-top:2px}.cast-state{font-size:12px;font-weight:800;padding:6px 8px;border-radius:999px;background:#ffffff10;white-space:nowrap}.cast.available .cast-state{color:var(--green);background:#56e58e15}.cast.seated .cast-state{color:var(--blue);background:#68b4ff15}.cast.preparing .cast-state{color:var(--yellow);background:#ffd25718}.cast.done,.cast.blocked{opacity:.42}.cast.done .cast-state{color:#d6d6d6}.cast.blocked .cast-state{color:var(--red)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:40;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(4,1fr);background:rgba(16,17,20,.97);border-top:1px solid var(--line);backdrop-filter:blur(16px)}nav button{background:transparent;color:var(--muted);font-size:11px;font-weight:700}nav button.active{color:#fff}nav b{display:block;font-size:20px;margin-bottom:2px}
.sheet{position:fixed;inset:0;z-index:60;background:#0008;display:flex;align-items:flex-end}.sheet-panel{width:100%;max-height:88vh;overflow:auto;background:#111318;border-radius:22px 22px 0 0;border-top:1px solid #343943;padding:10px 12px calc(18px + env(safe-area-inset-bottom))}.handle{width:44px;height:4px;background:#4a4f58;border-radius:4px;margin:0 auto 12px}.sheet-head{display:flex;justify-content:space-between;align-items:center}.sheet-head h3{margin:0;font-size:17px}.close{width:34px;height:34px;border-radius:50%;background:#ffffff10}.hint{font-size:11px;color:var(--muted);margin:6px 0 12px}.table-scroll{display:flex;gap:9px;overflow-x:auto;padding:2px 1px 10px;scroll-snap-type:x proximity}.table-card{position:relative;min-width:148px;scroll-snap-align:start;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:11px;text-align:left}.table-card.selected{border-color:var(--blue);background:#132339}.table-card.refused{border-color:#6d282e;background:#261114;opacity:.72}.table-line{display:flex;justify-content:space-between;align-items:center}.table-no{font-size:22px;font-weight:900}.plan{font-size:12px;font-weight:800;background:#ffffff12;padding:4px 7px;border-radius:8px}.entry{font-size:12px;color:#c7cbd2;margin-top:8px}.t-time{font-size:25px;font-weight:900;font-variant-numeric:tabular-nums;margin:7px 0 2px}.meta{font-size:11px;color:var(--muted);line-height:1.5}.reason{font-size:11px;color:#ffe39c;margin-top:7px;min-height:30px}.refuse{width:100%;margin-top:9px;padding:8px;border-radius:9px;background:#4b1b20;color:#ffabb0;font-size:11px;font-weight:800}.tap-note{position:absolute;inset:auto 8px 8px 8px;text-align:center;background:#68b4ff;color:#071523;border-radius:8px;padding:6px;font-size:11px;font-weight:900}.toast{position:fixed;z-index:100;left:50%;bottom:calc(var(--nav) + 18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#f6f7f9;color:#101216;border-radius:999px;padding:9px 14px;font-size:12px;font-weight:800;box-shadow:0 8px 30px #0008;max-width:88%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page{padding:10px 12px}.page h2{font-size:17px}.table-list{display:grid;gap:9px}.info-card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:12px}.info-top{display:flex;justify-content:space-between;align-items:center}.info-top strong{font-size:18px}.mini-actions{display:flex;gap:7px;margin-top:10px}.mini-actions button,.primary,.secondary,.danger{padding:10px 12px;border-radius:10px;font-weight:800}.primary{background:var(--blue);color:#08131d}.secondary{background:#ffffff12}.danger{background:#4b1b20;color:#ffabb0}.form{display:grid;gap:9px}.form label{font-size:11px;color:var(--muted)}.form input,.form select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fab{position:fixed;right:16px;bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;background:var(--blue);color:#07131e;font-size:28px;font-weight:500;box-shadow:0 8px 24px #0009}
</style>
</head>
<body>
<header><div class="brand"><h1>SWAMP-FLOW</h1><span class="clock" id="clock"></span></div><div class="summary"><div class="metric"><b id="mTables">0</b><small>稼働卓</small></div><div class="metric"><b id="mSeated">0</b><small>着席中</small></div><div class="metric"><b id="mAlerts">0</b><small>準備アラート</small></div></div></header>
<section id="homePage">
<div class="alerts"><p class="alert-title">次の着席準備</p><div class="alert-strip" id="alerts"></div></div>
<main id="casts"></main>
</section>
<section id="tablesPage" class="page hidden"><h2>卓設定・稼働状況</h2><div id="tableList" class="table-list"></div><button class="fab" id="addTable">＋</button></section>
<section id="statusPage" class="page hidden"><h2>営業状況</h2><div id="statusList" class="table-list"></div></section>
<section id="menuPage" class="page hidden"><h2>メニュー</h2><div class="info-card"><div class="mini-actions"><button class="secondary" id="seed">サンプル復元</button><button class="danger" id="reset">営業データリセット</button></div></div><div class="info-card" style="margin-top:10px"><b>操作</b><p class="hint">キャスト名 → 卓候補 → 同じ卓を2回タップで着席確定。着席拒否・確定着席は長押しで取り消せます。</p></div></section>
<nav><button data-page="home" class="active"><b>人</b>キャスト</button><button data-page="tables"><b>卓</b>卓設定</button><button data-page="status"><b>状</b>状況</button><button data-page="menu"><b>≡</b>メニュー</button></nav>
<div id="sheet" class="sheet hidden"><div class="sheet-panel"><div class="handle"></div><div class="sheet-head"><h3 id="sheetTitle"></h3><button class="close" id="closeSheet">×</button></div><p class="hint">卓カードを1回タップで選択、同じ卓をもう1回タップで着席確定。長押しで取消。</p><div class="table-scroll" id="candidates"></div></div></div>
<div id="tableModal" class="sheet hidden"><div class="sheet-panel"><div class="handle"></div><div class="sheet-head"><h3 id="modalTitle">卓を追加</h3><button class="close" id="closeModal">×</button></div><div class="form"><div class="row"><label>卓番<input id="fNo" placeholder="S1"></label><label>プラン<select id="fPlan"><option>A</option><option selected>B</option><option>VIP</option><option>お連れ様</option></select></label></div><div class="row"><label>入店時間<input id="fEntry" type="time"></label><label>お客様人数<input id="fGuests" type="number" min="1" value="2"></label></div><div class="row"><label>回し時間（分）<input id="fCycle" type="number" min="2" value="5"></label><label>準備アラート（秒前）<input id="fLead" type="number" min="10" value="90"></label></div><button class="primary" id="saveTable">保存</button></div></div></div>
<div id="toast" class="toast hidden"></div>
<script>
const KEY='swamp-flow-v10';
const sample={casts:[
{id:'c1',name:'れい',rank:'S',team:'#9b6cff'},{id:'c2',name:'ゆうせい',rank:'S',team:'#4fc3f7'},{id:'c3',name:'のあ',rank:'S',team:'#ff7da8'},{id:'c4',name:'たいが',rank:'A',team:'#65d58a'},{id:'c5',name:'かぐや',rank:'A',team:'#ffd15c'},{id:'c6',name:'りょうすけ',rank:'B',team:'#ff9966'},{id:'c7',name:'なつき',rank:'C',team:'#7da1ff'}],tables:[],refusals:{},history:[]};
let state=load(),selectedCast=null,selectedTable=null,editTableId=null,longTimer=null;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(sample)}catch{return structuredClone(sample)}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function now(){return Date.now()} function pad(n){return String(n).padStart(2,'0')} function hm(t){let d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())}
function fmt(sec){let neg=sec<0;sec=Math.abs(Math.floor(sec));return(neg?'+':'')+Math.floor(sec/60)+':'+pad(sec%60)}
function toast(s){let e=document.querySelector('#toast');e.textContent=s;e.classList.remove('hidden');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.add('hidden'),1800)}
function tablePhase(t){if(!t.active)return null;if(!t.lastSeatAt)return{sec:0,stage:'idle'};let elapsed=(now()-t.lastSeatAt)/1000,cycle=t.cycle*60,remaining=cycle-elapsed;if(remaining<=0)return{sec:remaining,stage:'over'};if(remaining<=30)return{sec:remaining,stage:'urgent'};if(remaining<=t.lead)return{sec:remaining,stage:'prepare'};return{sec:remaining,stage:'normal'}}
function eligible(c,t){if(!t.active)return false;if((t.seated||[]).includes(c.id))return false;if(state.refusals[c.id+'|'+t.id])return false;if(c.currentTable)return false;return true}
function candidatesFor(c){return state.tables.filter(t=>eligible(c,t)).sort((a,b)=>a.entryAt-b.entryAt)}
function castState(c){if(c.preparingFor)return['preparing','準備中 '+tableNo(c.preparingFor)];if(c.currentTable)return['seated','着席 '+tableNo(c.currentTable)];let n=candidatesFor(c).length;if(!state.tables.some(t=>t.active))return['blocked','対象なし'];if(n===0)return['done','完走'];return['available','残'+n+'卓']}
function tableNo(id){return state.tables.find(t=>t.id===id)?.no||''}
function render(){document.querySelector('#clock').textContent=new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});let active=state.tables.filter(t=>t.active);document.querySelector('#mTables').textContent=active.length;document.querySelector('#mSeated').textContent=state.casts.filter(c=>c.currentTable).length;let alertTables=active.filter(t=>['prepare','urgent','over'].includes(tablePhase(t).stage));document.querySelector('#mAlerts').textContent=alertTables.length;renderAlerts(alertTables);renderCasts();renderTables();renderStatus();if(selectedCast)renderCandidates()}
function renderAlerts(arr){let box=document.querySelector('#alerts');if(!arr.length){box.innerHTML='<div class="alert-card"><div class="alert-next">現在、準備が必要な卓はありません</div></div>';return}arr.sort((a,b)=>tablePhase(a).sec-tablePhase(b).sec);box.innerHTML=arr.map(t=>{let p=tablePhase(t),next=state.casts.filter(c=>eligible(c,t)).slice(0,3).map(c=>c.name).join('・')||'候補なし';return`<button class="alert-card ${p.stage}" data-alert="${t.id}"><div class="alert-top"><span class="alert-table">${t.no}</span><span class="alert-plan">${t.plan}</span></div><div class="alert-time">${p.stage==='over'?'超過 '+fmt(p.sec):'あと '+fmt(p.sec)}</div><div class="alert-next">次候補：${next}</div></button>`}).join('');box.querySelectorAll('[data-alert]').forEach(b=>b.onclick=()=>{let t=state.tables.find(x=>x.id===b.dataset.alert),c=state.casts.find(x=>eligible(x,t));if(c)openCandidates(c.id,t.id);else toast('着席可能なキャストがいません')})}
function renderCasts(){let root=document.querySelector('#casts');root.innerHTML='';for(let rank of ['S','A','B','C']){let list=state.casts.filter(c=>c.rank===rank);if(!list.length)continue;let sec=document.createElement('section');sec.className='rank';sec.innerHTML=`<div class="section-head"><h2>${rank}ランク</h2><span>${list.length}名</span></div><div class="cast-list"></div>`;let wrap=sec.querySelector('.cast-list');list.forEach(c=>{let [cls,label]=castState(c),b=document.createElement('button');b.className='cast '+cls;b.style.setProperty('--team',c.team);b.innerHTML=`<span class="cast-main"><div class="cast-name">${c.name}</div><div class="cast-sub">${c.preparingFor?'声掛け済み・卓前待機':c.currentTable?'長押しで着席取消':'タップして着席可能卓を表示'}</div></span><span class="cast-state">${label}</span>`;if(cls==='available')b.onclick=()=>openCandidates(c.id);if(cls==='preparing')b.onclick=()=>openCandidates(c.id,c.preparingFor);bindLong(b,()=>undoCast(c));wrap.appendChild(b)});root.appendChild(sec)}}
function openCandidates(cid,preferred){selectedCast=cid;selectedTable=preferred||null;document.querySelector('#sheet').classList.remove('hidden');renderCandidates()}
function renderCandidates(){let c=state.casts.find(x=>x.id===selectedCast);if(!c)return;document.querySelector('#sheetTitle').textContent=c.name+' の着席可能卓';let tables=state.tables.filter(t=>t.active && !(t.seated||[]).includes(c.id));tables.sort((a,b)=>a.entryAt-b.entryAt);let box=document.querySelector('#candidates');box.innerHTML=tables.map(t=>{let refused=!!state.refusals[c.id+'|'+t.id],ok=eligible(c,t),p=tablePhase(t),sel=selectedTable===t.id,reason=p?.stage==='over'?'タイマー超過':p?.stage==='urgent'?'交代まで30秒以内':p?.stage==='prepare'?'次キャスト準備時間':t===tables[tables.length-1]?'最新入店卓':'入店順';return`<div class="table-card ${sel?'selected':''} ${refused?'refused':''}" data-tid="${t.id}"><div class="table-line"><span class="table-no">${t.no}</span><span class="plan">${t.plan}</span></div><div class="entry">入店 ${hm(t.entryAt)}　${t.guests}名</div><div class="t-time">${!t.lastSeatAt?'未開始':p.stage==='over'?'超過 '+fmt(p.sec):fmt(p.sec)}</div><div class="meta">${t.cycle}分回し／準備${t.lead}秒前<br>着席済 ${(t.seated||[]).length}名</div><div class="reason">${refused?'着席拒否中（長押し解除）':reason}</div>${ok?`<button class="refuse" data-refuse="${t.id}">着席拒否</button>`:''}${sel&&!refused?'<div class="tap-note">もう一度タップで確定</div>':''}</div>`}).join('')||'<div class="hint">着席可能卓がありません</div>';
box.querySelectorAll('.table-card').forEach(card=>{let tid=card.dataset.tid;card.onclick=e=>{if(e.target.dataset.refuse)return;let t=state.tables.find(x=>x.id===tid);if(state.refusals[c.id+'|'+tid])return;if(selectedTable===tid)seat(c,t);else{selectedTable=tid;c.preparingFor=tid;save();render();toast(c.name+'へ声掛け・'+t.no+'待機')}};bindLong(card,()=>undoPair(c,tid))});box.querySelectorAll('[data-refuse]').forEach(b=>b.onclick=e=>{e.stopPropagation();state.refusals[c.id+'|'+b.dataset.refuse]=true;selectedTable=null;save();render();toast(c.name+'の着席拒否を登録')})}
function seat(c,t){if(!eligible(c,t)){toast('現在は着席できません');return}c.currentTable=t.id;c.preparingFor=null;t.seated=t.seated||[];t.seated.push(c.id);t.lastSeatAt=now();state.history.push({cast:c.id,table:t.id,at:now()});save();document.querySelector('#sheet').classList.add('hidden');selectedCast=selectedTable=null;if(navigator.vibrate)navigator.vibrate(80);toast(c.name+' → '+t.no+' 着席');render()}
function undoCast(c){if(c.currentTable){let t=state.tables.find(x=>x.id===c.currentTable);if(t)t.seated=(t.seated||[]).filter(id=>id!==c.id);let idx=state.history.map(h=>h.cast===c.id&&h.table===c.currentTable).lastIndexOf(true);if(idx>=0)state.history.splice(idx,1);c.currentTable=null;save();render();toast(c.name+'の着席を取り消しました')}else if(c.preparingFor){c.preparingFor=null;save();render();toast('準備中を解除しました')}}
function undoPair(c,tid){let k=c.id+'|'+tid;if(state.refusals[k]){delete state.refusals[k];save();render();toast('着席拒否を解除しました');return}if(selectedTable===tid){selectedTable=null;if(c.preparingFor===tid)c.preparingFor=null;save();render();toast('仮選択・準備中を解除しました')}}
function bindLong(el,fn){let moved=false;el.addEventListener('touchstart',()=>{moved=false;longTimer=setTimeout(fn,650)},{passive:true});el.addEventListener('touchmove',()=>{moved=true;clearTimeout(longTimer)},{passive:true});['touchend','touchcancel'].forEach(x=>el.addEventListener(x,()=>clearTimeout(longTimer)));el.addEventListener('contextmenu',e=>{e.preventDefault();fn()})}
function renderTables(){let box=document.querySelector('#tableList');box.innerHTML=state.tables.map(t=>{let p=tablePhase(t);return`<div class="info-card"><div class="info-top"><strong>${t.no} <small>${t.plan}</small></strong><span>${t.active?'稼働中':'終了'}</span></div><div class="hint">入店 ${hm(t.entryAt)}／${t.guests}名／${t.cycle}分回し／準備${t.lead}秒前</div><div>${!t.lastSeatAt?'タイマー未開始':p.stage==='over'?'超過 '+fmt(p.sec):'次交代まで '+fmt(p.sec)}</div><div class="mini-actions"><button class="secondary" data-edit="${t.id}">編集</button><button class="${t.active?'danger':'secondary'}" data-toggle="${t.id}">${t.active?'卓終了':'再開'}</button></div></div>`}).join('')||'<div class="info-card">卓設定から新しい卓を追加してください。</div>';box.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openTableModal(b.dataset.edit));box.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{let t=state.tables.find(x=>x.id===b.dataset.toggle);t.active=!t.active;save();render()})}
function renderStatus(){let box=document.querySelector('#statusList');box.innerHTML=state.tables.filter(t=>t.active).sort((a,b)=>a.entryAt-b.entryAt).map(t=>{let names=(t.seated||[]).map(id=>state.casts.find(c=>c.id===id)?.name).filter(Boolean);let p=tablePhase(t);return`<div class="info-card"><div class="info-top"><strong>${t.no} <small>${t.plan}</small></strong><span>${!t.lastSeatAt?'未開始':p.stage==='over'?'超過 '+fmt(p.sec):fmt(p.sec)}</span></div><div class="hint">入店 ${hm(t.entryAt)}／着席済 ${names.length}名</div><div>${names.join('・')||'着席履歴なし'}</div></div>`}).join('')||'<div class="info-card">稼働中の卓はありません。</div>'}
function openTableModal(id=null){editTableId=id;let t=id?state.tables.find(x=>x.id===id):null;document.querySelector('#modalTitle').textContent=t?'卓を編集':'卓を追加';document.querySelector('#fNo').value=t?.no||'';document.querySelector('#fPlan').value=t?.plan||'B';document.querySelector('#fEntry').value=t?hm(t.entryAt):new Date().toTimeString().slice(0,5);document.querySelector('#fGuests').value=t?.guests||2;document.querySelector('#fCycle').value=t?.cycle||5;document.querySelector('#fLead').value=t?.lead||90;document.querySelector('#tableModal').classList.remove('hidden')}
function saveTable(){let no=document.querySelector('#fNo').value.trim().toUpperCase();if(!no){toast('卓番を入力してください');return}let [h,m]=document.querySelector('#fEntry').value.split(':').map(Number),d=new Date();d.setHours(h,m,0,0);let data={no,plan:document.querySelector('#fPlan').value,entryAt:d.getTime(),guests:+document.querySelector('#fGuests').value||1,cycle:+document.querySelector('#fCycle').value||5,lead:+document.querySelector('#fLead').value||90};if(editTableId)Object.assign(state.tables.find(x=>x.id===editTableId),data);else state.tables.push({id:'t'+Date.now(),...data,active:true,seated:[],lastSeatAt:null});save();document.querySelector('#tableModal').classList.add('hidden');render();toast(no+'を保存しました')}
document.querySelector('#closeSheet').onclick=()=>document.querySelector('#sheet').classList.add('hidden');document.querySelector('#sheet').onclick=e=>{if(e.target.id==='sheet')e.currentTarget.classList.add('hidden')};document.querySelector('#addTable').onclick=()=>openTableModal();document.querySelector('#closeModal').onclick=()=>document.querySelector('#tableModal').classList.add('hidden');document.querySelector('#saveTable').onclick=saveTable;
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');['home','tables','status','menu'].forEach(p=>document.querySelector('#'+p+'Page').classList.toggle('hidden',p!==b.dataset.page))});
document.querySelector('#seed').onclick=()=>{state=structuredClone(sample);let base=Date.now();state.tables=[{id:'t1',no:'S1',plan:'B',entryAt:base-35*60000,guests:2,cycle:5,lead:90,active:true,seated:[],lastSeatAt:base-245000},{id:'t2',no:'S3',plan:'VIP',entryAt:base-18*60000,guests:2,cycle:5,lead:90,active:true,seated:[],lastSeatAt:base-220000},{id:'t3',no:'S5',plan:'A',entryAt:base-8*60000,guests:1,cycle:5,lead:90,active:true,seated:[],lastSeatAt:null}];save();render();toast('サンプルを復元しました')};document.querySelector('#reset').onclick=()=>{state.tables=[];state.refusals={};state.history=[];state.casts.forEach(c=>{c.currentTable=null;c.preparingFor=null});save();render();toast('営業データをリセットしました')};
if(!state.tables.length)document.querySelector('#seed').click();setInterval(render,1000);render();
</script>
</body></html>
