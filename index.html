<style>
:root{--bg:#090a0c;--panel:#14161a;--panel2:#1d2026;--line:#2b3038;--text:#f6f7f9;--muted:#9299a5;--green:#56e58e;--yellow:#ffd257;--orange:#ff9d45;--red:#ff5e68;--blue:#68b4ff;--nav:72px}

.alerts{padding:10px 12px 2px}.alert-title{font-size:12px;color:var(--muted);margin:0 2px 7px}.alert-strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}.alert-strip::-webkit-scrollbar{display:none}.alert-card{min-width:170px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left}.alert-card.find{border-color:#355e86;background:#101d2a}.alert-card.prepare{border-color:#765f1a;background:#211d10}.alert-card.urgent{border-color:#8a4d18;background:#28170d}.alert-card.over{border-color:#7b2429;background:#291013;animation:pulse 1.2s infinite}.alert-top{display:flex;justify-content:space-between;align-items:center}.alert-table{font-weight:800;font-size:17px}.alert-plan{font-size:11px;padding:3px 6px;border-radius:999px;background:#ffffff16}.alert-time{font-size:25px;font-variant-numeric:tabular-nums;font-weight:900;margin:6px 0 2px}.alert-next{font-size:11px;color:#d4d7dc}.swap-now{width:100%;margin-top:8px;padding:8px 10px;border-radius:9px;background:#b52b34;color:#fff;font-size:12px;font-weight:900}.swap-flow{font-size:11px;color:#ffd4d7;margin-top:5px}@keyframes pulse{50%{box-shadow:0 0 0 3px #ff5e6830}}

.sheet{position:fixed;inset:0;z-index:60;background:#0008;display:flex;align-items:flex-end}.sheet-panel{width:100%;max-height:88vh;overflow:auto;background:#111318;border-radius:22px 22px 0 0;border-top:1px solid #343943;padding:10px 12px calc(18px + env(safe-area-inset-bottom))}.handle{width:44px;height:4px;background:#4a4f58;border-radius:4px;margin:0 auto 12px}.sheet-head{display:flex;justify-content:space-between;align-items:center}.sheet-head h3{margin:0;font-size:17px}.close{width:34px;height:34px;border-radius:50%;background:#ffffff10}.hint{font-size:11px;color:var(--muted);margin:6px 0 12px}.table-scroll{display:flex;gap:9px;overflow-x:auto;padding:2px 1px 10px;scroll-snap-type:x proximity}.table-card{position:relative;min-width:148px;scroll-snap-align:start;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:11px;text-align:left}.table-card.selected{border-color:var(--blue);background:#132339}.table-card.refused{border-color:#6d282e;background:#261114;opacity:.72}.table-line{display:flex;justify-content:space-between;align-items:center}.table-no{font-size:22px;font-weight:900}.plan{font-size:12px;font-weight:800;background:#ffffff12;padding:4px 7px;border-radius:8px}.entry{font-size:12px;color:#c7cbd2;margin-top:8px}.t-time{font-size:25px;font-weight:900;font-variant-numeric:tabular-nums;margin:7px 0 2px}.meta{font-size:11px;color:var(--muted);line-height:1.5}.reason{font-size:11px;color:#ffe39c;margin-top:7px;min-height:30px}.refuse{width:100%;margin-top:9px;padding:8px;border-radius:9px;background:#4b1b20;color:#ffabb0;font-size:11px;font-weight:800}.tap-note{position:absolute;inset:auto 8px 8px 8px;text-align:center;background:#68b4ff;color:#071523;border-radius:8px;padding:6px;font-size:11px;font-weight:900}.table-candidate-list{display:flex;flex-direction:column;gap:8px;padding-bottom:8px}.table-candidate{width:100%;display:flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:11px;text-align:left}.table-candidate.preparing{border-color:#e7bb43;background:#211d10}.table-candidate.blocked{opacity:.55}.table-candidate .rank-chip{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:#ffffff12;font-weight:900}.table-candidate .candidate-main{flex:1;min-width:0}.table-candidate .candidate-name{font-weight:900;font-size:16px}.table-candidate .candidate-reason{font-size:11px;color:var(--muted);margin-top:3px}.table-candidate .candidate-state{font-size:11px;font-weight:900}.table-sheet-actions{position:sticky;bottom:0;background:#111318;padding-top:8px}.table-sheet-actions button{width:100%;margin-top:7px}.selected-count{font-size:12px;color:#ffd86b;text-align:center;font-weight:900;margin:4px 0}.reject-mini{padding:7px 9px;border-radius:8px;background:#4b1b20;color:#ffabb0;font-size:10px;font-weight:900;flex:none}.toast{position:fixed;z-index:100;left:50%;bottom:calc(var(--nav) + 18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#f6f7f9;color:#101216;border-radius:999px;padding:9px 14px;font-size:12px;font-weight:800;box-shadow:0 8px 30px #0008;max-width:88%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page{padding:10px 12px}.page h2{font-size:17px}.table-list{display:grid;gap:9px}.info-card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:12px}.info-top{display:flex;justify-content:space-between;align-items:center}.info-top strong{font-size:18px}.mini-actions{display:flex;gap:7px;margin-top:10px}.mini-actions button,.primary,.secondary,.danger{padding:10px 12px;border-radius:10px;font-weight:800}.primary{background:var(--blue);color:#08131d}.secondary{background:#ffffff12}.danger{background:#4b1b20;color:#ffabb0}.form{display:grid;gap:9px}.form label{font-size:11px;color:var(--muted)}.form input,.form select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fab{position:fixed;right:16px;bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;background:var(--blue);color:#07131e;font-size:28px;font-weight:500;box-shadow:0 8px 24px #0009}

.menu-section{margin:14px 0 18px}.menu-section h3{margin:0 2px 7px;font-size:12px;color:var(--muted);letter-spacing:.08em}.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:8px}.menu-grid button{min-height:54px;border-radius:13px;background:var(--panel2);border:1px solid var(--line);font-size:13px;font-weight:850;display:flex;align-items:center;justify-content:center;padding:10px}.menu-grid button span{font-size:13px;font-weight:850;line-height:1.25}.menu-grid button small{display:block;font-size:10px;color:var(--muted);margin-top:4px;font-weight:700}.menu-grid .priority-menu{min-height:70px;display:block;text-align:left;padding:12px 14px;background:#14283a;border-color:#3d79a8;box-shadow:0 0 0 1px #68b4ff22 inset}.menu-grid .priority-menu span{display:block;font-size:16px;color:#bdddff}.menu-grid .priority-menu small{color:#8ebce4}.release-chip{display:inline-flex;margin-top:7px;padding:5px 9px;border-radius:8px;background:#4b1b20;color:#ffabb0;font-size:11px;font-weight:850}.timer-preview{border:1px solid var(--line);background:#0e1115;border-radius:12px;padding:10px;line-height:1.6}.timer-preview b{font-size:18px}.drag-list{display:grid;gap:8px}.drag-item{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid var(--line);background:var(--panel2);border-radius:11px}.drag-handle{font-size:20px;color:var(--muted)}.menu-grid .danger-menu{background:#2a1417;border-color:#5f292f;color:#ffabb0}.menu-grid button.confirming{background:#503f12;border-color:#c39a24;color:#ffe18b}.menu-grid .full{grid-column:1/-1}nav button{position:relative;border-radius:12px;margin:7px 5px;padding:5px 2px}nav button.active{background:#ffffff10}nav button span{display:block;font-size:10px;margin-top:1px}.list-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.list-row:last-child{border-bottom:0}.list-main{flex:1;min-width:0}.list-main b{display:block}.list-main small{display:block;color:var(--muted);margin-top:3px}.tag{display:inline-block;font-size:10px;border-radius:999px;padding:3px 6px;background:#ffffff12;margin:2px 3px 0 0}.tag.red{color:#ffabb0;background:#4b1b20}.tag.blue{color:#a8d4ff;background:#18334d}.icon-btn{width:38px;height:38px;border-radius:10px;background:#ffffff10}.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.switch-row input{width:22px;height:22px}.sender-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:9px}.sender-btn{padding:10px;border-radius:10px;background:#ffffff10;border:1px solid var(--line);font-weight:800}.sender-btn.on{background:#1c3a2a;border-color:#3a8b5d;color:#8af0ad}.sender-btn.pending{background:#3b3218;border-color:#8c762e;color:#ffe18b}.full{grid-column:1/-1}.notice{border:1px solid #66531d;background:#211c0d;border-radius:12px;padding:10px;color:#ffe49b;font-size:12px;line-height:1.5}.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.modal-actions.three{grid-template-columns:1fr 1fr 1fr}.history-item{padding:10px 0;border-bottom:1px solid var(--line)}.history-item b{font-size:14px}.history-item small{display:block;color:var(--muted);margin-top:4px}.count-badge{min-width:26px;text-align:center;border-radius:999px;padding:4px 7px;background:#ffffff12;font-size:11px;font-weight:900}.blocked-reason{font-size:10px;color:#ffabb0;margin-top:3px}.form textarea{width:100%;min-height:110px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px;color:#fff}
</style>
</head>
<body>
<header><div class="brand"><h1>SWAMP-FLOW</h1><span class="clock" id="clock"></span></div><div class="summary"><div class="metric"><b id="mTables">0</b><small>稼働卓</small></div><div class="metric"><b id="mSeated">0</b><small>着席中</small></div><div class="metric"><b id="mAlerts">0</b><small>準備アラート</small></div></div></header>
<section id="homePage">
<div class="alerts"><p class="alert-title">次の着席準備</p><div class="alert-strip" id="alerts"></div></div>
<main id="casts"></main>
</section>
<section id="tablesPage" class="page hidden"><h2>卓設定</h2><div id="tableList" class="table-list"></div><button class="fab" id="addTable">＋</button></section>
<section id="statusPage" class="page hidden"><h2>営業状況</h2><div id="statusList" class="table-list"></div></section>
<section id="menuPage" class="page hidden"><h2>メニュー</h2>
<div class="menu-section"><h3>営業操作</h3><div class="menu-grid">
<button id="restrictionMenu" class="priority-menu"><span>制限設定</span><small>着席制限を変更</small></button><button id="sendingMenu" class="priority-menu"><span>送り設定</span><small>送り指名を登録</small></button>
<button id="summaryMenu" class="priority-menu"><span>営業集計</span><small>誰が何卓着いたか確認</small></button><button id="historyMenu"><span>着席履歴</span></button><button id="endBusinessMenu" class="danger-menu"><span>営業終了</span></button>
</div></div>
<div class="menu-section"><h3>キャスト管理</h3><div class="menu-grid">
<button id="addCastMenu"><span>キャスト追加</span></button><button id="bulkAddCastMenu"><span>キャストまとめて追加</span></button>
<button id="castManageMenu"><span>キャスト管理</span></button><button id="bulkCastManageMenu"><span>キャストまとめて管理</span></button>
<button id="bulkColorMenu"><span>キャスト色一括管理</span></button><button id="castSortMenu"><span>キャスト一括並び替え</span></button>
</div></div>
<div class="menu-section"><h3>データ管理</h3><div class="menu-grid">
<button id="backupMenu"><span>バックアップ</span></button><button id="importMenu"><span>データ復元</span></button>
<button id="resetTableMenu" class="danger-menu"><span>卓データリセット</span></button><button id="restoreTableMenu"><span>卓データ復元</span></button>
</div><p class="hint">卓データ復元は同じボタンを2回タップすると決定します。</p></div>
<div class="info-card" style="margin-top:10px"><b>操作</b><p class="hint">候補表示と実際の選択は同じ優先順位（C→B→A→S）です。準備枠・着席枠が満員でも、未着席卓が残っているキャストは完走ではなく待機表示になります。</p></div></section>
<nav><button data-page="home" class="active"><b>人</b><span>キャスト</span></button><button data-page="tables"><b>卓</b><span>卓設定</span></button><button data-page="status"><b>状</b><span>営業状況</span></button><button data-page="menu"><b>≡</b><span>メニュー</span></button></nav>
<div id="sheet" class="sheet hidden"><div class="sheet-panel"><div class="handle"></div><div class="sheet-head"><h3 id="sheetTitle"></h3><button class="close" id="closeSheet">×</button></div><p class="hint" id="sheetHint">通常操作：卓カードをタップで準備中、もう一度タップで同時着席。「着席拒否」は各卓のボタンから登録し、長押しで解除。</p><div class="table-scroll" id="candidates"></div></div></div>
<div id="tableModal" class="sheet hidden"><div class="sheet-panel"><div class="handle"></div><div class="sheet-head"><h3 id="modalTitle">卓を追加</h3><button class="close" id="closeModal">×</button></div><div class="form"><div class="row"><label>卓番<span id="standardTableNoWrap"><select id="fNoSelect"><option value="">選択</option><option>S1</option><option>S2</option><option>S3</option><option>S4</option><option>S5</option><option>S6</option><option>S7</option><option>S8</option><option>S9</option></select></span><input id="fNo" class="hidden" placeholder="卓番を直接入力"></label><label>プラン<select id="fPlan"><option>A</option><option selected>B</option><option>VIP</option><option>お連れ様</option></select></label></div><div class="row"><label>入店時間<input id="fEntry" type="time"></label><label>お客様人数<select id="fGuests"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select></label></div><div id="companionOwnerWrap" class="hidden"><label>お連れ様担当キャスト<select id="fOwner"></select></label></div><div class="row"><label>1回の回し人数<select id="fRotation"><option value="1">1人回し</option><option value="2" selected>2人回し（原則）</option><option value="3">3人回し</option></select></label><label>タイマー方式<select id="fTimerMode"><option value="auto">自動計算</option><option value="manual">手動設定</option></select></label></div><div class="row"><label>完走目標（分）<input id="fTarget" type="number" min="30" max="50" value="50"></label><label>手動タイマー（分）<input id="fCycle" type="number" min="1" max="10" step="0.1" value="3"></label></div><div class="row"><label>準備アラート（秒前）<input id="fLead" type="number" min="30" value="90"></label><label>原則<input value="2人回し" disabled></label></div><div id="timerPreview" class="timer-preview"></div><button class="primary" id="saveTable">保存</button><button class="danger hidden" id="endTableFromModal">この卓を終了</button></div></div></div>
<div id="utilityModal" class="sheet hidden"><div class="sheet-panel"><div class="handle"></div><div class="sheet-head"><h3 id="utilityTitle"></h3><button class="close" id="closeUtility">×</button></div><div id="utilityBody"></div></div></div><input id="importInput" type="file" accept="application/json" class="hidden"><div id="toast" class="toast hidden"></div>
<script>
const KEY='swamp-flow-v10.9',OLD_KEY='swamp-flow-v10.5',TABLE_SNAPSHOT_KEY='swamp-flow-table-snapshot-v10.9';
const sample={casts:[
{id:'c1',name:'れい',rank:'S',team:'#9b6cff'},{id:'c2',name:'ゆうせい',rank:'S',team:'#4fc3f7'},{id:'c3',name:'のあ',rank:'S',team:'#ff7da8'},{id:'c4',name:'たいが',rank:'A',team:'#65d58a'},{id:'c5',name:'かぐや',rank:'A',team:'#ffd15c'},{id:'c6',name:'りょうすけ',rank:'B',team:'#ff9966'},{id:'c7',name:'なつき',rank:'C',team:'#7da1ff'}],tables:[],refusals:{},history:[],settings:{sendLimit:2}};
let state=load(),selectedCast=null,selectedTable=null,editTableId=null,longTimer=null;
function clone(x){return JSON.parse(JSON.stringify(x))}
function normalize(s){s=s&&typeof s==='object'?s:clone(sample);s.casts=Array.isArray(s.casts)?s.casts:[];s.tables=Array.isArray(s.tables)?s.tables:[];s.refusals=s.refusals||{};s.history=Array.isArray(s.history)?s.history:[];s.settings={sendLimit:2,...(s.settings||{})};s.casts.forEach((c,i)=>Object.assign(c,{id:c.id||'c'+Date.now()+i,rank:c.rank||'C',team:c.team||'#777777',working:c.working!==false,sends:Number(c.sends)||0,penalty:!!c.penalty,inHouse:!!c.inHouse,ngTables:Array.isArray(c.ngTables)?c.ngTables:[],currentTable:c.currentTable||null,preparingFor:c.preparingFor||null,order:Number.isFinite(c.order)?c.order:i}));s.tables.forEach(t=>{let companion=t.plan==='お連れ様';Object.assign(t,{active:t.active!==false,seated:Array.isArray(t.seated)?t.seated:[],senders:Array.isArray(t.senders)?t.senders:[],senderPending:Array.isArray(t.senderPending)?t.senderPending:[],lastSeatAt:t.lastSeatAt||null,ownerId:t.ownerId||'',timerMode:t.timerMode||'manual',targetMin:Number(t.targetMin)||(companion?45:50),cycleSec:Number(t.cycleSec)||Math.round((Number(t.cycle)||(companion?5:3))*60),lead:Number(t.lead)||90,rotationSize:[1,2,3].includes(Number(t.rotationSize))?Number(t.rotationSize):2,currentCastIds:Array.isArray(t.currentCastIds)?t.currentCastIds:(t.currentCastId?[t.currentCastId]:[]),companionPicks:Array.isArray(t.companionPicks)?t.companionPicks:[],companionApplicants:Array.isArray(t.companionApplicants)?t.companionApplicants:[],groupNo:Number(t.groupNo)||0,autoHandledAt:Number(t.autoHandledAt)||0,rotationEnded:!!t.rotationEnded});delete t.currentCastId;t.cycle=t.cycleSec/60});return s}
function load(){try{let raw=localStorage.getItem(KEY)||localStorage.getItem(OLD_KEY);return normalize(raw?JSON.parse(raw):clone(sample))}catch{return normalize(clone(sample))}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function now(){return Date.now()} function pad(n){return String(n).padStart(2,'0')} function hm(t){let d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())}
function fmt(sec){let neg=sec<0;sec=Math.abs(Math.floor(sec));return(neg?'+':'')+Math.floor(sec/60)+':'+pad(sec%60)}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(s){let e=document.querySelector('#toast');e.textContent=s;e.classList.remove('hidden');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.add('hidden'),1900)}
function tablePhase(t){if(!t.active)return null;if(t.rotationEnded)return{sec:0,stage:'ended'};if(!t.lastSeatAt)return{sec:0,stage:'idle'};let elapsed=(now()-t.lastSeatAt)/1000,remaining=(t.cycleSec||t.cycle*60)-elapsed;if(remaining<=0)return{sec:remaining,stage:'over'};if(remaining<=30)return{sec:remaining,stage:'urgent'};if(remaining<=90)return{sec:remaining,stage:'prepare'};if(remaining<=180)return{sec:remaining,stage:'find'};return{sec:remaining,stage:'normal'}}

function openSenderForTable(tid,finishMode=false){let t=state.tables.find(x=>x.id===tid);if(!t)return;openUtility(t.no+'・送り指名',`<div class="notice">1回タップで仮選択、同じキャストを2回目で送り確定。確定済みは長押しで取り消し。${finishMode?'送りを選んだ後、下の「送り有り卓終了」で確定します。':''}</div><div class="sender-grid">${state.casts.filter(c=>c.working).map(c=>{let on=t.senders.includes(c.id),pending=t.senderPending.includes(c.id);return`<button class="sender-btn ${on?'on':pending?'pending':''}" data-sender="${c.id}">${esc(c.name)}<br><small>${on?'送り確定':pending?'もう一度で確定':'送り'+c.sends}</small></button>`}).join('')}</div><p class="hint">確定 ${(t.senders||[]).length}/${t.guests}</p>${finishMode?`<button class="danger" id="finishWithSend" style="width:100%;margin-top:10px" ${(t.senders||[]).length?'':'disabled'}>送り有り卓終了</button>`:''}`);document.querySelectorAll('[data-sender]').forEach(b=>{let cid=b.dataset.sender;bindLong(b,()=>removeSender(t,cid,finishMode));b.onclick=()=>toggleSender(t,cid,finishMode)});let finish=document.querySelector('#finishWithSend');if(finish)finish.onclick=()=>{closeUtility();finalizeTable(t,'withSend')}}
function toggleSender(t,cid,finishMode=false){if(t.senders.includes(cid))return;if(t.senderPending.includes(cid)){t.senderPending=t.senderPending.filter(id=>id!==cid);t.senders.push(cid);let c=state.casts.find(x=>x.id===cid);if(c)c.sends++;state.history.push({type:'send',cast:cid,table:t.id,castName:c?.name||'',tableNo:t.no,at:now()});toast((c?.name||'')+' 送り確定')}else t.senderPending.push(cid);save();openSenderForTable(t.id,finishMode);render()}

function seatGroupsForTable(tid){
 const seats=state.history.filter(h=>h.type==='seat'&&h.table===tid).sort((a,b)=>(Number(a.at)||0)-(Number(b.at)||0)||(Number(a.slot)||0)-(Number(b.slot)||0));
 const groups=[];
 seats.forEach(h=>{
   const key=(h.turn!=null?'turn:'+h.turn:'time:'+Math.floor((Number(h.at)||0)/3000));
   let g=groups.find(x=>x.key===key);
   if(!g){g={key,turn:h.turn||groups.length+1,at:Number(h.at)||0,members:[]};groups.push(g)}
   if(!g.members.some(m=>m.cast===h.cast))g.members.push(h);
 });
 return groups;
}
function allSeatGroups(){
 // 稼働中の卓一覧ではなく履歴そのものから生成する。
 // 卓終了で state.tables から削除されても、着席履歴と営業集計に残る。
 const map=new Map();
 state.history.filter(h=>h.type==='seat').forEach(h=>{
   const tableId=h.table||h.tableId||'';
   const turn=Number(h.turn||h.group||1);
   const key=tableId+'|'+turn;
   if(!map.has(key))map.set(key,{table:tableId,tableNo:h.tableNo||tableNo(tableId)||'卓',turn,at:Number(h.at)||0,members:[]});
   const g=map.get(key);
   g.at=Math.min(g.at||Number(h.at)||0,Number(h.at)||0);
   if(!g.members.some(m=>m.cast===h.cast))g.members.push(h);
 });
 return [...map.values()].sort((a,b)=>b.at-a.at);
}

}

function showBusinessSummary(){let seats=state.history.filter(h=>h.type==='seat'),rows=state.casts.map(c=>{let hs=seats.filter(h=>h.cast===c.id),sessions=[...new Map(hs.map(h=>[h.table||h.tableId||((h.tableNo||'卓')+'|'+h.at),h.tableNo||tableNo(h.table)||'卓'])).entries()],tables=sessions.map(x=>x[1]),last=hs.length?Math.max(...hs.map(h=>Number(h.at)||0)):0;return{c,tableCount:sessions.length,seatCount:hs.length,tables,last}}).sort((a,b)=>b.tableCount-a.tableCount||b.seatCount-a.seatCount||(a.c.order??0)-(b.c.order??0));let totalTables=new Set(seats.map(h=>h.table||h.tableId||((h.tableNo||'卓')+'|'+h.at))).size,totalSeats=seats.length;openUtility('営業集計',`<div class="notice">卓終了後も着席履歴は残ります。同じ卓番に新しいお客様をご案内した場合も、別の1卓として集計します。着席回数は実際に着席した回数です。</div><div class="row" style="margin-top:10px"><div class="info-card" style="text-align:center"><small>着席した卓</small><div style="font-size:25px;font-weight:950">${totalTables}</div></div><div class="info-card" style="text-align:center"><small>総着席回数</small><div style="font-size:25px;font-weight:950">${totalSeats}</div></div></div><div class="info-card" style="margin-top:10px">${rows.map((r,i)=>`<div class="list-row"><span class="count-badge">${i+1}</span><div class="list-main"><b>${esc(r.c.name)}　${r.tableCount}卓</b><small>${r.tables.length?esc(r.tables.join('・')):'着席なし'}${r.seatCount?`／着席${r.seatCount}回`:''}</small></div><strong style="font-size:19px">${r.tableCount}</strong></div>`).join('')}</div><button class="danger" id="summaryResetSeatHistory" style="width:100%;margin-top:10px">着席履歴リセット</button>`);document.querySelector('#summaryResetSeatHistory').onclick=()=>{resetSeatHistory();showBusinessSummary()}}

document.querySelector('#bulkAddCastMenu').onclick=openBulkAdd;document.querySelector('#addCastMenu').onclick=()=>castForm();document.querySelector('#castManageMenu').onclick=openCastManage;document.querySelector('#bulkCastManageMenu').onclick=openBulkManage;document.querySelector('#bulkColorMenu').onclick=openBulkColor;document.querySelector('#castSortMenu').onclick=openCastSort;document.querySelector('#restrictionMenu').onclick=openRestrictions;document.querySelector('#sendingMenu').onclick=openSending;document.querySelector('#summaryMenu').onclick=showBusinessSummary;document.querySelector('#historyMenu').onclick=showHistory;document.querySelector('#backupMenu').onclick=backup;document.querySelector('#importMenu').onclick=()=>document.querySelector('#importInput').click();document.querySelector('#endBusinessMenu').onclick=endBusiness;document.querySelector('#resetTableMenu').onclick=resetTableData;document.querySelector('#restoreTableMenu').onclick=restoreTableData;
document.querySelector('#importInput').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{state=normalize(JSON.parse(r.result));save();render();toast('データを復元しました')}catch{toast('復元できないファイルです')}};r.readAsText(f);e.target.value=''};
setInterval(()=>{processAutoSwaps();render()},1000);render();
</script>
