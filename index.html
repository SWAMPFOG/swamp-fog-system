<title>SWAMP-FLOW Ver.10.7</title>
<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}button,input,select{font:inherit;color:inherit}button{border:0}body{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom))}.hidden{display:none!important}
header{position:sticky;top:0;z-index:20;background:rgba(9,10,12,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 14px 10px}.brand{display:flex;align-items:center;justify-content:space-between}.brand h1{font-size:17px;margin:0;letter-spacing:.08em}.clock{font-size:12px;color:var(--muted)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}.metric{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:7px;text-align:center}.metric b{display:block;font-size:16px}.metric small{color:var(--muted);font-size:10px}
.alerts{padding:10px 12px 2px}.alert-title{font-size:12px;color:var(--muted);margin:0 2px 7px}.alert-strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}.alert-strip::-webkit-scrollbar{display:none}.alert-card{min-width:170px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left}.alert-card.prepare{border-color:#765f1a;background:#211d10}.alert-card.urgent{border-color:#8a4d18;background:#28170d}.alert-card.over{border-color:#7b2429;background:#291013;animation:pulse 1.2s infinite}.alert-top{display:flex;justify-content:space-between;align-items:center}.alert-table{font-weight:800;font-size:17px}.alert-plan{font-size:11px;padding:3px 6px;border-radius:999px;background:#ffffff16}.alert-time{font-size:25px;font-variant-numeric:tabular-nums;font-weight:900;margin:6px 0 2px}.alert-next{font-size:11px;color:#d4d7dc}.swap-now{width:100%;margin-top:8px;padding:8px 10px;border-radius:9px;background:#b52b34;color:#fff;font-size:12px;font-weight:900}.swap-flow{font-size:11px;color:#ffd4d7;margin-top:5px}@keyframes pulse{50%{box-shadow:0 0 0 3px #ff5e6830}}
main{padding:8px 12px 22px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:12px 2px 7px}.section-head h2{font-size:13px;margin:0;color:#dfe2e7}.section-head span{font-size:11px;color:var(--muted)}.rank{margin-bottom:12px}.cast-list{display:grid;gap:7px}.cast{width:100%;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 12px;text-align:left;position:relative;overflow:hidden}.cast::before{content:"";width:4px;align-self:stretch;border-radius:4px;background:var(--team,#666)}.cast-main{min-width:0;flex:1}.cast-name{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cast-sub{font-size:11px;color:var(--muted);margin-top:2px}.cast-state{font-size:12px;font-weight:800;padding:6px 8px;border-radius:999px;background:#ffffff10;white-space:nowrap}.cast.available .cast-state{color:var(--green);background:#56e58e15}.cast.seated .cast-state{color:var(--blue);background:#68b4ff15}.cast.preparing .cast-state{color:var(--yellow);background:#ffd25718}.cast.done,.cast.blocked{opacity:.42}.cast.done .cast-state{color:#d6d6d6}.cast.blocked .cast-state{color:var(--red)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:40;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(4,1fr);background:rgba(16,17,20,.97);border-top:1px solid var(--line);backdrop-filter:blur(16px)}nav button{background:transparent;color:var(--muted);font-size:11px;font-weight:700}nav button.active{color:#fff}nav b{display:block;font-size:20px;margin-bottom:2px}
.sheet{position:fixed;inset:0;z-index:60;background:#0008;display:flex;align-items:flex-end}.sheet-panel{width:100%;max-height:88vh;overflow:auto;background:#111318;border-radius:22px 22px 0 0;border-top:1px solid #343943;padding:10px 12px calc(18px + env(safe-area-inset-bottom))}.handle{width:44px;height:4px;background:#4a4f58;border-radius:4px;margin:0 auto 12px}.sheet-head{display:flex;justify-content:space-between;align-items:center}.sheet-head h3{margin:0;font-size:17px}.close{width:34px;height:34px;border-radius:50%;background:#ffffff10}.hint{font-size:11px;color:var(--muted);margin:6px 0 12px}.table-scroll{display:flex;gap:9px;overflow-x:auto;padding:2px 1px 10px;scroll-snap-type:x proximity}.table-card{position:relative;min-width:148px;scroll-snap-align:start;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:11px;text-align:left}.table-card.selected{border-color:var(--blue);background:#132339}.table-card.refused{border-color:#6d282e;background:#261114;opacity:.72}.table-line{display:flex;justify-content:space-between;align-items:center}.table-no{font-size:22px;font-weight:900}.plan{font-size:12px;font-weight:800;background:#ffffff12;padding:4px 7px;border-radius:8px}.entry{font-size:12px;color:#c7cbd2;margin-top:8px}.t-time{font-size:25px;font-weight:900;font-variant-numeric:tabular-nums;margin:7px 0 2px}.meta{font-size:11px;color:var(--muted);line-height:1.5}.reason{font-size:11px;color:#ffe39c;margin-top:7px;min-height:30px}.refuse{width:100%;margin-top:9px;padding:8px;border-radius:9px;background:#4b1b20;color:#ffabb0;font-size:11px;font-weight:800}.tap-note{position:absolute;inset:auto 8px 8px 8px;text-align:center;background:#68b4ff;color:#071523;border-radius:8px;padding:6px;font-size:11px;font-weight:900}.toast{position:fixed;z-index:100;left:50%;bottom:calc(var(--nav) + 18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#f6f7f9;color:#101216;border-radius:999px;padding:9px 14px;font-size:12px;font-weight:800;box-shadow:0 8px 30px #0008;max-width:88%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page{padding:10px 12px}.page h2{font-size:17px}.table-list{display:grid;gap:9px}.info-card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:12px}.info-top{display:flex;justify-content:space-between;align-items:center}.info-top strong{font-size:18px}.mini-actions{display:flex;gap:7px;margin-top:10px}.mini-actions button,.primary,.secondary,.danger{padding:10px 12px;border-radius:10px;font-weight:800}.primary{background:var(--blue);color:#08131d}.secondary{background:#ffffff12}.danger{background:#4b1b20;color:#ffabb0}.form{display:grid;gap:9px}.form label{font-size:11px;color:var(--muted)}.form input,.form select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fab{position:fixed;right:16px;bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;background:var(--blue);color:#07131e;font-size:28px;font-weight:500;box-shadow:0 8px 24px #0009}

.menu-section{margin:14px 0 18px}.menu-section h3{margin:0 2px 7px;font-size:12px;color:var(--muted);letter-spacing:.08em}.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:8px}.menu-grid button{min-height:54px;border-radius:13px;background:var(--panel2);border:1px solid var(--line);font-size:13px;font-weight:850;display:flex;align-items:center;justify-content:center;padding:10px}.menu-grid button span{font-size:13px;font-weight:850;line-height:1.25}.menu-grid button small{display:block;font-size:10px;color:var(--muted);margin-top:4px;font-weight:700}.menu-grid .priority-menu{min-height:70px;display:block;text-align:left;padding:12px 14px;background:#14283a;border-color:#3d79a8;box-shadow:0 0 0 1px #68b4ff22 inset}.menu-grid .priority-menu span{display:block;font-size:16px;color:#bdddff}.menu-grid .priority-menu small{color:#8ebce4}.release-chip{display:inline-flex;margin-top:7px;padding:5px 9px;border-radius:8px;background:#4b1b20;color:#ffabb0;font-size:11px;font-weight:850}.timer-preview{border:1px solid var(--line);background:#0e1115;border-radius:12px;padding:10px;line-height:1.6}.timer-preview b{font-size:18px}.drag-list{display:grid;gap:8px}.drag-item{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid var(--line);background:var(--panel2);border-radius:11px}.drag-handle{font-size:20px;color:var(--muted)}.menu-grid .danger-menu{background:#2a1417;border-color:#5f292f;color:#ffabb0}.menu-grid button.confirming{background:#503f12;border-color:#c39a24;color:#ffe18b}.menu-grid .full{grid-column:1/-1}nav button{position:relative;border-radius:12px;margin:7px 5px;padding:5px 2px}nav button.active{background:#ffffff10}nav button span{display:block;font-size:10px;margin-top:1px}.list-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.list-row:last-child{border-bottom:0}.list-main{flex:1;min-width:0}.list-main b{display:block}.list-main small{display:block;color:var(--muted);margin-top:3px}.tag{display:inline-block;font-size:10px;border-radius:999px;padding:3px 6px;background:#ffffff12;margin:2px 3px 0 0}.tag.red{color:#ffabb0;background:#4b1b20}.tag.blue{color:#a8d4ff;background:#18334d}.icon-btn{width:38px;height:38px;border-radius:10px;background:#ffffff10}.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.switch-row input{width:22px;height:22px}.sender-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:9px}.sender-btn{padding:10px;border-radius:10px;background:#ffffff10;border:1px solid var(--line);font-weight:800}.sender-btn.on{background:#1c3a2a;border-color:#3a8b5d;color:#8af0ad}.sender-btn.pending{background:#3b3218;border-color:#8c762e;color:#ffe18b}.full{grid-column:1/-1}.notice{border:1px solid #66531d;background:#211c0d;border-radius:12px;padding:10px;color:#ffe49b;font-size:12px;line-height:1.5}.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.modal-actions.three{grid-template-columns:1fr 1fr 1fr}.history-item{padding:10px 0;border-bottom:1px solid var(--line)}.history-item b{font-size:14px}.history-item small{display:block;color:var(--muted);margin-top:4px}.count-badge{min-width:26px;text-align:center;border-radius:999px;padding:4px 7px;background:#ffffff12;font-size:11px;font-weight:900}.blocked-reason{font-size:10px;color:#ffabb0;margin-top:3px}.form textarea{width:100%;min-height:110px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px;color:#fff}
</style>
</head>
<body>
<header><div class="brand"><h1>SWAMP-FLOW</h1><span class="clock" id="clock"></span></div><div class="summary"><div class="metric"><b id="mTables">0</b><small>稼働卓</small></div><div class="metric"><b id="mSeated">0</b><small>着席中</small></div><div class="metric"><b id="mAlerts">0</b><small>準備アラート</small></div></div></header>
<section id="homePage">
<div class="alerts"><p class="alert-title">次の着席準備</p><div class="alert-strip" id="alerts"></div></div>
<main id="casts"></main>
</section>
<section id="tablesPage" class="page hidden"><h2>卓設定・稼働状況</h2><div id="tableList" class="table-list"></div><button class="fab" id="addTable">＋</button></section>
<section id="statusPage" class="page hidden"><h2>営業状況</h2><div id="statusList" class="table-list"></div></section>
<section id="menuPage" class="page hidden"><h2>メニュー</h2>
<div class="menu-section"><h3>営業操作</h3><div class="menu-grid">
<button id="restrictionMenu" class="priority-menu"><span>制限設定</span><small>着席制限を変更</small></button><button id="sendingMenu" class="priority-menu"><span>送り設定</span><small>送り指名を登録</small></button>
<button id="historyMenu"><span>着席履歴</span></button><button id="endBusinessMenu" class="danger-menu"><span>営業終了</span></button>
</div></div>
<div class="menu-section"><h3>キャスト管理</h3><div class="menu-grid">
<button id="addCastMenu"><span>キャスト追加</span></button><button id="bulkAddCastMenu"><span>キャストまとめて追加</span></button>
<button id="castManageMenu"><span>キャスト管理</span></button><button id="bulkCastManageMenu"><span>キャストまとめて管理</span></button>
<button id="bulkColorMenu"><span>キャスト色一括管理</span></button><button id="castSortMenu"><span>キャスト一括並び替え</span></button>
</div></div>
<div class="menu-section"><h3>データ管理</h3><div class="menu-grid">
<button id="backupMenu"><span>バックアップ</span></button><button id="importMenu"><span>データ復元</span></button>
<button id="resetTableMenu" class="danger-menu"><span>卓データリセット</span></button><button id="restoreTableMenu"><span>卓データ復元</span></button>
</div><p class="hint">卓データ復元は同じボタンを2回タップすると決定します。</p></div>
<div class="info-card" style="margin-top:10px"><b>操作</b><p class="hint">キャスト名 → 卓候補 → 卓を1回タップで準備、同じ卓を2回目で着席確定。着席・準備・拒否は長押しで取り消せます。</p></div></section>
<nav><button data-page="home" class="active"><b>人</b><span>キャスト</span></button><button data-page="tables"><b>卓</b><span>卓設定</span></button><button data-page="status"><b>状</b><span>状況</span></button><button data-page="menu"><b>≡</b><span>メニュー</span></button></nav>
<div id="sheet" class="sheet hidden"><div class="sheet-panel"><div class="handle"></div><div class="sheet-head"><h3 id="sheetTitle"></h3><button class="close" id="closeSheet">×</button></div><p class="hint">卓カードを1回タップで選択、同じ卓をもう1回タップで着席確定。長押しで取消。</p><div class="table-scroll" id="candidates"></div></div></div>
<div id="tableModal" class="sheet hidden"><div class="sheet-panel"><div class="handle"></div><div class="sheet-head"><h3 id="modalTitle">卓を追加</h3><button class="close" id="closeModal">×</button></div><div class="form"><div class="row"><label>卓番<input id="fNo" placeholder="S1"></label><label>プラン<select id="fPlan"><option>A</option><option selected>B</option><option>VIP</option><option>お連れ様</option></select></label></div><div class="row"><label>入店時間<input id="fEntry" type="time"></label><label>お客様人数<input id="fGuests" type="number" min="1" value="2"></label></div><div id="companionOwnerWrap" class="hidden"><label>お連れ様担当キャスト<select id="fOwner"></select></label></div><div class="row"><label>1回の回し人数<select id="fRotation"><option value="1">1人回し</option><option value="2" selected>2人回し（原則）</option><option value="3">3人回し</option></select></label><label>タイマー方式<select id="fTimerMode"><option value="auto">自動計算</option><option value="manual">手動設定</option></select></label></div><div class="row"><label>完走目標（分）<input id="fTarget" type="number" min="30" max="50" value="50"></label><label>手動タイマー（分）<input id="fCycle" type="number" min="1" max="10" step="0.1" value="3"></label></div><div class="row"><label>準備アラート（秒前）<input id="fLead" type="number" min="30" value="90"></label><label>原則<input value="2人回し" disabled></label></div><div id="timerPreview" class="timer-preview"></div><button class="primary" id="saveTable">保存</button></div></div></div>
<div id="utilityModal" class="sheet hidden"><div class="sheet-panel"><div class="handle"></div><div class="sheet-head"><h3 id="utilityTitle"></h3><button class="close" id="closeUtility">×</button></div><div id="utilityBody"></div></div></div><input id="importInput" type="file" accept="application/json" class="hidden"><div id="toast" class="toast hidden"></div>
<script>
const KEY='swamp-flow-v10.5',OLD_KEY='swamp-flow-v10.3',TABLE_SNAPSHOT_KEY='swamp-flow-table-snapshot-v10.5';
const sample={casts:[
{id:'c1',name:'れい',rank:'S',team:'#9b6cff'},{id:'c2',name:'ゆうせい',rank:'S',team:'#4fc3f7'},{id:'c3',name:'のあ',rank:'S',team:'#ff7da8'},{id:'c4',name:'たいが',rank:'A',team:'#65d58a'},{id:'c5',name:'かぐや',rank:'A',team:'#ffd15c'},{id:'c6',name:'りょうすけ',rank:'B',team:'#ff9966'},{id:'c7',name:'なつき',rank:'C',team:'#7da1ff'}],tables:[],refusals:{},history:[],settings:{sendLimit:2}};
let state=load(),selectedCast=null,selectedTable=null,editTableId=null,longTimer=null;
function clone(x){return JSON.parse(JSON.stringify(x))}
function normalize(s){s=s&&typeof s==='object'?s:clone(sample);s.casts=Array.isArray(s.casts)?s.casts:[];s.tables=Array.isArray(s.tables)?s.tables:[];s.refusals=s.refusals||{};s.history=Array.isArray(s.history)?s.history:[];s.settings={sendLimit:2,...(s.settings||{})};s.casts.forEach((c,i)=>Object.assign(c,{id:c.id||'c'+Date.now()+i,rank:c.rank||'C',team:c.team||'#777777',working:c.working!==false,sends:Number(c.sends)||0,penalty:!!c.penalty,inHouse:!!c.inHouse,ngTables:Array.isArray(c.ngTables)?c.ngTables:[],currentTable:c.currentTable||null,preparingFor:c.preparingFor||null,order:Number.isFinite(c.order)?c.order:i}));s.tables.forEach(t=>{let companion=t.plan==='お連れ様';Object.assign(t,{active:t.active!==false,seated:Array.isArray(t.seated)?t.seated:[],senders:Array.isArray(t.senders)?t.senders:[],senderPending:Array.isArray(t.senderPending)?t.senderPending:[],lastSeatAt:t.lastSeatAt||null,ownerId:t.ownerId||'',timerMode:t.timerMode||'manual',targetMin:Number(t.targetMin)||(companion?45:50),cycleSec:Number(t.cycleSec)||Math.round((Number(t.cycle)||(companion?5:3))*60),lead:Number(t.lead)||90,rotationSize:[1,2,3].includes(Number(t.rotationSize))?Number(t.rotationSize):2,currentCastIds:Array.isArray(t.currentCastIds)?t.currentCastIds:(t.currentCastId?[t.currentCastId]:[]),groupNo:Number(t.groupNo)||0,autoHandledAt:Number(t.autoHandledAt)||0});delete t.currentCastId;t.cycle=t.cycleSec/60});return s}
function load(){try{let raw=localStorage.getItem(KEY)||localStorage.getItem(OLD_KEY);return normalize(raw?JSON.parse(raw):clone(sample))}catch{return normalize(clone(sample))}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function now(){return Date.now()} function pad(n){return String(n).padStart(2,'0')} function hm(t){let d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())}
function fmt(sec){let neg=sec<0;sec=Math.abs(Math.floor(sec));return(neg?'+':'')+Math.floor(sec/60)+':'+pad(sec%60)}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(s){let e=document.querySelector('#toast');e.textContent=s;e.classList.remove('hidden');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.add('hidden'),1900)}
function tablePhase(t){if(!t.active)return null;if(!t.lastSeatAt)return{sec:0,stage:'idle'};let elapsed=(now()-t.lastSeatAt)/1000,remaining=(t.cycleSec||t.cycle*60)-elapsed;if(remaining<=0)return{sec:remaining,stage:'over'};if(remaining<=30)return{sec:remaining,stage:'urgent'};if(remaining<=90)return{sec:remaining,stage:'prepare'};return{sec:remaining,stage:'normal'}}
function isCompanion(t){return t.plan==='お連れ様'}
function staticBlockReason(c,t){if(!c.working)return'本日休み';if((t.seated||[]).includes(c.id))return'着席済み';if(state.refusals[c.id+'|'+t.id])return'着席拒否';if(c.ngTables.includes(t.id))return'卓別NG';if(isCompanion(t)&&t.ownerId===c.id)return'お連れ様担当本人';if(t.plan==='VIP'&&!['S','A'].includes(c.rank))return'VIP対象外';if(c.penalty&&!isCompanion(t)&&t.plan!=='VIP')return'勤怠ペナルティ';if(c.inHouse&&!isCompanion(t)&&t.plan!=='VIP')return'場内中';if(c.sends>=state.settings.sendLimit&&!isCompanion(t)&&t.plan!=='VIP')return'送り上限';return''}
function eligibleCountFor(plan,ownerId=''){let temp={id:'preview',plan,ownerId,seated:[]};return state.casts.filter(c=>!staticBlockReason(c,temp)).length}
function tableStats(t){let total=state.casts.filter(c=>!staticBlockReason(c,t)).length,done=(t.seated||[]).length,remaining=Math.max(0,total-done),size=t.rotationSize||2,totalTurns=Math.ceil(total/size),doneTurns=Math.floor(done/size),remainingTurns=Math.ceil(remaining/size);return{total,done,remaining,size,totalTurns,doneTurns,remainingTurns}}
function calculateCycleSec(plan,targetMin,count,rotationSize=2){let fallback=plan==='お連れ様'?300:180,turns=Math.ceil(count/Math.max(1,rotationSize));if(!turns)return fallback;return Math.max(60,Math.min(600,Math.round(targetMin*60/turns)))}
function cycleLabel(t){let sec=Math.round(t.cycleSec||t.cycle*60),m=Math.floor(sec/60),r=sec%60;return r?m+'分'+r+'秒':m+'分'}
function blockReason(c,t){if(!c.working)return'本日休み';if(c.currentTable)return'着席中';if((t.seated||[]).includes(c.id))return'着席済み';if(state.refusals[c.id+'|'+t.id])return'着席拒否';if(c.ngTables.includes(t.id))return'卓別NG';if(isCompanion(t)&&t.ownerId===c.id)return'お連れ様担当本人';if(t.plan==='VIP'&&!['S','A'].includes(c.rank))return'VIP対象外';if(c.penalty&&!isCompanion(t)&&t.plan!=='VIP')return'勤怠ペナルティ';if(c.inHouse&&!isCompanion(t)&&t.plan!=='VIP')return'場内中';if(c.sends>=state.settings.sendLimit&&!isCompanion(t)&&t.plan!=='VIP')return'送り上限';return''}
function eligible(c,t){return !!t.active&&!blockReason(c,t)}

function castState(c){if(!c.working)return['blocked','休み'];if(c.preparingFor)return['preparing','準備中 '+tableNo(c.preparingFor)];if(c.currentTable)return['seated','着席 '+tableNo(c.currentTable)];let n=candidatesFor(c).length;if(!state.tables.some(t=>t.active))return['blocked','対象なし'];if(n===0)return['done','完走'];return['available','残'+n+'卓']}
function tableNo(id){return state.tables.find(t=>t.id===id)?.no||''}
function preparedForTable(t){return state.casts.filter(c=>c.preparingFor===t.id&&!c.currentTable&&!blockReason(c,t)).slice(0,t.rotationSize||2)}
function completeSwap(t,source='auto'){
 if(!t||!t.active)return false;
 let next=preparedForTable(t),current=(t.currentCastIds||[]).map(id=>state.casts.find(c=>c.id===id)).filter(Boolean);
 if(!next.length){if(source==='manual')toast('準備中のキャストがいません');return false}
 let stamp=now();
 current.forEach(previous=>{
   previous.currentTable=null;previous.preparingFor=null;
   state.history.push({type:'leave',cast:previous.id,table:t.id,castName:previous.name,tableNo:t.no,group:t.groupNo||1,at:stamp,reason:'交代'});
 });
 t.currentCastIds=[];t.groupNo=(t.groupNo||0)+1;
 next.forEach((c,i)=>{
   c.currentTable=t.id;c.preparingFor=null;t.currentCastIds.push(c.id);
   t.seated=t.seated||[];if(!t.seated.includes(c.id))t.seated.push(c.id);
   state.history.push({type:'seat',cast:c.id,table:t.id,castName:c.name,tableNo:t.no,turn:t.groupNo,slot:i+1,at:stamp,source});
 });
 t.lastSeatAt=stamp;t.autoHandledAt=stamp;
 save();
 if(navigator.vibrate)navigator.vibrate([70,40,70]);
 toast((current.map(c=>c.name).join('・')||'空席')+' → '+next.map(c=>c.name).join('・')+' 交代完了');
 return true
}
function processAutoSwaps(){
 let changed=false;
 state.tables.filter(t=>t.active&&t.lastSeatAt).forEach(t=>{
   let p=tablePhase(t);
   if(p&&p.stage==='over'&&preparedForTable(t).length&&(!t.autoHandledAt||t.autoHandledAt<t.lastSeatAt)){
     if(completeSwap(t,'auto'))changed=true;
   }
 });
 return changed
}

function openUtility(title,html){document.querySelector('#utilityTitle').textContent=title;document.querySelector('#utilityBody').innerHTML=html;document.querySelector('#utilityModal').classList.remove('hidden')}
function closeUtility(){document.querySelector('#utilityModal').classList.add('hidden')}
function castForm(c={}){openUtility(c.id?'キャスト編集':'キャスト追加',`<div class="form"><label>キャスト名<input id="uName" value="${esc(c.name||'')}"></label><div class="row"><label>ランク<select id="uRank">${['S','A','B','C'].map(r=>`<option ${c.rank===r?'selected':''}>${r}</option>`).join('')}</select></label><label>チーム色<input id="uTeam" type="color" value="${c.team||'#777777'}"></label></div><button class="primary" id="uSave">保存</button>${c.id?'<button class="danger" id="uDelete">削除</button>':''}</div>`);document.querySelector('#uSave').onclick=()=>{let name=document.querySelector('#uName').value.trim();if(!name){toast('名前を入力してください');return}if(c.id)Object.assign(c,{name,rank:document.querySelector('#uRank').value,team:document.querySelector('#uTeam').value});else state.casts.push(normalize({casts:[{id:'c'+Date.now(),name,rank:document.querySelector('#uRank').value,team:document.querySelector('#uTeam').value}],tables:[]}).casts[0]);save();closeUtility();render();toast(name+'を保存しました')};if(c.id)document.querySelector('#uDelete').onclick=()=>{if(!confirm(c.name+'を削除しますか？'))return;state.casts=state.casts.filter(x=>x.id!==c.id);state.tables.forEach(t=>{t.seated=t.seated.filter(id=>id!==c.id);t.senders=t.senders.filter(id=>id!==c.id)});save();closeUtility();render()}}
function openBulkAdd(){openUtility('キャストまとめて追加',`<div class="notice">1行に1名入力。名前だけでも追加できます。<br>形式：名前,ランク,色（例：れい,S,#9b6cff）</div><div class="form" style="margin-top:10px"><label>キャスト一覧<textarea id="bulkNames" rows="10" style="width:100%;resize:vertical;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px;color:var(--text)" placeholder="れい,S,#9b6cff\nたいが,A,#65d58a\nかぐや"></textarea></label><div class="row"><label>省略時ランク<select id="bulkRank"><option>S</option><option>A</option><option>B</option><option selected>C</option></select></label><label>省略時カラー<input id="bulkTeam" type="color" value="#777777"></label></div><button class="primary" id="bulkAddSave">まとめて追加</button></div>`);document.querySelector('#bulkAddSave').onclick=()=>{let lines=document.querySelector('#bulkNames').value.split(/\n/).map(x=>x.trim()).filter(Boolean),rank=document.querySelector('#bulkRank').value,team=document.querySelector('#bulkTeam').value;if(!lines.length){toast('キャスト名を入力してください');return}let added=0;lines.forEach((line,i)=>{let p=line.split(/[,，\t]/).map(x=>x.trim()),name=p[0],r=['S','A','B','C'].includes((p[1]||'').toUpperCase())?p[1].toUpperCase():rank,col=/^#[0-9a-fA-F]{6}$/.test(p[2]||'')?p[2]:team;if(!name||state.casts.some(c=>c.name===name))return;state.casts.push(normalize({casts:[{id:'c'+Date.now()+i,name,rank:r,team:col}],tables:[]}).casts[0]);added++});save();closeUtility();render();toast(added+'名を追加しました')}}
function castCheckList(selected=[]){return state.casts.map(c=>`<label class="switch-row"><span><b>${esc(c.name)}</b>　${c.rank}<small style="display:block;color:var(--muted)">${esc(restrictionsText(c)||'制限なし')}</small></span><input class="bulkCastCheck" type="checkbox" value="${c.id}" ${selected.includes(c.id)?'checked':''}></label>`).join('')||'<p class="hint">キャスト登録なし</p>'}
function selectedBulkIds(){return[...document.querySelectorAll('.bulkCastCheck:checked')].map(x=>x.value)}
function openBulkManage(){openUtility('キャストまとめて管理',`<div class="form"><div class="row"><button class="secondary" id="bulkAll">全選択</button><button class="secondary" id="bulkNone">全解除</button></div><div class="info-card">${castCheckList()}</div><label>一括ランク変更<select id="bulkManageRank"><option value="">変更しない</option><option>S</option><option>A</option><option>B</option><option>C</option></select></label><div class="row"><button class="secondary" id="bulkWorkingOn">出勤にする</button><button class="secondary" id="bulkWorkingOff">休みにする</button></div><button class="secondary" id="bulkClearTemp">一時制限を解除</button><button class="danger" id="bulkDelete">選択キャストを削除</button></div>`);document.querySelector('#bulkAll').onclick=()=>document.querySelectorAll('.bulkCastCheck').forEach(x=>x.checked=true);document.querySelector('#bulkNone').onclick=()=>document.querySelectorAll('.bulkCastCheck').forEach(x=>x.checked=false);let applyWorking=v=>{let ids=selectedBulkIds();state.casts.filter(c=>ids.includes(c.id)).forEach(c=>{c.working=v;if(!v){c.currentTable=null;c.preparingFor=null}});save();openBulkManage();render();toast(ids.length+'名を更新しました')};document.querySelector('#bulkWorkingOn').onclick=()=>applyWorking(true);document.querySelector('#bulkWorkingOff').onclick=()=>applyWorking(false);document.querySelector('#bulkClearTemp').onclick=()=>{let ids=selectedBulkIds();state.casts.filter(c=>ids.includes(c.id)).forEach(c=>Object.assign(c,{penalty:false,inHouse:false,ngTables:[]}));save();openBulkManage();render();toast('一時制限を解除しました')};document.querySelector('#bulkManageRank').onchange=e=>{if(!e.target.value)return;let ids=selectedBulkIds();state.casts.filter(c=>ids.includes(c.id)).forEach(c=>c.rank=e.target.value);save();openBulkManage();render();toast('ランクを変更しました')};document.querySelector('#bulkDelete').onclick=()=>{let ids=selectedBulkIds();if(!ids.length){toast('キャストを選択してください');return}if(!confirm(ids.length+'名を削除しますか？'))return;state.casts=state.casts.filter(c=>!ids.includes(c.id));state.tables.forEach(t=>{t.seated=t.seated.filter(id=>!ids.includes(id));t.senders=t.senders.filter(id=>!ids.includes(id));t.senderPending=t.senderPending.filter(id=>!ids.includes(id))});save();closeUtility();render();toast('削除しました')}}
function openBulkColor(){openUtility('キャスト色まとめて管理',`<div class="form"><div class="row"><button class="secondary" id="colorAll">全選択</button><button class="secondary" id="colorNone">全解除</button></div><div class="info-card">${castCheckList()}</div><label>変更する色<input id="bulkColorValue" type="color" value="#777777"></label><button class="primary" id="bulkColorSave">選択したキャストへ反映</button></div>`);document.querySelector('#colorAll').onclick=()=>document.querySelectorAll('.bulkCastCheck').forEach(x=>x.checked=true);document.querySelector('#colorNone').onclick=()=>document.querySelectorAll('.bulkCastCheck').forEach(x=>x.checked=false);document.querySelector('#bulkColorSave').onclick=()=>{let ids=selectedBulkIds(),col=document.querySelector('#bulkColorValue').value;if(!ids.length){toast('キャストを選択してください');return}state.casts.filter(c=>ids.includes(c.id)).forEach(c=>c.team=col);save();closeUtility();render();toast(ids.length+'名の色を変更しました')}}
function openCastSort(){let ordered=[...state.casts].sort((a,b)=>(a.order??0)-(b.order??0));openUtility('キャスト一括並び替え',`<p class="hint">右側の上下ボタンで営業中の表示順を変更します。ランク内ではこの順番が反映されます。</p><div class="drag-list">${ordered.map((c,i)=>`<div class="drag-item"><span class="drag-handle">≡</span><div class="list-main"><b>${esc(c.name)}</b><small>${c.rank}ランク</small></div><button class="icon-btn" data-up="${c.id}">↑</button><button class="icon-btn" data-down="${c.id}">↓</button></div>`).join('')}</div>`);document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>moveCastOrder(b.dataset.up,-1));document.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>moveCastOrder(b.dataset.down,1))}
function moveCastOrder(id,dir){let arr=[...state.casts].sort((a,b)=>(a.order??0)-(b.order??0)),i=arr.findIndex(c=>c.id===id),j=i+dir;if(i<0||j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];arr.forEach((c,k)=>c.order=k);save();openCastSort();render()}
function makeTableSnapshot(){let snap={tables:clone(state.tables),refusals:clone(state.refusals),history:clone(state.history),casts:state.casts.map(c=>({id:c.id,currentTable:c.currentTable,preparingFor:c.preparingFor,ngTables:clone(c.ngTables)})),savedAt:now()};localStorage.setItem(TABLE_SNAPSHOT_KEY,JSON.stringify(snap))}
function resetTableData(){if(!confirm('卓データをリセットしますか？\n直前データは「卓データ復元」から戻せます。'))return;makeTableSnapshot();state.tables=[];state.refusals={};state.history=[];state.casts.forEach(c=>{c.currentTable=null;c.preparingFor=null;c.ngTables=[]});save();render();toast('卓データをリセットしました')}
let restoreTapTimer=null,restoreArmed=false;
function restoreTableData(){let btn=document.querySelector('#restoreTableMenu');if(!localStorage.getItem(TABLE_SNAPSHOT_KEY)){toast('復元できる卓データがありません');return}if(!restoreArmed){restoreArmed=true;btn.classList.add('confirming');btn.querySelector('span').textContent='もう一度タップで決定';toast('もう一度タップすると復元します');clearTimeout(restoreTapTimer);restoreTapTimer=setTimeout(()=>{restoreArmed=false;btn.classList.remove('confirming');btn.querySelector('span').textContent='卓データ復元'},3500);return}clearTimeout(restoreTapTimer);restoreArmed=false;try{let snap=JSON.parse(localStorage.getItem(TABLE_SNAPSHOT_KEY));state.tables=snap.tables||[];state.refusals=snap.refusals||{};state.history=snap.history||[];(snap.casts||[]).forEach(x=>{let c=state.casts.find(y=>y.id===x.id);if(c){c.currentTable=x.currentTable||null;c.preparingFor=x.preparingFor||null;c.ngTables=x.ngTables||[]}});state=normalize(state);save();render();toast('卓データを復元しました')}catch{toast('卓データを復元できませんでした')}btn.classList.remove('confirming');btn.querySelector('span').textContent='卓データ復元'}
function openCastManage(){openUtility('キャスト管理',`<div class="info-card">${state.casts.map(c=>`<div class="list-row"><span style="width:5px;height:38px;border-radius:5px;background:${c.team}"></span><div class="list-main"><b>${esc(c.name)}　${c.rank}</b><small>${esc(restrictionsText(c)||'制限なし')}／送り${c.sends}</small></div><button class="icon-btn" data-castedit="${c.id}">編集</button></div>`).join('')||'登録なし'}</div>`);document.querySelectorAll('[data-castedit]').forEach(b=>b.onclick=()=>castForm(state.casts.find(c=>c.id===b.dataset.castedit)))}
function openRestrictions(){openUtility('制限設定',`<div class="notice">制限は着席候補へ即時反映されます。VIP・お連れ様は一部制限の例外です。</div><div class="info-card" style="margin-top:10px">${state.casts.map(c=>`<div class="list-row"><div class="list-main"><b>${esc(c.name)}　${c.rank}</b><small>${esc(restrictionsText(c)||'制限なし')}</small></div><button class="icon-btn" data-restrict="${c.id}">設定</button></div>`).join('')}</div>`);document.querySelectorAll('[data-restrict]').forEach(b=>b.onclick=()=>openRestrictionCast(b.dataset.restrict))}
function openRestrictionCast(cid){let c=state.casts.find(x=>x.id===cid);openUtility(c.name+'・制限',`<div class="notice">遅刻・欠勤などの勤怠上の制限は「勤怠ペナルティ」にまとめて設定します。</div><div class="form" style="margin-top:10px"><div class="switch-row"><span>本日出勤</span><input id="rWorking" type="checkbox" ${c.working?'checked':''}></div><div class="switch-row"><span>勤怠ペナルティ<br><small style="color:var(--muted)">遅刻・欠勤などを含む</small></span><input id="rPenalty" type="checkbox" ${c.penalty?'checked':''}></div><div class="switch-row"><span>場内中</span><input id="rInHouse" type="checkbox" ${c.inHouse?'checked':''}></div><label>送り数<input id="rSends" type="number" min="0" value="${c.sends}"></label><div><b>卓別NG</b>${state.tables.filter(t=>t.active).map(t=>`<label class="switch-row"><span>${esc(t.no)} ${esc(t.plan)}</span><input class="rNg" type="checkbox" value="${t.id}" ${c.ngTables.includes(t.id)?'checked':''}></label>`).join('')||'<p class="hint">稼働卓なし</p>'}</div><button class="primary" id="rSave">保存</button></div>`);document.querySelector('#rSave').onclick=()=>{c.working=document.querySelector('#rWorking').checked;c.penalty=document.querySelector('#rPenalty').checked;c.inHouse=document.querySelector('#rInHouse').checked;c.sends=+document.querySelector('#rSends').value||0;c.ngTables=[...document.querySelectorAll('.rNg:checked')].map(x=>x.value);if(!c.working){c.currentTable=null;c.preparingFor=null}save();closeUtility();render();toast('制限を保存しました')}}
function openSending(){openUtility('送り設定',`<div class="notice">送り指名が客数に達すると卓を自動終了し、選ばれたキャストの送り数を加算します。</div><div class="info-card" style="margin-top:10px">${state.tables.filter(t=>t.active).map(t=>`<div class="list-row"><div class="list-main"><b>${esc(t.no)}　${esc(t.plan)}</b><small>送り ${(t.senders||[]).length}/${t.guests}</small></div><button class="icon-btn" data-sending="${t.id}">設定</button></div>`).join('')||'稼働卓なし'}</div>`);document.querySelectorAll('[data-sending]').forEach(b=>b.onclick=()=>openSenderForTable(b.dataset.sending))}
function openSenderForTable(tid){let t=state.tables.find(x=>x.id===tid);openUtility(t.no+'・送り指名',`<div class="notice">1回タップで仮選択、同じキャストを2回目で送り確定。確定済みは長押しで取り消し。</div><div class="sender-grid">${state.casts.filter(c=>c.working).map(c=>{let on=t.senders.includes(c.id),pending=t.senderPending.includes(c.id);return`<button class="sender-btn ${on?'on':pending?'pending':''}" data-sender="${c.id}">${esc(c.name)}<br><small>${on?'送り確定':pending?'もう一度で確定':'送り'+c.sends}</small></button>`}).join('')}</div><p class="hint">確定 ${(t.senders||[]).length}/${t.guests}</p>`);document.querySelectorAll('[data-sender]').forEach(b=>{let cid=b.dataset.sender;bindLong(b,()=>removeSender(t,cid));b.onclick=()=>toggleSender(t,cid)})}
function toggleSender(t,cid){if(t.senders.includes(cid))return;if(t.senderPending.includes(cid)){t.senderPending=t.senderPending.filter(id=>id!==cid);t.senders.push(cid);let c=state.casts.find(x=>x.id===cid);if(c)c.sends++;state.history.push({type:'send',cast:cid,table:t.id,castName:c?.name||'',tableNo:t.no,at:now()});if(t.senders.length>=t.guests){t.active=false;t.lastSeatAt=null;t.currentCastIds=[];state.casts.forEach(c=>{if(c.currentTable===t.id)c.currentTable=null;if(c.preparingFor===t.id)c.preparingFor=null});toast(t.no+' 送り完了・卓終了')}else toast((c?.name||'')+' 送り確定')}else t.senderPending.push(cid);save();openSenderForTable(t.id);render()}
function removeSender(t,cid){let c=state.casts.find(x=>x.id===cid);if(t.senders.includes(cid)){t.senders=t.senders.filter(id=>id!==cid);if(c)c.sends=Math.max(0,c.sends-1);t.active=true}else t.senderPending=t.senderPending.filter(id=>id!==cid);save();openSenderForTable(t.id);render();toast('送り設定を取り消しました')}
function showHistory(){openUtility('着席・送り履歴',`<div class="info-card">${[...state.history].reverse().map(h=>`<div class="history-item"><b>${esc(h.type==='send'?'送り':h.type==='leave'?'離席':'着席'+(h.turn?' #'+h.turn:''))}　${esc(h.castName||state.casts.find(c=>c.id===h.cast)?.name||'')} → ${esc(h.tableNo||tableNo(h.table))}</b><small>${new Date(h.at).toLocaleString('ja-JP')}</small></div>`).join('')||'履歴なし'}</div><button class="danger" id="clearHistory" style="width:100%;margin-top:10px">履歴削除</button>`);document.querySelector('#clearHistory').onclick=()=>{if(confirm('履歴を削除しますか？')){state.history=[];save();showHistory()}}}
function backup(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='SWAMP-FLOW_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function endBusiness(){if(!confirm('営業を終了しますか？\n卓・着席・送り・一時制限をリセットします。'))return;state.tables=[];state.refusals={};state.history=[];state.casts.forEach(c=>Object.assign(c,{currentTable:null,preparingFor:null,sends:0,penalty:false,inHouse:false,ngTables:[]}));save();render();toast('営業終了処理が完了しました')}
document.querySelector('#closeSheet').onclick=()=>document.querySelector('#sheet').classList.add('hidden');document.querySelector('#sheet').onclick=e=>{if(e.target.id==='sheet')e.currentTarget.classList.add('hidden')};document.querySelector('#addTable').onclick=()=>openTableModal();document.querySelector('#closeModal').onclick=()=>document.querySelector('#tableModal').classList.add('hidden');document.querySelector('#saveTable').onclick=saveTable;document.querySelector('#fPlan').onchange=()=>{toggleOwner();let plan=document.querySelector('#fPlan').value;document.querySelector('#fCycle').value=plan==='お連れ様'?5:3;document.querySelector('#fTarget').value=plan==='お連れ様'?45:50;updateTimerPreview()};document.querySelector('#fTimerMode').onchange=updateTimerPreview;document.querySelector('#fTarget').oninput=updateTimerPreview;document.querySelector('#fCycle').oninput=updateTimerPreview;document.querySelector('#fOwner').onchange=updateTimerPreview;document.querySelector('#closeUtility').onclick=closeUtility;document.querySelector('#utilityModal').onclick=e=>{if(e.target.id==='utilityModal')closeUtility()};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');['home','tables','status','menu'].forEach(p=>document.querySelector('#'+p+'Page').classList.toggle('hidden',p!==b.dataset.page))});
document.querySelector('#bulkAddCastMenu').onclick=openBulkAdd;document.querySelector('#addCastMenu').onclick=()=>castForm();document.querySelector('#castManageMenu').onclick=openCastManage;document.querySelector('#bulkCastManageMenu').onclick=openBulkManage;document.querySelector('#bulkColorMenu').onclick=openBulkColor;document.querySelector('#castSortMenu').onclick=openCastSort;document.querySelector('#restrictionMenu').onclick=openRestrictions;document.querySelector('#sendingMenu').onclick=openSending;document.querySelector('#historyMenu').onclick=showHistory;document.querySelector('#backupMenu').onclick=backup;document.querySelector('#importMenu').onclick=()=>document.querySelector('#importInput').click();document.querySelector('#endBusinessMenu').onclick=endBusiness;document.querySelector('#resetTableMenu').onclick=resetTableData;document.querySelector('#restoreTableMenu').onclick=restoreTableData;
document.querySelector('#importInput').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{state=normalize(JSON.parse(r.result));save();render();toast('データを復元しました')}catch{toast('復元できないファイルです')}};r.readAsText(f);e.target.value=''};
setInterval(()=>{processAutoSwaps();render()},1000);render();
</script>
</body></html>
