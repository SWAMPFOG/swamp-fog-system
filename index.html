<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#101114">
<title>SWAMP-FOG Lite Ver.9.0</title>
<style>
:root{
  --bg:#101114;--panel:#191b20;--line:#343841;--text:#f4f5f7;--sub:#a9afb9;
  --accent:#f2c94c;--danger:#ef6b6b;--ok:#66d19e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Yu Gothic UI",sans-serif;
}
button,input,select{font:inherit}
button{touch-action:manipulation}
header{
  position:sticky;top:0;z-index:20;background:rgba(16,17,20,.96);
  border-bottom:1px solid var(--line);padding:10px 12px 8px;
}
h1{font-size:17px;margin:0 0 8px;font-weight:900}
.topbar{display:grid;grid-template-columns:1fr 1fr 56px;gap:7px}
.topbar button,.topbar select{
  min-height:42px;border-radius:10px;border:1px solid var(--line);
  background:#20232a;color:var(--text);font-weight:800;padding:6px 8px;
}
.topbar .active{border-color:var(--accent);color:var(--accent)}
main{padding:10px 10px 90px}
section{margin-bottom:14px}
.section-title{
  display:flex;align-items:center;justify-content:space-between;
  font-size:13px;font-weight:900;color:var(--sub);margin:0 2px 7px;
}
.add-btn{
  border:1px solid var(--line);background:#22252c;color:var(--text);
  border-radius:9px;padding:7px 10px;font-weight:900
}
.tables{display:grid;gap:8px}
.table-card{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px;
  display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;
}
.table-main{min-width:0}
.table-line{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.table-no{font-size:22px;font-weight:1000}
.table-meta{font-size:14px;font-weight:800}
.table-sub{font-size:12px;color:var(--sub);margin-top:4px;white-space:normal}
.table-card button{
  border:1px solid var(--line);background:#242832;color:var(--text);
  border-radius:10px;min-width:64px;min-height:48px;font-weight:900
}
.cast-list{display:grid;gap:6px}
.cast-row{
  min-height:54px;background:var(--panel);border:1px solid var(--line);border-radius:11px;
  display:grid;grid-template-columns:38px minmax(0,1fr) 62px 54px;gap:6px;align-items:center;padding:6px;
}
.cast-row.unavailable{opacity:.45}
.rank{
  text-align:center;font-size:12px;font-weight:1000;color:var(--sub)
}
.cast-name{
  min-width:0;font-size:17px;font-weight:1000;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  position:relative
}
.cast-row.unavailable .cast-name:after{
  content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:var(--danger);transform:rotate(-7deg)
}
.turn{
  width:100%;height:42px;text-align:center;border:1px solid var(--line);border-radius:9px;
  background:#111318;color:var(--text);font-size:19px;font-weight:1000;
}
.done{
  width:100%;height:42px;border:1px solid var(--line);border-radius:9px;
  background:#242832;color:var(--sub);font-size:23px;font-weight:1000
}
.done.on{background:#18392d;border-color:var(--ok);color:var(--ok)}
.bottom{
  position:fixed;left:0;right:0;bottom:0;z-index:30;padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:rgba(16,17,20,.97);border-top:1px solid var(--line);
  display:grid;grid-template-columns:1fr 1fr;gap:8px
}
.bottom button{
  min-height:48px;border-radius:11px;border:1px solid var(--line);
  background:#23262d;color:var(--text);font-weight:1000
}
.bottom .primary{background:var(--accent);color:#111;border-color:var(--accent)}
.overlay{
  position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.68);display:none;align-items:flex-end
}
.overlay.show{display:flex}
.sheet{
  width:100%;max-height:88vh;overflow:auto;background:#17191e;border-radius:18px 18px 0 0;
  border-top:1px solid #4a4e58;padding:16px 14px calc(18px + env(safe-area-inset-bottom))
}
.sheet h2{font-size:18px;margin:0 0 12px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:grid;gap:5px}
.field.full{grid-column:1/-1}
label{font-size:12px;color:var(--sub);font-weight:900}
input,select{
  width:100%;min-height:46px;background:#111318;color:var(--text);
  border:1px solid var(--line);border-radius:10px;padding:9px
}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice button{
  min-height:46px;border:1px solid var(--line);border-radius:10px;background:#22252c;color:var(--text);font-weight:900
}
.choice button.on{border-color:var(--accent);color:var(--accent)}
.cast-checks{display:grid;grid-template-columns:1fr 1fr;gap:7px;max-height:34vh;overflow:auto}
.check{
  display:flex;align-items:center;gap:7px;background:#20232a;border:1px solid var(--line);border-radius:9px;padding:9px
}
.check input{width:20px;min-height:20px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.actions button{
  min-height:48px;border-radius:10px;border:1px solid var(--line);background:#242832;color:var(--text);font-weight:1000
}
.actions .save{background:var(--accent);color:#111;border-color:var(--accent)}
.empty{padding:18px;text-align:center;color:var(--sub);border:1px dashed var(--line);border-radius:11px}
.small{font-size:12px;color:var(--sub)}
</style>
</head>
<body>
<header>
  <h1>SWAMP-FOG Lite Ver.9.0</h1>
  <div class="topbar">
    <button id="modeRun" class="active">営業中</button>
    <button id="modePrepare">営業前設定</button>
    <button id="menuBtn">⋯</button>
  </div>
</header>

<main>
  <section>
    <div class="section-title">
      <span>卓</span>
      <button class="add-btn" id="addTableBtn">＋ 卓追加</button>
    </div>
    <div id="tables" class="tables"></div>
  </section>

  <section>
    <div class="section-title">
      <span id="castTitle">キャスト順番</span>
      <button class="add-btn" id="addCastBtn">＋ キャスト</button>
    </div>
    <div id="casts" class="cast-list"></div>
  </section>
</main>

<div class="bottom" id="bottomBar">
  <button id="clearMarks">番号・○をクリア</button>
  <button class="primary" id="saveNow">保存</button>
</div>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<script>
const KEY="swamp_fog_lite_v9_0";
const nowTime=()=>new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

let data=load();
let mode="run";

function defaults(){
  return {
    casts:[],
    tables:[]
  };
}
function load(){
  try{
    const x=JSON.parse(localStorage.getItem(KEY));
    return x&&typeof x==="object"?{...defaults(),...x}:defaults();
  }catch(e){return defaults()}
}
function save(){
  localStorage.setItem(KEY,JSON.stringify(data));
}
function openSheet(html){
  document.getElementById("sheet").innerHTML=html;
  document.getElementById("overlay").classList.add("show");
}
function closeSheet(){
  document.getElementById("overlay").classList.remove("show");
}
document.getElementById("overlay").addEventListener("click",e=>{if(e.target.id==="overlay")closeSheet()});

function sortedCasts(){
  return [...data.casts].sort((a,b)=>(Number(a.order)||999)-(Number(b.order)||999)||a.name.localeCompare(b.name,"ja"));
}
function castName(id){
  return data.casts.find(c=>c.id===id)?.name||"";
}

function render(){
  document.getElementById("modeRun").classList.toggle("active",mode==="run");
  document.getElementById("modePrepare").classList.toggle("active",mode==="prepare");
  document.getElementById("castTitle").textContent=mode==="prepare"?"初回に着けない人へ斜線":"キャスト順番";
  document.getElementById("addTableBtn").style.display=mode==="run"?"block":"none";
  document.getElementById("bottomBar").style.display=mode==="run"?"grid":"none";

  const tables=document.getElementById("tables");
  if(!data.tables.length){
    tables.innerHTML='<div class="empty">卓が入ったら「＋ 卓追加」</div>';
  }else{
    tables.innerHTML=data.tables.map(t=>{
      const companion=t.type==="companion";
      const intro=companion&&t.introducerId?`紹介：${esc(castName(t.introducerId))}`:"";
      const wants=companion&&t.wantedIds?.length?`希望：${t.wantedIds.map(castName).filter(Boolean).map(esc).join("・")}`:"";
      return `<div class="table-card">
        <div class="table-main">
          <div class="table-line">
            <span class="table-no">${esc(t.number)}</span>
            <span class="table-meta">${esc(t.people)}名</span>
            <span class="table-meta">${esc(t.startTime)}</span>
          </div>
          <div class="table-sub">${companion?"お連れ様":"初回"}${intro?"　"+intro:""}${wants?"<br>"+wants:""}</div>
        </div>
        <button data-edit-table="${esc(t.id)}">編集</button>
      </div>`;
    }).join("");
  }

  const casts=document.getElementById("casts");
  const list=sortedCasts();
  if(!list.length){
    casts.innerHTML='<div class="empty">キャストをランク順に登録</div>';
  }else{
    casts.innerHTML=list.map(c=>{
      if(mode==="prepare"){
        return `<button class="cast-row ${c.unavailable?"unavailable":""}" data-toggle-available="${esc(c.id)}" style="width:100%;color:inherit;text-align:left">
          <span class="rank">${esc(c.rank||"-")}</span>
          <span class="cast-name">${esc(c.name)}</span>
          <span class="small">${c.unavailable?"初回不可":"初回可"}</span>
          <span></span>
        </button>`;
      }
      return `<div class="cast-row ${c.unavailable?"unavailable":""}">
        <span class="rank">${esc(c.rank||"-")}</span>
        <span class="cast-name">${esc(c.name)}</span>
        <input class="turn" inputmode="numeric" pattern="[0-9]*" maxlength="2" value="${esc(c.turn||"")}" data-turn="${esc(c.id)}" ${c.unavailable?"disabled":""}>
        <button class="done ${c.done?"on":""}" data-done="${esc(c.id)}" ${c.unavailable?"disabled":""}>○</button>
      </div>`;
    }).join("");
  }

  document.querySelectorAll("[data-edit-table]").forEach(b=>b.onclick=()=>openTable(b.dataset.editTable));
  document.querySelectorAll("[data-toggle-available]").forEach(b=>b.onclick=()=>{
    const c=data.casts.find(x=>x.id===b.dataset.toggleAvailable);
    if(c){c.unavailable=!c.unavailable;if(c.unavailable){c.turn="";c.done=false}save();render()}
  });
  document.querySelectorAll("[data-turn]").forEach(i=>{
    i.oninput=()=>{
      const c=data.casts.find(x=>x.id===i.dataset.turn);
      if(c){c.turn=i.value.replace(/\D/g,"").slice(0,2);save()}
    };
  });
  document.querySelectorAll("[data-done]").forEach(b=>b.onclick=()=>{
    const c=data.casts.find(x=>x.id===b.dataset.done);
    if(c){c.done=!c.done;save();render()}
  });
}

function openCast(id=null){
  const c=id?data.casts.find(x=>x.id===id):null;
  openSheet(`
    <h2>${c?"キャスト編集":"キャスト追加"}</h2>
    <div class="form">
      <div class="field full">
        <label>名前</label>
        <input id="castName" value="${esc(c?.name||"")}" autocomplete="off">
      </div>
      <div class="field">
        <label>ランク</label>
        <input id="castRank" value="${esc(c?.rank||"")}" placeholder="S / A / B">
      </div>
      <div class="field">
        <label>並び順</label>
        <input id="castOrder" inputmode="numeric" value="${esc(c?.order??data.casts.length+1)}">
      </div>
    </div>
    <div class="actions">
      <button id="cancel">閉じる</button>
      <button class="save" id="saveCast">保存</button>
    </div>
    ${c?'<div class="actions"><button id="deleteCast">削除</button><button id="nextCast">次のキャストを編集</button></div>':""}
  `);
  document.getElementById("cancel").onclick=closeSheet;
  document.getElementById("saveCast").onclick=()=>{
    const name=document.getElementById("castName").value.trim();
    if(!name){alert("名前を入力してください");return}
    const obj=c||{id:uid("c"),turn:"",done:false,unavailable:false};
    obj.name=name;
    obj.rank=document.getElementById("castRank").value.trim();
    obj.order=Number(document.getElementById("castOrder").value)||data.casts.length+1;
    if(!c)data.casts.push(obj);
    save();closeSheet();render();
  };
  if(c){
    document.getElementById("deleteCast").onclick=()=>{
      if(confirm(`${c.name}を削除しますか？`)){
        data.casts=data.casts.filter(x=>x.id!==c.id);
        data.tables.forEach(t=>{
          if(t.introducerId===c.id)t.introducerId="";
          t.wantedIds=(t.wantedIds||[]).filter(x=>x!==c.id);
        });
        save();closeSheet();render();
      }
    };
    document.getElementById("nextCast").onclick=()=>{
      const list=sortedCasts(),idx=list.findIndex(x=>x.id===c.id),next=list[idx+1]||list[0];
      if(next)openCast(next.id);
    };
  }
}

function openCastList(){
  const list=sortedCasts();
  openSheet(`
    <h2>キャスト管理</h2>
    <div style="display:grid;gap:7px">
      ${list.map(c=>`<button data-cast-edit="${esc(c.id)}" style="min-height:45px;border:1px solid var(--line);border-radius:10px;background:#22252c;color:var(--text);font-weight:900;text-align:left;padding:10px">${esc(c.rank||"-")}　${esc(c.name)}</button>`).join("")||'<div class="empty">未登録</div>'}
    </div>
    <div class="actions"><button id="closeManage">閉じる</button><button class="save" id="newCast">＋追加</button></div>
  `);
  document.getElementById("closeManage").onclick=closeSheet;
  document.getElementById("newCast").onclick=()=>openCast();
  document.querySelectorAll("[data-cast-edit]").forEach(b=>b.onclick=()=>openCast(b.dataset.castEdit));
}

function openTable(id=null){
  const t=id?data.tables.find(x=>x.id===id):null;
  const type=t?.type||"first";
  const castOptions=sortedCasts().map(c=>`<option value="${esc(c.id)}" ${t?.introducerId===c.id?"selected":""}>${esc(c.name)}</option>`).join("");
  const checks=sortedCasts().map(c=>`
    <label class="check">
      <input type="checkbox" value="${esc(c.id)}" class="wanted" ${(t?.wantedIds||[]).includes(c.id)?"checked":""}>
      <span>${esc(c.name)}</span>
    </label>`).join("");
  openSheet(`
    <h2>${t?"卓編集":"卓追加"}</h2>
    <div class="choice">
      <button id="firstChoice" class="${type==="first"?"on":""}">初回</button>
      <button id="compChoice" class="${type==="companion"?"on":""}">お連れ様</button>
    </div>
    <div class="form" style="margin-top:10px">
      <div class="field">
        <label>卓番号</label>
        <input id="tableNo" value="${esc(t?.number||"")}" placeholder="S1">
      </div>
      <div class="field">
        <label>人数</label>
        <input id="people" inputmode="numeric" value="${esc(t?.people||"2")}">
      </div>
      <div class="field full">
        <label>開始時刻</label>
        <input id="startTime" type="time" value="${esc(t?.startTime||nowTime())}">
      </div>
      <div id="compFields" class="field full" style="display:${type==="companion"?"grid":"none"};gap:10px">
        <div class="field">
          <label>誰の紹介か</label>
          <select id="introducer"><option value="">選択なし</option>${castOptions}</select>
        </div>
        <div class="field">
          <label>回りたいと言われたキャスト</label>
          <div class="cast-checks">${checks||'<div class="empty">キャスト未登録</div>'}</div>
        </div>
      </div>
    </div>
    <div class="actions">
      <button id="cancel">閉じる</button>
      <button class="save" id="saveTable">保存</button>
    </div>
    ${t?'<div class="actions"><button id="deleteTable">卓を削除</button><button id="closeTable">回し終了</button></div>':""}
  `);
  let selectedType=type;
  const updateType=()=>{
    document.getElementById("firstChoice").classList.toggle("on",selectedType==="first");
    document.getElementById("compChoice").classList.toggle("on",selectedType==="companion");
    document.getElementById("compFields").style.display=selectedType==="companion"?"grid":"none";
  };
  document.getElementById("firstChoice").onclick=()=>{selectedType="first";updateType()};
  document.getElementById("compChoice").onclick=()=>{selectedType="companion";updateType()};
  document.getElementById("cancel").onclick=closeSheet;
  document.getElementById("saveTable").onclick=()=>{
    const number=document.getElementById("tableNo").value.trim();
    if(!number){alert("卓番号を入力してください");return}
    const obj=t||{id:uid("t")};
    obj.number=number;
    obj.people=Math.max(1,Number(document.getElementById("people").value)||1);
    obj.startTime=document.getElementById("startTime").value||nowTime();
    obj.type=selectedType;
    obj.introducerId=selectedType==="companion"?document.getElementById("introducer").value:"";
    obj.wantedIds=selectedType==="companion"?[...document.querySelectorAll(".wanted:checked")].map(x=>x.value):[];
    if(!t)data.tables.push(obj);
    save();closeSheet();render();
  };
  if(t){
    document.getElementById("deleteTable").onclick=()=>{
      if(confirm(`${t.number}を削除しますか？`)){data.tables=data.tables.filter(x=>x.id!==t.id);save();closeSheet();render()}
    };
    document.getElementById("closeTable").onclick=()=>{
      data.tables=data.tables.filter(x=>x.id!==t.id);save();closeSheet();render();
    };
  }
}

function openMenu(){
  openSheet(`
    <h2>設定</h2>
    <div style="display:grid;gap:8px">
      <button id="manageCasts" style="min-height:48px;border:1px solid var(--line);border-radius:10px;background:#22252c;color:var(--text);font-weight:900">キャスト管理</button>
      <button id="backup" style="min-height:48px;border:1px solid var(--line);border-radius:10px;background:#22252c;color:var(--text);font-weight:900">バックアップ保存</button>
      <button id="resetAll" style="min-height:48px;border:1px solid #6d3c3c;border-radius:10px;background:#2a1d20;color:#ffb0b0;font-weight:900">営業データを全消去</button>
    </div>
    <div class="actions"><button id="closeMenu">閉じる</button><button class="save" id="addCastMenu">＋キャスト追加</button></div>
  `);
  document.getElementById("closeMenu").onclick=closeSheet;
  document.getElementById("addCastMenu").onclick=()=>openCast();
  document.getElementById("manageCasts").onclick=openCastList;
  document.getElementById("backup").onclick=()=>{
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`SWAMP-FOG-Lite-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href);
  };
  document.getElementById("resetAll").onclick=()=>{
    if(confirm("卓・番号・○・営業前設定をすべて消去しますか？")){
      data.tables=[];
      data.casts.forEach(c=>{c.turn="";c.done=false;c.unavailable=false});
      save();closeSheet();render();
    }
  };
}

document.getElementById("modeRun").onclick=()=>{mode="run";render()};
document.getElementById("modePrepare").onclick=()=>{mode="prepare";render()};
document.getElementById("addTableBtn").onclick=()=>openTable();
document.getElementById("addCastBtn").onclick=()=>openCast();
document.getElementById("menuBtn").onclick=openMenu;
document.getElementById("saveNow").onclick=()=>{save();const b=document.getElementById("saveNow");b.textContent="保存済み";setTimeout(()=>b.textContent="保存",700)};
document.getElementById("clearMarks").onclick=()=>{
  if(confirm("全キャストの予定番号と○を消しますか？")){
    data.casts.forEach(c=>{c.turn="";c.done=false});save();render();
  }
};

render();
</script>
</body>
</html>
