
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SWAMP-FOG">
<title>SWAMP-FOG 初回回し Ver.8.2 完成版</title>
<style>
:root{
  --name-col:92px;
  --table-col:82px;
  --line:#393939;
  --bg:#0f0f10;
  --panel:#181819;
  --panel2:#252527;
  --green:#52ef87;
  --green-dark:#123c25;
  --blue:#52a9ff;
  --blue-dark:#143653;
  --yellow:#ffd24b;
  --yellow-dark:#4a3b0d;
  --red:#ff6268;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;min-height:100%;background:var(--bg);color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif
}
button,input,select{font:inherit}
button{touch-action:manipulation}
.topbar{
  position:sticky;top:0;z-index:60;
  min-height:46px;padding:6px 7px;
  display:grid;grid-template-columns:74px 1fr 74px;gap:5px;align-items:center;
  background:#202022;border-bottom:1px solid var(--line)
}
.topbar h1{margin:0;text-align:center;font-size:14px;line-height:1.15}
.top-btn{
  height:34px;border:1px solid #555;border-radius:9px;
  background:#2c2c2f;color:#fff;font-size:12px;font-weight:800
}
.top-btn.active{background:#165f36;border-color:#2c9b58}
.statusbar{
  position:sticky;top:46px;z-index:50;
  min-height:35px;padding:5px 7px;
  display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;
  background:#151516;border-bottom:1px solid #333;
  font-size:11px;white-space:nowrap
}
.status-main{overflow:hidden;text-overflow:ellipsis}
.status-count{
  padding:4px 7px;border-radius:999px;background:#343438;font-weight:900
}
.add-table{
  width:44px;height:27px;border:1px solid #555;border-radius:8px;
  background:#2d2d30;color:#fff;font-size:11px;font-weight:900
}
.board-wrap{
  width:100%;overflow-x:auto;overflow-y:visible;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain
}
table{
  border-collapse:separate;border-spacing:0;table-layout:fixed;
  width:max-content;min-width:100%
}
th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
thead th{
  position:relative;z-index:8;
  width:var(--table-col);min-width:var(--table-col);max-width:var(--table-col);
  height:104px;padding:7px 2px;background:var(--panel2);
  text-align:center;vertical-align:middle
}
thead th:first-child{
  position:sticky;left:0;z-index:16;
  width:var(--name-col);min-width:var(--name-col);max-width:var(--name-col);
  padding-left:6px;background:#151516;text-align:left;font-size:11px
}
.table-head{cursor:pointer}
.table-head.active{
  background:#263b30;
  box-shadow:inset 0 -3px 0 var(--green)
}
.table-head.planning{background:#4a3b0d;box-shadow:inset 0 -3px 0 var(--yellow)}
.table-no{font-size:17px;font-weight:900;line-height:1}
.start{margin-top:3px;font-size:11px;color:#e2e2e5}
.meta{margin-top:3px;font-size:10px;color:#ccccd0;white-space:nowrap}
.timer{
  margin-top:5px;font-size:17px;line-height:1;font-weight:900;
  color:var(--green);font-variant-numeric:tabular-nums
}
.timer.not-started{color:#a9a9ad;font-size:13px}
.timer.paused{color:#b7b7bb}
.timer.warn{color:var(--yellow)}
.timer.over{color:var(--red)}
.duration{margin-top:3px;font-size:9px;color:#9f9fa5}
tbody tr{height:58px}
tbody td{
  height:58px;min-height:58px;background:#141415;
  text-align:center;vertical-align:middle
}
.cast{
  position:sticky;left:0;z-index:5;
  width:var(--name-col);min-width:var(--name-col);max-width:var(--name-col);
  padding:7px 5px 6px;background:#181819;text-align:left;vertical-align:middle
}
.cast.editable{cursor:pointer}
.cast-line{
  display:flex;align-items:center;gap:3px;min-width:0;
  height:22px;line-height:22px;overflow:visible
}
.rank-dot{
  width:15px;height:15px;border-radius:50%;flex:0 0 auto;
  box-shadow:inset 0 1px 2px rgba(255,255,255,.5)
}
.rank{font-size:12px;font-weight:900;flex:0 0 auto}
.name{
  min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;font-size:14px;font-weight:800
}
.cast-sub{
  margin-top:1px;padding-left:18px;color:#a9a9ad;
  font-size:10px;line-height:14px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis
}
.c .rank,.c .name{color:#4cff5a}
.b .rank,.b .name{color:#43a2ff}
.a .rank,.a .name{color:#ffd54a}
.s .rank,.s .name{color:#ff5a5f}
.c .rank-dot{background:linear-gradient(#4eff57,#08a910)}
.b .rank-dot{background:linear-gradient(#42a8ff,#0758bf)}
.a .rank-dot{background:linear-gradient(#ffe75e,#ffbc00)}
.s .rank-dot{background:linear-gradient(#ff666b,#cb0710)}
.state-cell{
  width:var(--table-col);min-width:var(--table-col);
  max-width:var(--table-col);padding:0
}
.state-btn{
  width:100%;height:58px;border:0;background:transparent;color:#fff;
  font-size:26px;line-height:1
}
.state-btn:active{filter:brightness(1.25)}
.state-btn.empty{color:#fff}
.state-btn.selected{
  background:var(--blue-dark);color:#8dccff;
  box-shadow:inset 0 0 0 2px var(--blue)
}
.state-btn.checked{
  background:var(--green-dark);color:#75ff9e;
  box-shadow:inset 0 0 0 2px #2bc96b
}
.state-btn.blocked{
  background:#35191b;color:#ff777c;font-size:21px
}
.seat-order{
  display:flex;align-items:center;justify-content:center;gap:3px;
  font-variant-numeric:tabular-nums
}
.order-number{font-size:23px;font-weight:1000;line-height:1}
.order-check{font-size:14px;font-weight:1000}
.bottom{
  position:sticky;bottom:0;z-index:40;
  display:grid;grid-template-columns:88px 1fr;gap:7px;
  padding:7px 8px calc(7px + env(safe-area-inset-bottom));
  background:rgba(20,20,21,.98);border-top:1px solid var(--line)
}
.primary,.secondary{
  min-height:42px;border-radius:10px;border:1px solid #555;
  color:#fff;font-weight:900
}
.primary{background:#176b3b;border-color:#2b9a59}
.primary:disabled{opacity:.4}
.secondary{background:#303034;font-size:11px}
.sheet-backdrop{
  position:fixed;inset:0;z-index:90;
  background:rgba(0,0,0,.62);display:none
}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:100;
  max-height:90vh;overflow:auto;
  padding:12px 14px calc(18px + env(safe-area-inset-bottom));
  background:#222225;border-radius:18px 18px 0 0;
  transform:translateY(110%);transition:.2s ease
}
.sheet.open{transform:translateY(0)}
.sheet-backdrop.open{display:block}
.sheet h2{margin:2px 0 12px;font-size:18px}
.sheet h3{margin:16px 0 8px;font-size:14px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}
label{font-size:12px;color:#ccccd0}
input,select{
  width:100%;height:42px;border:1px solid #555;border-radius:9px;
  padding:0 10px;background:#151516;color:#fff
}
.checkrow{display:flex;align-items:center;gap:8px;min-height:38px}
.checkrow input{width:22px;height:22px}
.sheet-actions{display:flex;gap:7px;margin-top:14px}
.sheet-actions button{
  flex:1;min-height:43px;border-radius:10px;border:1px solid #555;
  color:#fff;font-weight:800
}
.save{background:#176b3b}
.start-timer{background:#176b3b;border-color:#2b9a59!important}
.danger{background:#6c2020}
.cancel{background:#333338}
.pause{background:#66520f}
.reason{
  padding:10px;border:1px solid #555;border-radius:10px;
  background:#171719;color:#eee;font-size:14px;line-height:1.5
}
.small-note{margin-top:8px;color:#aaa;font-size:11px;line-height:1.45}
.history-list{display:flex;flex-direction:column;gap:8px}
.history-item{
  padding:10px;border:1px solid #45454a;
  border-radius:11px;background:#171719
}
.history-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.history-table{font-size:16px;font-weight:900}
.history-time{color:#aaa;font-size:11px}
.history-casts{margin-top:5px;font-size:14px;line-height:1.45}
.history-meta{margin-top:4px;color:#aaa;font-size:11px}
.round-badge{
  display:inline-block;min-width:25px;padding:2px 6px;margin-right:5px;
  border-radius:999px;background:#174529;color:#79ffa5;
  text-align:center;font-size:11px;font-weight:900
}
.empty-history{padding:25px 5px;text-align:center;color:#aaa}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.menu-grid button{
  min-height:48px;border:1px solid #555;border-radius:10px;
  background:#303034;color:#fff;font-weight:800
}
.quick-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.quick-row button{
  min-height:40px;border:1px solid #555;border-radius:9px;
  background:#303034;color:#fff;font-weight:800
}
.timer-panel{
  padding:12px;border:1px solid #4b4b50;border-radius:12px;
  background:#171719;text-align:center
}
.timer-panel-value{
  margin:7px 0;font-size:34px;font-weight:1000;
  font-variant-numeric:tabular-nums
}

.rank{color:#a9a9ad!important}
.name{font-weight:900}

.state-btn.rejected{
  background:#3a1719;color:#ff8b90;
  box-shadow:inset 0 0 0 2px #ff6268
}
.reject-badge{
  display:block;margin-top:2px;font-size:9px;font-weight:1000;line-height:1
}
.table-head.reject-mode{
  background:#4a1a1d;
  box-shadow:inset 0 -3px 0 #ff6268
}
.auto-info{
  margin-top:5px;color:#8fd7ff;font-size:9px;line-height:1.2
}
.attendance-off{opacity:.42}
.state-btn.planned{background:var(--yellow-dark);color:#ffe270;box-shadow:inset 0 0 0 2px var(--yellow)}
.plan-mark{font-size:23px;font-weight:1000}
.order-label{font-size:10px;font-weight:1000}
.timer-panel-value.over{color:var(--red)}
.plan-btn{background:#66520f}

.hidden-input{display:none}

.table-head.collapsed{width:48px!important;min-width:48px!important;max-width:48px!important;height:108px;padding:3px 0;background:#1c1c1e;box-shadow:inset 2px 0 0 #555}
.table-head.collapsed .table-no{writing-mode:horizontal-tb;text-orientation:mixed;margin:0 auto 4px;font-size:12px;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46px}
.table-head.collapsed .start,.table-head.collapsed .meta,.table-head.collapsed .timer,.table-head.collapsed .duration{display:none}
.table-head .collapsed-senders{display:none}
.table-head.collapsed .auto-info{display:none}
.table-head.collapsed .collapsed-senders{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  margin:5px auto 0;color:#ffd24b;font-size:9px;font-weight:1000;
  line-height:1.1;max-height:70px;overflow:hidden;writing-mode:horizontal-tb
}
.table-head.collapsed .collapsed-senders .sender-title{
  color:#fff;font-size:8px;letter-spacing:.04em
}
.table-head.collapsed .collapsed-senders .sender-name{
  display:block;max-width:42px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
.end-estimate{margin-top:2px;font-size:9px;color:#8fd7ff;white-space:nowrap}

.state-cell.collapsed{width:48px!important;min-width:48px!important;max-width:48px!important;background:#171719}
.state-cell.collapsed .state-btn{display:none}
.cast-sub.stats{font-size:9px;color:#c5c5ca}
.sender-badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:16px;margin-left:2px;padding:0 3px;border-radius:5px;background:#8b1f28;color:#fff;font-size:9px;font-weight:1000;vertical-align:middle}
.sender-mode{background:#5a1b22!important;box-shadow:inset 0 -3px 0 #ff6268!important}
.sender-list{margin-top:8px;padding:9px;border:1px solid #5a4043;border-radius:9px;background:#211719;color:#ffd8da;font-size:12px;line-height:1.5}
.wheel-row{display:grid;grid-template-columns:1fr auto 1fr auto;gap:7px;align-items:end}
.wheel-row select{height:48px;font-size:18px;font-weight:900;text-align:center}
.wheel-unit{padding-bottom:13px;color:#bbb;font-size:12px}
@media(max-width:390px){
  :root{--name-col:84px;--table-col:76px}
  .topbar{grid-template-columns:68px 1fr 68px}
  .topbar h1{font-size:13px}
}
</style>
</head>
<body>
<header class="topbar">
  <button class="top-btn" id="modeBtn">営業モード</button>
  <h1>SWAMP-FOG 初回回し Ver.8.2</h1>
  <button class="top-btn" id="menuBtn">メニュー</button>
</header>

<div class="statusbar">
  <div class="status-main" id="activeLabel">卓を選択してください</div>
  <div class="status-count" id="selectedCount">0名</div>
  <button class="add-table" id="addTableBtn">＋卓</button>
</div>

<div class="board-wrap">
  <table id="board" aria-label="初回回しボード"></table>
</div>

<div class="bottom">
  <button class="secondary" id="clearSelectBtn">選択解除</button>
  <button class="primary" id="seatBtn" disabled>次を着席</button>
</div>

<div class="sheet-backdrop" id="backdrop"></div>
<section class="sheet" id="sheet" aria-modal="true" role="dialog"></section>
<input class="hidden-input" id="importInput" type="file" accept="application/json">

<script>
const STORAGE_KEY="swamp_fog_v8_2_complete";
const MIGRATION_KEYS=["swamp_fog_v7_9_complete","swamp_fog_v7_8_complete","swamp_fog_v7_7_complete","swamp_fog_v7_6_complete","swamp_fog_v7_5_complete","swamp_fog_v7_4_complete","swamp_fog_v7_3_complete","swamp_fog_v7_2_complete","swamp_fog_v7_complete_1","swamp_fog_v7_gamma_1","swamp_fog_v7_beta_1"];
const defaultData={
  settings:{editMode:false},
  casts:[
    {id:"c1",name:"さや",rank:"C",nameColor:"#4cff5a",sends:0,penalty:false,inHouse:false,working:true,ngTables:[]},
    {id:"c2",name:"あい",rank:"C",nameColor:"#4cff5a",sends:1,penalty:false,inHouse:false,working:true,ngTables:[]},
    {id:"c3",name:"みく",rank:"B",nameColor:"#43a2ff",sends:2,penalty:false,inHouse:false,working:true,ngTables:["t2"]},
    {id:"c4",name:"りな",rank:"A",nameColor:"#ffd54a",sends:2,penalty:false,inHouse:false,working:true,ngTables:[]},
    {id:"c5",name:"ゆい",rank:"S",nameColor:"#ff5a5f",sends:0,penalty:false,inHouse:false,working:true,ngTables:[]}
  ],
  tables:[
    {id:"t1",number:"S1",start:"21:05",people:2,plan:"A",durationSec:900,startedAt:null,pausedAt:null,totalPaused:0,turnCounter:0,collapsed:false},
    {id:"t2",number:"VIP1",start:"21:12",people:3,plan:"VIP",durationSec:900,startedAt:null,pausedAt:null,totalPaused:0,turnCounter:0,collapsed:false},
    {id:"t3",number:"A2",start:"21:18",people:1,plan:"お連れ様",durationSec:600,startedAt:null,pausedAt:null,totalPaused:0,turnCounter:0,collapsed:false}
  ],
  seated:{},selected:{},planned:{},planningTableId:null,sendNominees:{},senderTableId:null,rejections:{},rejectionTableId:null,history:[]
};
let data=load();
let activeTableId=data.tables[0]?.id||null;
function cloneDefault(){return JSON.parse(JSON.stringify(defaultData))}
function normalize(d){
  d.settings=d.settings||{}; d.settings.editMode=!!d.settings.editMode;
  d.history=Array.isArray(d.history)?d.history:[]; d.seated=d.seated||{}; d.selected={}; d.planned=d.planned||{}; d.planningTableId=null; d.sendNominees=d.sendNominees||{}; d.senderTableId=null; d.rejections=d.rejections||{}; d.rejectionTableId=null;
  d.casts=Array.isArray(d.casts)?d.casts:[]; d.tables=Array.isArray(d.tables)?d.tables:[];
  d.casts.forEach(c=>{c.ngTables=Array.isArray(c.ngTables)?c.ngTables:[];c.sends=Number(c.sends)||0;c.penalty=!!c.penalty;c.inHouse=!!c.inHouse;c.working=c.working!==false;if(!c.nameColor)c.nameColor={C:"#4cff5a",B:"#43a2ff",A:"#ffd54a",S:"#ff5a5f"}[c.rank]||"#ffffff"});
  d.tables.forEach(t=>{if(!("pausedAt" in t))t.pausedAt=null;if(!("totalPaused" in t))t.totalPaused=0;if(!("turnCounter" in t))t.turnCounter=Number(t.roundCounter)||0;if(!("startedAt" in t))t.startedAt=null;if(!("durationSec" in t))t.durationSec=900;if(!("autoTimer" in t))t.autoTimer=true;if(!("rotationStartedAt" in t))t.rotationStartedAt=null;if(!("nextDurationSec" in t))t.nextDurationSec=null});
  const counters={};
  Object.keys(d.seated).forEach(k=>{if(!d.seated[k]){delete d.seated[k];return}const tid=k.split(":")[1];counters[tid]=(counters[tid]||0)+1;if(typeof d.seated[k]!=="object")d.seated[k]={turn:counters[tid],at:Date.now()};else{d.seated[k].turn=Number(d.seated[k].turn||d.seated[k].order)||counters[tid];d.seated[k].at=Number(d.seated[k].at)||Date.now();delete d.seated[k].order}});
  d.tables.forEach(t=>{const max=Math.max(0,...Object.entries(d.seated).filter(([k])=>k.endsWith(":"+t.id)).map(([,v])=>Number(v.turn)||0));t.turnCounter=Math.max(Number(t.turnCounter)||0,max)});
  return d;
}
function load(){try{const c=JSON.parse(localStorage.getItem(STORAGE_KEY));if(c?.casts&&c?.tables)return normalize(c);for(const k of MIGRATION_KEYS){const o=JSON.parse(localStorage.getItem(k));if(o?.casts&&o?.tables)return normalize(o)}}catch(e){}return cloneDefault()}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function pairKey(c,t){return c+":"+t}
function rankIndex(r){return["C","B","A","S"].indexOf(r)}
function sortCasts(){data.casts.sort((a,b)=>rankIndex(a.rank)-rankIndex(b.rank))}
function dateTimeText(ts){return new Intl.DateTimeFormat("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).format(new Date(ts))}
function elapsedSeconds(t){if(!t.startedAt)return 0;const end=t.pausedAt||Date.now();return Math.max(0,Math.floor((end-t.startedAt-(t.totalPaused||0))/1000))}
function remainingSeconds(t){return Math.max(0,(Number(t.durationSec)||0)-elapsedSeconds(t))}
function overtimeSeconds(t){return Math.max(0,elapsedSeconds(t)-(Number(t.durationSec)||0))}
function mmss(sec){sec=Math.max(0,Math.floor(sec));return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")}
function formatTimer(t){if(!t.startedAt)return"未開始";const over=overtimeSeconds(t);return over>0?"超過 "+mmss(over):mmss(remainingSeconds(t))}
function timerClass(t){if(!t.startedAt)return"not-started";if(t.pausedAt)return"paused";return overtimeSeconds(t)>0||remainingSeconds(t)===0?"over":""}
function startTimer(t){
  if(t.autoTimer!==false&&t.nextDurationSec){
    t.durationSec=t.nextDurationSec;
    t.nextDurationSec=null;
  }
  if(!t.rotationStartedAt)t.rotationStartedAt=Date.now();
  t.startedAt=Date.now();t.pausedAt=null;t.totalPaused=0
}
function isCompanion(t){return t.plan==="お連れ様"}
function eligibility(c,t){
  const r=[];
  const companion=isCompanion(t);
  const vip=t.plan==="VIP";

  // 卓別NGはすべての卓で適用
  if((c.ngTables||[]).includes(t.id))r.push("この卓はNG");

  // VIPはA・Sランクのみ。送り制限中・場内中でも着席可能
  if(vip&&!["A","S"].includes(c.rank)){
    r.push("VIPプランはA・Sランクのみ");
  }

  // 勤怠ペナルティは初回のみ。お連れ様には適用しない
  if(!companion&&c.penalty){
    r.push("勤怠ペナルティ中（初回のみ）");
  }

  // 場内中は通常の初回卓に着席不可。VIP・お連れ様は対象外
  if(!companion&&!vip&&c.inHouse){
    r.push("場内中：通常の初回卓には着席不可");
  }

  // 送り2回制限はA・Bプランの初回卓に全ランク適用
  // ランクがA・Sでも、送り制限中はA・Bプランに着席不可
  // 適用外はVIPプランとお連れ様卓
  if(!companion&&!vip&&c.sends>=2){
    r.push("2送り：A・Bプランの初回卓には着席不可");
  }

  return{ok:r.length===0,reasons:r}
}
function seatRecord(c,t){return data.seated[pairKey(c,t)]||null}

function castStats(c){
  let initial=0,branch=0;
  data.history.forEach(h=>{
    if(h.type!=="seat"||!(h.castIds||[]).includes(c.id))return;
    if(h.plan==="お連れ様")branch++;else initial++;
  });

}
function isSendNominee(c,t){return (data.sendNominees[t]||[]).includes(c)}
function toggleSendNominee(castId,tableId){
  const table=data.tables.find(x=>x.id===tableId);
  const cast=data.casts.find(x=>x.id===castId);
  if(!table||!cast)return;
  const arr=data.sendNominees[tableId]||[];
  const removing=arr.includes(castId);
  data.sendNominees[tableId]=removing?arr.filter(x=>x!==castId):[...arr,castId];

  // お連れ様の送りは送り数へ反映しない。初回卓の送りだけ反映。
  if(!isCompanion(table)){
    cast.sends=Math.max(0,(Number(cast.sends)||0)+(removing?-1:1));
  }
  recalculateAllTimers();
}
function senderNames(t){return (data.sendNominees[t.id]||[]).map(id=>data.casts.find(c=>c.id===id)?.name).filter(Boolean)}

function isRejected(c,t){return (data.rejections[t]||[]).includes(c)}
function toggleRejection(c,t){
  const arr=data.rejections[t]||[];
  data.rejections[t]=arr.includes(c)?arr.filter(x=>x!==c):[...arr,c];
  const table=data.tables.find(x=>x.id===t);
  if(table){table.autoTimer=true;recalculateAutoTimer(table)}
}
function eligibleWorkingCasts(t){
  return data.casts.filter(c=>c.working!==false&&eligibility(c,t).ok&&!isRejected(c.id,t.id))
}
function rotationElapsedSeconds(t){
  if(!t.rotationStartedAt)return 0;
  const end=t.pausedAt||Date.now();
  return Math.max(0,Math.floor((end-t.rotationStartedAt)/1000))
}
function autoTimerPlan(t){
  const all=eligibleWorkingCasts(t);
  const remaining=all.filter(c=>!seatRecord(c.id,t.id));

  // お客様人数に関係なく、原則2名ずつ回す。
  const seatsPerTurn=2;
  const totalTurns=Math.max(1,Math.ceil(all.length/seatsPerTurn));
  const remainingTurns=Math.max(1,Math.ceil(remaining.length/seatsPerTurn));

  // 回し開始後は経過時間を差し引き、残りを約50分内に収め直す。
  const elapsed=rotationElapsedSeconds(t);
  const remainingBudget=t.rotationStartedAt
    ?Math.max(60*remainingTurns,3000-elapsed)
    :3000;

  const raw=remainingBudget/remainingTurns;
  const duration=Math.max(60,Math.min(3000,Math.round(raw/5)*5));

  return{
    eligible:all.length,
    remaining:remaining.length,
    seatsPerTurn,
    turns:totalTurns,
    remainingTurns,
    elapsed,
    duration,
    remainingTotal:duration*remainingTurns,
    projectedTotal:elapsed+duration*remainingTurns
  }
}
function recalculateAutoTimer(t,applyNow=false){
  if(!t||t.autoTimer===false)return;

    t.nextDurationSec=null;
  }else{
    t.nextDurationSec=p.duration;
  }
  t.autoTurns=p.turns;
  t.autoEligible=p.eligible;
}

  const [h,m]=t.start.split(":").map(Number);
  const d=new Date();d.setHours(h,m,0,0);return d
}

}
function estimateEndTime(t){
  const p=autoTimerPlan(t);
  if(t.rotationStartedAt)return hm(Date.now()+p.remainingTotal*1000);
  const guide=parseGuideTime(t);

}
function stateFor(c,t){
  if(seatRecord(c.id,t.id))return"checked";
  if(data.rejectionTableId===t.id)return isRejected(c.id,t.id)?"rejected":"empty";
  if(data.planningTableId===t.id&&isCompanion(t))return isPlanned(c.id,t.id)?"planned":"empty";
  if(isRejected(c.id,t.id))return"rejected";
  if(c.working===false)return"blocked";
  if(!eligibility(c,t).ok)return"blocked";
  if(data.selected[pairKey(c.id,t.id)])return"selected";
  if(isCompanion(t)&&isPlanned(c.id,t.id))return"planned";
  return"empty"
}

}

  const t=data.tables.find(x=>x.id===id);if(!t)return;
  recalculateAutoTimer(t);const state=!t.startedAt?"未開始":t.pausedAt?"一時停止中":"計測中",senders=senderNames(t),ap=autoTimerPlan(t),rejects=(data.rejections[t.id]||[]).map(id=>data.casts.find(c=>c.id===id)?.name).filter(Boolean);
  openSheet(`<h2>${esc(t.number)}・操作</h2><div class="timer-panel"><div>${state}</div><div class="timer-panel-value ${timerClass(t)}">${formatTimer(t)}</div><div>設定 ${mmss(t.durationSec)}／${t.people}名・${esc(t.plan)}</div><div class="small-note">出勤・制限・拒否を反映：対象${ap.eligible}名・残${ap.remaining}名 → 原則2名ずつ、残${ap.remainingTurns}ターン／現在の自動タイマー ${mmss(t.durationSec)}／終了目安 ${estimateEndTime(t)}</div></div><div class="sheet-actions">${!t.startedAt?'<button class="start-timer" id="startTimerBtn">タイマースタート</button>':t.pausedAt?'<button class="start-timer" id="resumeTimerBtn">タイマー再開</button>':'<button class="pause" id="pauseTimerBtn">一時停止</button>'}<button class="cancel" id="resetTimerBtn">未開始に戻す</button></div><div class="sheet-actions"><button class="danger" id="rejectBtn">${data.rejectionTableId===t.id?"着席拒否チェック終了":"着席拒否を設定"}</button><button class="danger" id="senderBtn">${data.senderTableId===t.id?"送り指名チェック終了":"送り指名を設定"}</button>${isCompanion(t)?`<button class="plan-btn" id="planningBtn">${data.planningTableId===t.id?"予定者チェック終了":"予定者をチェック"}</button>`:""}</div><div class="sender-list">着席拒否：${rejects.length?rejects.map(esc).join("・"):"なし"}</div><div class="sender-list">送り指名：${senders.length?senders.map(esc).join("・"):"なし"}</div><div class="small-note">着席拒否チェック中はセルをタップすると🙅になります。対象人数とターン数を再計算し、約50分で終わるタイマーへ自動変更します。</div><div class="sheet-actions"><button class="cancel" id="cancelSheet">閉じる</button>${data.settings.editMode?'<button class="save" id="editTableBtn">卓情報を編集</button>':""}</div>`);
  document.getElementById("cancelSheet").onclick=closeSheet;
  if(!t.startedAt)document.getElementById("startTimerBtn").onclick=()=>{recalculateAutoTimer(t,true);startTimer(t);save();closeSheet();render()};else if(t.pausedAt)document.getElementById("resumeTimerBtn").onclick=()=>{t.totalPaused=(t.totalPaused||0)+(Date.now()-t.pausedAt);t.pausedAt=null;save();closeSheet();render()};else document.getElementById("pauseTimerBtn").onclick=()=>{t.pausedAt=Date.now();save();closeSheet();render()};
  document.getElementById("resetTimerBtn").onclick=()=>{if(confirm("タイマーを未開始に戻しますか？")){t.startedAt=null;t.pausedAt=null;t.totalPaused=0;t.rotationStartedAt=null;t.nextDurationSec=null;save();closeSheet();render()}};
  document.getElementById("rejectBtn").onclick=()=>{data.rejectionTableId=data.rejectionTableId===t.id?null:t.id;data.senderTableId=null;data.planningTableId=null;activeTableId=t.id;clearSelections();save();closeSheet();render()};
  document.getElementById("senderBtn").onclick=()=>{
if(data.senderTableId!==t.id){
data.senderTableId=t.id;data.planningTableId=null;data.rejectionTableId=null;activeTableId=t.id;clearSelections();save();closeSheet();render();
}else{
t.collapsed=true;
if(t.startedAt&&!t.pausedAt)t.pausedAt=Date.now();
data.history.unshift({id:"h"+Date.now(),type:"table-finish",at:Date.now(),tableId:t.id,tableNumber:t.number,plan:t.plan,people:t.people,castIds:[],castNames:senderNames(t),note:"回し終了"});
data.senderTableId=null;data.planningTableId=null;data.rejectionTableId=null;
activeTableId=data.tables.find(x=>!x.collapsed&&x.id!==t.id)?.id||null;
save();closeSheet();render();
}};
  if(isCompanion(t))document.getElementById("planningBtn").onclick=()=>{data.planningTableId=data.planningTableId===t.id?null:t.id;data.senderTableId=null;data.rejectionTableId=null;activeTableId=t.id;clearSelections();save();closeSheet();render()};
  const finishTableBtn=document.getElementById("finishTableBtn");
  if(finishTableBtn)finishTableBtn.onclick=()=>{if(confirm(`${t.number}の回しを終了して細く折りたたみますか？`)){t.collapsed=true;t.pausedAt=t.startedAt?Date.now():null;data.history.unshift({id:"h"+Date.now(),type:"table-finish",at:Date.now(),tableId:t.id,tableNumber:t.number,plan:t.plan,people:t.people,castIds:[],castNames:senderNames(t),note:"回し終了・折りたたみ"});data.senderTableId=null;data.planningTableId=null;activeTableId=data.tables.find(x=>!x.collapsed&&x.id!==t.id)?.id||null;save();closeSheet();render()}};
  const editTableBtn=document.getElementById("editTableBtn");
  if(editTableBtn)editTableBtn.onclick=()=>openTable(t.id)
}
function showReason(c,t){
  const reasons=[];
  if(c.working===false)reasons.push("本日休み");
  if(isRejected(c.id,t.id))reasons.push("この卓で着席拒否");
  reasons.push(...eligibility(c,t).reasons);
  openSheet(`<h2>${esc(c.name)} → ${esc(t.number)}</h2><div class="reason">🚫 ${reasons.map(esc).join("<br>")}</div><div class="sheet-actions"><button class="cancel" id="cancelSheet">閉じる</button></div>`);
  document.getElementById("cancelSheet").onclick=closeSheet
}
function showSeatDetail(c,t){const r=seatRecord(c.id,t.id);openSheet(`<h2>${esc(c.name)}・${esc(t.number)}</h2><div class="reason">回った順番：<strong>${r?.turn||"-"}ターン目</strong><br>着席時刻：${r?.at?dateTimeText(r.at):"-"}</div><div class="sheet-actions"><button class="cancel" id="cancelSheet">閉じる</button><button class="danger" id="unseatBtn">着席を解除</button></div>`);document.getElementById("cancelSheet").onclick=closeSheet;document.getElementById("unseatBtn").onclick=()=>{
  const rec=seatRecord(c.id,t.id);
  delete data.seated[pairKey(c.id,t.id)];
  const h=data.history.find(x=>x.type==="seat"&&x.tableId===t.id&&x.turn===rec?.turn&&(x.castIds||[]).includes(c.id));
  if(h){
    const idx=h.castIds.indexOf(c.id);
    h.castIds=h.castIds.filter(id=>id!==c.id);
    h.castNames=(h.castNames||[]).filter((_,i)=>i!==idx);
    if(!h.castIds.length)data.history=data.history.filter(x=>x.id!==h.id);
  }
  recalculateAutoTimer(t,false);save();closeSheet();render()
}}
function showHistory(){openSheet(`<h2>着席履歴</h2><div class="history-list">${data.history.length?data.history.map(h=>`<div class="history-item"><div class="history-top"><span class="history-table">${esc(h.tableNumber||"")}</span><span class="history-time">${dateTimeText(h.at)}</span></div><div class="history-casts">${h.turn?`<span class="round-badge">${h.turn}ターン目</span>`:""}${h.type==="table-close"?"卓終了":h.type==="table-finish"?"回し終了（送り："+esc((h.castNames||[]).join("・")||"なし")+")":esc((h.castNames||[]).join("・"))}</div><div class="history-meta">${h.people||""}名・${esc(h.plan||"")}${h.note?"／"+esc(h.note):""}</div></div>`).join(""):'<div class="empty-history">まだ履歴はありません</div>'}</div><div class="sheet-actions"><button class="danger" id="clearHistory">履歴削除</button><button class="cancel" id="cancelSheet">閉じる</button></div>`);document.getElementById("cancelSheet").onclick=closeSheet;document.getElementById("clearHistory").onclick=()=>{if(confirm("履歴を削除しますか？")){data.history=[];save();closeSheet();render()}}}
function downloadBackup(){const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="SWAMP-FOG_Ver8.2_backup_"+new Date().toISOString().slice(0,10)+".json";a.click();URL.revokeObjectURL(url)}
function openMenu(){openSheet(`<h2>メニュー</h2><div class="menu-grid"><button id="historyMenu">履歴を見る</button><button id="addCastMenu">キャスト追加</button><button id="bulkAddCastMenu">まとめて追加</button><button id="backupMenu">バックアップ</button><button id="importMenu">復元</button><button id="endBusinessMenu">営業終了</button></div><div class="small-note">出勤・制限・拒否を反映して原則2名ずつの残りターンを計算し、表示中のタイマーを目安に回します。キャストは「まとめて追加」から一括登録できます。</div><div class="sheet-actions"><button class="cancel" id="cancelSheet">閉じる</button></div>`);document.getElementById("cancelSheet").onclick=closeSheet;document.getElementById("historyMenu").onclick=showHistory;document.getElementById("addCastMenu").onclick=()=>openCast();document.getElementById("bulkAddCastMenu").onclick=openBulkCastAdd;document.getElementById("backupMenu").onclick=downloadBackup;document.getElementById("importMenu").onclick=()=>document.getElementById("importInput").click();document.getElementById("endBusinessMenu").onclick=endBusiness}
function endBusiness(){
  if(confirm("営業を終了しますか？\n着席実績・送り数・初回停止・勤怠ペナルティ・場内中・卓NGをリセットします。")){
    data.seated={};data.planned={};data.sendNominees={};data.rejections={};data.history=[];
    clearSelections();
    data.casts.forEach(c=>{
      c.sends=0;
      c.penalty=false;
      c.inHouse=false;
      c.working=true;
      c.ngTables=[];
    });
    data.tables=[];
    data.planningTableId=null;data.senderTableId=null;data.rejectionTableId=null;
    activeTableId=null;save();closeSheet();render()
  }
}
document.getElementById("modeBtn").onclick=()=>{data.settings.editMode=!data.settings.editMode;clearSelections();data.planningTableId=null;data.senderTableId=null;data.rejectionTableId=null;save();render()};
document.getElementById("menuBtn").onclick=openMenu;document.getElementById("addTableBtn").onclick=()=>openTable();document.getElementById("clearSelectBtn").onclick=()=>{clearSelections();data.planningTableId=null;data.senderTableId=null;data.rejectionTableId=null;save();render()};
document.getElementById("seatBtn").onclick=()=>{const t=activeTable(),casts=selectedForActive();if(!t||!casts.length)return;t.turnCounter=(Number(t.turnCounter)||0)+1;const turn=t.turnCounter,at=Date.now();casts.forEach(c=>{data.seated[pairKey(c.id,t.id)]={turn,at};delete data.selected[pairKey(c.id,t.id)];if(isCompanion(t))delete data.planned[pairKey(c.id,t.id)]});data.history.unshift({id:"h"+at,type:"seat",at,tableId:t.id,tableNumber:t.number,plan:t.plan,people:t.people,castIds:casts.map(c=>c.id),castNames:casts.map(c=>c.name),turn,note:"着席・自動再計算・カウントダウン再スタート"});recalculateAutoTimer(t,true);startTimer(t);save();render()};
document.getElementById("importInput").addEventListener("change",async e=>{const f=e.target.files?.[0];if(!f)return;try{const p=JSON.parse(await f.text());if(!p?.casts||!p?.tables)throw 0;if(confirm("復元しますか？")){data=normalize(p);activeTableId=data.tables[0]?.id||null;save();closeSheet();render()}}catch(err){alert("復元できません")}e.target.value=""});
setInterval(()=>{
  let changed=false;
  data.tables.forEach(t=>{
    if(t.autoTimer!==false&&t.startedAt&&overtimeSeconds(t)>0){
      const before=t.nextDurationSec;
      recalculateAutoTimer(t,false);
      if(before!==t.nextDurationSec)changed=true;
    }
    const el=document.querySelector(`[data-table-timer="${t.id}"]`);
    if(el){el.textContent=formatTimer(t);el.className="timer "+timerClass(t)}
  });
  if(changed){save();render()}
},1000);
sortCasts();recalculateAllTimers();render();
</script>
