<script>
const SCHEMA_VERSION='11.2.1-stable';
const ROOT_KEY='swamp-flow-v11-root';
const CASTS_KEY='swamp-flow-v11-casts';
const TABLES_KEY='swamp-flow-v11-tables';
const OPERATIONS_KEY='swamp-flow-v11-operations';
const HISTORY_KEY='swamp-flow-v11-history';
const SETTINGS_KEY='swamp-flow-v11-settings';
const LEGACY_KEYS=['swamp-flow-v10.9','swamp-flow-v10.5'];
const TABLE_SNAPSHOT_KEY='swamp-flow-table-snapshot-v11';
const sample={casts:[
{id:'c1',name:'れい',rank:'S',team:'#9b6cff'},{id:'c2',name:'ゆうせい',rank:'S',team:'#4fc3f7'},{id:'c3',name:'のあ',rank:'S',team:'#ff7da8'},{id:'c4',name:'たいが',rank:'A',team:'#65d58a'},{id:'c5',name:'かぐや',rank:'A',team:'#ffd15c'},{id:'c6',name:'りょうすけ',rank:'B',team:'#ff9966'},{id:'c7',name:'なつき',rank:'C',team:'#7da1ff'}],tables:[],refusals:{},history:[],settings:{sendLimit:2}};
let state=load(),selectedCast=null,selectedTable=null,editTableId=null,longTimer=null;
function clone(x){return JSON.parse(JSON.stringify(x))}
function normalize(s){s=s&&typeof s==='object'?s:clone(sample);s.casts=Array.isArray(s.casts)?s.casts:[];s.tables=Array.isArray(s.tables)?s.tables:[];s.refusals=s.refusals||{};s.history=Array.isArray(s.history)?s.history:[];s.settings={sendLimit:2,...(s.settings||{})};s.casts.forEach((c,i)=>Object.assign(c,{id:c.id||'c'+Date.now()+i,rank:c.rank||'C',team:c.team||'#777777',working:c.working!==false,sends:Number(c.sends)||0,penalty:!!c.penalty,inHouse:!!c.inHouse,ngTables:Array.isArray(c.ngTables)?c.ngTables:[],currentTable:c.currentTable||null,preparingFor:c.preparingFor||null,order:Number.isFinite(c.order)?c.order:i}));s.tables.forEach(t=>{let companion=t.plan==='お連れ様';Object.assign(t,{active:t.active!==false,seated:Array.isArray(t.seated)?t.seated:[],senders:Array.isArray(t.senders)?t.senders:[],senderPending:Array.isArray(t.senderPending)?t.senderPending:[],lastSeatAt:t.lastSeatAt||null,ownerId:t.ownerId||'',timerMode:t.timerMode||'manual',targetMin:Number(t.targetMin)||(companion?45:50),cycleSec:Number(t.cycleSec)||Math.round((Number(t.cycle)||(companion?5:3))*60),lead:Number(t.lead)||90,rotationSize:[1,2,3].includes(Number(t.rotationSize))?Number(t.rotationSize):2,currentCastIds:Array.isArray(t.currentCastIds)?t.currentCastIds:(t.currentCastId?[t.currentCastId]:[]),companionPicks:Array.isArray(t.companionPicks)?t.companionPicks:[],companionApplicants:Array.isArray(t.companionApplicants)?t.companionApplicants:[],vipExceptions:Array.isArray(t.vipExceptions)?t.vipExceptions:[],groupNo:Number(t.groupNo)||0,autoHandledAt:Number(t.autoHandledAt)||0,rotationEnded:!!t.rotationEnded});delete t.currentCastId;t.cycle=t.cycleSec/60});return s}
function operationFromState(s){
  return {
    refusals:clone(s.refusals||{}),
    castStatus:Object.fromEntries((s.casts||[]).map(c=>[c.id,{
      working:c.working!==false,sends:Number(c.sends)||0,penalty:!!c.penalty,
      inHouse:!!c.inHouse,ngTables:clone(c.ngTables||[]),currentTable:c.currentTable||null,
      preparingFor:c.preparingFor||null
    }])),
    tableStatus:Object.fromEntries((s.tables||[]).map(t=>[t.id,{
      active:t.active!==false,seated:clone(t.seated||[]),senders:clone(t.senders||[]),
      senderPending:clone(t.senderPending||[]),lastSeatAt:t.lastSeatAt||null,
      currentCastIds:clone(t.currentCastIds||[]),groupNo:Number(t.groupNo)||0,
      autoHandledAt:Number(t.autoHandledAt)||0,rotationEnded:!!t.rotationEnded
    }]))
  }
}
function splitState(s){
  const operations=operationFromState(s);
  const casts=(s.casts||[]).map(c=>({id:c.id,name:c.name,rank:c.rank,team:c.team,order:c.order}));
  const tables=(s.tables||[]).map(t=>{const x=clone(t);['active','seated','senders','senderPending','lastSeatAt','currentCastIds','groupNo','autoHandledAt','rotationEnded'].forEach(k=>delete x[k]);return x});
  return {casts,tables,operations,history:clone(s.history||[]),settings:clone(s.settings||{})}
}
function mergeStore(parts){
  const base={casts:clone(parts.casts||[]),tables:clone(parts.tables||[]),refusals:clone(parts.operations?.refusals||{}),history:clone(parts.history||[]),settings:clone(parts.settings||{})};
  const castStatus=parts.operations?.castStatus||{},tableStatus=parts.operations?.tableStatus||{};
  base.casts.forEach(c=>Object.assign(c,clone(castStatus[c.id]||{})));
  base.tables.forEach(t=>Object.assign(t,clone(tableStatus[t.id]||{})));
  return normalize(base)
}
function readJson(key,fallback){try{const raw=localStorage.getItem(key);return raw?JSON.parse(raw):fallback}catch{return fallback}}
function load(){
  try{
    const root=readJson(ROOT_KEY,null);
    if(root?.schemaVersion&&String(root.schemaVersion).startsWith('11.')){
      return mergeStore({
        casts:readJson(CASTS_KEY,[]),tables:readJson(TABLES_KEY,[]),
        operations:readJson(OPERATIONS_KEY,{}),history:readJson(HISTORY_KEY,[]),
        settings:readJson(SETTINGS_KEY,{sendLimit:2})
      })
    }
    for(const key of LEGACY_KEYS){
      const raw=localStorage.getItem(key);
      if(raw){const migrated=normalize(JSON.parse(raw));persistSplit(migrated,'legacy-migration');return migrated}
    }
  }catch(e){console.warn('load failed',e)}
  const fresh=normalize(clone(sample));persistSplit(fresh,'fresh-install');return fresh
}
function persistSplit(s,reason='save'){
  const p=splitState(s);
  localStorage.setItem(CASTS_KEY,JSON.stringify(p.casts));
  localStorage.setItem(TABLES_KEY,JSON.stringify(p.tables));
  localStorage.setItem(OPERATIONS_KEY,JSON.stringify(p.operations));
  localStorage.setItem(HISTORY_KEY,JSON.stringify(p.history));
  localStorage.setItem(SETTINGS_KEY,JSON.stringify(p.settings));
  localStorage.setItem(ROOT_KEY,JSON.stringify({schemaVersion:SCHEMA_VERSION,updatedAt:Date.now(),reason}));
}
function save(){persistSplit(state)}
function now(){return Date.now()} function pad(n){return String(n).padStart(2,'0')} function hm(t){let d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())}
function fmt(sec){let neg=sec<0;sec=Math.abs(Math.floor(sec));return(neg?'+':'')+Math.floor(sec/60)+':'+pad(sec%60)}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(s){let e=document.querySelector('#toast');e.textContent=s;e.classList.remove('hidden');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.add('hidden'),1900)}
function tablePhase(t){if(!t.active)return null;if(t.rotationEnded)return{sec:0,stage:'ended'};if(!t.lastSeatAt)return{sec:0,stage:'idle'};let elapsed=(now()-t.lastSeatAt)/1000,remaining=(t.cycleSec||t.cycle*60)-elapsed;if(remaining<=0)return{sec:remaining,stage:'over'};if(remaining<=30)return{sec:remaining,stage:'urgent'};if(remaining<=90)return{sec:remaining,stage:'prepare'};if(remaining<=180)return{sec:remaining,stage:'find'};return{sec:remaining,stage:'normal'}}
function isCompanion(t){return t.plan==='お連れ様'}
function companionCategory(c,t){if(!isCompanion(t))return'';let owner=state.casts.find(x=>x.id===t.ownerId);if((t.companionPicks||[]).includes(c.id))return'担当指名';if(owner&&c.team===owner.team&&c.id!==owner.id)return'同チーム';if((t.companionApplicants||[]).includes(c.id))return'申告者';return''}
function isVipException(c,t){return t.plan==='VIP'&&(t.vipExceptions||[]).includes(c.id)}
function vipExceptionLabel(c,t){return isVipException(c,t)?'VIP例外':''}
function openVipExceptions(tableId){
  const t=state.tables.find(x=>x.id===tableId&&x.active);if(!t||t.plan!=='VIP')return;
  const list=state.casts.filter(c=>['B','C'].includes(c.rank)).sort((a,b)=>rankPriority(a.rank)-rankPriority(b.rank)||(a.order??0)-(b.order??0));
  openUtility(t.no+'・VIP例外キャスト',`<div class="notice">B・Cランクを、このVIP卓だけ着席可能にします。勤怠ペナルティ・休み・卓別NG・着席拒否などは引き続き優先されます。</div><div class="info-card" style="margin-top:10px">${list.map(c=>`<label class="switch-row"><span><b>${esc(c.name)}</b>　${c.rank}ランク</span><input class="vipExCheck" type="checkbox" value="${c.id}" ${(t.vipExceptions||[]).includes(c.id)?'checked':''}></label>`).join('')||'<p class="hint">B・Cランクの登録がありません</p>'}</div><button class="primary" id="saveVipExceptions">保存</button>`);
  const btn=document.querySelector('#saveVipExceptions');if(btn)btn.onclick=()=>{t.vipExceptions=[...document.querySelectorAll('.vipExCheck:checked')].map(x=>x.value);save();closeUtility();render();toast('VIP例外を保存しました')};
}
function staticBlockReason(c,t){if(!c.working)return'本日休み';if((t.seated||[]).includes(c.id))return'着席済み';if(state.refusals[c.id+'|'+t.id])return'着席拒否';if(c.ngTables.includes(t.id))return'卓別NG';if(isCompanion(t)&&t.ownerId===c.id)return'お連れ様担当本人';if(isCompanion(t)&&!companionCategory(c,t))return'お連れ様候補外';if(t.plan==='VIP'&&!['S','A'].includes(c.rank)&&!(t.vipExceptions||[]).includes(c.id))return'VIP対象外';if(c.penalty&&!isCompanion(t))return'勤怠ペナルティ（お連れ様以外不可）';if(c.inHouse&&!isCompanion(t)&&t.plan!=='VIP')return'場内中';if(c.sends>=state.settings.sendLimit&&!isCompanion(t)&&t.plan!=='VIP')return'送り上限';return''}
function eligibleCountFor(plan,ownerId=''){let temp={id:'preview',plan,ownerId,seated:[]};return state.casts.filter(c=>!staticBlockReason(c,temp)).length}
function tableStats(t){let total=state.casts.filter(c=>!staticBlockReason(c,t)).length,done=(t.seated||[]).length,remaining=Math.max(0,total-done),size=t.rotationSize||2,totalTurns=Math.ceil(total/size),doneTurns=Math.floor(done/size),remainingTurns=Math.ceil(remaining/size);return{total,done,remaining,size,totalTurns,doneTurns,remainingTurns}}
function calculateCycleSec(plan,targetMin,count,rotationSize=2){let fallback=plan==='お連れ様'?300:180,turns=Math.ceil(count/Math.max(1,rotationSize));if(!turns)return fallback;return Math.max(60,Math.min(600,Math.round(targetMin*60/turns)))}
function cycleLabel(t){let sec=Math.round(t.cycleSec||t.cycle*60),m=Math.floor(sec/60),r=sec%60;return r?m+'分'+r+'秒':m+'分'}
function preparingCasts(t){return state.casts.filter(c=>c.preparingFor===t.id&&!c.currentTable)}
function blockReason(c,t){if(!c.working)return'本日休み';if(c.currentTable)return'着席中';if(c.preparingFor&&c.preparingFor!==t.id)return'別卓で準備中 '+tableNo(c.preparingFor);if(preparingCasts(t).length>=(t.rotationSize||2)&&c.preparingFor!==t.id)return'準備枠満員 '+preparingCasts(t).map(x=>x.name).join('・');if((t.seated||[]).includes(c.id))return'着席済み';if(state.refusals[c.id+'|'+t.id])return'着席拒否';if(c.ngTables.includes(t.id))return'卓別NG';if(isCompanion(t)&&t.ownerId===c.id)return'お連れ様担当本人';if(isCompanion(t)&&!companionCategory(c,t))return'お連れ様候補外';if(t.plan==='VIP'&&!['S','A'].includes(c.rank)&&!(t.vipExceptions||[]).includes(c.id))return'VIP対象外';if(c.penalty&&!isCompanion(t))return'勤怠ペナルティ（お連れ様以外不可）';if(c.inHouse&&!isCompanion(t)&&t.plan!=='VIP')return'場内中';if(c.sends>=state.settings.sendLimit&&!isCompanion(t)&&t.plan!=='VIP')return'送り上限';return''}
function eligible(c,t){return !!t.active&&!blockReason(c,t)}
function remainingTablesFor(c){return state.tables.filter(t=>t.active&&!t.rotationEnded&&!(t.seated||[]).includes(c.id)&&!staticBlockReason(c,t)).sort((a,b)=>a.entryAt-b.entryAt)}
function candidatesFor(c){return state.tables.filter(t=>eligible(c,t)).sort((a,b)=>a.entryAt-b.entryAt)}
function rankOrder(rank){return({C:0,B:1,A:2,S:3})[rank]??9}
function companionPriority(c,t){let k=companionCategory(c,t);return k==='担当指名'?0:k==='同チーム'?1:k==='申告者'?2:9}
function rankPriority(rank){return rank==='C'?0:rank==='B'?1:rank==='A'?2:3}
function candidatesForTable(t){if(t.rotationEnded)return[];return state.casts.filter(c=>eligible(c,t)&&!c.preparingFor).sort((a,b)=>rankPriority(a.rank)-rankPriority(b.rank)||(isCompanion(t)?companionPriority(a,t)-companionPriority(b,t):0)||((a.order||0)-(b.order||0)))}
function castState(c){if(!c.working)return['blocked','休み'];if(c.preparingFor)return['preparing','準備中 '+tableNo(c.preparingFor)];if(c.currentTable)return['seated','着席 '+tableNo(c.currentTable)];if(!state.tables.some(t=>t.active))return['blocked','対象なし'];let remaining=remainingTablesFor(c),now=candidatesFor(c);if(remaining.length===0)return['done','完走'];if(now.length===0)return['blocked','待機・残'+remaining.length+'卓'];return['available','残'+remaining.length+'卓']}
function tableNo(id){return state.tables.find(t=>t.id===id)?.no||''}
function preparedForTable(t){return preparingCasts(t).slice(0,t.rotationSize||2)}
function completeSwap(t,source='auto'){
 if(!t||!t.active)return false;
 const handledCycleStart=t.lastSeatAt||0;
 let next=preparedForTable(t),current=(t.currentCastIds||[]).map(id=>state.casts.find(c=>c.id===id)).filter(Boolean);
 if(!next.length){if(source==='manual')toast('準備中のキャストがいません');return false}
 let stamp=now();
 current.forEach(previous=>{
   previous.currentTable=null;previous.preparingFor=null;
   state.history.push({type:'leave',cast:previous.id,table:t.id,castName:previous.name,tableNo:t.no,group:t.groupNo||1,at:stamp,reason:'交代'});
 });
 t.currentCastIds=[];t.groupNo=(t.groupNo||0)+1;
 next.forEach((c,i)=>{
   c.currentTable=t.id;c.preparingFor=null;t.currentCastIds.push(c.id);
   t.seated=t.seated||[];if(!t.seated.includes(c.id))t.seated.push(c.id);
   state.history.push({type:'seat',cast:c.id,table:t.id,castName:c.name,tableNo:t.no,turn:t.groupNo,slot:i+1,at:stamp,source});
 });
 t.lastSeatAt=stamp;t.autoHandledAt=handledCycleStart;
 save();
 if(navigator.vibrate)navigator.vibrate([70,40,70]);
 toast((current.map(c=>c.name).join('・')||'空席')+' → '+next.map(c=>c.name).join('・')+' 交代完了');
 return true
}

function seatPreparedGroup(t){
 if(!t||!t.active)return false;
 const prepared=preparedForTable(t);
 if(!prepared.length){toast('準備中のキャストがいません');return false}
 const size=t.rotationSize||2;
 const current=(t.currentCastIds||[]).map(id=>state.casts.find(c=>c.id===id)).filter(Boolean);
 // すでに着席者がいる場合は、準備中グループへまとめて交代
 if(current.length)return completeSwap(t,'manual');
 const stamp=now();
 t.currentCastIds=[];
 t.groupNo=(t.groupNo||0)+1;
 prepared.slice(0,size).forEach((c,i)=>{
   c.currentTable=t.id;
   c.preparingFor=null;
   t.currentCastIds.push(c.id);
   t.seated=t.seated||[];
   if(!t.seated.includes(c.id))t.seated.push(c.id);
   state.history.push({type:'seat',cast:c.id,table:t.id,castName:c.name,tableNo:t.no,turn:t.groupNo,slot:i+1,at:stamp,source:'manual-group'});
 });
 t.lastSeatAt=stamp;
 t.autoHandledAt=0;
 save();
 if(navigator.vibrate)navigator.vibrate([70,40,70]);
 toast(prepared.slice(0,size).map(c=>c.name).join('・')+' → '+t.no+' 同時着席');
 render();
 return true;
}

function processAutoSwaps(){
 // 交代時間を過ぎても、準備中キャストを自動では着席させない。
 // 実際の交代確認後に「今すぐ交代」または手動確定で着席させる。
 return false
}

function openSenderForTable(tid,finishMode=false){let t=state.tables.find(x=>x.id===tid);if(!t)return;openUtility(t.no+'・送り指名',`<div class="notice">1回タップで仮選択、同じキャストを2回目で送り確定。確定済みは長押しで取り消し。${finishMode?'送りを選んだ後、下の「送り有り卓終了」で確定します。':''}</div><div class="sender-grid">${state.casts.filter(c=>c.working).map(c=>{let on=t.senders.includes(c.id),pending=t.senderPending.includes(c.id);return`<button class="sender-btn ${on?'on':pending?'pending':''}" data-sender="${c.id}">${esc(c.name)}<br><small>${on?'送り確定':pending?'もう一度で確定':'送り'+c.sends}</small></button>`}).join('')}</div><p class="hint">確定 ${(t.senders||[]).length}/${t.guests}</p>${finishMode?`<button class="danger" id="finishWithSend" style="width:100%;margin-top:10px" ${(t.senders||[]).length?'':'disabled'}>送り有り卓終了</button>`:''}`);document.querySelectorAll('[data-sender]').forEach(b=>{let cid=b.dataset.sender;bindLong(b,()=>removeSender(t,cid,finishMode));b.onclick=()=>toggleSender(t,cid,finishMode)});let finish=document.querySelector('#finishWithSend');if(finish)finish.onclick=()=>{closeUtility();finalizeTable(t,'withSend')}}
function toggleSender(t,cid,finishMode=false){if(t.senders.includes(cid))return;if(t.senderPending.includes(cid)){t.senderPending=t.senderPending.filter(id=>id!==cid);t.senders.push(cid);let c=state.casts.find(x=>x.id===cid);if(c)c.sends++;state.history.push({type:'send',cast:cid,table:t.id,castName:c?.name||'',tableNo:t.no,at:now()});toast((c?.name||'')+' 送り確定')}else t.senderPending.push(cid);save();openSenderForTable(t.id,finishMode);render()}
function removeSender(t,cid,finishMode=false){let c=state.casts.find(x=>x.id===cid);if(t.senders.includes(cid)){t.senders=t.senders.filter(id=>id!==cid);if(c)c.sends=Math.max(0,c.sends-1);let idx=state.history.map(h=>h.type==='send'&&h.cast===cid&&h.table===t.id).lastIndexOf(true);if(idx>=0)state.history.splice(idx,1)}else t.senderPending=t.senderPending.filter(id=>id!==cid);save();openSenderForTable(t.id,finishMode);render();toast('送り設定を取り消しました')}
function seatGroupsForTable(tid){
 const seats=state.history.filter(h=>h.type==='seat'&&h.table===tid).sort((a,b)=>(Number(a.at)||0)-(Number(b.at)||0)||(Number(a.slot)||0)-(Number(b.slot)||0));
 const groups=[];
 seats.forEach(h=>{
   const key=(h.turn!=null?'turn:'+h.turn:'time:'+Math.floor((Number(h.at)||0)/3000));
   let g=groups.find(x=>x.key===key);
   if(!g){g={key,turn:h.turn||groups.length+1,at:Number(h.at)||0,members:[]};groups.push(g)}
   if(!g.members.some(m=>m.cast===h.cast))g.members.push(h);
 });
 return groups;
}
function allSeatGroups(){
 // 稼働中の卓一覧ではなく履歴そのものから生成する。
 // 卓終了で state.tables から削除されても、着席履歴と営業集計に残る。
 const map=new Map();
 state.history.filter(h=>h.type==='seat').forEach(h=>{
   const tableId=h.table||h.tableId||'';
   const turn=Number(h.turn||h.group||1);
   const key=tableId+'|'+turn;
   if(!map.has(key))map.set(key,{table:tableId,tableNo:h.tableNo||tableNo(tableId)||'卓',turn,at:Number(h.at)||0,members:[]});
   const g=map.get(key);
   g.at=Math.min(g.at||Number(h.at)||0,Number(h.at)||0);
   if(!g.members.some(m=>m.cast===h.cast))g.members.push(h);
 });
 return [...map.values()].sort((a,b)=>b.at-a.at);
}

function removeSeatTurn(tableId,turn){
 if(!confirm(`第${turn}ターンの着席履歴を取り消しますか？\n同時着席した全員が未着席へ戻り、後続ターンを詰め直します。`))return;
 const removed=state.history.filter(h=>h.type==='seat'&&(h.table||h.tableId)===tableId&&Number(h.turn||h.group||1)===Number(turn));
 if(!removed.length){toast('対象の着席履歴がありません');return}
 const removedIds=new Set(removed.map(h=>h.cast));
 state.history=state.history.filter(h=>{
   const sameTable=(h.table||h.tableId)===tableId;
   const hTurn=Number(h.turn||h.group||1);
   if(sameTable&&(h.type==='seat'||h.type==='leave')&&hTurn===Number(turn))return false;
   return true;
 });
 // 後続ターンを1つ前へ詰める
 state.history.forEach(h=>{
   if((h.table||h.tableId)===tableId&&(h.type==='seat'||h.type==='leave')){
     const hTurn=Number(h.turn||h.group||1);
     if(hTurn>Number(turn)){h.turn=hTurn-1;if('group' in h)h.group=hTurn-1}
   }
 });
 const t=state.tables.find(x=>x.id===tableId);
 if(t){
   if(Number(t.groupNo||0)===Number(turn)){
     (t.currentCastIds||[]).forEach(id=>{let c=state.casts.find(x=>x.id===id);if(c&&c.currentTable===t.id)c.currentTable=null});
     t.currentCastIds=[];t.lastSeatAt=null;
   }
   t.groupNo=Math.max(0,Number(t.groupNo||0)-1);
   const remainingSeatIds=[...new Set(state.history.filter(h=>h.type==='seat'&&(h.table||h.tableId)===tableId).map(h=>h.cast))];
   t.seated=remainingSeatIds;
 }
 removedIds.forEach(id=>{
   let c=state.casts.find(x=>x.id===id);
   if(c&&c.currentTable===tableId)c.currentTable=null;
 });
 save();render();toast(`第${turn}ターンを取り消しました`);showHistory();
}

function resetSeatHistory(){
 if(!confirm('着席履歴をリセットしますか？\n営業集計の着席数・卓数もリセットされます。\n卓設定や現在の稼働状況は残ります。'))return;
 state.history=state.history.filter(h=>h.type!=='seat'&&h.type!=='leave');
 save();render();toast('着席履歴をリセットしました');
}
function showHistory(){let groups=allSeatGroups(),others=[...state.history].filter(h=>h.type!=='seat'&&h.type!=='leave').reverse();openUtility('着席・送り履歴',`<div class="notice">卓終了後も着席履歴は残ります。同じターンに着席したキャストを1組として表示します。誤登録はターン単位で取り消せます。</div><div class="info-card" style="margin-top:10px">${groups.map(g=>`<div class="history-item"><b>${esc(g.tableNo)}　第${g.turn}ターン　${esc(g.members.map(m=>m.castName||state.casts.find(c=>c.id===m.cast)?.name||'').join('・'))}</b><small>${new Date(g.at).toLocaleString('ja-JP')}／${g.members.length}名同時着席</small><button class="secondary" data-remove-seat-turn="${esc(g.table)}|${g.turn}" style="width:100%;margin-top:7px">このターンを取り消す</button></div>`).join('')||'着席履歴なし'}</div>${others.length?`<div class="info-card" style="margin-top:10px"><b>その他の履歴</b>${others.map(h=>`<div class="history-item"><b>${esc(h.type==='send'?'送り':h.type==='tableEndWithSend'?'送り有り卓終了':h.type==='tableEndNoSend'?'送り無し卓終了':h.type==='rotationEnd'?'一時終了':'卓終了')}　${esc(h.castName||'')} ${h.tableNo?'→ '+esc(h.tableNo):''}</b><small>${new Date(h.at).toLocaleString('ja-JP')}</small></div>`).join('')}</div>`:''}<button class="danger" id="resetSeatHistory" style="width:100%;margin-top:10px">着席履歴リセット</button>`);document.querySelectorAll('[data-remove-seat-turn]').forEach(b=>b.onclick=()=>{let [tid,turn]=b.dataset.removeSeatTurn.split('|');removeSeatTurn(tid,Number(turn))});document.querySelector('#resetSeatHistory').onclick=()=>{resetSeatHistory();showHistory()}}
function businessSummaryData(){let seats=state.history.filter(h=>h.type==='seat'),rows=state.casts.map(c=>{let hs=seats.filter(h=>h.cast===c.id),sessions=[...new Map(hs.map(h=>[h.table||h.tableId||((h.tableNo||'卓')+'|'+h.at),h.tableNo||tableNo(h.table)||'卓'])).entries()],tables=sessions.map(x=>x[1]);return{c,tableCount:sessions.length,seatCount:hs.length,tables}}).sort((a,b)=>b.tableCount-a.tableCount||b.seatCount-a.seatCount||(a.c.order??0)-(b.c.order??0));let totalTables=new Set(seats.map(h=>h.table||h.tableId||((h.tableNo||'卓')+'|'+h.at))).size,totalSeats=seats.length;return{rows,totalTables,totalSeats}}
function businessSummaryText(){let d=businessSummaryData(),date=new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'numeric',day:'numeric'}).format(new Date());let lines=[`【初回回し営業集計】`,`日付：${date}`,`着席卓数：${d.totalTables}卓`,`総着席回数：${d.totalSeats}回`,''];d.rows.forEach((r,i)=>{lines.push(`${i+1}. ${r.c.name}：${r.tableCount}卓${r.seatCount?`（着席${r.seatCount}回）`:''}`);lines.push(`　${r.tables.length?r.tables.join('・'):'着席なし'}`)});return lines.join('\n')}
async function copyBusinessSummary(){let text=businessSummaryText();try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text)}else{let ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();document.execCommand('copy');ta.remove()}toast('営業集計をコピーしました')}catch(e){openUtility('LINE用営業集計',`<div class="notice">長押ししてコピーしてください。</div><textarea style="width:100%;min-height:55vh;margin-top:10px">${esc(text)}</textarea>`)}}
function showBusinessSummary(){let d=businessSummaryData();openUtility('営業集計',`<div class="notice">営業終わりに「LINE用にコピー」を押すと、そのまま集計係へ送れる文章をコピーできます。</div><div class="row" style="margin-top:10px"><div class="info-card" style="text-align:center"><small>着席した卓</small><div style="font-size:25px;font-weight:950">${d.totalTables}</div></div><div class="info-card" style="text-align:center"><small>総着席回数</small><div style="font-size:25px;font-weight:950">${d.totalSeats}</div></div></div><div class="row" style="margin-top:10px"><button class="primary" id="copyBusinessSummary" style="font-size:16px">LINE用にコピー</button><button class="secondary" id="previewBusinessSummary">コピー内容を表示</button></div><div class="info-card" style="margin-top:10px">${d.rows.map((r,i)=>`<div class="list-row"><span class="count-badge">${i+1}</span><div class="list-main"><b>${esc(r.c.name)}　${r.tableCount}卓</b><small>${r.tables.length?esc(r.tables.join('・')):'着席なし'}${r.seatCount?`／着席${r.seatCount}回`:''}</small></div><strong style="font-size:19px">${r.tableCount}</strong></div>`).join('')}</div><button class="danger" id="summaryResetSeatHistory" style="width:100%;margin-top:10px">着席履歴リセット</button>`);document.querySelector('#copyBusinessSummary').onclick=copyBusinessSummary;document.querySelector('#previewBusinessSummary').onclick=()=>openUtility('LINE用営業集計',`<div class="notice">この文章がコピーされます。必要に応じて編集してから長押しコピーもできます。</div><textarea style="width:100%;min-height:55vh;margin-top:10px">${esc(businessSummaryText())}</textarea>`);document.querySelector('#summaryResetSeatHistory').onclick=()=>{resetSeatHistory();showBusinessSummary()}}
function backup(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='SWAMP-FLOW_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function copyPlainText(text,successMessage='コピーしました'){
  if(navigator.clipboard&&window.isSecureContext){
    return navigator.clipboard.writeText(text).then(()=>toast(successMessage)).catch(()=>fallbackCopyText(text,successMessage));
  }
  return fallbackCopyText(text,successMessage);
}
function fallbackCopyText(text,successMessage){
  try{let ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();document.execCommand('copy');ta.remove();toast(successMessage);return Promise.resolve()}catch(e){return Promise.reject(e)}
}
function endBusiness(){
  if(!confirm('営業を終了しますか？\n\n・卓とタイマーをリセット\n・着席中／準備中を解除\n・一時制限と送り数をリセット\n・出勤状態を全員「出勤」に戻します\n\n本日の営業集計は保存されます。'))return;
  const endedAt=Date.now();
  const summaryText=businessSummaryText();
  const summaryData=businessSummaryData();
  state.settings.businessArchives=Array.isArray(state.settings.businessArchives)?state.settings.businessArchives:[];
  state.settings.businessArchives.unshift({
    id:'business-'+endedAt,
    endedAt,
    text:summaryText,
    totalTables:summaryData.totalTables,
    totalSeats:summaryData.totalSeats,
    rows:summaryData.rows.map(r=>({castId:r.c.id,castName:r.c.name,tableCount:r.tableCount,seatCount:r.seatCount,tables:[...r.tables]})),
    history:clone(state.history||[])
  });
  state.settings.businessArchives=state.settings.businessArchives.slice(0,90);
  state.tables=[];
  state.refusals={};
  state.history=[];
  state.casts.forEach(c=>Object.assign(c,{
    working:true,
    currentTable:null,
    preparingFor:null,
    sends:0,
    penalty:false,
    inHouse:false,
    ngTables:[]
  }));
  save();render();
  openUtility('営業終了しました',`<div class="notice" style="border-color:#2f744c;background:#10251a;color:#a9f3c3">卓・タイマー・一時制限をリセットし、全キャストを出勤状態へ戻しました。本日の営業集計は保存されています。</div><div class="row" style="margin-top:10px"><div class="info-card" style="text-align:center"><small>着席した卓</small><div style="font-size:25px;font-weight:950">${summaryData.totalTables}</div></div><div class="info-card" style="text-align:center"><small>総着席回数</small><div style="font-size:25px;font-weight:950">${summaryData.totalSeats}</div></div></div><button class="primary" id="copyEndedBusinessSummary" style="width:100%;margin-top:10px;font-size:16px">LINE用営業集計をコピー</button><textarea style="width:100%;min-height:34vh;margin-top:10px">${esc(summaryText)}</textarea>`);

// ===== STEP3 着席システム =====
function ensurePending(t){
  if(!Array.isArray(t.pendingCastIds))t.pendingCastIds=[];
  if(!Number.isFinite(Number(t.pendingUpdatedAt)))t.pendingUpdatedAt=0;
  return t.pendingCastIds;
}
function isFirstTurn(t){
  return !(t.seated||[]).length && !(t.currentCastIds||[]).length && !(t.groupNo>0) && !state.history.some(h=>h.type==='seat'&&h.table===t.id);
}
function pendingSecondsLeft(t){
  ensurePending(t);
  if(!t.pendingCastIds.length||isFirstTurn(t))return 5;
  return Math.max(0,Math.ceil((5000-(Date.now()-t.pendingUpdatedAt))/1000));
}
function togglePendingCast(c,t){
  ensurePending(t);
  if(c.currentTable===t.id){toast(c.name+'は現在着席中です');return}
  const idx=t.pendingCastIds.indexOf(c.id);
  if(idx>=0){
    t.pendingCastIds.splice(idx,1);
    if(c.preparingFor===t.id)c.preparingFor=null;
    t.pendingUpdatedAt=Date.now();
    save();render();toast(c.name+'の受付を取り消しました');return;
  }
  let reason=blockReason(c,t);
  if(reason){toast(reason);return}
  if(t.pendingCastIds.length>=3){toast('同時受付は3名までです');return}
  if(c.preparingFor&&c.preparingFor!==t.id){toast('別卓で準備中 '+tableNo(c.preparingFor));return}
  t.pendingCastIds.push(c.id);c.preparingFor=t.id;t.pendingUpdatedAt=Date.now();
  save();render();
  toast(c.name+'を'+t.no+'の受付中へ追加');
}
function cancelPendingGroup(t){
  ensurePending(t);
  t.pendingCastIds.forEach(id=>{let c=state.casts.find(x=>x.id===id);if(c&&c.preparingFor===t.id)c.preparingFor=null});
  t.pendingCastIds=[];t.pendingUpdatedAt=0;save();render();toast(t.no+'の受付を取り消しました');
}
function commitPendingGroup(t,source='manual'){
  ensurePending(t);
  const ids=[...t.pendingCastIds];
  if(!ids.length){toast('キャストを選択してください');return false}
  const at=Date.now();
  // 現在着席中を離席
  (t.currentCastIds||[]).forEach(id=>{let prev=state.casts.find(c=>c.id===id);if(prev){prev.currentTable=null;state.history.push({type:'leave',cast:id,table:t.id,castName:prev.name,tableNo:t.no,turn:t.groupNo||1,at})}});
  t.currentCastIds=[];
  t.groupNo=(Number(t.groupNo)||0)+1;
  ids.forEach((id,slot)=>{
    let c=state.casts.find(x=>x.id===id);if(!c)return;
    c.preparingFor=null;c.currentTable=t.id;
    t.currentCastIds.push(id);
    if(!t.seated.includes(id))t.seated.push(id);
    state.history.push({type:'seat',cast:id,table:t.id,castName:c.name,tableNo:t.no,turn:t.groupNo,slot:slot+1,at});
  });
  t.pendingCastIds=[];t.pendingUpdatedAt=0;t.lastSeatAt=at;t.autoHandledAt=0;
  save();if(navigator.vibrate)navigator.vibrate(80);render();
  toast(ids.map(id=>state.casts.find(c=>c.id===id)?.name).filter(Boolean).join('・')+' → '+t.no+' 同時着席');
  return true;
}
function processPendingGroups(){
  let changed=false;
  state.tables.filter(t=>t.active&&!t.rotationEnded).forEach(t=>{
    ensurePending(t);
    if(!t.pendingCastIds.length||isFirstTurn(t)||!t.pendingUpdatedAt)return;
    if(Date.now()-t.pendingUpdatedAt>=5000){commitPendingGroup(t,'auto');changed=true}
  });
  return changed;
}

 }).join('');

// STEP8: 初回受入判断・自動タイマー
function intakeSettings(){
  state.settings.intake=state.settings.intake||{};
  const i=state.settings.intake;
  if(!Number.isFinite(+i.attendance))i.attendance=state.casts.filter(c=>c.working!==false).length;
  if(!Number.isFinite(+i.totalTables))i.totalTables=state.tables.filter(t=>t.active!==false).length;
  if(!Number.isFinite(+i.newGuests))i.newGuests=2;
  if(![1,2,3].includes(+i.rotationSize))i.rotationSize=2;
  if(!Number.isFinite(+i.targetMin))i.targetMin=50;
  if(typeof i.eventMode!=='boolean')i.eventMode=false;
  return i;
}
function initialEligibleCount(){
  const limit=Number(state.settings.sendLimit)||2;
  return state.casts.filter(c=>c.working!==false&&!c.penalty&&!c.inHouse&&(Number(c.sends)||0)<limit).length;
}
function intakeDecision(overrides={}){
  const base={...intakeSettings(),...overrides};
  const attendance=Math.max(0,+base.attendance||0);
  const totalTables=Math.max(0,+base.totalTables||0);
  const activeInitial=state.tables.filter(t=>t.active!==false&&t.plan!=='お連れ様').length;
  const busy=state.casts.filter(c=>c.currentTable||c.preparingFor).length;
  const restricted=Math.max(0,state.casts.filter(c=>c.working!==false&&(c.penalty||c.inHouse||(Number(c.sends)||0>=(Number(state.settings.sendLimit)||2))).length));
  const computedEligible=initialEligibleCount();
  const available=Math.max(0,Math.min(attendance||computedEligible,computedEligible)-busy);
  const rotation=Math.max(1,Math.min(3,+base.rotationSize||2));
  const target=Math.max(30,Math.min(50,+base.targetMin||50));
  const requiredPeople=Math.max(1,available);
  const turns=Math.max(1,Math.ceil(requiredPeople/rotation));
  const recommendedSec=Math.max(60,Math.min(300,Math.floor(target*60/turns/5)*5));
  const projectedMin=Math.ceil(recommendedSec*turns/60);
  const maxInitial=base.eventMode?3:4;
  const totalLimit=14;
  const reasons=[];
  let level='green';
  if(totalTables>=totalLimit){level='red';reasons.push(`総卓数${totalTables}卓で基準${totalLimit}卓以上`)}
  if(activeInitial>=maxInitial){level='red';reasons.push(`同時初回${activeInitial}卓で上限${maxInitial}卓`)}
  if(available<rotation*2){level='red';reasons.push(`今動かせる候補が${available}名と少ない`)}
  if(recommendedSec<120){level='red';reasons.push(`50分以内完走には1ターン${recommendedSec}秒が必要`)}
  if(level!=='red'){
    if(totalTables>=12){level='yellow';reasons.push(`総卓数${totalTables}卓で制限目安に近い`)}
    if(activeInitial>=maxInitial-1){level='yellow';reasons.push(`同時初回が上限まで残り1卓`)}
    if(available<rotation*4){level='yellow';reasons.push(`今動かせる候補が${available}名`)}
    if(recommendedSec<150){level='yellow';reasons.push(`推奨タイマーが${recommendedSec}秒と短い`)}
  }
  if(!reasons.length)reasons.push('現在の人数・卓数なら目標時間内で完走見込み');
  const totalRoom=Math.max(0,totalLimit-totalTables);
  const initialRoom=Math.max(0,maxInitial-activeInitial);
  const capacity=Math.max(0,Math.min(totalRoom,initialRoom));
  return {level,attendance,totalTables,activeInitial,busy,restricted,available,rotation,target,turns,recommendedSec,projectedMin,reasons,capacity,maxInitial};
}
function intakeLabel(d){return d.level==='red'?'制限推奨':d.level==='yellow'?'注意':'受付可能'}
function renderIntakeBanner(){
  const card=document.querySelector('#openIntakeJudge');if(!card)return;
  const d=intakeDecision();

}
function secText(sec){let m=Math.floor(sec/60),s=sec%60;return s?`${m}分${s}秒`:`${m}分`}
function openIntakeJudge(){
  const i=intakeSettings(),d=intakeDecision();
  openUtility('初回受入判断',`<div class="notice">出勤人数と現在の総卓数を入力し、アプリ内の着席中・準備中・制限状況も合わせて判断します。最終判断は運営が行ってください。</div><div class="form" style="margin-top:10px"><div class="row"><label>出勤人数<input id="jAttendance" type="number" min="0" value="${i.attendance}"></label><label>現在の総卓数<input id="jTotalTables" type="number" min="0" value="${i.totalTables}"></label></div><div class="row"><label>新規初回の人数<select id="jGuests">${Array.from({length:10},(_,x)=>`<option ${i.newGuests===x+1?'selected':''}>${x+1}</option>`).join('')}</select></label><label>1回の回し人数<select id="jRotation"><option value="1" ${i.rotationSize===1?'selected':''}>1人</option><option value="2" ${i.rotationSize===2?'selected':''}>2人（原則）</option><option value="3" ${i.rotationSize===3?'selected':''}>3人</option></select></label></div><div class="row"><label>完走目標<select id="jTarget">${[30,35,40,45,50].map(x=>`<option ${i.targetMin===x?'selected':''}>${x}</option>`).join('')}</select></label><label style="display:flex;align-items:center;gap:8px;margin-top:20px"><input id="jEvent" type="checkbox" ${i.eventMode?'checked':''} style="width:22px;height:22px">イベント日（同時3卓上限）</label></div></div><div id="judgeResult"></div><button class="primary" id="saveJudge" style="width:100%;margin-top:10px">入力値を保存</button>`);
  const read=()=>({attendance:+document.querySelector('#jAttendance').value||0,totalTables:+document.querySelector('#jTotalTables').value||0,newGuests:+document.querySelector('#jGuests').value||2,rotationSize:+document.querySelector('#jRotation').value||2,targetMin:+document.querySelector('#jTarget').value||50,eventMode:document.querySelector('#jEvent').checked});
  const draw=()=>{const x=intakeDecision(read()),el=document.querySelector('#judgeResult');el.innerHTML=`<div class="judge-result ${x.level}"><h4>${x.level==='red'?'🔴':x.level==='yellow'?'🟡':'🟢'} ${intakeLabel(x)}</h4><div class="judge-reasons">${x.reasons.map(r=>'・'+esc(r)).join('<br>')}</div><div class="judge-grid"><div class="judge-metric"><b>${x.available}</b><small>今動かせる候補</small></div><div class="judge-metric"><b>${x.activeInitial}/${x.maxInitial}</b><small>同時初回卓</small></div><div class="judge-metric"><b>${x.turns}T</b><small>想定ターン</small></div><div class="judge-metric"><b>${secText(x.recommendedSec)}</b><small>推奨タイマー</small></div></div><p class="hint">完走見込み：約${x.projectedMin}分／新規受入余力：${x.capacity}卓目安</p></div>`};
  ['jAttendance','jTotalTables','jGuests','jRotation','jTarget','jEvent'].forEach(id=>document.querySelector('#'+id).addEventListener('input',draw));draw();
  document.querySelector('#saveJudge').onclick=()=>{state.settings.intake=read();save();renderIntakeBanner();toast('初回受入判断の入力値を保存しました')};
}
const _renderStep8=render;
render=function(){_renderStep8();renderIntakeBanner()};
setTimeout(()=>{document.querySelector('#openIntakeJudge')?.addEventListener('click',openIntakeJudge);document.querySelector('#intakeJudgeMenu')?.addEventListener('click',openIntakeJudge);renderIntakeBanner()},0);
</script>

<script>
(function(){
  function runSystemDiagnostic(){
    const issues=[];
    const activeTables=state.tables.filter(t=>t.active);
    const tableIds=new Set(state.tables.map(t=>t.id));
    const castIds=new Set(state.casts.map(c=>c.id));
    const activeNos=new Map();
    activeTables.forEach(t=>{
      if(activeNos.has(t.no))issues.push('同じ卓番が重複稼働：'+t.no);
      activeNos.set(t.no,t.id);
      (t.currentCastIds||[]).forEach(id=>{if(!castIds.has(id))issues.push(t.no+'の着席者IDが不明：'+id)});
      (t.seated||[]).forEach(id=>{if(!castIds.has(id))issues.push(t.no+'の着席済IDが不明：'+id)});
      if(![1,2,3].includes(Number(t.rotationSize)))issues.push(t.no+'の回し人数が不正');
      if(!(Number(t.cycleSec)>0))issues.push(t.no+'のタイマー時間が不正');
    });
    state.casts.forEach(c=>{
      if(c.currentTable&&!tableIds.has(c.currentTable))issues.push(c.name+'の着席先が存在しない');
      if(c.preparingFor&&!tableIds.has(c.preparingFor))issues.push(c.name+'の準備先が存在しない');
      if(c.currentTable&&c.preparingFor)issues.push(c.name+'が着席中と準備中を同時保持');
    });
    (state.history||[]).forEach((h,i)=>{
      if(h.cast&&!castIds.has(h.cast)&&!h.castName)issues.push('履歴'+(i+1)+'のキャスト情報が不足');
      if(!h.tableId&&!h.tableNo)issues.push('履歴'+(i+1)+'の卓情報が不足');
    });
    const storageOk=[ROOT_KEY,CASTS_KEY,TABLES_KEY,OPERATIONS_KEY,HISTORY_KEY,SETTINGS_KEY].every(k=>localStorage.getItem(k)!==null);
    if(!storageOk)issues.push('分離保存キーの一部が未保存');
    const summary=`<div class="info-card"><b>${issues.length?'⚠ 診断で確認事項あり':'✓ 診断正常'}</b><p class="hint">キャスト ${state.casts.length}名／稼働卓 ${activeTables.length}卓／履歴 ${(state.history||[]).length}件</p></div>`;
    const body=issues.length?`<div class="notice">${issues.map(x=>'・'+esc(x)).join('<br>')}</div>`:'<div class="notice" style="border-color:#2f744c;background:#10251a;color:#a9f3c3">保存状態・卓状態・着席状態・履歴の基本整合性に問題は見つかりませんでした。</div>';
    openUtility('システム診断',summary+body+'<button class="secondary" id="rerunDiagnostic" style="width:100%;margin-top:10px">もう一度診断</button>');
    document.querySelector('#rerunDiagnostic').onclick=runSystemDiagnostic;
  }
  const btn=document.querySelector('#diagnosticMenu');
  if(btn)btn.onclick=runSystemDiagnostic;
})();


// Ver.11 Stable: PWA・復旧・インストール
const STABLE_RECOVERY_KEY='swamp-flow-v11-stable-recovery';
let deferredInstallPrompt=null;
function saveRecoverySnapshot(){
  try{localStorage.setItem(STABLE_RECOVERY_KEY,JSON.stringify({savedAt:Date.now(),state:state}))}catch(e){}
}
function restoreRecoverySnapshot(){
  try{
    const raw=localStorage.getItem(STABLE_RECOVERY_KEY);if(!raw)return false;
    const snap=JSON.parse(raw);if(!snap?.state)return false;
    if(confirm('前回の自動復旧データがあります。復元しますか？')){
      state=normalize(snap.state);save();render();toast('自動復旧データを復元しました');return true;
    }
  }catch(e){}
  return false;
}
window.addEventListener('beforeunload',saveRecoverySnapshot);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveRecoverySnapshot()});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;toast('ホーム画面への追加が完了しました')});
async function installStableApp(){
  if(deferredInstallPrompt){deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;return}

}

if('serviceWorker' in navigator && location.protocol.startsWith('http')){

<script>
(function(){
  function ensureSimplePending(t){
    if(!Array.isArray(t.pendingCastIds)) t.pendingCastIds=[];
    return t.pendingCastIds;
  }
  window.ensurePending=window.ensurePending||ensureSimplePending;
  window.renderDirectBoard=function(){
    const box=document.querySelector('#directBoard');
    if(!box)return;
    // 毎秒の再描画でも、卓横スクロールと各キャスト一覧の縦位置を保持する。
    const boardScrollLeft=box.scrollLeft;
    const listScrollPositions={};
    box.querySelectorAll('[data-direct-table]').forEach(card=>{
      const list=card.querySelector('.direct-list');
      if(list)listScrollPositions[card.dataset.directTable]=list.scrollTop;
    });
    const tables=state.tables.filter(t=>t.active);
    if(!tables.length){
      box.innerHTML='<div class="info-card" style="min-width:calc(100vw - 20px)">卓設定から卓を追加してください。</div>';
      return;
    }
    box.innerHTML=tables.map(t=>{
      ensureSimplePending(t);
      const p=tablePhase(t);
      const current=(t.currentCastIds||[]).map(id=>state.casts.find(c=>c.id===id)).filter(Boolean);
      const pending=t.pendingCastIds.map(id=>state.casts.find(c=>c.id===id)).filter(Boolean);
      const st=tableStats(t);
      const candidates=state.casts
        .filter(c=>c.working&&!(t.seated||[]).includes(c.id))
        .sort((a,b)=>['S','A','B','C'].indexOf(a.rank)-['S','A','B','C'].indexOf(b.rank)||(a.order??0)-(b.order??0));
      const rankHtml=['S','A','B','C'].map(rank=>{
        const list=candidates.filter(c=>c.rank===rank);
        if(!list.length)return'';
        return '<div class="direct-rank">'+rank+'ランク</div>'+list.map(c=>{
          const reason=blockReason(c,t);
          const selected=t.pendingCastIds.includes(c.id);
          return `<button type="button" class="direct-cast ${reason&&!selected?'blocked':''} ${selected?'pending':''}" data-simple-table="${t.id}" data-simple-cast="${c.id}" style="--team:${esc(c.team)}"><b>${esc(c.name)}</b><small>${selected?'選択中・再タップで取消':reason?esc(reason):'タップで選択'}</small></button>`;
        }).join('');
      }).join('');
      const time=!t.lastSeatAt?'未開始':p.stage==='over'?'超過 '+fmt(p.sec):fmt(p.sec);
      const pendingHtml=pending.length?`<div class="direct-pending"><b>選択中 ${pending.length}名</b><br>${esc(pending.map(c=>c.name).join('・'))}</div>`:'';
      const canUndo=t.lastSeatAt&&p.stage!=='over'&&current.length;
      const currentHtml=current.length?current.map(c=>`<button type="button" class="current-cast-chip" data-simple-undo="${c.id}" data-simple-undo-table="${t.id}" ${canUndo?'':'disabled'}>${esc(c.name)}${canUndo?'　取消':''}</button>`).join(''):'空席';
      return `<section class="direct-table ${p.stage||''} ${pending.length?'accepting':''} ${t.rotationEnded?'direct-table-ended':''}"><button type="button" class="direct-table-head simple-start-head" data-simple-start="${t.id}"><div class="direct-table-title"><b>${esc(t.no)}</b><span>${esc(t.plan)}</span></div><div class="direct-timer">${esc(t.rotationEnded?'一時終了':time)}</div><div class="direct-meta">入店 ${hm(t.entryAt)}／${t.guests}名<br>残${st.remaining}人・残${st.remainingTurns}T</div>${pendingHtml}<div class="tap-start-guide">${pending.length?'ここをタップして着席・タイマースタート':'先にキャストを選択'}</div></button><div class="direct-current"><b>現在着席</b><div class="current-cast-list">${currentHtml}</div></div><div class="direct-list">${t.rotationEnded?'<div class="direct-empty">回し一時終了</div>':rankHtml||'<div class="direct-empty">着席可能キャストなし</div>'}</div><div class="direct-footer">名前を選択 → 上の卓情報をタップ</div></section>`;
    }).join('');
    // DOM差し替え後に、直前のスクロール位置を復元する。
    box.scrollLeft=boardScrollLeft;
    box.querySelectorAll('[data-direct-table]').forEach(card=>{
      const list=card.querySelector('.direct-list');
      const saved=listScrollPositions[card.dataset.directTable];
      if(list&&Number.isFinite(saved))list.scrollTop=saved;
    });
    box.querySelectorAll('[data-simple-cast]').forEach(btn=>{
      btn.addEventListener('click',e=>{
        e.preventDefault();e.stopPropagation();
        const c=state.casts.find(x=>x.id===btn.dataset.simpleCast);
        const t=state.tables.find(x=>x.id===btn.dataset.simpleTable);
        if(!c||!t)return;
        const reason=blockReason(c,t);
        if(reason&&!ensureSimplePending(t).includes(c.id)){toast(reason);return}
        togglePendingCast(c,t);
      });
    });
    box.querySelectorAll('[data-simple-start]').forEach(btn=>{
      btn.addEventListener('click',e=>{
        e.preventDefault();e.stopPropagation();
        const t=state.tables.find(x=>x.id===btn.dataset.simpleStart);
        if(!t)return;
        if(!ensureSimplePending(t).length){toast('先にキャストを選択してください');return}
        commitPendingGroup(t,'table-head');
      });
    });
    box.querySelectorAll('[data-simple-undo]').forEach(btn=>{
      btn.addEventListener('click',e=>{
        e.preventDefault();e.stopPropagation();
        const t=state.tables.find(x=>x.id===btn.dataset.simpleUndoTable);
        const c=state.casts.find(x=>x.id===btn.dataset.simpleUndo);
        if(!t||!c)return;
        const phase=tablePhase(t);
        if(!t.lastSeatAt||phase.stage==='over'){toast('タイマー終了後は着席取消できません');return}
        undoCast(c);
      });
    });
  };
  // Defensive navigation binding. This also repairs versions where direct onclick bindings were lost.
  document.querySelectorAll('nav button[data-page]').forEach(btn=>{
    btn.onclick=()=>{
      document.querySelectorAll('nav button[data-page]').forEach(x=>x.classList.toggle('active',x===btn));
      ['home','tables','status','menu'].forEach(p=>document.querySelector('#'+p+'Page')?.classList.toggle('hidden',p!==btn.dataset.page));
      render();
    };
  });
  const add=document.querySelector('#addTable'); if(add) add.onclick=()=>openTableModal();
  render();
})();
</script>
