
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SWAMP-FOG">
<title>SWAMP-FOG 初回回し Ver.9.0 キャスト起点UI</title>
<style>
:root{
  --name-col:92px;
  --table-col:82px;
  --line:#393939;
  --bg:#0f0f10;
  --panel:#181819;
  --panel2:#252527;
  --green:#52ef87;
  --green-dark:#123c25;
  --blue:#52a9ff;
  --blue-dark:#143653;
  --yellow:#ffd24b;
  --yellow-dark:#4a3b0d;
  --red:#ff6268;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;min-height:100%;background:var(--bg);color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif
}
button,input,select{font:inherit}
button{touch-action:manipulation}
.topbar{
  position:sticky;top:0;z-index:60;
  min-height:46px;padding:6px 7px;
  display:grid;grid-template-columns:74px 1fr 74px;gap:5px;align-items:center;
  background:#202022;border-bottom:1px solid var(--line)
}
.topbar h1{margin:0;text-align:center;font-size:14px;line-height:1.15}
.top-btn{
  height:34px;border:1px solid #555;border-radius:9px;
  background:#2c2c2f;color:#fff;font-size:12px;font-weight:800
}
.top-btn.active{background:#165f36;border-color:#2c9b58}
.statusbar{
  position:sticky;top:46px;z-index:50;
  min-height:35px;padding:5px 7px;
  display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;
  background:#151516;border-bottom:1px solid #333;
  font-size:11px;white-space:nowrap
}
.status-main{overflow:hidden;text-overflow:ellipsis}
.status-count{
  padding:4px 7px;border-radius:999px;background:#343438;font-weight:900
}
.add-table{
  width:44px;height:27px;border:1px solid #555;border-radius:8px;
  background:#2d2d30;color:#fff;font-size:11px;font-weight:900
}
.board-wrap{
  width:100%;height:calc(100dvh - 81px);overflow:auto;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain
}
table{
  border-collapse:separate;border-spacing:0;table-layout:fixed;
  width:max-content;min-width:100%
}
th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
thead th{
  position:sticky;top:0;z-index:8;
  width:var(--table-col);min-width:var(--table-col);max-width:var(--table-col);
  height:82px;padding:4px 2px;background:var(--panel2);
  text-align:center;vertical-align:middle
}
thead th:first-child{
  position:sticky;left:0;z-index:16;
  width:var(--name-col);min-width:var(--name-col);max-width:var(--name-col);
  padding-left:6px;background:#151516;text-align:left;font-size:11px
}
.table-head{cursor:pointer}
.table-head.active{
  background:#263b30;
  box-shadow:inset 0 -3px 0 var(--green)
}
.table-head.planning{background:#4a3b0d;box-shadow:inset 0 -3px 0 var(--yellow)}
.table-no{font-size:17px;font-weight:900;line-height:1}
.start{margin-top:3px;font-size:11px;color:#e2e2e5}
.meta{margin-top:3px;font-size:10px;color:#ccccd0;white-space:nowrap}
.timer{
  margin-top:3px;font-size:15px;line-height:1;font-weight:900;
  color:var(--green);font-variant-numeric:tabular-nums
}
.timer.not-started{color:#a9a9ad;font-size:13px}
.timer.paused{color:#b7b7bb}
.timer.warn{color:var(--yellow)}
.timer.over{color:var(--red)}
.duration{margin-top:1px;font-size:8px;color:#9f9fa5}
tbody tr{height:46px}
tbody td{
  height:46px;min-height:46px;background:#141415;
  text-align:center;vertical-align:middle
}
.cast{
  position:sticky;left:0;z-index:5;
  width:var(--name-col);min-width:var(--name-col);max-width:var(--name-col);
  padding:3px 5px;background:#181819;text-align:left;vertical-align:middle
}
.cast.editable{cursor:pointer}
.cast-line{
  display:flex;align-items:center;gap:3px;min-width:0;
  height:18px;line-height:18px;overflow:visible
}
.rank-dot{
  width:15px;height:15px;border-radius:50%;flex:0 0 auto;
  box-shadow:inset 0 1px 2px rgba(255,255,255,.5)
}
.rank{font-size:12px;font-weight:900;flex:0 0 auto}
.name{
  min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;font-size:13px;font-weight:800
}
.cast-sub{
  margin-top:1px;padding-left:18px;color:#a9a9ad;
  font-size:9px;line-height:11px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis
}
.c .rank,.c .name{color:#4cff5a}
.b .rank,.b .name{color:#43a2ff}
.a .rank,.a .name{color:#ffd54a}
.s .rank,.s .name{color:#ff5a5f}
.c .rank-dot{background:linear-gradient(#4eff57,#08a910)}
.b .rank-dot{background:linear-gradient(#42a8ff,#0758bf)}
.a .rank-dot{background:linear-gradient(#ffe75e,#ffbc00)}
.s .rank-dot{background:linear-gradient(#ff666b,#cb0710)}
.state-cell{
  width:var(--table-col);min-width:var(--table-col);
  max-width:var(--table-col);padding:0;position:relative
}
.state-cell:nth-child(even){background:#171719}
.state-cell.active-column{background:#18231d;box-shadow:inset 2px 0 0 rgba(82,239,135,.28),inset -2px 0 0 rgba(82,239,135,.28)}
tr.cell-focus-row .cast{box-shadow:inset 0 0 0 2px var(--blue)}
.state-cell.cell-focus{z-index:6;box-shadow:inset 0 0 0 3px var(--blue)!important}
.table-head.cell-focus-head{background:#173d55!important;box-shadow:inset 0 -3px 0 var(--blue)!important}
.cell-guide{
  position:fixed;left:50%;top:87px;z-index:75;transform:translateX(-50%);
  max-width:92vw;padding:7px 13px;border:1px solid #63b7ff;border-radius:999px;
  background:rgba(12,40,61,.96);color:#fff;font-size:13px;font-weight:900;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;
  opacity:0;transition:opacity .1s ease
}
.cell-guide.show{opacity:1}
.state-btn{
  width:100%;height:46px;border:0;background:transparent;color:#fff;
  font-size:26px;line-height:1
}
.state-btn:active{filter:brightness(1.25)}
.state-btn.empty{color:#fff}
.state-btn.selected{
  background:var(--blue-dark);color:#8dccff;
  box-shadow:inset 0 0 0 2px var(--blue)
}
.state-btn.checked{
  background:var(--green-dark);color:#75ff9e;
  box-shadow:inset 0 0 0 2px #2bc96b
}
.state-btn.blocked{
  background:#35191b;color:#ff777c;font-size:21px
}
.seat-order{
  display:flex;align-items:center;justify-content:center;gap:3px;
  font-variant-numeric:tabular-nums
}
.order-number{font-size:23px;font-weight:1000;line-height:1}
.order-check{font-size:14px;font-weight:1000}
.bottom{
  position:sticky;bottom:0;z-index:40;
  display:none;
  background:rgba(20,20,21,.98);border-top:1px solid var(--line)
}
.primary,.secondary{
  min-height:42px;border-radius:10px;border:1px solid #555;
  color:#fff;font-weight:900
}
.primary{background:#176b3b;border-color:#2b9a59}
.primary:disabled{opacity:.4}
.secondary{background:#303034;font-size:11px}
.sheet-backdrop{
  position:fixed;inset:0;z-index:90;
  background:rgba(0,0,0,.62);display:none
}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:100;
  max-height:90vh;overflow:auto;
  padding:12px 14px calc(18px + env(safe-area-inset-bottom));
  background:#222225;border-radius:18px 18px 0 0;
  transform:translateY(110%);transition:.2s ease
}
.sheet.open{transform:translateY(0)}
.sheet-backdrop.open{display:block}
.sheet h2{margin:2px 0 12px;font-size:18px}
.sheet h3{margin:16px 0 8px;font-size:14px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}
label{font-size:12px;color:#ccccd0}
input,select{
  width:100%;height:42px;border:1px solid #555;border-radius:9px;
  padding:0 10px;background:#151516;color:#fff
}
.checkrow{display:flex;align-items:center;gap:8px;min-height:38px}
.checkrow input{width:22px;height:22px}
.sheet-actions{display:flex;gap:7px;margin-top:14px}
.sheet-actions button{
  flex:1;min-height:43px;border-radius:10px;border:1px solid #555;
  color:#fff;font-weight:800
}
.save{background:#176b3b}
.start-timer{background:#176b3b;border-color:#2b9a59!important}
.danger{background:#6c2020}
.cancel{background:#333338}
.pause{background:#66520f}
.reason{
  padding:10px;border:1px solid #555;border-radius:10px;
  background:#171719;color:#eee;font-size:14px;line-height:1.5
}
.small-note{margin-top:8px;color:#aaa;font-size:11px;line-height:1.45}
.history-list{display:flex;flex-direction:column;gap:8px}
.history-item{
  padding:10px;border:1px solid #45454a;
  border-radius:11px;background:#171719
}
.history-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.history-table{font-size:16px;font-weight:900}
.history-time{color:#aaa;font-size:11px}
.history-casts{margin-top:5px;font-size:14px;line-height:1.45}
.history-meta{margin-top:4px;color:#aaa;font-size:11px}
.round-badge{
  display:inline-block;min-width:25px;padding:2px 6px;margin-right:5px;
  border-radius:999px;background:#174529;color:#79ffa5;
  text-align:center;font-size:11px;font-weight:900
}
.empty-history{padding:25px 5px;text-align:center;color:#aaa}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.menu-grid button{
  min-height:48px;border:1px solid #555;border-radius:10px;
  background:#303034;color:#fff;font-weight:800
}
.quick-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.quick-row button{
  min-height:40px;border:1px solid #555;border-radius:9px;
  background:#303034;color:#fff;font-weight:800
}
.timer-panel{
  padding:12px;border:1px solid #4b4b50;border-radius:12px;
  background:#171719;text-align:center
}
.timer-panel-value{
  margin:7px 0;font-size:34px;font-weight:1000;
  font-variant-numeric:tabular-nums
}

.rank{color:#a9a9ad!important}
.name{font-weight:900}

.state-btn.rejected{
  background:#3a1719;color:#ff8b90;
  box-shadow:inset 0 0 0 2px #ff6268
}
.reject-badge{
  display:block;margin-top:2px;font-size:9px;font-weight:1000;line-height:1
}
.table-head.reject-mode{
  background:#4a1a1d;
  box-shadow:inset 0 -3px 0 #ff6268
}
.auto-info{
  margin-top:2px;color:#8fd7ff;font-size:9px;line-height:1.2
}
.attendance-off{opacity:.42}
.state-btn.planned{background:var(--yellow-dark);color:#ffe270;box-shadow:inset 0 0 0 2px var(--yellow)}
.plan-mark{font-size:23px;font-weight:1000}
.order-label{font-size:10px;font-weight:1000}
.timer-panel-value.over{color:var(--red)}
.plan-btn{background:#66520f}

.hidden-input{display:none}

.table-head.collapsed{width:48px!important;min-width:48px!important;max-width:48px!important;height:108px;padding:3px 0;background:#1c1c1e;box-shadow:inset 2px 0 0 #555}
.table-head.collapsed .table-no{writing-mode:horizontal-tb;text-orientation:mixed;margin:0 auto 4px;font-size:12px;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46px}
.table-head.collapsed .start,.table-head.collapsed .meta,.table-head.collapsed .timer,.table-head.collapsed .duration{display:none}
.table-head .collapsed-senders{display:none}
.table-head.collapsed .auto-info{display:none}
.table-head.collapsed .collapsed-senders{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  margin:5px auto 0;color:#ffd24b;font-size:9px;font-weight:1000;
  line-height:1.1;max-height:70px;overflow:hidden;writing-mode:horizontal-tb
}
.table-head.collapsed .collapsed-senders .sender-title{
  color:#fff;font-size:8px;letter-spacing:.04em
}
.table-head.collapsed .collapsed-senders .sender-name{
  display:block;max-width:42px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
.end-estimate{margin-top:2px;font-size:9px;color:#8fd7ff;white-space:nowrap}

.state-cell.collapsed{width:48px!important;min-width:48px!important;max-width:48px!important;background:#171719}
.state-cell.collapsed .state-btn{display:none}
.cast-sub.stats{font-size:9px;color:#c5c5ca}
.sender-badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:16px;margin-left:2px;padding:0 3px;border-radius:5px;background:#8b1f28;color:#fff;font-size:9px;font-weight:1000;vertical-align:middle}
.sender-mode{background:#5a1b22!important;box-shadow:inset 0 -3px 0 #ff6268!important}
.sender-list{margin-top:8px;padding:9px;border:1px solid #5a4043;border-radius:9px;background:#211719;color:#ffd8da;font-size:12px;line-height:1.5}
.wheel-row{display:grid;grid-template-columns:1fr auto 1fr auto;gap:7px;align-items:end}
.wheel-row select{height:48px;font-size:18px;font-weight:900;text-align:center}
.wheel-unit{padding-bottom:13px;color:#bbb;font-size:12px}

.cast{border-left:5px solid transparent}
.name{color:#fff!important;text-shadow:0 1px 2px rgba(0,0,0,.75)}
.state-btn.queued{background:#263246;color:#fff;box-shadow:inset 0 0 0 2px #7db7ff}
.state-btn.current-seat{background:#0f5a38!important;color:#fff;box-shadow:inset 0 0 0 3px #52ef87!important}
.turn-number{display:inline-flex;align-items:center;justify-content:center;width:31px;height:31px;font-size:23px;font-weight:1000;line-height:1}
.turn-number.confirmed{border:2px solid currentColor;border-radius:50%;font-size:19px}


.cast-order-list{max-height:58vh;overflow:auto;margin-top:8px;border:1px solid #444;border-radius:10px;background:#171719}
.order-item{display:grid;grid-template-columns:30px 28px 26px 1fr;gap:6px;align-items:center;min-height:48px;padding:6px 10px;border-bottom:1px solid #343438;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.order-item:last-child{border-bottom:0}
.order-grip{font-size:20px;color:#aaa;text-align:center}
.order-rank{font-size:12px;font-weight:1000;color:#ddd}
.order-name{font-size:15px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.order-item.dragging{opacity:.7;background:#23402f;box-shadow:inset 0 0 0 2px var(--green);transform:scale(.99)}
.cast-order-dragging,.cast-order-dragging *{cursor:grabbing!important}
.cast-order-dragging .cast-order-list{overflow:hidden}
.cast-order-dragging .order-item{touch-action:none}

.cast.ai-enabled{cursor:pointer}
.cast.ai-disabled{opacity:.38;filter:grayscale(.35);cursor:not-allowed}
.cast.ai-pending{box-shadow:inset 0 0 0 3px #7db7ff}
.cast-ai-status{margin-top:2px;font-size:10px;font-weight:1000;color:#8fd7ff}
.cast.ai-disabled .cast-ai-status{color:#999}
.cast.ai-pending .cast-ai-status{color:#cde4ff}
.ai-mode-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border-radius:999px;background:#173d55;color:#8fd7ff;font-size:9px;font-weight:1000}

.candidate-list{display:flex;flex-direction:column;gap:9px}
.candidate-card{width:100%;min-height:70px;padding:10px 12px;border:1px solid #4c4c52;border-radius:13px;background:#18181b;color:#fff;text-align:left;display:grid;grid-template-columns:1fr auto;gap:7px;align-items:center}
.candidate-card.recommended{border-color:#52ef87;background:#143522;box-shadow:inset 0 0 0 1px #52ef87}
.candidate-main{min-width:0}
.candidate-title{display:flex;align-items:center;gap:7px;font-size:20px;font-weight:1000}
.candidate-badge{padding:3px 7px;border-radius:999px;background:#237449;color:#caffd8;font-size:10px;font-weight:1000}
.candidate-reason{margin-top:6px;color:#d7d7dc;font-size:12px;line-height:1.4}
.candidate-meta{text-align:right;color:#aeb0b7;font-size:11px;line-height:1.45;white-space:nowrap}
.candidate-empty{padding:25px 10px;text-align:center;border:1px solid #444;border-radius:12px;background:#171719;color:#aaa}


@media(max-width:390px){
  :root{--name-col:84px;--table-col:76px}
  .topbar{grid-template-columns:68px 1fr 68px}
  .topbar h1{font-size:13px}
}
</style>
</head>
<body>
<header class="topbar">
  <button class="top-btn" id="modeBtn">営業モード</button>
  <h1>SWAMP-FOG 初回回し Ver.9.0</h1>
  <button class="top-btn" id="menuBtn">メニュー</button>
</header>

<div class="statusbar">
  <div class="status-main" id="activeLabel">卓を選択してください</div>
  <div class="status-count" id="selectedCount">0名</div>
  <button class="add-table" id="addTableBtn">＋卓</button>
</div>

<div id="cellGuide" class="cell-guide"></div>
<div class="board-wrap">
  <table id="board" aria-label="初回回しボード"></table>
</div>

<div class="bottom">
  <button class="secondary" id="clearSelectBtn">選択解除</button>
  <button class="primary" id="seatBtn" disabled>次を着席</button>
</div>

<div class="sheet-backdrop" id="backdrop"></div>
<section class="sheet" id="sheet" aria-modal="true" role="dialog"></section>
<input class="hidden-input" id="importInput" type="file" accept="application/json">

<script>
const STORAGE_KEY="swamp_fog_v8_14_complete";
const MIGRATION_KEYS=["swamp_fog_v8_8_complete","swamp_fog_v8_7_complete","swamp_fog_v8_6_complete","swamp_fog_v8_5_complete","swamp_fog_v8_4_complete","swamp_fog_v8_3_complete","swamp_fog_v7_9_complete","swamp_fog_v7_8_complete","swamp_fog_v7_7_complete","swamp_fog_v7_6_complete","swamp_fog_v7_5_complete","swamp_fog_v7_4_complete","swamp_fog_v7_3_complete","swamp_fog_v7_2_complete","swamp_fog_v7_complete_1","swamp_fog_v7_gamma_1","swamp_fog_v7_beta_1"];
const defaultData={
  settings:{editMode:false,castOrderInitialized:true,castCentricMode:true},
  casts:[
    {id:"c5",name:"ゆい",rank:"S",nameColor:"#ff5a5f",sends:0,penalty:false,inHouse:false,working:true,ngTables:[]},
    {id:"c4",name:"りな",rank:"A",nameColor:"#ffd54a",sends:2,penalty:false,inHouse:false,working:true,ngTables:[]},
    {id:"c3",name:"みく",rank:"B",nameColor:"#43a2ff",sends:2,penalty:false,inHouse:false,working:true,ngTables:["t2"]},
    {id:"c1",name:"さや",rank:"C",nameColor:"#4cff5a",sends:0,penalty:false,inHouse:false,working:true,ngTables:[]},
    {id:"c2",name:"あい",rank:"C",nameColor:"#4cff5a",sends:1,penalty:false,inHouse:false,working:true,ngTables:[]}
  ],
  tables:[
    {id:"t1",number:"S1",start:"21:05",people:2,plan:"A",durationSec:180,targetMinutes:50,startedAt:null,pausedAt:null,totalPaused:0,turnCounter:0,collapsed:false},
    {id:"t2",number:"VIP1",start:"21:12",people:3,plan:"VIP",durationSec:180,targetMinutes:50,startedAt:null,pausedAt:null,totalPaused:0,turnCounter:0,collapsed:false},
    {id:"t3",number:"A2",start:"21:18",people:1,plan:"お連れ様",durationSec:300,targetMinutes:45,companionCastId:"c5",companionTargetTurns:9,startedAt:null,pausedAt:null,totalPaused:0,turnCounter:0,collapsed:false}
  ],
  seated:{},selected:{},planned:{},planningTableId:null,sendNominees:{},senderPending:{},senderTableId:null,rejections:{},rejectionTableId:null,history:[]
};
let data=load();
let activeTableId=data.tables[0]?.id||null;
data.tables.filter(isCompanion).forEach(t=>{if(t.companionCastId)applyCompanionTeamPlans(t)});
function cloneDefault(){return JSON.parse(JSON.stringify(defaultData))}
function normalize(d){
  d.settings=d.settings||{}; d.settings.editMode=!!d.settings.editMode; if(!("castCentricMode" in d.settings))d.settings.castCentricMode=true;
  d.history=Array.isArray(d.history)?d.history:[]; d.seated=d.seated||{}; d.selected={}; d.planned=d.planned||{}; d.senderPending=d.senderPending||{}; Object.keys(d.planned).forEach(k=>{if(d.planned[k]===true)d.planned[k]={turn:null,at:Date.now()}}); d.planningTableId=null; d.sendNominees=d.sendNominees||{}; d.senderTableId=null; d.rejections=d.rejections||{}; d.rejectionTableId=null;

function flashAiGuide(c,t,confirmed=false){

function candidateSortValue(c,t){
  const overdue=t.startedAt&&remainingSeconds(t)===0?1:0;
  const guide=parseGuideTime(t);
  const entry=guide?guide.getTime():0;
  const scarcity=Math.max(0,100-tableScarcity(t));
  const remaining=isCompanion(t)?companionSelectionPlan(t).remainingTurns:autoTimerPlan(t).remainingTurns;
  return [overdue,entry,scarcity,remaining];
}
function sortedCandidateTables(c){
  return candidateTablesForCast(c).sort((a,b)=>{
    const av=candidateSortValue(c,a),bv=candidateSortValue(c,b);
    for(let i=0;i<av.length;i++){if(bv[i]!==av[i])return bv[i]-av[i]}
    return String(a.number).localeCompare(String(b.number),'ja',{numeric:true});
  });
}
function candidateReason(c,t){

  if(t.startedAt&&remainingSeconds(t)===0)r.push(`⏰ タイマー${overtimeSeconds(t)>0?`超過 ${mmss(overtimeSeconds(t))}`:"終了"}`);
  else if(t.startedAt)r.push(`⏱ 残${mmss(remainingSeconds(t))}`);
  const guide=parseGuideTime(t);if(guide)r.push(`🆕 入店 ${t.start}`);
  const scarcity=tableScarcity(t);if(scarcity<=2)r.push(`⚠️ 候補${scarcity}名`);
  const rem=isCompanion(t)?companionSelectionPlan(t).remainingTurns:autoTimerPlan(t).remainingTurns;

}

  openSheet(`<h2>${isNew?"卓追加":"卓設定"}</h2><div class="form-grid"><div class="field"><label>卓番</label><input id="tableNumber" value="${esc(t.number)}"></div><div class="field"><label>案内時刻</label><input id="tableStart" type="time" value="${esc(t.start)}"></div><div class="field"><label>人数</label><input id="tablePeople" type="number" min="1" value="${t.people}"></div><div class="field"><label>プラン</label><select id="tablePlan">${["A","B","VIP","お連れ様"].map(p=>`<option ${t.plan===p?"selected":""}>${p}</option>`).join("")}</select></div><div class="field full" id="companionOwnerField" style="display:${isCompanion(t)?"flex":"none"}"><label>どのキャストのお連れ様か</label><select id="companionCastId"><option value="">選択してください</option>${data.casts.filter(c=>c.working!==false).map(c=>`<option value="${c.id}" ${t.companionCastId===c.id?"selected":""}>${esc(c.name)}（${c.rank}・チーム色）</option>`).join("")}</select><div class="small-note">選択した担当キャスト本人は自動停止し、同じチーム色の出勤キャストを自動で着席予定にします。</div></div><div class="field"><label>完走目標</label><select id="targetMinutes">${[30,35,40,45,50].map(v=>`<option value="${v}" ${Number(t.targetMinutes||(isCompanion(t)?45:50))===v?"selected":""}>${v}分</option>`).join("")}</select></div><div class="field full checkrow"><input id="autoTimer" type="checkbox" ${t.autoTimer!==false?"checked":""}><label>設定した30〜50分で終わるよう自動計算</label></div><div class="field full"><label>手動タイマー（自動OFF時・スクロール選択）</label><div class="wheel-row"><select id="durationMin">${Array.from({length:121},(_,i)=>`<option value="${i}" ${i===dm?"selected":""}>${i}</option>`).join("")}</select><span class="wheel-unit">分</span><select id="durationSec">${Array.from({length:60},(_,i)=>`<option value="${i}" ${i===ds?"selected":""}>${String(i).padStart(2,"0")}</option>`).join("")}</select><span class="wheel-unit">秒</span></div></div></div><div class="small-note">お連れ様卓は9ターン×5分を固定します。選択した担当キャスト本人はその卓で自動停止し、同じチーム色の他キャストを着席予定にします。保存してもタイマーは始まりません。</div><div class="sheet-actions">${isNew?"":'<button class="danger" id="deleteTable">卓終了</button>'}<button class="cancel" id="cancelSheet">閉じる</button><button class="save" id="saveTable">保存</button></div>`);
  document.getElementById("cancelSheet").onclick=closeSheet;
  document.getElementById("tablePlan").addEventListener("change",e=>{
    const companion=e.target.value==="お連れ様",total=companion?300:180;
    document.getElementById("durationMin").value=Math.floor(total/60);
    document.getElementById("durationSec").value=total%60;
    document.getElementById("companionOwnerField").style.display=companion?"flex":"none";
    if(companion)document.getElementById("targetMinutes").value="45";
  });
  document.getElementById("saveTable").onclick=()=>{
    const n=document.getElementById("tableNumber").value.trim(),mins=Math.max(0,Number(document.getElementById("durationMin").value)||0),secs=Math.min(59,Math.max(0,Number(document.getElementById("durationSec").value)||0));
    const plan=document.getElementById("tablePlan").value,companion=plan==="お連れ様",ownerId=document.getElementById("companionCastId")?.value||"";
    if(!n){alert("卓番を入力してください");return}
    if(companion&&!ownerId){alert("どのキャストのお連れ様か選択してください");return}
    if(!document.getElementById("autoTimer").checked&&mins===0&&secs===0){alert("タイマー時間を入力してください");return}
    t.number=n;t.start=document.getElementById("tableStart").value;t.people=Math.max(1,Number(document.getElementById("tablePeople").value)||1);t.plan=plan;t.companionCastId=companion?ownerId:"";t.companionTargetTurns=9;t.targetMinutes=companion?45:(Number(document.getElementById("targetMinutes").value)||50);t.autoTimer=document.getElementById("autoTimer").checked;
    if(companion){t.durationSec=300;t.nextDurationSec=null}else if(t.autoTimer)recalculateAutoTimer(t,true);else{t.durationSec=mins*60+secs;t.nextDurationSec=null;}
    if(isNew)data.tables.push(t);
    if(companion){applyCompanionTeamPlans(t);recalculateAutoTimer(t,true)}

  };
  if(!isNew){document.getElementById("deleteTable").onclick=()=>{if(confirm(t.number+"を終了しますか？")){data.history.unshift({id:"h"+Date.now(),type:"table-close",at:Date.now(),tableId:t.id,tableNumber:t.number,plan:t.plan,people:t.people,castIds:[],castNames:[],note:"卓終了"});data.tables=data.tables.filter(x=>x.id!==t.id);[data.seated,data.planned].forEach(o=>Object.keys(o).forEach(k=>{if(k.endsWith(":"+t.id))delete o[k]}));delete data.rejections[t.id];delete data.sendNominees[t.id];delete data.senderPending[t.id];data.casts.forEach(c=>c.ngTables=(c.ngTables||[]).filter(x=>x!==t.id));clearSelections();data.planningTableId=null;activeTableId=data.tables[0]?.id||null;save();closeSheet();render()}}}
}
function openTableQuick(id){
  const t=data.tables.find(x=>x.id===id);if(!t)return;
  recalculateAutoTimer(t);const state=!t.startedAt?"未開始":t.pausedAt?"一時停止中":"計測中",senders=senderNames(t),ap=autoTimerPlan(t);
  openSheet(`<h2>${esc(t.number)}・操作</h2><div class="timer-panel"><div>${state}</div><div class="timer-panel-value ${timerClass(t)}">${formatTimer(t)}</div><div>設定 ${mmss(t.durationSec)}／${t.people}名・${esc(t.plan)}</div><div class="small-note">${isCompanion(t)?(()=>{const cp=companionSelectionPlan(t),owner=companionOwner(t);return `担当 ${owner?esc(owner.name):"未選択"}／9ターン×5分／予定込${cp.selected}名／残り選択${cp.remainingMin}〜${cp.remainingMax}名／残${cp.remainingTurns}ターン`})():`残${ap.remaining}名・残${ap.remainingTurns}ターン／完走目標 ${t.targetMinutes||50}分／終了目安 ${estimateEndTime(t)}`}</div></div><div class="sheet-actions">${!t.startedAt?'<button class="start-timer" id="startTimerBtn">タイマースタート</button>':t.pausedAt?'<button class="start-timer" id="resumeTimerBtn">タイマー再開</button>':'<button class="pause" id="pauseTimerBtn">一時停止</button>'}<button class="cancel" id="resetTimerBtn">タイマーリセット</button></div><div class="sheet-actions">${isCompanion(t)?`<button class="plan-btn" id="planningBtn">${data.planningTableId===t.id?"予定者チェック終了":"予定者をチェック"}</button>`:""}<button class="danger" id="senderBtn">${data.senderTableId===t.id?"送り指名チェック終了":"送り指名"}</button></div><div class="sender-list">送り指名：${senders.length?senders.map(esc).join("・"):"なし"}</div><div class="small-note">予定者チェック：セルをタップで★、もう一度タップで解除。通常操作では★を1回タップで仮チェック、同じセルを2回目にタップで着席確定。1人回しも同じセルの2回タップで確定できます。送り指名：セルを1回タップで「送り?」、2回目で決定。決定人数がお客様人数に達すると卓・タイマーを自動終了して折りたたみます。長押しで解除できます。</div><div class="sheet-actions"><button class="cancel" id="cancelSheet">閉じる</button><button class="cancel" id="collapseTableBtn">折りたたむ</button><button class="save" id="editTableBtn">卓設定</button></div>`);
  document.getElementById("cancelSheet").onclick=closeSheet;
  document.getElementById("collapseTableBtn").onclick=()=>{collapseTableManually(t);save();closeSheet();render()};
  if(!t.startedAt)document.getElementById("startTimerBtn").onclick=()=>{recalculateAutoTimer(t,true);startTimer(t);save();closeSheet();render()};else if(t.pausedAt)document.getElementById("resumeTimerBtn").onclick=()=>{t.totalPaused=(t.totalPaused||0)+(Date.now()-t.pausedAt);t.pausedAt=null;save();closeSheet();render()};else document.getElementById("pauseTimerBtn").onclick=()=>{t.pausedAt=Date.now();save();closeSheet();render()};
  document.getElementById("resetTimerBtn").onclick=()=>{if(confirm("タイマーをリセットしますか？")){t.startedAt=null;t.pausedAt=null;t.totalPaused=0;t.rotationStartedAt=null;t.nextDurationSec=null;recalculateAutoTimer(t,true);save();closeSheet();render()}};
  document.getElementById("senderBtn").onclick=()=>{data.senderTableId=data.senderTableId===t.id?null:t.id;data.planningTableId=null;activeTableId=t.id;clearSelections();save();closeSheet();render()};
  if(isCompanion(t))document.getElementById("planningBtn").onclick=()=>{data.planningTableId=data.planningTableId===t.id?null:t.id;data.senderTableId=null;activeTableId=t.id;clearSelections();save();closeSheet();render()};
  document.getElementById("editTableBtn").onclick=()=>openTable(t.id);
}
function showReason(c,t){
  const reasons=[];
  if(c.working===false)reasons.push("本日休み");
  if(isRejected(c.id,t.id))reasons.push("この卓で着席拒否");
  reasons.push(...eligibility(c,t).reasons);
  openSheet(`<h2>${esc(c.name)} → ${esc(t.number)}</h2><div class="reason">🚫 ${reasons.map(esc).join("<br>")}</div><div class="sheet-actions"><button class="cancel" id="cancelSheet">閉じる</button></div>`);
  document.getElementById("cancelSheet").onclick=closeSheet
}
function showSeatDetail(c,t){const r=seatRecord(c.id,t.id);openSheet(`<h2>${esc(c.name)}・${esc(t.number)}</h2><div class="reason">回った順番：<strong>${r?.turn||"-"}ターン目</strong><br>着席時刻：${r?.at?dateTimeText(r.at):"-"}</div><div class="small-note">解除すると、この着席は履歴・個人着席数・残り人数・残りターンから完全に削除されます。空いたターン番号は自動で詰め直します。</div><div class="sheet-actions"><button class="cancel" id="cancelSheet">閉じる</button><button class="danger" id="unseatBtn">着席を完全解除</button></div>`);document.getElementById("cancelSheet").onclick=closeSheet;document.getElementById("unseatBtn").onclick=()=>{
  const rec=seatRecord(c.id,t.id);if(!rec)return;
  const removedTurn=Number(rec.turn)||0;
  delete data.seated[pairKey(c.id,t.id)];
  data.history=[...data.history].filter(h=>{
    if(h.type!=="seat"||h.tableId!==t.id||Number(h.turn)!==removedTurn||!(h.castIds||[]).includes(c.id))return true;
    const idx=(h.castIds||[]).indexOf(c.id);
    h.castIds=(h.castIds||[]).filter(id=>id!==c.id);
    h.castNames=(h.castNames||[]).filter((_,i)=>i!==idx);
    return h.castIds.length>0;
  });
  compactTableTurns(t);
  recalculateAutoTimer(t,false);save();closeSheet();render()
}}

function openBulkCastColor(){
  const castRows=data.casts.map(c=>`
    <label class="checkrow" style="min-height:42px;padding:8px 4px;border-bottom:1px solid #333">
      <input type="checkbox" class="bulkColorCast" value="${esc(c.id)}">
      <span style="display:flex;align-items:center;gap:8px;min-width:0">

        <span style="color:${esc(c.nameColor||"#ffffff")};font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.name)}</span>
      </span>
    </label>
  `).join("");

  openSheet(`
    <h2>チーム枠色一括変更</h2>
    <div class="small-note">同じチームのキャストを複数選択して、チーム枠の色をまとめて変更できます。</div>
    <div class="sheet-actions">
      <button class="cancel" id="selectAllColor">すべて選択</button>
      <button class="cancel" id="clearAllColor">すべて解除</button>
    </div>
    <div style="max-height:45vh;overflow:auto;border:1px solid #444;border-radius:10px;padding:2px 8px;background:#151516">
      ${castRows||'<div class="empty-history">キャストが登録されていません</div>'}
    </div>
    <div class="field full" style="margin-top:14px">
      <label>変更するチーム色</label>
      <input id="bulkCastColor" type="color" value="#ffffff" style="width:100%;height:50px;padding:4px">
    </div>
    <div class="small-note" id="bulkColorCount">0名選択中</div>
    <div class="sheet-actions">
      <button class="cancel" id="cancelSheet">閉じる</button>
      <button class="save" id="applyBulkColor" ${data.casts.length?"":"disabled"}>選択したキャストに適用</button>
    </div>
  `);

  const boxes=()=>[...document.querySelectorAll(".bulkColorCast")];
  const updateCount=()=>{
    const count=boxes().filter(x=>x.checked).length;
    const countEl=document.getElementById("bulkColorCount");
    const applyBtn=document.getElementById("applyBulkColor");
    if(countEl)countEl.textContent=`${count}名選択中`;
    if(applyBtn)applyBtn.disabled=count===0;
  };

  document.getElementById("cancelSheet").onclick=closeSheet;
  document.getElementById("selectAllColor").onclick=()=>{boxes().forEach(x=>x.checked=true);updateCount()};
  document.getElementById("clearAllColor").onclick=()=>{boxes().forEach(x=>x.checked=false);updateCount()};
  boxes().forEach(x=>x.addEventListener("change",updateCount));
  document.getElementById("applyBulkColor").onclick=()=>{
    const ids=boxes().filter(x=>x.checked).map(x=>x.value);
    if(!ids.length){alert("キャストを選択してください");return}
    const color=document.getElementById("bulkCastColor").value||"#ffffff";
    data.casts.forEach(c=>{if(ids.includes(c.id))c.nameColor=color});
    save();closeSheet();render();
  };
  updateCount();
}

function openCastOrder(){
  let order=data.casts.map(c=>c.id),dragId=null,holdTimer=null,dragging=false;
  const draw=()=>{
    const box=document.getElementById("castOrderList");if(!box)return;
    box.innerHTML=order.map((id,i)=>{const c=data.casts.find(x=>x.id===id);return `<div class="order-item" data-id="${esc(id)}"><span class="order-grip">☰</span><strong>${i+1}</strong><span class="order-rank">${esc(c?.rank||"")}</span><span class="order-name">${esc(c?.name||"")}</span></div>`}).join("");
    bindOrderDrag();
  };
  const stopHold=()=>{if(holdTimer){clearTimeout(holdTimer);holdTimer=null}};
  const finishDrag=()=>{
    stopHold();
    if(!dragging)return;
    dragging=false;dragId=null;
    document.body.classList.remove("cast-order-dragging");
    document.querySelectorAll(".order-item.dragging").forEach(x=>x.classList.remove("dragging"));
    if(navigator.vibrate)navigator.vibrate(15);
  };
  const moveDragged=(clientY)=>{
    if(!dragging||!dragId)return;
    const target=document.elementFromPoint(40,clientY)?.closest?.(".order-item");
    if(!target||target.dataset.id===dragId)return;
    const from=order.indexOf(dragId),to=order.indexOf(target.dataset.id);
    if(from<0||to<0)return;
    order.splice(from,1);order.splice(to,0,dragId);draw();
    const active=document.querySelector(`.order-item[data-id="${CSS.escape(dragId)}"]`);
    if(active)active.classList.add("dragging");
  };
  const bindOrderDrag=()=>{
    document.querySelectorAll(".order-item").forEach(item=>{
      item.onpointerdown=e=>{
        if(e.pointerType==="mouse"&&e.button!==0)return;
        stopHold();dragId=item.dataset.id;
        holdTimer=setTimeout(()=>{
          dragging=true;item.classList.add("dragging");document.body.classList.add("cast-order-dragging");
          try{item.setPointerCapture(e.pointerId)}catch(_){ }
          if(navigator.vibrate)navigator.vibrate(25);
        },420);
      };
      item.onpointermove=e=>{if(dragging){e.preventDefault();moveDragged(e.clientY)}};
      item.onpointerup=finishDrag;item.onpointercancel=finishDrag;item.onpointerleave=()=>{if(!dragging)stopHold()};
      item.oncontextmenu=e=>e.preventDefault();
    });
  };
  openSheet(`<h2>キャスト並び順変更</h2><div class="small-note">キャストを長押しし、そのまま上下へ動かして入れ替えます。初期順はS→A→B→Cです。</div><div id="castOrderList" class="cast-order-list"></div><div class="sheet-actions"><button class="cancel" id="resetRankOrder">S→A→B→Cに戻す</button><button class="cancel" id="cancelSheet">閉じる</button><button class="save" id="saveCastOrder">保存</button></div>`);
  draw();
  document.getElementById("resetRankOrder").onclick=()=>{const map=new Map(data.casts.map(c=>[c.id,c]));order=[...order].sort((a,b)=>rankIndex(map.get(a)?.rank)-rankIndex(map.get(b)?.rank));draw()};
  document.getElementById("cancelSheet").onclick=closeSheet;
  document.getElementById("saveCastOrder").onclick=()=>{const map=new Map(data.casts.map(c=>[c.id,c]));data.casts=order.map(id=>map.get(id)).filter(Boolean);data.settings.castOrderInitialized=true;save();closeSheet();render()};
}
function openBulkCastDelete(){
  const rows=data.casts.map(c=>`<label class="checkrow" style="padding:7px;border-bottom:1px solid #333"><input type="checkbox" class="bulkDeleteCast" value="${esc(c.id)}"><span><strong>${esc(c.rank)}</strong> ${esc(c.name)}</span></label>`).join("");
  openSheet(`<h2>キャスト一括削除</h2><div class="small-note">削除するキャストを選択してください。着席履歴・予定・送り・拒否設定からも削除されます。</div><div style="max-height:52vh;overflow:auto;border:1px solid #444;border-radius:10px;padding:3px 8px;background:#151516">${rows||'<div class="empty-history">キャストがいません</div>'}</div><div class="sheet-actions"><button class="cancel" id="selectAllDelete">すべて選択</button><button class="cancel" id="clearAllDelete">解除</button></div><div class="sheet-actions"><button class="cancel" id="cancelSheet">閉じる</button><button class="danger" id="applyBulkDelete">選択したキャストを削除</button></div>`);
  const boxes=()=>[...document.querySelectorAll(".bulkDeleteCast")];
  document.getElementById("cancelSheet").onclick=closeSheet;
  document.getElementById("selectAllDelete").onclick=()=>boxes().forEach(x=>x.checked=true);
  document.getElementById("clearAllDelete").onclick=()=>boxes().forEach(x=>x.checked=false);
  document.getElementById("applyBulkDelete").onclick=()=>{
    const ids=boxes().filter(x=>x.checked).map(x=>x.value);if(!ids.length){alert("削除するキャストを選択してください");return}
    if(!confirm(`${ids.length}名を削除しますか？`))return;
    const set=new Set(ids);data.casts=data.casts.filter(c=>!set.has(c.id));
    [data.seated,data.selected,data.planned].forEach(o=>Object.keys(o).forEach(k=>{if(set.has(k.split(":")[0]))delete o[k]}));
    Object.keys(data.rejections).forEach(tid=>data.rejections[tid]=(data.rejections[tid]||[]).filter(id=>!set.has(id)));
    Object.keys(data.sendNominees).forEach(tid=>data.sendNominees[tid]=(data.sendNominees[tid]||[]).filter(id=>!set.has(id)));
    Object.keys(data.senderPending).forEach(tid=>data.senderPending[tid]=(data.senderPending[tid]||[]).filter(id=>!set.has(id)));
    data.history=data.history.map(h=>{const keep=(h.castIds||[]).map((id,i)=>({id,name:(h.castNames||[])[i]})).filter(x=>!set.has(x.id));h.castIds=keep.map(x=>x.id);h.castNames=keep.map(x=>x.name);return h}).filter(h=>h.type!=="seat"||(h.castIds||[]).length);
    recalculateAllTimers();save();closeSheet();render();
  };
}
function openMenu(){openSheet(`<h2>メニュー</h2><div class="menu-grid"><button id="castCentricMenu">${data.settings.castCentricMode?"キャスト起点操作：ON":"キャスト起点操作：OFF"}</button><button id="historyMenu">履歴を見る</button><button id="addCastMenu">キャスト追加</button><button id="bulkAddCastMenu">まとめて追加</button><button id="bulkColorMenu">チーム枠色一括変更</button><button id="castOrderMenu">キャスト並び順変更</button><button id="bulkDeleteCastMenu">キャスト一括削除</button><button id="backupMenu">バックアップ</button><button id="importMenu">復元</button><button id="endBusinessMenu">営業終了</button></div><div class="small-note">出勤・制限・拒否を反映して原則2名ずつの残りターンを計算し、表示中のタイマーを目安に回します。キャスト名をタップすると着席可能な卓候補が優先順に表示され、卓を選ぶと即着席確定します。キャスト欄はチームごとに背景・左枠の色をまとめて変更できます。</div><div class="sheet-actions"><button class="cancel" id="cancelSheet">閉じる</button></div>`);document.getElementById("cancelSheet").onclick=closeSheet;document.getElementById("castCentricMenu").onclick=()=>{data.settings.castCentricMode=!data.settings.castCentricMode;save();closeSheet();render()};document.getElementById("historyMenu").onclick=showHistory;document.getElementById("addCastMenu").onclick=()=>openCast();document.getElementById("bulkAddCastMenu").onclick=openBulkCastAdd;document.getElementById("bulkColorMenu").onclick=openBulkCastColor;document.getElementById("castOrderMenu").onclick=openCastOrder;document.getElementById("bulkDeleteCastMenu").onclick=openBulkCastDelete;document.getElementById("backupMenu").onclick=downloadBackup;document.getElementById("importMenu").onclick=()=>document.getElementById("importInput").click();document.getElementById("endBusinessMenu").onclick=endBusiness}
function endBusiness(){
  if(confirm("営業を終了しますか？\n着席実績・送り数・初回停止・勤怠ペナルティ・場内中・卓NGをリセットします。")){
    data.seated={};data.planned={};data.sendNominees={};data.senderPending={};data.rejections={};data.history=[];
    clearSelections();
    data.casts.forEach(c=>{
      c.sends=0;
      c.penalty=false;
      c.inHouse=false;
      c.working=true;
      c.ngTables=[];
    });
    data.tables=[];
    data.planningTableId=null;data.senderTableId=null;data.rejectionTableId=null;
    activeTableId=null;save();closeSheet();render()
  }
}
document.getElementById("modeBtn").onclick=()=>{data.settings.editMode=!data.settings.editMode;clearSelections();data.planningTableId=null;data.senderTableId=null;data.rejectionTableId=null;save();render()};
document.getElementById("menuBtn").onclick=openMenu;document.getElementById("addTableBtn").onclick=()=>openTable();document.getElementById("clearSelectBtn").onclick=()=>{clearSelections();data.planningTableId=null;data.senderTableId=null;data.rejectionTableId=null;save();render()};
document.getElementById("seatBtn").onclick=()=>{const t=activeTable(),casts=selectedForActive();if(!t||!casts.length)return;t.turnCounter=(Number(t.turnCounter)||0)+1;const turn=t.turnCounter,at=Date.now();casts.forEach(c=>{data.seated[pairKey(c.id,t.id)]={turn,at};delete data.selected[pairKey(c.id,t.id)];if(isCompanion(t))delete data.planned[pairKey(c.id,t.id)]});data.history.unshift({id:"h"+at,type:"seat",at,tableId:t.id,tableNumber:t.number,plan:t.plan,people:t.people,castIds:casts.map(c=>c.id),castNames:casts.map(c=>c.name),turn,note:"着席・自動再計算・カウントダウン再スタート"});recalculateAutoTimer(t,true);startTimer(t);save();render()};
document.getElementById("importInput").addEventListener("change",async e=>{const f=e.target.files?.[0];if(!f)return;try{const p=JSON.parse(await f.text());if(!p?.casts||!p?.tables)throw 0;if(confirm("復元しますか？")){data=normalize(p);activeTableId=data.tables[0]?.id||null;save();closeSheet();render()}}catch(err){alert("復元できません")}e.target.value=""});
setInterval(()=>{
  let changed=false;
  data.tables.forEach(t=>{
    if(t.autoTimer!==false&&t.startedAt&&overtimeSeconds(t)>0){
      const before=t.nextDurationSec;
      recalculateAutoTimer(t,false);
      if(before!==t.nextDurationSec)changed=true;
    }
    const el=document.querySelector(`[data-table-timer="${t.id}"]`);
    if(el){el.textContent=formatTimer(t);el.className="timer "+timerClass(t)}
  });
  if(changed){save();render()}
},1000);
if(!data.settings.castOrderInitialized){sortCasts();data.settings.castOrderInitialized=true;save()}recalculateAllTimers();render();
</script>
