<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SWAMP-FOG 初回回し Ver.3</title>
<style>
:root{
  --bg:#07080b;--panel:#11141a;--panel2:#1a1e26;--line:#2c313c;
  --text:#f5f7fb;--muted:#949aa8;--gold:#d8b65b;--green:#39cf7e;
  --yellow:#f2c14f;--red:#ff6171;--blue:#62aaff;--purple:#a78bfa;
}
*{box-sizing:border-box} html,body{margin:0;background:linear-gradient(180deg,#050609,#0d1118);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:1500px;margin:auto;padding:12px 12px 100px}
header{position:sticky;top:0;z-index:50;background:rgba(7,8,11,.94);backdrop-filter:blur(16px);margin:-12px -12px 12px;padding:12px;border-bottom:1px solid var(--line)}
.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:22px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:3px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 12px;border-radius:11px;font-weight:800}
.btn.gold{background:var(--gold);color:#171208;border-color:transparent}.btn.red{background:#3b1b22;color:#ffc5cb}.btn.blue{background:#163451;color:#bedfff}
.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}
.tables{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.table{background:var(--panel);border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.table.inactive{opacity:.5}
.head{padding:12px;background:linear-gradient(180deg,#181c24,#12151b);border-bottom:1px solid var(--line)}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.title-left{display:flex;align-items:center;gap:8px}.title-left h2{margin:0;font-size:21px}
.toggle{width:42px;height:24px;border:0;border-radius:999px;background:#3b404b;position:relative}
.toggle:after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:white;top:3px;left:3px;transition:.2s}
.toggle.on{background:var(--green)}.toggle.on:after{left:21px}
.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:10px}
.field{background:#0d1015;border:1px solid var(--line);border-radius:10px;padding:7px}
.field label{display:block;font-size:10px;color:var(--muted);margin-bottom:3px}
.field input,.field select,.field textarea{width:100%;background:transparent;border:0;outline:0;color:var(--text)}
.field textarea{resize:none;min-height:42px}
.full{grid-column:1/-1}
.suggest{margin-top:9px;padding:9px 10px;background:#0d1015;border:1px solid var(--line);border-radius:11px}
.suggest small{display:block;color:var(--muted);margin-bottom:3px}.suggest strong{color:var(--gold);font-size:17px}
.reason{font-size:11px;color:#b9bfca;margin-top:3px}
.timer-row{display:grid;grid-template-columns:1fr auto auto;gap:7px;align-items:center;margin-top:9px}
.timer{font-size:25px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;background:#090c11;border:1px solid var(--line);border-radius:11px;padding:8px}
.timer.warn{color:var(--yellow)}.timer.done{color:var(--red);animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.5}}
.timerbtn{border:0;border-radius:9px;padding:10px 11px;font-weight:900;background:var(--blue);color:#08111c}.resetbtn{background:#353b47;color:white}
.head-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}
.head-actions button{border:1px solid var(--line);background:#222630;color:white;border-radius:9px;padding:8px;font-size:11px;font-weight:800}
.queue{padding:9px;display:flex;flex-direction:column;gap:7px;min-height:90px}
.empty{border:1px dashed var(--line);border-radius:11px;color:var(--muted);text-align:center;padding:22px 8px}
.person{display:grid;grid-template-columns:34px 44px 1fr auto;gap:7px;align-items:center;background:#181b22;border:1px solid var(--line);border-radius:12px;padding:8px;touch-action:none}
.person.waiting{border-left:5px solid var(--yellow)}.person.seated{border-left:5px solid var(--green);background:#112019}.person.finished{border-left:5px solid var(--red);background:#211317;opacity:.78}
.drag{font-size:22px;color:#727988;text-align:center}
.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#2b3039;display:grid;place-items:center;font-weight:900;color:var(--gold);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.name-row{display:flex;gap:6px;align-items:center}.name{width:100%;background:transparent;border:0;outline:0;color:white;font-weight:850;font-size:15px}
.rank{border:1px solid var(--line);background:#0e1116;color:white;border-radius:7px;padding:3px 4px;font-size:11px}
.meta{font-size:10px;color:var(--muted);margin-top:2px}
.p-actions{display:grid;grid-template-columns:repeat(2,40px);gap:5px}
.p-actions button{width:40px;height:34px;border:1px solid var(--line);background:#292e38;color:white;border-radius:8px}
.p-actions .wide{grid-column:1/-1;width:85px;font-size:10px;font-weight:800}.remove{background:#3a1b21!important;color:#ffbcc4!important}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.68);display:none;align-items:flex-end;z-index:100}.modal.show{display:flex}
.sheet{width:100%;max-height:88vh;overflow:auto;background:#11141a;border-radius:20px 20px 0 0;padding:16px;border-top:1px solid var(--line)}
.cast-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.cast-card{border:1px solid var(--line);background:#191d24;border-radius:12px;padding:10px}
.cast-card input,.cast-card select{width:100%;margin-top:5px;background:#0f1217;color:white;border:1px solid var(--line);border-radius:8px;padding:8px}
.cast-card .avatar{margin:auto}.sheet h3{margin-top:0}.sheet-actions{display:flex;gap:8px;position:sticky;bottom:0;background:#11141a;padding-top:10px}
.sheet-actions button{flex:1}
@media(max-width:1050px){.tables{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.tables{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,1fr)}.summary .stat:last-child{grid-column:1/-1}.app{padding:9px 9px 100px}.cast-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="top">
    <div><h1>SWAMP-FOG 初回回し Ver.3</h1><div class="sub">複数卓・卓情報・キャスト管理・自動提案</div></div>
    <div class="actions">
      <button class="btn blue" onclick="openCastManager()">キャスト管理</button>
      <button class="btn gold" onclick="saveNow()">保存</button>
      <button class="btn red" onclick="endBusiness()">営業終了</button>
    </div>
  </div>
</header>

<section class="summary">
  <div class="stat"><b id="activeCount">0</b><span>稼働卓</span></div>
  <div class="stat"><b id="waitingCount">0</b><span>未着席</span></div>
  <div class="stat"><b id="seatedCount">0</b><span>着席済み</span></div>
  <div class="stat"><b id="finishedCount">0</b><span>終了</span></div>
  <div class="stat"><b id="rotationCount">0</b><span>総着席回数</span></div>
</section>

<main id="tables" class="tables"></main>
</div>

<div id="castModal" class="modal" onclick="if(event.target===this)closeCastManager()">
  <div class="sheet">
    <h3>本日のキャスト管理</h3>
    <div id="castGrid" class="cast-grid"></div>
    <button class="btn blue" style="width:100%;margin-top:10px" onclick="addMasterCast()">＋キャスト追加</button>
    <div class="sheet-actions">
      <button class="btn" onclick="closeCastManager()">閉じる</button>
      <button class="btn gold" onclick="saveMasterCasts()">保存して反映</button>
    </div>
  </div>
</div>

<script>
const KEY="swamp_fog_v3";
const TIMER=210;
let state={casts:[],tables:[]},intervals={};

function uid(){return crypto?.randomUUID?crypto.randomUUID():"id"+Date.now()+Math.random()}
function defaultState(){
  const casts=["キャスト1","キャスト2","キャスト3","キャスト4"].map((name,i)=>({id:uid(),name,rank:["S","A","B","C"][i],image:"",rotations:0}));
  return {casts,tables:Array.from({length:9},(_,i)=>({
    id:uid(),name:"S"+(i+1),active:false,guestCount:1,plan:"B",preference:"",
    timer:{remaining:TIMER,running:false,last:null},queue:[]
  }))};
}
function load(){try{state=JSON.parse(localStorage.getItem(KEY))||defaultState()}catch{state=defaultState()}normalize();render();resume()}
function normalize(){
  const now=Date.now();
  state.tables.forEach(t=>{
    t.guestCount??=1;t.plan??="B";t.preference??="";t.queue??=[];t.timer??={remaining:TIMER,running:false,last:null};
    if(t.timer.running&&t.timer.last){const e=Math.floor((now-t.timer.last)/1000);t.timer.remaining=Math.max(0,t.timer.remaining-e);t.timer.last=now;if(!t.timer.remaining)t.timer.running=false}
  });
  state.casts.forEach(c=>{c.rotations??=0;c.rank??="C";c.image??=""});
  persist();
}
function persist(){localStorage.setItem(KEY,JSON.stringify(state))}
function saveNow(){persist();alert("保存しました")}
function getTable(id){return state.tables.find(t=>t.id===id)}
function getCast(id){return state.casts.find(c=>c.id===id)}
function esc(s=""){return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
function format(sec){return `${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`}
function rankScore(r){return {S:4,A:3,B:2,C:1}[r]||0}

function recommendation(t){
  const waiting=t.queue.map(q=>({q,cast:getCast(q.castId)})).filter(x=>x.q.status==="waiting"&&x.cast);
  if(!waiting.length)return {name:"待機なし",reason:"未着席キャストがいません"};
  waiting.sort((a,b)=>{
    if(a.cast.rotations!==b.cast.rotations)return a.cast.rotations-b.cast.rotations;
    return rankScore(b.cast.rank)-rankScore(a.cast.rank);
  });
  const x=waiting[0];
  return {name:x.cast.name,reason:`本日${x.cast.rotations}卓・ランク${x.cast.rank}を優先`};
}

function render(){
  const root=document.getElementById("tables");
  root.innerHTML=state.tables.map(t=>{
    const rec=recommendation(t);
    return `<section class="table ${t.active?"":"inactive"}">
      <div class="head">
        <div class="title-row">
          <div class="title-left"><h2>${t.name}</h2><button class="toggle ${t.active?"on":""}" onclick="toggleTable('${t.id}')"></button></div>
          <button class="btn" style="padding:7px 9px" onclick="addQueueCast('${t.id}')">＋追加</button>
        </div>
        <div class="info-grid">
          <div class="field"><label>人数</label><select onchange="updateTable('${t.id}','guestCount',this.value)"><option ${t.guestCount==1?"selected":""}>1</option><option ${t.guestCount==2?"selected":""}>2</option><option ${t.guestCount==3?"selected":""}>3</option></select></div>
          <div class="field"><label>プラン</label><select onchange="updateTable('${t.id}','plan',this.value)"><option ${t.plan==="A"?"selected":""}>A</option><option ${t.plan==="B"?"selected":""}>B</option><option ${t.plan==="VIP"?"selected":""}>VIP</option></select></div>
          <div class="field full"><label>好きなタイプ・メモ</label><textarea placeholder="右：高身長　左：黒髪" oninput="updateTable('${t.id}','preference',this.value)">${esc(t.preference)}</textarea></div>
        </div>
        <div class="suggest"><small>次に回すおすすめ</small><strong>${esc(rec.name)}</strong><div class="reason">${esc(rec.reason)}</div></div>
        <div class="timer-row">
          <div id="timer-${t.id}" class="timer ${t.timer.remaining<=30&&t.timer.remaining>0?"warn":""} ${t.timer.remaining===0?"done":""}">${format(t.timer.remaining)}</div>
          <button class="timerbtn" id="tb-${t.id}" onclick="startPause('${t.id}')">${t.timer.running?"一時停止":"スタート"}</button>
          <button class="timerbtn resetbtn" onclick="resetTimer('${t.id}')">リセット</button>
        </div>
        <div class="head-actions">
          <button onclick="markNextSeated('${t.id}')">次を着席</button>
          <button onclick="resetStatuses('${t.id}')">未着席へ</button>
          <button onclick="clearTable('${t.id}')">卓を空に</button>
        </div>
      </div>
      <div class="queue">
        ${t.queue.length?t.queue.map((q,i)=>personHtml(t,q,i)).join(""):'<div class="empty">キャストを追加してください</div>'}
      </div>
    </section>`
  }).join("");
  bindDrag();updateSummary();
}
function personHtml(t,q,i){
  const c=getCast(q.castId);if(!c)return"";
  return `<div class="person ${q.status}" draggable="true" data-tid="${t.id}" data-qid="${q.id}">
    <div class="drag">≡</div>
    <div class="avatar">${c.image?`<img src="${c.image}">`:esc(c.name.slice(0,1))}</div>
    <div><div class="name-row"><input class="name" value="${esc(c.name)}" readonly><span class="rank">${c.rank}</span></div><div class="meta">${i+1}番目・${label(q.status)}・本日${c.rotations}卓</div></div>
    <div class="p-actions"><button onclick="move('${t.id}','${q.id}',-1)">↑</button><button onclick="move('${t.id}','${q.id}',1)">↓</button><button class="wide" onclick="cycle('${t.id}','${q.id}')">${label(q.status)} →</button><button class="wide remove" onclick="removeQ('${t.id}','${q.id}')">削除</button></div>
  </div>`
}
function label(s){return s==="waiting"?"未着席":s==="seated"?"着席済み":"終了"}
function updateSummary(){
  const q=state.tables.flatMap(t=>t.queue);
  activeCount.textContent=state.tables.filter(t=>t.active).length;
  waitingCount.textContent=q.filter(x=>x.status==="waiting").length;
  seatedCount.textContent=q.filter(x=>x.status==="seated").length;
  finishedCount.textContent=q.filter(x=>x.status==="finished").length;
  rotationCount.textContent=state.casts.reduce((a,c)=>a+c.rotations,0);
}
function toggleTable(id){const t=getTable(id);t.active=!t.active;persist();render()}
function updateTable(id,key,val){const t=getTable(id);t[key]=key==="guestCount"?Number(val):val;t.active=true;persist();render()}
function addQueueCast(tid){
  const t=getTable(tid); if(!state.casts.length)return alert("先にキャスト管理から登録してください");
  const choices=state.casts.map((c,i)=>`${i+1}. ${c.name}（${c.rank}）`).join("\n");
  const ans=prompt("追加する番号を入力\n"+choices); if(!ans)return;
  const c=state.casts[Number(ans)-1]; if(!c)return;
  t.queue.push({id:uid(),castId:c.id,status:"waiting"});t.active=true;persist();render()
}
function move(tid,qid,d){const t=getTable(tid),i=t.queue.findIndex(q=>q.id===qid),n=i+d;if(i<0||n<0||n>=t.queue.length)return;[t.queue[i],t.queue[n]]=[t.queue[n],t.queue[i]];persist();render()}
function cycle(tid,qid){
  const t=getTable(tid),q=t.queue.find(x=>x.id===qid);if(!q)return;
  const prev=q.status;q.status=prev==="waiting"?"seated":prev==="seated"?"finished":"waiting";
  if(prev!=="seated"&&q.status==="seated"){const c=getCast(q.castId);c.rotations++}
  persist();render()
}
function markNextSeated(tid){const t=getTable(tid),q=t.queue.find(x=>x.status==="waiting");if(!q)return alert("未着席キャストがいません");q.status="seated";getCast(q.castId).rotations++;persist();render()}
function removeQ(tid,qid){const t=getTable(tid);t.queue=t.queue.filter(x=>x.id!==qid);persist();render()}
function resetStatuses(tid){getTable(tid).queue.forEach(q=>q.status="waiting");persist();render()}
function clearTable(tid){if(!confirm("この卓を空にしますか？"))return;const t=getTable(tid);t.queue=[];t.active=false;resetTimer(tid,false);persist();render()}

function startPause(id){
  const t=getTable(id);if(t.timer.remaining<=0)t.timer.remaining=TIMER;t.timer.running=!t.timer.running;t.timer.last=t.timer.running?Date.now():null;persist();t.timer.running?run(id):stop(id);render()
}
function run(id){stop(id);intervals[id]=setInterval(()=>{const t=getTable(id);if(!t.timer.running)return;t.timer.remaining=Math.max(0,t.timer.remaining-1);t.timer.last=Date.now();if(!t.timer.remaining){t.timer.running=false;t.timer.last=null;stop(id);navigator.vibrate?.([250,150,250])}persist();const el=document.getElementById("timer-"+id);if(el){el.textContent=format(t.timer.remaining);el.className="timer "+(t.timer.remaining===0?"done":t.timer.remaining<=30?"warn":"")}const b=document.getElementById("tb-"+id);if(b)b.textContent=t.timer.running?"一時停止":"スタート"},1000)}
function stop(id){if(intervals[id])clearInterval(intervals[id]);delete intervals[id]}
function resetTimer(id,r=true){const t=getTable(id);stop(id);t.timer={remaining:TIMER,running:false,last:null};persist();if(r)render()}
function resume(){state.tables.forEach(t=>t.timer.running&&run(t.id))}
function endBusiness(){if(!confirm("営業終了として全卓・回数・タイマーをリセットしますか？"))return;Object.keys(intervals).forEach(stop);state.tables.forEach(t=>{t.active=false;t.guestCount=1;t.plan="B";t.preference="";t.queue=[];t.timer={remaining:TIMER,running:false,last:null}});state.casts.forEach(c=>c.rotations=0);persist();render()}

function openCastManager(){renderCastManager();castModal.classList.add("show")}
function closeCastManager(){castModal.classList.remove("show")}
function renderCastManager(){
  castGrid.innerHTML=state.casts.map((c,i)=>`<div class="cast-card">
    <div class="avatar">${c.image?`<img src="${c.image}">`:esc(c.name.slice(0,1))}</div>
    <input value="${esc(c.name)}" oninput="state.casts[${i}].name=this.value">
    <select onchange="state.casts[${i}].rank=this.value"><option ${c.rank==="S"?"selected":""}>S</option><option ${c.rank==="A"?"selected":""}>A</option><option ${c.rank==="B"?"selected":""}>B</option><option ${c.rank==="C"?"selected":""}>C</option></select>
    <input type="file" accept="image/*" onchange="loadImage(event,${i})">
    <button class="btn red" style="width:100%;margin-top:5px" onclick="removeMasterCast(${i})">削除</button>
  </div>`).join("")
}
function addMasterCast(){state.casts.push({id:uid(),name:"",rank:"C",image:"",rotations:0});renderCastManager()}
function removeMasterCast(i){const id=state.casts[i].id;state.casts.splice(i,1);state.tables.forEach(t=>t.queue=t.queue.filter(q=>q.castId!==id));renderCastManager()}
function loadImage(e,i){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{state.casts[i].image=r.result;renderCastManager()};r.readAsDataURL(f)}
function saveMasterCasts(){persist();closeCastManager();render()}

function bindDrag(){
  let d=null;
  document.querySelectorAll(".person").forEach(el=>{
    el.addEventListener("dragstart",()=>{d={tid:el.dataset.tid,qid:el.dataset.qid};el.style.opacity=.4});
    el.addEventListener("dragend",()=>el.style.opacity=1);
    el.addEventListener("dragover",e=>e.preventDefault());
    el.addEventListener("drop",e=>{e.preventDefault();if(!d||d.tid!==el.dataset.tid)return;const t=getTable(d.tid),a=t.queue.findIndex(q=>q.id===d.qid),b=t.queue.findIndex(q=>q.id===el.dataset.qid);if(a<0||b<0||a===b)return;const [x]=t.queue.splice(a,1);t.queue.splice(b,0,x);persist();render()});
    let y=0;el.addEventListener("touchstart",e=>{if(e.target.closest("button"))return;y=e.touches[0].clientY},{passive:true});
    el.addEventListener("touchend",e=>{if(e.target.closest("button"))return;const dy=e.changedTouches[0].clientY-y;if(Math.abs(dy)>45)move(el.dataset.tid,el.dataset.qid,dy<0?-1:1)},{passive:true})
  })
}
load();
</script>
</body>
</html>
