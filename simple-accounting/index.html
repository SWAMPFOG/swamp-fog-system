<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0b0c">
<title>SWAMP FOG 簡単会計 Ver.8</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  background:#f3f3f4;
  color:#111;
}
button,input,select{font:inherit}
.app{max-width:760px;margin:auto}

/* ===== 上部固定合計 ===== */
.top{
  position:sticky;
  top:0;
  z-index:50;
  background:#0b0b0c;
  color:#fff;
  padding:10px 12px 11px;
  box-shadow:0 6px 24px rgba(0,0,0,.2);
}
.topline{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:9px;
}
.brand{
  font-size:14px;
  font-weight:900;
  letter-spacing:.06em;
}
.brand small{
  font-size:9px;
  opacity:.6;
  margin-left:6px;
}
.reset{
  border:1px solid #3b3b3d;
  background:#171719;
  color:#fff;
  border-radius:10px;
  padding:8px 10px;
  font-size:12px;
  font-weight:800;
}
.totals-top{
  display:grid;
  grid-template-columns:1.35fr 1fr;
  gap:8px;
}
.totalbox{
  border:1px solid #2c2c2f;
  background:#141416;
  border-radius:13px;
  padding:9px 11px;
}
.totalbox .label{
  font-size:11px;
  font-weight:800;
  color:#c7c7cc;
}
.totalbox .amount{
  font-weight:950;
  color:#e6c65f;
  font-size:30px;
  line-height:1.08;
  margin-top:3px;
  white-space:nowrap;
}
.totalbox.secondary .amount{font-size:24px}
.totalbox .sub{
  font-size:9px;
  color:#8f8f96;
  margin-top:3px;
}

/* ===== 共通 ===== */
main{padding:12px}
.card{
  background:#fff;
  border:1px solid #e5e5e7;
  border-radius:17px;
  padding:14px;
  margin-bottom:10px;
}
.card-title{
  font-size:15px;
  font-weight:950;
  margin-bottom:11px;
}
label{
  display:block;
  font-size:11px;
  font-weight:850;
  color:#444;
  margin-bottom:5px;
}
input[type=time],
input[type=number],
select{
  width:100%;
  height:45px;
  border:1px solid #d7d7db;
  border-radius:11px;
  background:#fff;
  padding:0 10px;
  font-size:16px;
}

/* ===== 卓情報 ===== */
.setup{
  display:grid;
  grid-template-columns:1.05fr .95fr;
  gap:9px;
}
.timewrap{
  display:grid;
  grid-template-columns:1fr 54px;
  gap:6px;
}
.nowbtn{
  border:0;
  border-radius:11px;
  background:#111;
  color:#fff;
  font-size:12px;
  font-weight:900;
}
.seatline{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:9px;
}
.stat{
  background:#fafafa;
  border:1px solid #ededee;
  border-radius:11px;
  padding:9px 10px;
}
.stat .k{
  font-size:10px;
  color:#777;
}
.stat .v{
  font-size:15px;
  font-weight:950;
  margin-top:2px;
}

/* ===== プラン ===== */
.plan-wrap{margin-top:10px}
.plans{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.plan{
  border:1px solid #d8d8dc;
  background:#fff;
  border-radius:12px;
  padding:11px 8px;
  font-weight:900;
  font-size:13px;
}
.plan span{
  display:block;
  font-size:11px;
  margin-top:3px;
  color:#666;
}
.plan.active{
  background:#111;
  color:#fff;
}
.plan.active span{color:#ccc}
.plan:disabled{opacity:.35}
.plan-status{
  margin-top:8px;
  font-size:11px;
  font-weight:800;
  color:#555;
}
.auto-switch{color:#b26e00}

/* ===== よく使う ===== */
.quick-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:9px;
}
.hint{
  font-size:10px;
  color:#888;
}
.quick-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}
.quick-btn,
.product-btn{
  position:relative;
  border:1px solid #dedee1;
  background:#fff;
  border-radius:12px;
  padding:11px 7px;
  text-align:left;
  min-height:58px;
}
.quick-btn .n,
.product-btn .n{
  font-size:12px;
  font-weight:950;
  line-height:1.2;
}
.quick-btn .p,
.product-btn .p{
  font-size:10px;
  color:#73737a;
  margin-top:4px;
  font-weight:700;
}
.badge{
  position:absolute;
  right:6px;
  top:6px;
  min-width:20px;
  height:20px;
  padding:0 5px;
  border-radius:10px;
  background:#111;
  color:#fff;
  font-size:11px;
  font-weight:950;
  display:none;
  align-items:center;
  justify-content:center;
}
.has .badge{display:flex}

/* ===== カテゴリ ===== */
.tabs{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding-bottom:7px;
}
.tab{
  flex:0 0 auto;
  border:1px solid #ddd;
  background:#fff;
  border-radius:999px;
  padding:9px 12px;
  font-size:12px;
  font-weight:900;
}
.tab.active{
  background:#111;
  color:#fff;
}
.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

/* ===== その他シャンパン ===== */
.custom-panel{
  display:none;
  margin-top:9px;
  padding:11px;
  border-radius:12px;
  background:#faf7ea;
  border:1px solid #eee2b5;
}
.custom-panel.show{display:block}
.custom-grid{
  display:grid;
  grid-template-columns:1fr 70px;
  gap:7px;
}
.custom-add{
  border:0;
  border-radius:10px;
  background:#111;
  color:#fff;
  font-weight:950;
}

/* ===== 追加済み ===== */
.added-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.added-count{
  font-size:11px;
  color:#777;
}
.empty{
  text-align:center;
  color:#999;
  padding:11px 0;
  font-size:12px;
}
.item{
  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;
  gap:8px;
  padding:9px 0;
  border-bottom:1px solid #eee;
}
.item .name{
  font-size:12px;
  font-weight:900;
}
.item .meta{
  font-size:10px;
  color:#777;
  margin-top:3px;
}
.controls{
  display:flex;
  align-items:center;
  gap:5px;
}
.controls button{
  width:34px;
  height:34px;
  border:0;
  border-radius:9px;
  background:#f1f1f2;
  font-size:19px;
  font-weight:900;
}
.controls .count{
  min-width:24px;
  text-align:center;
  font-size:13px;
  font-weight:950;
}

/* ===== 内訳 ===== */
.details-btn{
  width:100%;
  border:0;
  background:#f1f1f2;
  border-radius:11px;
  padding:11px;
  font-weight:900;
  font-size:12px;
}
.details{
  display:none;
  margin-top:10px;
}
.details.open{display:block}
.detailrow{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:7px 0;
  border-bottom:1px dashed #e3e3e5;
  font-size:12px;
}
.rule{
  font-size:10px;
  color:#777;
  line-height:1.55;
  margin-top:9px;
}

.flash{animation:flash .18s ease}
@keyframes flash{
  0%{transform:scale(.97);background:#eee}
  100%{transform:scale(1)}
}

@media(max-width:420px){
  .totalbox .amount{font-size:27px}
  .totalbox.secondary .amount{font-size:21px}
}

/* ===== Ver.8 現場用・一画面操作 ===== */
html,body{height:100%;width:100%;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;touch-action:pan-x pan-y}
button,select,input{touch-action:manipulation}
input,select,textarea{font-size:16px!important}
[hidden]{display:none!important}
body{background:#0c0d10}
.app{width:100%;max-width:760px;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:#f2f2f4;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
.top{position:relative;flex:none;padding:8px 11px 9px}
.topline{margin-bottom:6px}
.totals-top{gap:6px}
.totalbox{padding:7px 9px;border-radius:11px}
.totalbox .amount{font-size:clamp(22px,6.8vw,31px);margin-top:2px}
.totalbox.secondary .amount{font-size:clamp(17px,5vw,24px)}
main{padding:8px 9px 0;flex:1;min-height:0;display:flex;flex-direction:column;gap:7px;overflow:hidden}
.card{margin:0;padding:10px;border-radius:13px}
main>section:first-child{flex:none}
main>section.card:not(:first-child){display:none;min-height:0;overflow:auto;flex:1}
main>section.card.panel-active{display:block;min-height:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;flex:1}
main>section.card.panel-active{display:block}
.setup{grid-template-columns:1fr 1fr;gap:7px}
input[type=time],select{height:39px;font-size:15px}
.timewrap{grid-template-columns:minmax(0,1fr) 42px;gap:4px}
.seatline{margin-top:6px;gap:6px}
.stat{padding:5px 8px}
.stat .v{font-size:12px;margin-top:1px}
.plan-wrap{margin-top:7px}
.plans{gap:6px}
.plan{padding:7px 6px;font-size:12px}
.plan span{font-size:10px;margin-top:1px}
.plan-status{margin-top:4px;font-size:10px}
.card-title{font-size:14px;margin-bottom:7px}
.quick-grid{gap:6px}
.quick-btn,.product-btn{min-height:59px;padding:8px 6px}
.quick-btn .n,.product-btn .n{font-size:11px}
.quick-btn .p,.product-btn .p{font-size:10px}
.tabs{padding-bottom:7px;gap:5px}
.tab{padding:7px 10px}
.products{gap:6px}
.item{padding:6px 0}
.controls button{width:32px;height:32px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:9999;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;padding:7px 9px calc(7px + env(safe-area-inset-bottom));background:#0c0d10;box-shadow:0 -3px 16px #0003;pointer-events:auto}
.bottom-nav button{border:1px solid #37383d;background:#1b1c20;color:#d5d5d8;border-radius:10px;padding:10px 2px;font-weight:900;font-size:12px}
.bottom-nav button.active{background:#e6c65f;color:#111;border-color:#e6c65f}
@media(max-height:720px){
 .top{padding:6px 9px}
 .topline{margin-bottom:4px}
 .totalbox{padding:5px 8px}
 main{padding-top:5px;gap:5px}
 .card{padding:7px}
 .stat{padding:4px 7px}
 .plan{padding:5px}
 .bottom-nav{padding-top:5px}
 .bottom-nav button{padding:7px 2px}
}

.detail-card .card-title{margin-bottom:5px}
.detail-card .detailrow{padding:11px 2px;font-size:13px;align-items:center}
.detail-card .detailrow strong{font-size:15px;white-space:nowrap}
.detail-card .detailrow small{font-size:10px;color:#888}
.detail-card .detail-total{background:#171719;color:#fff;border-radius:10px;margin-top:8px;padding:12px 10px;border:0}
.detail-card .detail-total strong{font-size:21px;color:#e6c65f}
.detail-card .detail-total.last{background:#ededf0;color:#111;margin-top:5px}
.detail-card .detail-total.last strong{color:#111}
.detail-card .rule{font-size:10px;line-height:1.5}

.other-toggle{position:relative;z-index:2;touch-action:manipulation;width:100%;border-radius:10px;margin-bottom:8px;background:#171719;color:#e6c65f;border-color:#171719}
.quick-editor{position:relative;z-index:2;margin-top:8px;overflow:auto;max-height:100%}
.quick-choices{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:7px}
.quick-choice{display:flex;align-items:center;gap:5px;padding:8px 5px;border:1px solid #ddd;border-radius:8px;margin:0;font-size:11px;color:#111}
.quick-choice span{flex:1}.quick-choice small{font-size:9px;color:#666}
.quick-choice input{width:17px;height:17px;flex:none}
.save-quick{width:100%;padding:10px;margin-top:8px}
.detail-card{display:flex!important;flex-direction:column;justify-content:space-between;overflow:auto!important;overscroll-behavior:contain}
main>section.card.detail-card:not(.panel-active){display:none!important}
.detail-card .card-title{font-size:13px;margin:0}
.detail-card .detailrow{padding:clamp(4px,1.1dvh,9px) 2px;font-size:12px;min-height:0}
.detail-card .detailrow strong{font-size:14px}
.detail-card .detail-total{margin-top:4px;padding:clamp(7px,1.2dvh,11px) 9px}
.detail-card .detail-total strong{font-size:18px}
.detail-card .rule{font-size:9px;line-height:1.25;margin-top:3px}
.other-entry{padding:12px 4px}.other-input-btn{width:100%;padding:14px;font-size:15px}
#otherForm{margin-top:12px}#otherForm label{display:block;margin-bottom:8px}
.other-qty{display:flex;align-items:center;justify-content:center;gap:15px;margin-top:15px}
.other-qty button{width:48px;height:44px;border-radius:10px;border:1px solid #bbb;background:#fff;font-size:25px;font-weight:bold}
.other-qty span{font-size:14px;font-weight:800}
.move-area{margin-top:5px}.move-toggle{width:100%;padding:6px;background:#242428;color:#e6c65f;border:0;border-radius:8px;font-weight:800;font-size:11px}
.move-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}.move-grid label{font-size:10px}.move-grid input,.move-grid select{width:100%;height:33px}
.move-clear{background:none;border:0;text-decoration:underline;font-size:11px;margin-top:4px}
@media(max-height:780px){
 .top{padding:5px 9px}.totalbox{padding:5px 7px}
 main{padding:5px 7px 0;gap:4px}.card{padding:7px}
 .setup{gap:4px}.seatline{margin-top:4px}
 .plan-wrap{margin-top:4px}.plan{padding:5px 4px}
 .move-area{margin-top:3px}.move-toggle{padding:5px}
 .quick-btn,.product-btn{min-height:49px;padding:5px}
 .detail-card .detailrow{padding:4px 2px}
}
@media(max-height:650px){
 .brand{font-size:12px}.totalbox .amount{font-size:21px}
 .seatline{display:none}.plan-status{display:none}
 .bottom-nav button{padding:6px 2px}
}
</style>
</head>

<body>

<div class="app">

<header class="top">

<div class="topline">
  <div class="brand">
    SWAMP FOG
    <small>簡単会計 Ver.8</small>
  </div>

  <button class="reset" id="resetBtn">
    ↻ リセット
  </button>
</div>

<div class="totals-top">

  <div class="totalbox">
    <div class="label">現在会計</div>
    <div class="amount" id="grandNow">¥0</div>
    <div class="sub">千円未満切り捨て</div>
  </div>

  <div class="totalbox secondary">
    <div class="label">ラストまで</div>
    <div class="amount" id="grandLast">¥0</div>
    <div class="sub">25:00まで</div>
  </div>

</div>

</header>

<main>

<!-- 卓情報 -->
<section class="card">

<div class="setup">

<div>
<label>入店時間</label>

<div class="timewrap">
<input type="time" id="entryTime">
<button class="nowbtn" id="nowBtn">今</button>
</div>

</div>

<div>
<label>卓種</label>
<select id="tableNo"><option value="NORMAL">通常卓</option><option value="SEMI">SEMI-VIP</option><option value="VIP">VIP</option><option value="RVIP">RVIP</option></select>
</div>

</div>

<div class="seatline">

<div class="stat">
<div class="k">席種</div>
<div class="v" id="seatType">通常卓</div>
</div>

<div class="stat">
<div class="k">滞在時間</div>
<div class="v" id="stayTime">--</div>
</div>

</div>

<div class="plan-wrap" id="planWrap"><div id="rvipOverride" style="display:none;margin-bottom:8px"><button type="button" class="plan" id="rvipDiscountBtn" style="width:100%">22時前 特別料金 ¥140,000</button></div>

<label>プラン</label>

<div class="plans">

<button class="plan" data-plan="quick">
クイック
<span>1時間 ¥10,000</span>
</button>

<button class="plan active" data-plan="free">
フリータイム
<span>¥20,000</span>
</button>

</div>

<div class="plan-status" id="planStatus">
クイック選択中
</div>

</div>
<div class="move-area"><button type="button" id="moveToggle" class="move-toggle">＋ 卓移動を設定</button>
<div id="movePanel" hidden><div class="move-grid"><label>移動時間<input type="time" id="moveTime"></label><label>移動先<select id="moveTo"><option value="NORMAL">通常卓</option><option value="SEMI">SEMI-VIP</option><option value="VIP">VIP</option><option value="RVIP">RVIP</option></select></label></div><button type="button" id="clearMove" class="move-clear">卓移動を解除</button></div></div>
</section>


<!-- よく使う -->
<section class="card">

<div class="quick-title">

<div class="card-title" style="margin:0">
よく使う
</div>

<button type="button" id="editQuickBtn" class="tab">編集</button>

</div>

<div class="quick-grid" id="quickGrid"></div><div id="quickEditor" class="quick-editor" hidden><div class="hint">よく使う商品を選択（最大6個）</div><div id="quickChoices" class="quick-choices"></div><button type="button" id="saveQuickBtn" class="custom-add save-quick">保存して戻る</button></div>

</section>


<!-- メニュー -->
<section class="card">

<div class="quick-title">

<div class="card-title" style="margin:0">
メニュー
</div>

<div class="hint">
カテゴリ → 商品タップ
</div>

</div>

<div class="tabs" id="tabs"></div><div id="otherPanel" class="other-entry" hidden><button type="button" id="otherToggle" class="custom-add other-input-btn">金額を入力</button><div id="otherForm" hidden><label>その他メニューの単価（税抜）</label><div class="custom-grid"><input type="number" id="otherPrice" min="1" step="1000" inputmode="numeric" placeholder="例：10000"><button type="button" class="custom-add" id="otherAdd">追加</button></div></div><div class="other-qty" id="otherQty" hidden><button type="button" id="otherMinus">−</button><span id="otherQtyLabel">0点</span><button type="button" id="otherPlus">＋</button></div></div>

<div class="products" id="products"></div>

<div class="custom-panel" id="customPanel">

<label>その他シャンパン 金額</label>

<div class="custom-grid">

<input
type="number"
id="customPrice"
min="0"
step="1000"
placeholder="金額"
>

<button class="custom-add" id="customAdd">
追加
</button>

</div>

</div>

</section>


<!-- 追加済み -->
<section class="card">

<div class="added-head">

<div class="card-title" style="margin:0">
追加済み
</div>

<div class="added-count" id="addedCount">
0点
</div>

</div>

<div id="addedList"></div>

</section>


<!-- 内訳 -->
<section class="card detail-card">
<div class="card-title">会計内訳</div>
<div class="detailrow"><span>卓種類</span><strong id="detailSeatKind">通常卓</strong></div>
<div class="detailrow"><span>ドリンク 小計</span><strong id="subtotal">¥0</strong></div>
<div class="detailrow"><span>現在の席料金</span><strong id="seatNow">¥0</strong></div>
<div class="detailrow"><span>ラストまでの席料金</span><strong id="seatLast">¥0</strong></div>
<div class="detailrow" id="extraRow"><span>TC＋指名料 小計</span><strong id="extraBase">¥0</strong></div>
<div class="detailrow"><span>TAX 40% <small id="taxNote">（ドリンク分）</small></span><strong id="taxAmount">¥0</strong></div>
<div class="detailrow detail-total"><span>現在の合計</span><strong id="detailGrandNow">¥0</strong></div>
<div class="detailrow detail-total last"><span>ラストまでの合計</span><strong id="detailGrandLast">¥0</strong></div>
<div class="rule">通常卓の席料金は税込み。その他の席料金・TC・指名料・ドリンクにTAX40%を適用。最終合計は千円未満切り捨て。</div>
<div hidden><span id="drinkTaxed"></span><span id="extraTaxed"></span></div>
</section>

</main>
<nav class="bottom-nav" aria-label="会計操作">
<button type="button" data-panel="1" class="active">よく使う</button>
<button type="button" data-panel="2">全メニュー</button>
<button type="button" data-panel="3">追加済み</button>
<button type="button" data-panel="4">内訳</button>
</nav>
</div>


<script>

/* =========================
   商品マスター
========================= */

const master={

"ソフトドリンク":[
["ソフトドリンク",1000]
],

"ピッチャー":[
["ピッチャー",2000]

/* =========================

========================= */

function seatKind(t){

if(t==="SEMI"){
return "SEMI-VIP";
}

if(t==="VIP"){
return "VIP";
}

if(t==="RVIP"){
return "RVIP";

/* =========================
   時間計算
========================= */

function norm(h,m){

let x=h*60+m;

if(h<5){
x+=1440;
}

return x;

}


function nowMinutes(){

const d=new Date();

return norm(
d.getHours(),
d.getMinutes()
);

}


function entryMinutes(){

if(!$("entryTime").value){
return null;
}

const [h,m]=
$("entryTime")
.value
.split(":")
.map(Number);

return norm(h,m);

}


function elapsedMinutes(){

const e=entryMinutes();

if(e===null){
return null;
}

let n=nowMinutes();

// 営業終了後(01:00〜19:59)は前営業日のラストとして扱う
if(n>=1500 && n<2640){
n=1500;
}
if(n<1200){
n=1200;
}

if(n>1500){
n=1500;
}

return Math.max(
0,
n-e
);

}


function minutesToLast(){

const e=entryMinutes();

if(e===null){
return null;
}

return Math.max(
0,
1500-e
);

}


/* =========================
   席料金
========================= */

// RVIPの料金は「現在時刻」ではなく、その席を使い始めた時刻で確定する。
function rvipSeatPrice(startMinutes){
 if(rvipDiscount)return 140000;
 return startMinutes>=1320?140000:280000;
}
function seatCharge(mins){

if(mins===null){
return 0;
}

const k=
seatKind(
$("tableNo").value
);


if(k==="RVIP"){
return rvipSeatPrice(entryMinutes()===null?nowMinutes():entryMinutes());
}


if(k==="VIP"){

return Math.max(
1,
Math.ceil(mins/60)
)*42000;

}


if(k==="SEMI-VIP"){

return Math.max(
1,
Math.ceil(mins/60)
)*14000;

}


if(plan==="free"){
return 20000;
}


/*
通常卓クイック

60分以内
¥10,000

60分超
自動でフリー
¥20,000
*/

return mins>60
?20000
:10000;

}


/* =========================
   卓移動：移動前後の滞在時間を個別計算
========================= */
let moveEnabled=false;
function moveMinutes(){
 if(!moveEnabled||!$("moveTime").value)return null;
 const [h,m]=$("moveTime").value.split(":").map(Number);
 return norm(h,m);
}
function segmentSeat(kind,minutes,normalTransfer,startMinutes){
 if(kind==="通常卓")return normalTransfer?(minutes<=60?10000:20000):seatCharge(minutes);
 if(kind==="SEMI-VIP")return Math.max(1,Math.ceil(minutes/60))*14000;
 if(kind==="VIP")return Math.max(1,Math.ceil(minutes/60))*42000;
 return rvipSeatPrice(startMinutes);
}
function moveCalculation(totalMinutes){
 const entry=entryMinutes(),mt=moveMinutes();
 if(!moveEnabled||entry===null||mt===null||mt<=entry||mt>1500)return null;
 const original=seatKind($("tableNo").value),dest=seatKind($("moveTo").value);
 if(original===dest)return null;
 const end=entry+totalMinutes;
 // 移動前は元の卓・元のプランのまま計算する
 if(end<=mt)return null;
 const before=Math.min(Math.max(0,end-entry),mt-entry);
 const after=Math.max(0,end-mt);
 const seatA=segmentSeat(original,before,true,entry);
 const seatB=after>0?segmentSeat(dest,after,true,mt):0;
 const taxableA=original!=="通常卓"?seatA:0;
 const taxableB=dest!=="通常卓"?seatB:0;
 const hasPremium=original!=="通常卓"||(after>0&&dest!=="通常卓");
 return {seat:seatA+seatB,taxableSeat:taxableA+taxableB,extra:hasPremium?4000:0,kind:original+" → "+dest};
}

/* =========================

function recalc(){

const sub=
added.reduce(
(s,x)=>
s+x.price*x.qty,
0
);


/*
ドリンク
TAX 40%
*/

const drinkTaxed=
Math.floor(
sub*1.4
);


const em=
elapsedMinutes();

const lm=
minutesToLast();


const moveNow=em===null?null:moveCalculation(em);
const moveLast=lm===null?null:moveCalculation(lm);
const nowSeat=moveNow?moveNow.seat:seatCharge(em===null?0:em);
const lastSeat=moveLast?moveLast.seat:seatCharge(lm===null?0:lm);


/*
通常卓以外

TC 2,000
指名料 2,000

1会計につき1回
*/

const nonNormal=
seatKind(
$("tableNo").value
)!=="通常卓";


const extraBase=moveNow?moveNow.extra:(nonNormal?4000:0);
const lastExtraBase=moveLast?moveLast.extra:(nonNormal?4000:0);


const extraTaxed=
Math.floor(
extraBase*1.4
);


$("subtotal").textContent=
yen(sub);

$("drinkTaxed").textContent=
yen(drinkTaxed);

$("seatNow").textContent=
yen(nowSeat);

$("seatLast").textContent=
yen(lastSeat);

$("extraBase").textContent=
yen(extraBase);

$("extraTaxed").textContent=yen(extraTaxed);
$("detailSeatKind").textContent=moveNow?moveNow.kind:seatKind($("tableNo").value);
$("extraRow").style.display=(extraBase||lastExtraBase)?"flex":"none";
const taxableNowSeat=moveNow?moveNow.taxableSeat:(nonNormal?nowSeat:0);
const taxableLastSeat=moveLast?moveLast.taxableSeat:(nonNormal?lastSeat:0);
const taxBase=sub+taxableNowSeat+extraBase;
$("taxAmount").textContent=yen(Math.floor(taxBase*.4));
$("taxNote").textContent=(taxableNowSeat||extraBase)?"（ドリンク・対象席・TC・指名料）":"（ドリンク分）";


const hasEntry=
entryMinutes()!==null;


/*
最終金額

千円未満
切り捨て
*/

$("grandNow").textContent=

(hasEntry || ["通常卓","RVIP"].includes(seatKind($("tableNo").value)))

?yen(
floor1000(
nowSeat+Math.floor(taxableNowSeat*.4)+
drinkTaxed+
extraTaxed
)
)

:"¥0";


$("grandLast").textContent=

(hasEntry || ["通常卓","RVIP"].includes(seatKind($("tableNo").value)))

?yen(
floor1000(
lastSeat+Math.floor(taxableLastSeat*.4)+
drinkTaxed+
Math.floor(lastExtraBase*1.4)
)
)

:"¥0";


if(em===null){

$("stayTime").textContent=
"--";

}else{

$("stayTime").textContent=

`${Math.floor(em/60)}
時間
${em%60}分`;

}


$("detailGrandNow").textContent=$("grandNow").textContent;
$("detailGrandLast").textContent=$("grandLast").textContent;
updatePlanStatus();

}

const panelButtons=Array.from(document.querySelectorAll(".bottom-nav button"));
function switchPanel(index){
 // 入力中にタブを移動する場合はキーボードを閉じ、表示領域を安定させる。
 const focused=document.activeElement;
 if(focused&&focused.matches&&focused.matches("input,select,textarea"))focused.blur();
 panels.forEach((p,i)=>{
  const active=i===index;
  p.classList.toggle("panel-active",active);
  if(active)p.scrollTop=0;
 });
 panelButtons.forEach((b,i)=>b.classList.toggle("active",i===index));
}
panelButtons.forEach((b,i)=>{b.onclick=()=>switchPanel(i);});
switchPanel(0);
document.querySelectorAll(".quick-btn").forEach(b=>b.setAttribute("type","button"));

/* ===== キーボード表示中の入力操作 ===== */
// iOSのキーボードが開いても、入力欄を現在のタブ内で確認できる位置に保つ。
document.addEventListener("focusin",e=>{
 const input=e.target;
 if(!input.matches('input[type="number"],input[type="time"]'))return;
 const panel=input.closest("main > section.card.panel-active");
 if(!panel)return;
 window.setTimeout(()=>{
  if(document.activeElement!==input)return;
  const box=input.getBoundingClientRect();
  const viewBottom=window.visualViewport
   ?window.visualViewport.offsetTop+window.visualViewport.height
   :window.innerHeight;
  const bottom=Math.min(viewBottom,document.querySelector(".bottom-nav").getBoundingClientRect().top);
  if(box.bottom>bottom-12)panel.scrollTop+=box.bottom-(bottom-12);
 },300);
});
document.querySelectorAll("#otherPrice,#customPrice").forEach(input=>{
 input.addEventListener("keydown",e=>{
  if(e.key==="Enter"){e.preventDefault();input.blur();}
 });
});
// iPhoneのキーボードを閉じた後は、内部スクロール位置を正常範囲へ戻す。
if(window.visualViewport){
 window.visualViewport.addEventListener("resize",()=>{
  if(document.activeElement?.matches('input[type="number"],input[type="time"]'))return;
  document.querySelectorAll("main > section.card.panel-active").forEach(panel=>{
   const max=Math.max(0,panel.scrollHeight-panel.clientHeight);
   if(panel.scrollTop>max)panel.scrollTop=max;
  });
 });
}

/* ===== iPhone 画面拡大・ダブルタップ抑止 ===== */
document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
document.addEventListener("gesturechange",e=>e.preventDefault(),{passive:false});
document.addEventListener("gestureend",e=>e.preventDefault(),{passive:false});
let lastTouchEnd=0;
document.addEventListener("touchend",e=>{
 if(e.target.closest("input,select,textarea"))return;
 const now=Date.now();
 if(now-lastTouchEnd<300)e.preventDefault();
 lastTouchEnd=now;
},{passive:false});

renderTables();

renderTabs();

renderAllItems();

updateSeatUI();

recalc();

滞在時間・料金を更新

recalc,
30000
