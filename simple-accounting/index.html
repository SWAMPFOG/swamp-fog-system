<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>SWAMP FOG 簡単会計 Ver.2</title>
<style>
:root{--bg:#f4f4f5;--card:#fff;--ink:#111214;--gold:#d8b44b;--line:#e5e5e7}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink)}
.app{max-width:720px;margin:auto;padding-bottom:150px}
header{position:sticky;top:0;z-index:20;background:#0b0b0c;color:#fff;padding:16px}
.head{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:.08em}.brand small{display:block;font-size:10px;opacity:.7;margin-top:3px}
.reset{background:#171719;color:#fff;border:1px solid #3b3b3d;border-radius:10px;padding:9px 12px}
main{padding:14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.title{font-weight:900;font-size:17px;margin-bottom:12px}label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}
input,select,button{font:inherit}input[type=time],input[type=number],select{width:100%;height:48px;border:1px solid #d8d8dc;border-radius:12px;background:#fff;padding:0 12px;font-size:17px}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:10px}.plan{border:1px solid #ddd;border-radius:14px;background:#fff;padding:14px 8px;font-weight:900}.plan span{display:block;margin-top:4px}.plan.active{background:#111;color:#fff}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.cat{flex:0 0 auto;border:1px solid #ddd;background:#fff;border-radius:999px;padding:10px 13px;font-weight:800}.cat.active{background:#111;color:#fff}
.grid{display:grid;grid-template-columns:1.4fr .8fr;gap:10px;margin-top:12px}.qty{display:grid;grid-template-columns:42px 1fr 42px;border:1px solid #ddd;border-radius:12px;overflow:hidden}.qty button{border:0;background:#f2f2f3;font-size:22px}.qty input{border:0;border-radius:0;text-align:center}
.custom{display:none;margin-top:10px}.custom.show{display:block}.preview{margin-top:10px;padding:12px 14px;border-radius:12px;background:#faf7ea;border:1px solid #eee2b5;font-weight:900}.add{width:100%;height:50px;border:0;border-radius:14px;background:#111;color:#fff;font-weight:900;margin-top:10px}
.row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #eee}.row:last-child{border-bottom:0}.name{font-weight:850}.meta{font-size:12px;color:#777}.amount{font-weight:900}.del{border:0;background:#f2f2f3;border-radius:9px;width:34px;height:34px}.empty{text-align:center;color:#888;padding:12px 0}
.totals{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini{background:#fafafa;border:1px solid #eee;border-radius:14px;padding:13px;text-align:center}.mini .k{font-size:12px;color:#666}.mini .v{font-size:23px;font-weight:950;margin-top:4px}.formula{font-size:12px;color:#777;margin-top:9px;line-height:1.5}
.final{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#0b0b0c;color:#fff;padding:14px}.final-in{max-width:720px;margin:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}.final .l{font-size:14px;font-weight:800}.final .d{font-size:11px;color:#aaa;margin-top:3px}.final .g{font-size:40px;line-height:1;font-weight:950;color:#f0cf64;white-space:nowrap}
@media(max-width:430px){.grid{grid-template-columns:1fr}.final .g{font-size:35px}}
</style>
</head>
<body>
<div class="app">
<header><div class="head"><div class="brand">SWAMP FOG<small>SIMPLE ACCOUNTING Ver.2</small></div><button class="reset" id="resetBtn">↻ リセット</button></div></header>
<main>
<section class="card"><label for="entryTime">入店時間</label><input type="time" id="entryTime"></section>
<section class="card"><div class="title">プラン</div><div class="plans"><button class="plan active" data-plan="quick">クイック<span>¥10,000</span></button><button class="plan" data-plan="free">フリータイム<span>¥20,000</span></button></div></section>
<section class="card"><div class="title">ドリンク追加</div><div class="cats" id="cats"></div><div class="grid"><div><label for="product">商品</label><select id="product"></select></div><div><label>数量</label><div class="qty"><button id="minus">−</button><input id="qty" type="number" min="1" value="1" inputmode="numeric"><button id="plus">＋</button></div></div></div><div class="custom" id="customWrap"><label for="customPrice">その他シャンパン 金額</label><input id="customPrice" type="number" min="0" step="1000" placeholder="金額を直接入力" inputmode="numeric"></div><div class="preview" id="preview"></div><button class="add" id="add">＋ 追加</button></section>
<section class="card"><div class="title">追加済み</div><div id="list"></div></section>
<section class="card"><div class="totals"><div class="mini"><div class="k">ドリンク小計</div><div class="v" id="subtotal">¥0</div></div><div class="mini"><div class="k">小計 + TAX40%</div><div class="v" id="taxed">¥0</div></div></div><div class="formula">最終合計 = プラン料金 +（ドリンク小計 × 1.4）→ 1,000円単位で切り上げ</div></section>
</main></div>
<div class="final"><div class="final-in"><div><div class="l">合計金額</div><div class="d" id="detail"></div></div><div class="g" id="grand"></div></div></div>
<script>
const master={
"ソフトドリンク":[["ソフトドリンク",1000]],
"ピッチャー":[["ピッチャー",2000]],
"缶類":[["缶類（2本1セット）",3000],["レッドブル",2000]],
"ビン類":[["ビン類（2本1セット）",4000]],
"シャンパン":[["アスティ",50000],["オリシャン",70000],["オリシャンルミナス",100000],["オリシャンキラキラ",420000],["その他シャンパン",null]],
"ボトル":[["茉莉花 / JAPAN / 鍛高譚",12000],["柚子小町 / 黒霧島",15000],["吉四六",18000],["梅酒 / 富乃宝山",30000],["角",50000]],
"高級ボトル":[["バカラ",700000],["トラディション",3500000],["ジュビリー",5000000],["ロイヤルバカラ",6000000],["ヘネパラ",2500000],["ヘネパラインペリ",8000000],["リシャール",10000000],["新型リシャール",17000000],["ルイ13世",8000000]],
"ショット":[["ショット",3000],["コカボム / クライナー",4000],["テキーラアネホ",8000],["テキーラ観覧車",150000],["テキーラship / アネホ観覧車",300000]]
};
const categories=["ソフトドリンク","ピッチャー","缶類","ビン類","シャンパン","ボトル","高級ボトル","ショット"];
let category=categories[0],plan="quick",added=[];
const yen=n=>"¥"+Math.round(Number(n)||0).toLocaleString("ja-JP"),planPrice=()=>plan==="quick"?10000:20000,ceil1000=n=>Math.ceil(n/1000)*1000;
const el=id=>document.getElementById(id);
function renderCats(){el("cats").innerHTML=categories.map(c=>`<button class="cat ${c===category?"active":""}" data-c="${c}">${c}</button>`).join("");document.querySelectorAll(".cat").forEach(b=>b.onclick=()=>{category=b.dataset.c;renderCats();renderProducts();});}
function renderProducts(){el("product").innerHTML=master[category].map((p,i)=>`<option value="${i}">${p[0]}${p[1]!=null?"（"+yen(p[1])+"）":""}</option>`).join("");el("product").selectedIndex=0;updatePreview();}
function selected(){return master[category][Number(el("product").value||0)]}
function updatePreview(){const p=selected(),custom=p[1]===null;el("customWrap").classList.toggle("show",custom);const price=custom?(Number(el("customPrice").value)||0):p[1];const q=Math.max(1,Number(el("qty").value)||1);el("preview").textContent="追加金額 "+yen(price*q);}
function renderList(){el("list").innerHTML=added.length?added.map((x,i)=>`<div class="row"><div><div class="name">${x.name}</div><div class="meta">${yen(x.price)} × ${x.qty}</div></div><div class="amount">${yen(x.price*x.qty)}</div><button class="del" onclick="removeItem(${i})">×</button></div>`).join(""):'<div class="empty">まだ追加されていません</div>';recalc();}
function recalc(){const sub=added.reduce((s,x)=>s+x.price*x.qty,0),tax=Math.floor(sub*1.4),total=ceil1000(planPrice()+tax);el("subtotal").textContent=yen(sub);el("taxed").textContent=yen(tax);el("grand").textContent=yen(total);el("detail").textContent=`${plan==="quick"?"クイック":"フリータイム"} ${yen(planPrice())} + ドリンク税込 ${yen(tax)}`;}
function removeItem(i){added.splice(i,1);renderList();}
document.querySelectorAll(".plan").forEach(b=>b.onclick=()=>{document.querySelectorAll(".plan").forEach(x=>x.classList.remove("active"));b.classList.add("active");plan=b.dataset.plan;recalc();});
el("product").onchange=updatePreview;el("customPrice").oninput=updatePreview;el("qty").oninput=updatePreview;
el("minus").onclick=()=>{el("qty").value=Math.max(1,(Number(el("qty").value)||1)-1);updatePreview();};
el("plus").onclick=()=>{el("qty").value=(Number(el("qty").value)||1)+1;updatePreview();};
el("add").onclick=()=>{const p=selected();let price=p[1]===null?(Number(el("customPrice").value)||0):p[1],q=Math.max(1,Number(el("qty").value)||1);if(p[1]===null&&price<=0){alert("その他シャンパンの金額を入力してください");return;}const same=added.find(x=>x.name===p[0]&&x.price===price);if(same)same.qty+=q;else added.push({name:p[0],price,qty:q});el("qty").value=1;if(p[1]===null)el("customPrice").value="";updatePreview();renderList();};
el("resetBtn").onclick=()=>{if(!confirm("入力内容をリセットしますか？"))return;added=[];plan="quick";category=categories[0];el("entryTime").value="";el("qty").value=1;el("customPrice").value="";document.querySelectorAll(".plan").forEach(x=>x.classList.toggle("active",x.dataset.plan==="quick"));renderCats();renderProducts();renderList();};
renderCats();renderProducts();renderList();
</script>
</body></html>
