<style id="v11265-table-restore-style">
#undoLastTableEndBtn{display:flex!important}
#restoreCompletedTableBtn{display:flex!important}
#tableRestoreSheet .restore-list{display:grid;gap:9px;margin-top:10px}
#tableRestoreSheet .restore-item{width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;color:var(--text)}
#tableRestoreSheet .restore-item b{display:block;font-size:18px;margin-bottom:4px}
#tableRestoreSheet .restore-item small{display:block;color:var(--muted);line-height:1.45}
</style>
<!-- SWAMP-FLOW Ver.11.2.65 / 卓終了取消・完全終了卓復元 -->
<script id="v11265-table-restore">
(function(){
  const undoBtn=document.querySelector('#undoLastTableEndBtn');
  const endBusinessBtn=document.querySelector('#endBusinessMenu');
  if(undoBtn){
    undoBtn.className='priority-menu';
    undoBtn.innerHTML='<span>卓終了取り消し</span><small>送り未定の卓を選択して回しを再開</small>';
  }
  let fullBtn=document.querySelector('#restoreCompletedTableBtn');
  if(!fullBtn&&undoBtn){
    fullBtn=document.createElement('button');
    fullBtn.id='restoreCompletedTableBtn';
    fullBtn.className='priority-menu';
    fullBtn.innerHTML='<span>完全終了卓を復元</span><small>送り有り・無しで終了した卓を選択して復元</small>';
    undoBtn.insertAdjacentElement('afterend',fullBtn);
  }
  if(endBusinessBtn&&fullBtn&&fullBtn.nextElementSibling!==endBusinessBtn){
    endBusinessBtn.insertAdjacentElement('beforebegin',fullBtn);
  }
  function archiveKey(){try{return scopedStorageKey('swampFlowCompletedTableArchive')}catch(e){return 'swampFlowCompletedTableArchive'}}
  function loadArchive(){try{const x=JSON.parse(localStorage.getItem(archiveKey())||'[]');return Array.isArray(x)?x:[]}catch(e){return []}}
  function saveArchive(a){try{localStorage.setItem(archiveKey(),JSON.stringify((a||[]).slice(-50)))}catch(e){}}
  function esc2(v){try{return esc(v)}catch(e){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}}
  function fmtAt(ms){if(!ms)return'';const d=new Date(ms);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  function closeRestore(){document.querySelector('#tableRestoreSheet')?.remove()}
  function openRestore(mode){
    closeRestore();
    const paused=state.tables.filter(t=>t.active&&t.rotationEnded).sort((a,b)=>(a.entryAt||0)-(b.entryAt||0));
    const archived=loadArchive().slice().sort((a,b)=>(b.endedAt||0)-(a.endedAt||0));
    const list=mode==='paused'?paused:archived;
    const title=mode==='paused'?'卓終了取り消し':'完全終了卓を復元';
    const hint=mode==='paused'?'送り未定で一時終了している卓を選択してください。選択した卓は回しを再開します。':'送り有り／送り無しで完全終了した卓を選択してください。送り結果待ちの状態へ戻します。';
    const html=list.map((x,i)=>{
      const t=mode==='paused'?x:x.table;
      const sub=mode==='paused'?'入店 '+fmtAt(t.entryAt)+'／'+esc2(t.plan||'')+'／送り '+((t.senders||[]).length):'終了 '+fmtAt(x.endedAt)+'／'+esc2(t.plan||'')+'／'+(x.outcome==='withSend'?'送り有り':'送り無し');
      return '<button class="restore-item" data-restore-index="'+i+'"><b>'+esc2(t.no||'卓')+'</b><small>'+sub+'</small></button>';
    }).join('')||'<div class="notice">対象の卓はありません。</div>';
    const sheet=document.createElement('div');sheet.id='tableRestoreSheet';sheet.className='sheet';
    sheet.innerHTML='<div class="sheet-panel"><div class="handle"></div><div class="sheet-head"><h3>'+title+'</h3><button class="close" id="closeRestoreSheet">×</button></div><div class="hint">'+hint+'</div><div class="restore-list">'+html+'</div></div>';
    document.body.appendChild(sheet);
    sheet.querySelector('#closeRestoreSheet').onclick=closeRestore;
    sheet.addEventListener('click',e=>{if(e.target===sheet)closeRestore()});
    sheet.querySelectorAll('[data-restore-index]').forEach(b=>b.onclick=()=>{const idx=Number(b.dataset.restoreIndex);if(mode==='paused')resumePaused(paused[idx]);else restoreCompleted(archived[idx])});
  }
  function resumePaused(t){
    if(!t||!t.rotationEnded){toast('対象卓が見つかりません');closeRestore();return}
    if(!confirm(t.no+'の卓終了を取り消して回しを再開しますか？'))return;
    const endIdx=state.history.map(h=>h.type==='rotationEnd'&&h.table===t.id).lastIndexOf(true);let endedAt=0;
    if(endIdx>=0){endedAt=Number(state.history[endIdx].at)||0;state.history.splice(endIdx,1)}
    if(endedAt)state.history=state.history.filter(h=>!(h.type==='leave'&&h.table===t.id&&Number(h.at)===endedAt&&h.note==='回し一時終了による離席'));
    t.rotationEnded=false;t.currentCastIds=[];t.lastSeatAt=null;t.autoHandledAt=0;t.pausedAt=0;t.totalPaused=Number(t.totalPaused)||0;t.pendingCastIds=[];t.pendingUpdatedAt=0;
    save();render();closeRestore();toast(t.no+' 卓終了を取り消して再開しました');
  }
  function restoreCompleted(rec){
    if(!rec||!rec.table){toast('復元データが見つかりません');closeRestore();return}
    const t0=rec.table;
    if(state.tables.some(t=>t.id===t0.id)){toast('この卓はすでに存在します');return}
    if(!confirm((t0.no||'卓')+'を完全終了から復元しますか？\n送り結果待ちの状態へ戻します。'))return;
    const t=clone(t0);t.active=true;t.rotationEnded=true;t.currentCastIds=[];t.lastSeatAt=null;t.autoHandledAt=0;t.pausedAt=0;t.pendingCastIds=[];t.pendingUpdatedAt=0;
    state.casts.forEach(c=>{if(c.currentTable===t.id)c.currentTable=null;if(c.preparingFor===t.id)c.preparingFor=null});
    const endIdx=state.history.map(h=>(h.type==='tableEndWithSend'||h.type==='tableEndNoSend')&&h.table===t.id).lastIndexOf(true);if(endIdx>=0)state.history.splice(endIdx,1);
    state.tables.push(t);state.tables.sort((a,b)=>(a.entryAt||0)-(b.entryAt||0));
    let a=loadArchive();const key=rec.archiveId||'';a=a.filter(x=>(x.archiveId||'')!==key);saveArchive(a);
    save();render();closeRestore();toast((t.no||'卓')+' を完全終了から復元しました');
  }
  if(undoBtn)undoBtn.onclick=()=>openRestore('paused');
  if(fullBtn)fullBtn.onclick=()=>openRestore('completed');
  const prevFinalize=finalizeTable;
  finalizeTable=function(t,outcome,skipConfirm=false){
    if(!t)return prevFinalize(t,outcome,skipConfirm);
    const tid=t.id,snapshot=clone(t),beforeExists=state.tables.some(x=>x.id===tid);
    const result=prevFinalize(t,outcome,skipConfirm);
    if(beforeExists&&!state.tables.some(x=>x.id===tid)){
      let a=loadArchive(),endedAt=Date.now();
      a.push({archiveId:tid+'-'+endedAt,table:snapshot,outcome:outcome==='withSend'?'withSend':'noSend',endedAt});saveArchive(a);
    }
    return result;
  };
  window.finalizeTable=finalizeTable;
})();
</script>
